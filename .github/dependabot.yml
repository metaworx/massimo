# Dependabot (GUIDELINES/project/CI.md, "Dependabot"): the Go modules the
# code imports directly, the actions the workflows use, pinned by commit
# SHA with their version as a comment, and the Android app's Gradle
# dependencies and plugins, in app/android/gradle/libs.versions.toml;
# checked monthly, one pull request for each. Its commit messages cannot take the project's form,
# so the Guidelines job leaves them out of its check, and its updates go
# into one CHANGELOG bullet when they are merged.
# github.com/bytemare/ksf, replaced by third_party/bytemare-ksf until a
# release builds for 32-bit targets, is indirect and so left alone.
# actionlint, pinned by the tool line of tools/actionlint/go.mod (make
# actionlint), has an entry of its own, so that its modules stay out of
# the product's group; the tool's module is marked indirect there, so
# the entry allows it by name, and its own dependencies follow it.
# esbuild, pinned by tools/uibundle/go.mod (make ui), has one of its own
# for the same reason, allowed by name; the type check's TypeScript and
# the hooks lint's Biome, locked by tools/ui-check/package-lock.json (make
# ui-check), are the npm entry's, the two packages there.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-type: direct
    groups:
      go-modules:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: gradle
    directory: /app/android
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: gomod
    directory: /tools/actionlint
    schedule:
      interval: monthly
    allow:
      - dependency-name: github.com/rhysd/actionlint
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: gomod
    directory: /tools/uibundle
    schedule:
      interval: monthly
    allow:
      - dependency-name: github.com/evanw/esbuild
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /tools/ui-check
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
