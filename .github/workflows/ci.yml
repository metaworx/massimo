name: CI

# Once per commit: a push to main, or a pull request (each push to its
# branch), never both; and a release tag. Formatting, vet, the tests, a
# cross build of every release binary, govulncheck, the Debian package in
# a container, and the Windows service on a Windows runner. A pull
# request runs the web UI's suite only when it changes the UI, the suite
# or this file, and on two of its four cases, and the mDNS test against
# avahi only when it changes the announcement, discovery, the test or
# this file; a push to main or of a tag runs all of it, but for a push
# to main of a release commit, which its tag's run tests (What to test).
# A push builds the release beside the tests (build.yml), and once every
# test job has passed ("All tests passed") calls release.yml, which signs
# and publishes a tag as its release, and a push to main as the devel
# build. The nightly build is nightly.yml's. A push to a release branch
# (release/alpha) runs nothing: the release moved it to a commit this
# workflow had tested.
on:
  push:
    branches: [ main ]
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*' ]
  pull_request:

# A new push to a pull request cancels the run it supersedes; runs of
# main are never cancelled, each commit of main keeps its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The toolchain for tests, scans and release builds: a supported release
# line, newest patch (check-latest), so that binaries carry the standard
# library's security fixes; go.mod states only the oldest Go the code
# builds with. Moved to the next line when this one leaves support.
env:
  GO_VERSION: '1.26'
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  # What the run tests, the one job every test job waits for. suite is
  # false for a push to main of a release commit (its summary opens with
  # "chore(release): "): make release-alpha pushes main and the tag at
  # once, and the tag's run tests the same commit, so main's run skips
  # every job and makes no devel build (GUIDELINES/project/CI.md,
  # section 2). code is false for a pull request or a push to main that
  # changes only documents no test reads, and no path of project.shipped:
  # every job but Guidelines is skipped, and All tests passed, and main
  # makes no devel build; a tag is always tested whole, and a push whose
  # earlier commit is not known counts as code. ui and lan, for the
  # Screenshots and LAN jobs, are true for
  # a push; for a pull request, ui is true when it touches the web UI, its
  # suite or this file, lan when it touches the announcement, discovery,
  # the proxy, the LAN test or this file. The run checks out the pull
  # request's merge commit, whose first parent is the base branch. The
  # list is taken before it is matched, so that grep -q ending the pipe
  # early cannot fail the step under pipefail. Only an answer of false
  # skips a job: a step that fails anyway leaves every answer empty, so
  # every job runs, and All tests passed counts this job's failure.
  # Every job's condition names its status function for that reason.
  changes:
    name: What to test
    runs-on: ubuntu-latest
    outputs:
      suite: ${{ steps.what.outputs.suite }}
      code: ${{ steps.what.outputs.code }}
      ui: ${{ steps.what.outputs.ui }}
      lan: ${{ steps.what.outputs.lan }}
    steps:
      # A pull request's merge commit and its parents; a push's whole
      # history, for the range from the commit main was at before.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: What to test
        id: what
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          BEFORE: ${{ github.event.before }}
        run: |
          suite=true code=true ui=true lan=true
          range=""
          case "${GITHUB_EVENT_NAME}:${GITHUB_REF}" in
          pull_request:*) range=HEAD^1..HEAD ;;
          push:refs/heads/main)
            if [[ "$MESSAGE" == "chore(release): "* ]]; then
              echo "a release commit: its tag's run tests it."
              suite=false
            elif [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              range="${BEFORE}..HEAD"
            fi
            ;;
          esac
          # Documents no test reads (GUIDELINES/project/CI.md, section 2):
          # a change to these alone runs the Guidelines job and no other;
          # a path of project.shipped never counts as one.
          if [ -n "$range" ]; then
            mapfile -t shipped < <(git config -f GUIDELINES/config.ini --get-all project.shipped)
            if git diff --quiet "$range" -- . ':!GUIDELINES/wip/**' ':!GUIDELINES/project/**' \
              ':!AGENTS.md' ':!GUIDELINES/README.md' ':!CHANGELOG.md' ':!CHANGELOG.d/**' ':!LICENSE' &&
              [ "${#shipped[@]}" -gt 0 ] && git diff --quiet "$range" -- "${shipped[@]}"; then
              echo "${range}: documents alone; no test reads them."
              code=false
            fi
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            changed="$(git diff --name-only HEAD^1 HEAD)"
            grep -qE '^(internal/server/ui/|tools/ui-test/|\.github/workflows/ci\.yml$)' <<<"$changed" || ui=false
            grep -qE '^(internal/announce/|internal/serve/|internal/proxy/|internal/cubelan/|cmd/massimo/(discover|serve)\.go$|tools/lan-test/|\.github/workflows/ci\.yml$)' <<<"$changed" || lan=false
          fi
          echo "suite=${suite} code=${code} ui=${ui} lan=${lan}"
          {
            echo "suite=${suite}"
            echo "code=${code}"
            echo "ui=${ui}"
            echo "lan=${lan}"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Vet and test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.suite != 'false' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe needs the tags

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...

      - name: go test
        run: go test ./...

      # The store's benchmarks once each, with -short, to see that they
      # still run (docs/store.md section 5, "Measuring on a box"); no
      # time is compared.
      - name: Benchmarks, once
        run: go test -run '^$' -bench . -benchtime 1x -short ./internal/store

      - name: Cross build
        run: make cross

  # The race detector (make race, GUIDELINES/project/CI.md, section 2) on
  # the packages whose goroutines meet, beside Vet and test rather than in
  # it, so that neither waits for the other.
  race:
    name: Race
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.suite != 'false' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: make race
        run: make race

  # Every package's tests on 32-bit ARM (make test-armv6,
  # GUIDELINES/project/CI.md, section 2): the armv6 binary the armhf
  # package ships, run with -short by Ubuntu's qemu-user as the Raspberry
  # Pi 1's core, beside Vet and test; make cross only builds it.
  armv6:
    name: Test (armv6, QEMU)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.suite != 'false' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: qemu-user
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-user

      - name: make test-armv6
        run: make test-armv6

  # The fuzz targets (make fuzz, GUIDELINES/project/CI.md, section 2), on
  # a push to main only, 10 s a target: a pull request runs their seeds
  # in Vet and test. A crash's input is kept as the artifact fuzz-crash,
  # to be committed as a seed with its fix.
  fuzz:
    name: Fuzz
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'push' && needs.changes.outputs.suite != 'false' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: make fuzz
        run: make fuzz

      - name: Keep a crash's input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash
          path: internal/**/testdata/fuzz/
          if-no-files-found: ignore

  # The web UI in Chromium against the fake Cube: the pytest suite, then
  # the screenshot set, uploaded as the artifact ui-screenshots
  # (tools/ui-test/README.md). Nothing is compared with the committed
  # set: the job fails when a test fails or a shot cannot be taken, not
  # when a picture changed; a failed test's screenshot and video, and the
  # trace of its run once more, kept in tools/ui-test/results/, are
  # uploaded as ui-test-results. It
  # runs in Microsoft's Playwright image, which holds the browsers and
  # their system libraries, so that nothing goes
  # through apt (which took up to 11 minutes on the runner). The image's
  # version and the pip pin below move together (GUIDELINES/project/CI.md,
  # section 3). The image has no make: the steps run what the make
  # targets run. The slideshow is built and committed with the set, not
  # here. It runs for every push to main and for a pull request whose
  # What to test answered ui=true; skipped by this condition, the
  # required check counts as passed.
  screenshots:
    name: Screenshots
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.suite != 'false' && needs.changes.outputs.code != 'false' && needs.changes.outputs.ui != 'false' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
    env:
      UI_TEST_PYTHON: python
      # The checkout belongs to another user than the container's root,
      # so git refuses it and go build cannot stamp the version from it;
      # the binary under test needs none.
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Playwright
        run: pip install "playwright==1.64.1" -r tools/ui-test/requirements.txt

      # UI_TEST_REQUIRED: a missing Playwright, pytest,
      # pytest-playwright or pytest-xdist fails the job instead of
      # skipping the suite or running it in one process. run.sh runs all
      # four cases in four workers, one per CPU of the runner, each
      # against a server set of its own, on a push and a pull request.
      - name: Smoke test
        run: tools/ui-test/run.sh
        env:
          UI_TEST_REQUIRED: 1

      - name: Screenshots
        run: tools/ui-test/run.sh screenshots

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ui-screenshots
          path: |
            docs/screenshots/*.png
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-test-results
          path: tools/ui-test/results/
          if-no-files-found: ignore

  # Discovery, serve's mDNS announcement and massimo discover on a LAN in
  # Docker, against avahi (tools/lan-test/README.md): a second serve's
  # searches finding a fake Cube, losing it with its cable pulled and
  # finding it again, then from the box's proxy too; serve sharing UDP
  # 5353 with avahi-daemon, avahi-browse resolving it on the box and on a
  # client, discover listing it and marking the proxy, and its goodbye.
  # The runner has Docker and Compose v2; the hosts' image is built from
  # debian:trixie-slim at each run. It runs for every push to main and for
  # a pull request whose What to test answered lan=true, as Screenshots
  # does; skipped by this condition, the check counts as passed.
  lan:
    name: LAN against avahi
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.suite != 'false' && needs.changes.outputs.code != 'false' && needs.changes.outputs.lan != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: LAN test
        run: make lan-test

  # Fails on a vulnerability the code can reach (govulncheck exits 3),
  # for the platforms with code of their own.
  govulncheck:
    name: govulncheck (${{ matrix.goos }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.suite != 'false' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [ linux, windows ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # Built for the runner; GOOS then selects the code it scans.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          GOOS=${{ matrix.goos }} "$(go env GOPATH)/bin/govulncheck" ./...

  # The Debian package (packaging/README.md, "Debian package"): built for
  # the three architectures as `make release` builds it, then the amd64
  # one installed, checked and purged in a Debian container
  # (packaging/deb/test.sh), on trixie and on bookworm, which the
  # Raspberry Pi OS Legacy images run, and installed again from an apt
  # repository built with a throwaway key (packaging/apt/test.sh). That
  # container has no systemd; the cases that need one run each in a
  # container of its own with systemd as its first process
  # (packaging/deb/systemd-test.sh): the first start, the restart, and the
  # upgrade from v0.12.0-alpha.1 with the service running.
  deb:
    name: Debian package (${{ matrix.image }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.suite != 'false' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ 'debian:trixie-slim', 'debian:bookworm-slim' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe names the version

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build the packages
        run: make packages

      - name: Install, check and purge in a container
        run: make deb-test DEB_IMAGE=${{ matrix.image }}

      # v0.12.0-alpha.1's package, the last whose account was massimo,
      # comes from its release through gh, with the job's token.
      - name: Under systemd, the upgrade from v0.12.0-alpha.1 included
        env:
          GH_TOKEN: ${{ github.token }}
        run: make deb-systemd-test DEB_IMAGE=${{ matrix.image }}

      # The apt repository (packaging/README.md, "The apt repository")
      # built from the packages with a throwaway key, verified, and
      # installed from in the same container image.
      - name: Build an apt repository with a throwaway key and install from it
        run: |
          command -v apt-ftparchive >/dev/null || sudo apt-get -qq install -y apt-utils
          make apt-test DEB_IMAGE=${{ matrix.image }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.image == 'debian:trixie-slim'
        with:
          name: packages
          path: dist/*.deb
          if-no-files-found: error

  # The Windows service for real: install from a settings file, the
  # service answering on /healthz against a fake Cube, an update through
  # the service manager (to the newest alpha release, or rolled back when
  # that one cannot run as a service), and removal.
  windows:
    name: Windows service
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.suite != 'false' && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # Discovery's tests as well: Windows binds UDP ports otherwise than
      # Linux, a wildcard beside an address's own port (CI.md, section 3).
      - name: Unit tests
        shell: bash
        run: |
          go test ./internal/update/... ./internal/install/... ./cmd/... ./internal/cubelan/...
          go test -run 'Update|Discovery|Search|FailedRun|FoundCube|RemovedCubeIsListedAsFound|FollowsItsAddress' ./internal/server/

      # The service against the fake Cube, with the update from the web
      # UI's request (docs/update-windows.md, section 6): the server
      # starts the helper itself, which must outlive the service it stops.
      # The shell functions are shared by the steps below.
      - name: Install and run the service
        shell: bash
        # Without a token GitHub allows 60 API requests an hour per
        # address, which the shared runners use up; with it the release
        # files come through the API too, not from github.com's download
        # pages, which held requests without one on 2026-11-08. It goes
        # into the settings, so that the server's release check and the
        # helper it starts have it.
        env:
          MASSIMO_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > ci-lib.sh <<'EOF'
          health=http://127.0.0.1:18099/healthz
          api=http://127.0.0.1:18099/api/v1/update
          bin="C:/Program Files/Massimo/massimo.exe"
          data=C:/ProgramData/Massimo
          up() { for i in $(seq 30); do curl -fsS "$health" && echo && return; sleep 2; done; return 1; }
          # As the web UI does it: POST, a second POST in the same moment
          # must be refused, then the helper's states until the last one,
          # left in $st. Both POSTs go out of one curl, the second on the
          # first's connection the moment the first is answered: in stage 2
          # the helper stops the service faster than a second curl process
          # starts (GUIDELINES/project/CI.md, "Runner Constraints").
          post_update() {
            rm -f "$data/update-status.json" post.json second.json
            local codes code second
            # One code per line; curl on Windows writes \r\n for the \n.
            codes="$(curl -sS -o post.json -w '%{http_code}\n' -X POST -H 'Authorization: Bearer ci' "$api" \
              --next -sS -o second.json -w '%{http_code}\n' -X POST -H 'Authorization: Bearer ci' "$api" | tr -d '\r' || true)"
            code="${codes%%$'\n'*}"
            second="${codes#*$'\n'}"
            cat post.json 2>/dev/null || true; echo
            if [ "$code" != 202 ]; then
              echo "::error::POST /api/v1/update answered $code"
              curl -sS -H 'Authorization: Bearer ci' "$api" || true
              return 1
            fi
            cat second.json 2>/dev/null || true; echo
            if [ "$second" != 409 ]; then echo "::error::the second POST answered $second, want 409"; return 1; fi
            st=""
            for i in $(seq 90); do
              st="$(cat "$data/update-status.json" 2>/dev/null || true)"
              echo "$st" | grep -E '"state": "(done|rolled-back|failed|up-to-date)"' >/dev/null && break
              sleep 2
            done
            echo "$st"
            echo "--- update.log"; cat "$data/update.log" || true
            up
          }
          EOF
          . ./ci-lib.sh
          go build -ldflags "-X main.version=v0.0.0-ci.1 -X main.flavour=alpha" -o massimo.exe ./cmd/massimo
          ./massimo.exe fakecube -greeting internal/protocol/cube/testdata/cube-fw0113-greeting.txt -listen 127.0.0.1:62999 > fakecube.log 2>&1 &
          # The fake Cube reports the fixture's serial.
          printf 'MASSIMO_CUBE_KEQ0000100_ADDRESS=127.0.0.1:62999\nMASSIMO_API_TOKEN=ci\nMASSIMO_GITHUB_TOKEN=%s\n' "$MASSIMO_GITHUB_TOKEN" > ci.env

          ./massimo.exe install -settings ci.env -listen 127.0.0.1:18099
          sc.exe query massimo
          sc.exe qc massimo | tee qc.txt
          grep -q -- '-update-request C:\\ProgramData\\Massimo\\update-request -update-status C:\\ProgramData\\Massimo\\update-status.json' qc.txt
          up
          curl -fsS "$health" | grep 'v0.0.0-ci.1' >/dev/null

          # Installing again keeps the address and restarts the service.
          ./massimo.exe install
          up
          curl -fsS -H 'Authorization: Bearer ci' "$api"; echo

      # Stage 1: the newest alpha on GitHub, as on a real PC. It either
      # installs (the helper outlived the service, the new server came up
      # on the same port), or rolls back when that release cannot run as a
      # service.
      - name: Update from the API against the alpha channel
        shell: bash
        run: |
          set -euo pipefail
          . ./ci-lib.sh
          post_update
          now="$(curl -fsS "$health")"
          if echo "$st" | grep '"state": "done"' >/dev/null; then
            echo "$now" | grep -v 'v0.0.0-ci.1' >/dev/null
            test -f "$bin.prev"
            # Back by hand, with the binary that is installed.
            "$bin" update -rollback -restart massimo
            up
            curl -fsS "$health" | grep 'v0.0.0-ci.1' >/dev/null
          else
            echo "$st" | grep '"state": "rolled-back"' >/dev/null
            echo "$now" | grep 'v0.0.0-ci.1' >/dev/null
            test -f "$bin.failed"
          fi
          test ! -e "$data/update-request"
          grep -q 'update helper started' "$data/serve.log"
          test "$(tasklist //FI "IMAGENAME eq massimo.exe" //NH | grep -c '^massimo.exe')" -le 2 # the service and the fake Cube

      # The update by hand from an administrator prompt, with the real key
      # and the real API.
      - name: Update by hand against the alpha channel
        shell: bash
        env:
          MASSIMO_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . ./ci-lib.sh
          status=0
          "$bin" update -yes -restart massimo -health "$health" -health-timeout 90s || status=$?
          up
          now="$(curl -fsS "$health")"
          echo "update exit $status, server: $now"
          if [ "$status" = 0 ]; then
            echo "$now" | grep -v 'v0.0.0-ci.1' >/dev/null
          else
            echo "$now" | grep 'v0.0.0-ci.1' >/dev/null   # rolled back
            test -f "$bin.failed"
          fi

      # Stage 2: releases served here and signed with a test key compiled
      # into the binaries built in this step (MASSIMO_UPDATE_API), so that
      # both outcomes run every time: v0.0.0-ci.2 comes up, v0.0.0-ci.3
      # passes the smoke test but cannot be a service and is rolled back
      # through the API. Nothing built here is published.
      - name: Update and roll back from the API with a stubbed release
        shell: bash
        run: |
          set -euo pipefail
          . ./ci-lib.sh
          mkdir -p ci-tools/sign ci-tools/standin ci-stub/repos/metaworx/massimo
          cat > ci-tools/sign/main.go <<'EOF'
          // The CI job's test key: "key <seed> <public.pem>" makes one,
          // "sign <seed> <file>" prints the file's signature in base64.
          package main

          import (
          	"crypto/ed25519"
          	"crypto/x509"
          	"encoding/base64"
          	"encoding/pem"
          	"fmt"
          	"os"
          )

          func main() {
          	if err := run(os.Args[1:]); err != nil {
          		fmt.Fprintln(os.Stderr, err)
          		os.Exit(1)
          	}
          }

          func run(a []string) error {
          	switch {
          	case len(a) == 3 && a[0] == "key":
          		pub, priv, err := ed25519.GenerateKey(nil)
          		if err != nil {
          			return err
          		}
          		der, err := x509.MarshalPKIXPublicKey(pub)
          		if err != nil {
          			return err
          		}
          		if err := os.WriteFile(a[1], priv.Seed(), 0o600); err != nil {
          			return err
          		}
          		return os.WriteFile(a[2], pem.EncodeToMemory(&pem.Block{Type: "PUBLIC KEY", Bytes: der}), 0o644)
          	case len(a) == 3 && a[0] == "sign":
          		seed, err := os.ReadFile(a[1])
          		if err != nil {
          			return err
          		}
          		msg, err := os.ReadFile(a[2])
          		if err != nil {
          			return err
          		}
          		fmt.Println(base64.StdEncoding.EncodeToString(ed25519.Sign(ed25519.NewKeyFromSeed(seed), msg)))
          		return nil
          	}
          	return fmt.Errorf("usage: sign key <seed> <public.pem> | sign sign <seed> <file>")
          }
          EOF
          cat > ci-tools/standin/main.go <<'EOF'
          // A release that passes the smoke test and cannot run as a service.
          package main

          import (
          	"fmt"
          	"os"
          )

          func main() {
          	if len(os.Args) > 1 && os.Args[1] == "version" {
          		fmt.Println("massimo v0.0.0-ci.3 (ci)")
          		return
          	}
          	os.Exit(1)
          }
          EOF
          (cd ci-tools/sign && go mod init citools/sign && go build -o ../sign.exe .)
          (cd ci-tools/standin && go mod init citools/standin && go build -o standin.exe .)
          ci-tools/sign.exe key ci-tools/ci-key internal/update/release-key.pem

          # On the channel ci, which the stub's tags name, as release.yml's
          # do theirs (internal/update, hintedChannel).
          asset=massimo-windows-amd64.exe
          go build -ldflags "-X main.version=v0.0.0-ci.1 -X main.flavour=ci" -o ci1.exe ./cmd/massimo
          mkdir -p ci-stub/dl/v0.0.0-ci.2 ci-stub/dl/v0.0.0-ci.3
          go build -ldflags "-X main.version=v0.0.0-ci.2 -X main.flavour=ci" -o "ci-stub/dl/v0.0.0-ci.2/$asset" ./cmd/massimo
          cp ci-tools/standin/standin.exe "ci-stub/dl/v0.0.0-ci.3/$asset"
          for tag in v0.0.0-ci.2 v0.0.0-ci.3; do
            d="ci-stub/dl/$tag"
            go run ./internal/update/mkmanifest -tag "$tag" -commit ci -flavour ci -dir "$d" "$asset" > "$d/massimo-release.json"
            ci-tools/sign.exe sign ci-tools/ci-key "$d/massimo-release.json" > "$d/massimo-release.json.sig"
          done
          # The release list in GitHub's shape, one release at a time.
          list() {
            local u="http://127.0.0.1:8123/dl/$1"
            printf '[{"tag_name":"%s","html_url":"%s","draft":false,"prerelease":true,"assets":[{"name":"%s","browser_download_url":"%s/%s"},{"name":"massimo-release.json","browser_download_url":"%s/massimo-release.json"},{"name":"massimo-release.json.sig","browser_download_url":"%s/massimo-release.json.sig"}]}]\n' \
              "$1" "$u" "$asset" "$u" "$asset" "$u" "$u" > ci-stub/repos/metaworx/massimo/releases
          }
          list v0.0.0-ci.2
          python -m http.server 8123 --bind 127.0.0.1 --directory ci-stub > stub.log 2>&1 &
          for i in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:8123/repos/metaworx/massimo/releases && break; sleep 1; done

          # The test-key binary as the service, its settings pointing at the
          # stub (the server's check and, through it, the helper).
          printf 'MASSIMO_UPDATE_API=http://127.0.0.1:8123\n' >> "$data/env"
          ./ci1.exe install
          up
          curl -fsS "$health" | grep 'v0.0.0-ci.1' >/dev/null
          # A failure kept from earlier goes with the next successful update.
          echo stale > "$bin.failed"

          post_update
          echo "$st" | grep '"state": "done"' >/dev/null
          curl -fsS "$health" | grep 'v0.0.0-ci.2' >/dev/null
          test -f "$bin.prev"
          test ! -e "$bin.failed"

          list v0.0.0-ci.3
          start=$(date +%s)
          post_update
          echo "rolled back after $(( $(date +%s) - start )) s"
          echo "$st" | grep '"state": "rolled-back"' >/dev/null
          curl -fsS "$health" | grep 'v0.0.0-ci.2' >/dev/null
          cmp "$bin.failed" "ci-stub/dl/v0.0.0-ci.3/$asset"
          powershell -NoProfile -Command "Get-WinEvent -FilterHashtable @{LogName='System'; ProviderName='Service Control Manager'} -MaxEvents 20 | Where-Object { \$_.Id -in 7000,7009,7031,7034 } | Format-List TimeCreated,Id,Message" | tee events.txt
          grep -Eq 'Id +: (7000|7009|7034)' events.txt

      - name: Remove the service
        shell: bash
        run: |
          set -euo pipefail
          ./massimo.exe install -remove -purge
          if sc.exe query massimo; then echo "::error::service still there"; exit 1; fi
          test ! -e "C:/Program Files/Massimo"
          test ! -e "C:/ProgramData/Massimo" # the settings, the logs, update.log, update-status.json and update-request

      # The announcement beside Windows' own mDNS (the DNS client service
      # holds UDP 5353): a second serve on every address, with a store of
      # its own, announces itself without a warning, and massimo discover
      # finds it by multicast. Windows has no dns-sd of its own, so the
      # browser is ours; tools/lan-test/README.md for avahi.
      - name: mDNS beside Windows' mDNS
        shell: bash
        run: |
          set -euo pipefail
          go build -o mdns.exe ./cmd/massimo
          : > mdns.env
          mkdir -p mdns-data
          ./mdns.exe fakecube -greeting internal/protocol/cube/testdata/cube-fw0113-greeting.txt -listen 127.0.0.1:62998 > mdns-fakecube.log 2>&1 &
          MASSIMO_CUBE_KEQ0000100_ADDRESS=127.0.0.1:62998 ./mdns.exe -env mdns.env -data mdns-data serve -listen 0.0.0.0:18097 -announce -proxy off -discover-interval 0 > mdns-serve.log 2>&1 &
          serve=$!
          for i in $(seq 30); do grep -q 'msg="announced on the LAN"' mdns-serve.log && break; sleep 1; done
          cat mdns-serve.log
          grep -q 'msg="announced on the LAN"' mdns-serve.log
          if grep -q 'not announced' mdns-serve.log; then echo "::error::serve did not announce itself beside Windows' mDNS"; exit 1; fi
          if grep -q 'cube proxy listening' mdns-serve.log; then echo "::error::serve's flags after -announce were not read"; exit 1; fi
          node="$(sed -n 's/.*msg="api listening".* node=\([0-9a-f-]*\).*/\1/p' mdns-serve.log | head -n1)"
          ./mdns.exe -env mdns.env discover -json -wait 4s > mdns-discover.json
          cat mdns-discover.json
          grep -q "\"node\": *\"$node\"" mdns-discover.json
          kill "$serve"

      - name: Logs
        if: always()
        shell: bash
        run: |
          cat fakecube.log stub.log || true
          for f in service.log serve.log update.log update-status.json; do
            echo "--- $f"; cat "C:/ProgramData/Massimo/$f" 2>/dev/null || true
          done

      # What the service manager saw, and the service's command line run by
      # hand for a few seconds, to tell a failing serve from a failing
      # answer to the manager.
      - name: Diagnose the service
        if: failure()
        shell: pwsh
        run: |
          sc.exe queryex massimo
          sc.exe qc massimo
          Get-WinEvent -FilterHashtable @{LogName='System'; ProviderName='Service Control Manager'} -MaxEvents 15 -ErrorAction SilentlyContinue | Format-List TimeCreated, Id, Message
          $p = Start-Process -FilePath 'C:\Program Files\Massimo\massimo.exe' -ArgumentList '-env','C:\ProgramData\Massimo\env','serve','-listen','127.0.0.1:18098','-log','C:\ProgramData\Massimo\by-hand.log' -RedirectStandardError by-hand.err -PassThru -NoNewWindow
          Start-Sleep -Seconds 5
          if (!$p.HasExited) { Stop-Process -Id $p.Id; "still running after 5 s" } else { "exited with $($p.ExitCode)" }
          Get-Content by-hand.err -ErrorAction SilentlyContinue

  macos:
    name: macOS LaunchDaemon
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.suite != 'false' && needs.changes.outputs.code != 'false' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Unit tests
        run: go test ./internal/update/... ./internal/install/... ./cmd/...

      # install on the template's settings, as a new Mac gets it
      # (packaging/launchd/template-test.sh): left for its owner with the
      # message, whose owner line, run as printed from a directory the
      # service user cannot enter, creates the owner; install again
      # restarting a loaded job and leaving a booted-out one; the web UI's
      # way; and a removal that leaves nothing, which the install below
      # needs.
      - name: Install on the template's settings
        run: |
          go build -o massimo ./cmd/massimo
          bash packaging/launchd/template-test.sh ./massimo

      # The whole path as on a Mac: install against the fake Cube with a
      # self-signed certificate (so the health check and the API go over
      # https://, which the helper must accept on the loopback), the
      # update from the web UI's request through the root helper, a
      # rollback, and a removal that leaves nothing behind. Until a
      # release on the alpha channel knows -tls, the update installs a
      # server that serves plain HTTP, the helper's https:// check fails
      # and the job takes its rollback branch (GUIDELINES/project/CI.md).
      - name: Install, run, update and remove the LaunchDaemons
        # Without a token GitHub allows 60 API requests an hour per address,
        # which the shared macOS runners use up (the release check then gets
        # 403); with it the release files come through the API too, not from
        # github.com's download pages, which held requests without one on
        # 2026-11-08.
        env:
          MASSIMO_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          go build -ldflags "-X main.version=v0.0.0-ci.1 -X main.flavour=alpha" -o massimo ./cmd/massimo
          ./massimo fakecube -greeting internal/protocol/cube/testdata/cube-fw0113-greeting.txt -listen 127.0.0.1:62999 > fakecube.log 2>&1 &
          # The fake Cube reports the fixture's serial.
          printf 'MASSIMO_CUBE_KEQ0000100_ADDRESS=127.0.0.1:62999\nMASSIMO_API_TOKEN=ci\nMASSIMO_GITHUB_TOKEN=%s\n' "$MASSIMO_GITHUB_TOKEN" > ci.env
          health=https://127.0.0.1:18099/healthz
          up() { for i in $(seq 30); do curl -fsSk "$health" && return; sleep 2; done; return 1; }

          sudo ./massimo install -settings ci.env -listen 127.0.0.1:18099 -tls self-signed
          sudo launchctl print system/ch.metaworx.massimo | grep -E 'state|pid' | sed -n 1,3p
          up
          curl -fsSk "$health" | grep 'v0.0.0-ci.1' >/dev/null
          curl -fsSk "$health" | grep -E '"self_signed": ?true' >/dev/null
          curl -fsSkI "$health" | grep -i 'strict-transport-security: max-age=31536000' >/dev/null
          test "$(sudo stat -f %Su:%Lp /var/lib/massimo/tls/self-signed.key)" = _massimo:600
          sudo grep -q 'MASSIMO_TLS=self-signed' /etc/massimo/env
          sudo grep -q '<string>https://127.0.0.1:18099/healthz</string>' /Library/LaunchDaemons/ch.metaworx.massimo-update.plist
          sudo -u _massimo ./massimo -data /var/lib/massimo -env /etc/massimo/env tls show | grep 'SHA256:' >/dev/null
          test "$(sudo stat -f %Su:%Lp /etc/massimo/env)" = _massimo:600
          if cat /etc/massimo/env 2>/dev/null; then echo "::error::settings readable"; exit 1; fi
          dscl . -read /Users/_massimo IsHidden UserShell

          # Installing again keeps the address and restarts the service.
          sudo ./massimo install
          up

          # The helper reads no settings: the token goes into its own
          # environment (launchctl setenv is barred by SIP).
          helper=/Library/LaunchDaemons/ch.metaworx.massimo-update.plist
          sudo /usr/libexec/PlistBuddy -c "Add :EnvironmentVariables:MASSIMO_GITHUB_TOKEN string $MASSIMO_GITHUB_TOKEN" "$helper"
          sudo launchctl bootout system/ch.metaworx.massimo-update
          for i in $(seq 50); do sudo launchctl print system/ch.metaworx.massimo-update >/dev/null 2>&1 || break; sleep 0.2; done
          sudo launchctl bootstrap system "$helper"

          # As the web UI does it: the server writes the request, launchd
          # starts the helper, which installs the newest alpha or rolls
          # back.
          code="$(curl -sSk -o post.json -w '%{http_code}' -X POST -H 'Authorization: Bearer ci' https://127.0.0.1:18099/api/v1/update)"
          cat post.json
          if [ "$code" != 202 ]; then
            echo "::error::POST /api/v1/update answered $code"
            curl -sSk -H 'Authorization: Bearer ci' https://127.0.0.1:18099/api/v1/update
            exit 1
          fi
          for i in $(seq 90); do
            st="$(cat /var/lib/massimo-update/status.json 2>/dev/null || true)"
            echo "$st" | grep -E '"state": "(done|rolled-back|failed)"' >/dev/null && break
            sleep 2
          done
          echo "$st"
          up
          now="$(curl -fsSk "$health")"
          if echo "$st" | grep '"state": "done"' >/dev/null; then
            echo "$now" | grep -v 'v0.0.0-ci.1' >/dev/null
            # Back by hand, with the binary that knows launchd.
            sudo ./massimo update -rollback -binary /usr/local/bin/massimo -restart ch.metaworx.massimo
            sleep 3; up
            curl -fsSk "$health" | grep 'v0.0.0-ci.1' >/dev/null
          else
            echo "$st" | grep '"state": "rolled-back"' >/dev/null
            echo "$now" | grep 'v0.0.0-ci.1' >/dev/null
            test -f /usr/local/bin/massimo.failed
          fi

          sudo ./massimo install -remove -purge
          if sudo launchctl print system/ch.metaworx.massimo >/dev/null 2>&1; then echo "::error::still loaded"; exit 1; fi
          for p in /usr/local/bin/massimo /etc/massimo /var/lib/massimo /var/log/massimo \
                   /Library/LaunchDaemons/ch.metaworx.massimo.plist /Library/LaunchDaemons/ch.metaworx.massimo-update.plist; do
            if [ -e "$p" ]; then echo "::error::$p left"; exit 1; fi
          done
          if dscl . -read /Users/_massimo >/dev/null 2>&1; then echo "::error::user left"; exit 1; fi

      # The Homebrew formula (packaging/README.md, "Homebrew"), rendered
      # for a tarball of this checkout into a tap made on the runner
      # (Homebrew loads formulae from taps only, and trusts a tap on
      # request), built from source as a user installs it, tested, and
      # the marker checked: brew owns that binary, and update and install
      # say so. Then a newer version of the formula in the tap, and the
      # update helper's command as the server starts it, but without
      # -restart and -health (brew services does not run here): brew
      # builds and links the newer version. The tarball is served from a
      # local port, since a formula wants a URL.
      # Developer mode, which brew test turns on anyway, from the start:
      # a deprecation in the formula, or a conflicts_with brew cannot
      # resolve, then fails the install rather than warning in the log.
      - name: Homebrew formula from this checkout
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ENV_HINTS: 1
          HOMEBREW_DEVELOPER: 1
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/src"
          git archive --format=tar.gz --prefix=massimo/ -o "$RUNNER_TEMP/src/massimo.tar.gz" HEAD
          sha="$(shasum -a 256 "$RUNNER_TEMP/src/massimo.tar.gz" | cut -d' ' -f1)"
          python3 -m http.server 8321 --bind 127.0.0.1 --directory "$RUNNER_TEMP/src" > "$RUNNER_TEMP/http.log" 2>&1 &
          for i in $(seq 20); do curl -fsS -o /dev/null http://127.0.0.1:8321/massimo.tar.gz 2>/dev/null && break; sleep 1; done
          tap="$(brew --repository)/Library/Taps/local/homebrew-massimo"
          mkdir -p "$tap/Formula"
          packaging/homebrew/render.sh --tag v0.0.0-ci.1 --url http://127.0.0.1:8321/massimo.tar.gz --sha256 "$sha" --out "$tap/Formula/massimo-ci.rb"
          brew trust local/massimo || brew trust --tap local/massimo
          brew install --build-from-source local/massimo/massimo-ci
          brew test local/massimo/massimo-ci
          prefix="$(brew --prefix massimo-ci)"
          test "$(head -n 1 "$prefix/share/massimo/packaged")" = brew
          test -f "$(brew --prefix)/etc/massimo/env"
          if "$prefix/bin/massimo" update 2>err.txt; then echo "::error::update did not refuse under brew"; exit 1; fi
          grep -q 'managed by brew' err.txt
          if "$prefix/bin/massimo" install -dry-run 2>err.txt; then echo "::error::install did not refuse under brew"; exit 1; fi
          grep -q 'Homebrew' err.txt
          packaging/homebrew/render.sh --tag v0.0.0-ci.2 --url http://127.0.0.1:8321/massimo.tar.gz --sha256 "$sha" --out "$tap/Formula/massimo-ci.rb"
          echo alpha > "$RUNNER_TEMP/update-request"
          "$prefix/bin/massimo" update -request "$RUNNER_TEMP/update-request" -status "$RUNNER_TEMP/update-status.json"
          cat "$RUNNER_TEMP/update-status.json"
          test "$(basename "$(readlink "$(brew --prefix)/opt/massimo-ci")")" = 0.0.0-ci.2
          grep -q '"state": "done"' "$RUNNER_TEMP/update-status.json"
          "$(brew --prefix)/opt/massimo-ci/bin/massimo" version | grep 'v0.0.0-ci.2' >/dev/null
          brew uninstall --force massimo-ci
          rm -rf "$tap"

      # The announcement beside Apple's mDNSResponder, which holds UDP 5353
      # on every Mac: a second serve, on every address and with a store of
      # its own, runs as a launchd daemon in the system domain, as massimo
      # install runs the service, and dns-sd must find and resolve it
      # through mDNSResponder (-Z lists the PTR, SRV and TXT records);
      # tools/lan-test/README.md for avahi. A daemon, because macOS's local
      # network privacy refuses the runner's own processes every multicast
      # send ("no route to host"), and spares launchd daemons; for the same
      # reason massimo discover, a runner's process, is not asked here.
      # dns-sd only talks to mDNSResponder, and is read through a
      # pseudo-terminal of Python's, so that what it printed is kept when it
      # is stopped. -announce is a switch: written alone, as "-announce on"
      # would end the flags at "on".
      - name: mDNS beside mDNSResponder
        run: |
          set -uo pipefail
          go build -o massimo-mdns ./cmd/massimo || exit 1
          d="$(mktemp -d)"
          ./massimo-mdns fakecube -greeting internal/protocol/cube/testdata/cube-fw0113-greeting.txt -listen 127.0.0.1:62998 > mdns-fakecube.log 2>&1 &
          label=ch.metaworx.massimo.mdns-ci
          plist="/Library/LaunchDaemons/$label.plist"
          log="$PWD/mdns-serve.log"
          cat > "$RUNNER_TEMP/$label.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>Label</key><string>$label</string>
            <key>ProgramArguments</key><array>
              <string>$PWD/massimo-mdns</string><string>-data</string><string>$d</string><string>serve</string>
              <string>-listen</string><string>0.0.0.0:18097</string><string>-announce</string>
              <string>-proxy</string><string>off</string><string>-discover-interval</string><string>0</string>
              <string>-log-level</string><string>debug</string>
            </array>
            <key>EnvironmentVariables</key><dict>
              <key>MASSIMO_ENV_FILE</key><string>/dev/null</string>
              <key>MASSIMO_CUBE_KEQ0000100_ADDRESS</key><string>127.0.0.1:62998</string>
            </dict>
            <key>StandardOutPath</key><string>$log</string>
            <key>StandardErrorPath</key><string>$log</string>
            <key>RunAtLoad</key><true/>
          </dict></plist>
          EOF
          sudo install -o root -g wheel -m 644 "$RUNNER_TEMP/$label.plist" "$plist"
          sudo launchctl bootstrap system "$plist"
          stop() { sudo launchctl bootout "system/$label" 2>/dev/null || true; sudo rm -f "$plist"; }
          trap stop EXIT
          for i in $(seq 30); do grep -q 'msg="announced on the LAN"' "$log" 2>/dev/null && break; sleep 1; done
          sleep 3
          ok=0
          if ! grep -q 'msg="announced on the LAN"' "$log" || grep -q 'not announced' "$log"; then echo "::error::the daemon did not announce itself beside mDNSResponder"; ok=1; fi
          if grep -q 'mdns: not sent' "$log"; then echo "::error::the daemon's announcements were not sent: local network privacy refuses a launchd daemon too"; ok=1; fi
          if grep -q 'cube proxy listening' "$log"; then echo "::error::serve's flags after -announce were not read"; ok=1; fi
          node="$(sed -n 's/.*msg="api listening".* node=\([0-9a-f-]*\).*/\1/p' "$log" | head -n1)"
          # dns-sd for six seconds in a pseudo-terminal, what it printed on stdout
          pty_run() {
            python3 -I - "$@" <<'PY'
          import os, pty, select, signal, sys, time
          pid, fd = pty.fork()
          if pid == 0:
              os.execvp(sys.argv[1], sys.argv[1:])
          out, end = b"", time.time() + 6
          while time.time() < end:
              if select.select([fd], [], [], 0.2)[0]:
                  try:
                      data = os.read(fd, 4096)
                  except OSError:
                      break
                  if not data:
                      break
                  out += data
          os.kill(pid, signal.SIGTERM)
          sys.stdout.write(out.decode(errors="replace"))
          PY
          }
          echo "--- dns-sd: the service types mDNSResponder sees"
          pty_run dns-sd -B _services._dns-sd._udp local. | tee mdns-types.txt
          echo "--- dns-sd: _massimo._tcp"
          pty_run dns-sd -Z _massimo._tcp local. | tee mdns-zone.txt
          echo "--- the daemon's log"; grep -vE 'device state|schema migrated|greeting: ' "$log"
          if ! grep -q 'SRV.* 18097 ' mdns-zone.txt || ! grep -q "node=$node" mdns-zone.txt; then echo "::error::dns-sd does not resolve the server through mDNSResponder"; ok=1; fi
          exit "$ok"

      - name: Logs
        if: always()
        run: |
          cat fakecube.log || true
          for f in /var/log/massimo/serve.log /var/log/massimo-update.log; do
            echo "--- $f"; sudo cat "$f" 2>/dev/null || true
          done
          sudo launchctl print system/ch.metaworx.massimo 2>/dev/null || true

  # The guidelines' own checks (GUIDELINES/project/CI.md, "Guideline
  # Gates"): the generated documents are current, the declared languages
  # match the tree, every document version has its revision record, the
  # heading numbers, the line breaks, CHANGELOG.md's form and its released
  # sections against their tags, and, on a pull request, the commit
  # messages of the pull request's commits.
  guidelines:
    name: Guidelines
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.suite != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          # The changelog check compares the released sections with the
          # tags, and the commit-message check reads a range of commits.
          fetch-depth: 0
      - name: Tags
        run: git fetch --quiet --force --tags origin
      # The check for serials, MACs and radio addresses (tools/identifiers)
      # reads the project's documents and changelog too, which a change to
      # documents alone does not run Vet and test for (What to test).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Identifiers
        run: MASSIMO_ENV_FILE=/dev/null go test ./tools/identifiers
      # HEAD..HEAD, an empty range, reads no commit message: a push to main,
      # and a pull request of Dependabot's, whose messages cannot take the
      # project's form (GUIDELINES/project/CI.md, "Dependabot"); every other
      # check runs on them. Without a range, check reads what is not on the
      # remote's default branch wherever the checkout has an origin/HEAD.
      - name: Checks
        if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]'
        run: GUIDELINES/shared/tools/check --commit-range HEAD..HEAD
      # base..head, not ..HEAD: on a pull request HEAD is the merge commit
      # GitHub makes for the run, whose message is not ours to write; the
      # merge commits main receives are left out the same way, by running
      # the commit-message check on pull requests only.
      - name: Checks, with the pull request's commit messages
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: GUIDELINES/shared/tools/check --commit-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  # The site's pages and the docs of the commit (packaging/site/build.sh;
  # packaging/README.md, "The site"), without the apt repository and never
  # deployed: it fails on a document under docs/ missing from
  # docs/fragments/_documents.md, on a link to a file the commit does not
  # have, and on one to a page or heading that is not there. The deploy is
  # site.yml's, which release.yml calls.
  site:
    name: Site
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.suite != 'false' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Build the pages and the docs of the commit
        run: packaging/site/build.sh --out site --no-apt --ref main=HEAD

  # One job that stands for all of the above: it fails unless none of
  # them failed or was cancelled (a pull request skips some). The release
  # waits for it, and the nightly build looks for it among a commit's runs
  # (release.yml).
  # The release's build (build.yml), beside the test jobs, so that its
  # files are ready when they have passed: for a push of main or of a
  # tag, unless What to test answered suite=false. It holds no secret,
  # and nothing is signed until All tests passed; a build whose tests fail
  # is thrown away with the run. actions: What to release reads runs for
  # the nightly build; id-token and attestations: the build's provenance.
  build:
    name: Build
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'push' && needs.changes.outputs.suite != 'false' && needs.changes.outputs.code != 'false' }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml

  # One check for the whole suite, which the release waits for. It counts
  # What to test with the others, so that a gate that failed fails it,
  # although every job ran; for a release commit pushed to main,
  # which What to test leaves untested, it is skipped, and so is Release.
  tests:
    name: All tests passed
    needs: [ changes, test, race, armv6, fuzz, screenshots, lan, govulncheck, deb, windows, macos, guidelines, site ]
    if: ${{ !cancelled() && needs.changes.outputs.suite != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Every test job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done

  # The release of a pushed commit (release.yml), once All tests passed
  # and the build is done, with build.yml's answers as inputs and the
  # permissions its jobs need: contents to publish, pages and id-token to
  # deploy the site.
  # The condition names its status function: without one GitHub adds
  # success(), which is false while any job up the chain was skipped, as
  # Fuzz is on a pull request and Changed paths, now What to test, was on
  # a push (2026-11-10: the first devel build was skipped so).
  release:
    name: Release
    needs: [ tests, build ]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.tests.result == 'success' && needs.build.result == 'success' }}
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      kind: ${{ needs.build.outputs.kind }}
      tag: ${{ needs.build.outputs.tag }}
      sha: ${{ needs.build.outputs.sha }}
      version: ${{ needs.build.outputs.version }}
      flavour: ${{ needs.build.outputs.flavour }}
      release: ${{ needs.build.outputs.release }}
      prerelease: ${{ needs.build.outputs.prerelease }}
