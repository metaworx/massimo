name: Nightly

# The nightly build, release/nightly: once a day, and by hand with
# `gh workflow run nightly.yml --ref main`. What to ship
# (packaging/nightly-pick.sh) takes the newest commit of main whose run of
# ci.yml had All tests passed succeed and that is newer than the one the
# nightly build carries, and reads the Tested records of it and of the
# commits before it: where they say that the macOS or the Windows job did
# not run for its code, as a push to main records a job no runner took
# (AP TestSpeed, D16-A), Platforms (platforms.yml) runs that job first on
# main's head, the commit this run checks out (D15-B), never on one an
# output names: a scheduled run holds the default branch's caches, which a
# commit chosen so could poison (CodeQL, actions/cache-poisoning). Where
# the commit to ship is older than main's head and a job is needed, the
# night is skipped, its reason in What to ship's summary and Platforms
# passed's error. The nightly build ships only once Platforms passed
# or was not needed (Platforms passed); a job no runner took is run again
# by Retry (retry.yml), at most twice, about 20 minutes after an attempt,
# and where none came the night is skipped. build.yml builds the commit
# and release.yml signs it with the rolling key and publishes it, as
# ci.yml does for the devel build; both see this workflow's event,
# schedule or workflow_dispatch, from which the rolling job admits the
# flavour nightly alone, and its ref, main, which the signing-rolling
# environment admits. The site is deployed also for a run that has
# nothing to build, but for one at a release commit, main's head while
# its tag's run is still going: that run deploys the same commit, and
# Pages keeps the first deploy of one; and not on a night that is
# skipped.
#
# By hand, dry_run decides and runs the jobs it asks for, and builds,
# signs and publishes nothing; platforms runs both jobs on main's head
# whatever the records say. Both together try Platforms and Retry safely:
# `gh workflow run nightly.yml --ref main -f dry_run=true -f platforms=true`.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Ship nothing: decide, and run the macOS and Windows jobs where needed'
        type: boolean
        default: false
      platforms:
        description: 'Run the macOS and Windows jobs whatever the Tested records say'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # actions: the runs of ci.yml whose All tests passed succeeded;
  # statuses: the Tested records. The guidelines for fingerprint.sh.
  what:
    name: What to ship
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      statuses: read
    outputs:
      sha: ${{ steps.what.outputs.sha }}
      site: ${{ steps.what.outputs.site }}
      macos: ${{ steps.what.outputs.macos }}
      windows: ${{ steps.what.outputs.windows }}
      skip: ${{ steps.what.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: What to ship
        id: what
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORMS: ${{ inputs.platforms && 'both' || '' }}
        run: packaging/nightly-pick.sh

  # The macOS and Windows jobs on main's head, where What to ship asks for
  # them; named Platforms as ci.yml's caller is, so that Retry knows its
  # jobs by the same names.
  platforms:
    name: Platforms
    needs: what
    if: ${{ needs.what.outputs.macos == 'true' || needs.what.outputs.windows == 'true' }}
    uses: ./.github/workflows/platforms.yml
    with:
      windows: ${{ needs.what.outputs.windows == 'true' }}
      macos: ${{ needs.what.outputs.macos == 'true' }}

  # One check for Platforms, as ci.yml's All tests passed is for its
  # suite: green where it passed or was not needed; red otherwise, which
  # skips the night (Build waits for it) and which Retry reads as the
  # verdict that a job no runner took failed; red too where What to ship
  # skipped the night (skip), as a skipped night is.
  tested:
    name: Platforms passed
    needs: [ what, platforms ]
    if: ${{ !cancelled() && needs.what.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: The macOS and Windows jobs passed or were not needed
        env:
          RESULT: ${{ needs.platforms.result }}
          SKIP: ${{ needs.what.outputs.skip }}
        run: |
          echo "Platforms: ${RESULT}"
          if [ -n "$SKIP" ]; then
            echo "::error::${SKIP}"
            exit 1
          fi
          case "$RESULT" in
          success | skipped) ;;
          *)
            echo "::error::the macOS or the Windows job did not pass (${RESULT}): no nightly build tonight; Retry runs a job no runner took again."
            exit 1
            ;;
          esac

  # The commit What to ship picked, once Platforms passed or was not
  # needed; not on a dry run. id-token and attestations: the build's
  # provenance; What to release reads no runs. Each job after one that can
  # be skipped names a status function: GitHub otherwise adds success(),
  # which is false while any job up the chain was skipped, as Platforms is
  # on most nights.
  build:
    name: Build
    needs: [ what, tested ]
    if: ${{ !cancelled() && needs.tested.result == 'success' && !inputs.dry_run }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      nightly_sha: ${{ needs.what.outputs.sha }}
      nightly_site: ${{ needs.what.outputs.site }}

  # contents to publish, pages and id-token to deploy the site, actions
  # for the release's jobs that wait for Sign and publish, attestations
  # for the signed nightly app's provenance: a called job may ask for no
  # more than this, whether it runs or not.
  release:
    name: Release
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read
      attestations: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      kind: ${{ needs.build.outputs.kind }}
      tag: ${{ needs.build.outputs.tag }}
      sha: ${{ needs.build.outputs.sha }}
      version: ${{ needs.build.outputs.version }}
      flavour: ${{ needs.build.outputs.flavour }}
      release: ${{ needs.build.outputs.release }}
      prerelease: ${{ needs.build.outputs.prerelease }}
      site: ${{ needs.build.outputs.site }}
