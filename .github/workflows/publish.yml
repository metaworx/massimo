name: Publish

# The Homebrew formula of a release's channel, rendered from
# packaging/homebrew/massimo.rb.in for the tag and pushed to the tap
# metaworx/homebrew-massimo with a deploy key (packaging/README.md,
# "Homebrew"). Skipped until the owner has made the tap and put the key
# into the secret HOMEBREW_TAP_DEPLOY_KEY.
#
# release.yml calls it once the release is published. It does not listen
# for "release: published" itself: a release that a workflow creates with
# its own token starts no other workflow, so that event never came. By
# hand, for a release already out (the tap set up after it), with
# `gh workflow run publish.yml --ref <tag> -f tag=<tag>`: the signing
# environment, which holds the tap's key, admits version tags alone.
on:
  workflow_call:
    inputs:
      tag:
        description: The release's tag.
        required: true
        type: string
      wait:
        description: Whether to wait for this run's job "Sign and publish" first.
        required: false
        type: boolean
        default: false
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, such as v0.9.0-alpha.1.
        required: true
        type: string

permissions:
  contents: read

jobs:
  # In the signing environment, which admits version tags alone and waits for
  # the owner's approval, as the release's other keys are: the tap's key
  # lives there (D56-A, 2026-11-11), and the environment's secret is the
  # one used, not one release.yml hands over. actions: the wait.
  homebrew:
    name: Homebrew formula
    runs-on: ubuntu-latest
    environment: signing
    permissions:
      contents: read
      actions: read
    env:
      HAS_TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' }}
    steps:
      # The template and the renderer of the tag, so that a run by hand
      # renders what the release's own run would have.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_TAP_KEY == 'true'
        with:
          ref: refs/tags/${{ inputs.tag }}
      # Called by release.yml beside sign: no formula for a release that
      # was not published.
      - name: Wait for Sign and publish
        if: env.HAS_TAP_KEY == 'true' && inputs.wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: packaging/wait-for-job.sh "Sign and publish"

      # The tap is cloned first: the formula conflicts with the other
      # formulae then in it (all install bin/massimo), and brew wants a
      # conflicts_with to name a formula it can find. The tarball's
      # SHA-256 is computed from GitHub's archive of the tag.
      - name: Render the formula and push it to the tap
        if: env.HAS_TAP_KEY == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TAG: ${{ inputs.tag }}
        run: |
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:metaworx/homebrew-massimo.git tap
          others=""
          if [ -d tap/Formula ]; then
            others="$(find tap/Formula -maxdepth 1 -name '*.rb' -exec basename {} .rb \; | paste -sd, -)"
          fi
          name="$(packaging/homebrew/render.sh --tag "$TAG" --conflicts "$others" --out formula.rb)"
          cat formula.rb
          install -D formula.rb "tap/Formula/$name.rb"
          changed=("Formula/$name.rb")
          # Every less stable numbered formula whose version is older moves
          # to this release too, built as its own flavour, so that a box on
          # alpha takes a beta or stable release, as massimo update does;
          # the flavours as update.Flavours ranks them, the least stable
          # first. A formula of a newer release stays.
          own=stable
          [ "$name" = massimo ] || own="${name#massimo-}"
          sha="$(sed -n 's/^  sha256 "\(.*\)"$/\1/p' formula.rb)"
          want="${TAG#v}"
          followers=""
          for c in alpha beta stable; do
            [ "$c" != "$own" ] || break
            f="tap/Formula/massimo-${c}.rb"
            [ -f "$f" ] || continue
            have="$(sed -n 's/^  version "\(.*\)"$/\1/p' "$f")"
            if [ -n "$have" ] && dpkg --compare-versions "${have//-/\~}" ge "${want//-/\~}"; then
              echo "massimo-${c} stays at ${have}"
              continue
            fi
            packaging/homebrew/render.sh --tag "$TAG" --channel "$c" --sha256 "$sha" --conflicts "$others" --out "formula-${c}.rb" >/dev/null
            install "formula-${c}.rb" "$f"
            changed+=("Formula/massimo-${c}.rb")
            followers="${followers}massimo-${c} moves from ${have:-none} to ${TAG}."$'\n'
            echo "massimo-${c} moves from ${have:-none} to ${TAG}"
          done
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${changed[@]}"
          # A run by hand for a release the tap already has changes nothing.
          if git diff --cached --quiet; then
            echo "the tap holds this formula for ${TAG} already"
            exit 0
          fi
          git commit -m "$name $TAG" -m "${followers}Rendered by metaworx/massimo's release workflow from packaging/homebrew/massimo.rb.in."
          git push
