name: Release

# A version tag (v1.2.3, v0.1.0-alpha.10) is tested, built for every
# platform (the binaries, and the Debian packages holding them), signed
# and published as a GitHub release, which `massimo update` installs
# (internal/update).
#
# The jobs, a key in one each: `build` runs the toolchain and the
# third-party actions and holds no secret; `sign` holds the release key
# through the `signing` environment, which only v* tags may use, runs
# nothing but openssl and gh on what build handed over, checks the
# signature against the public key compiled into massimo before
# publishing, and publishes exactly what it signed. `homebrew` then
# pushes the formula to the tap (publish.yml). `apt-build` holds
# the apt repository's key through the same environment and rebuilds
# the site from the releases (packaging/apt/publish.sh); `apt-deploy`
# puts it on GitHub Pages. Both are skipped until the owner has made
# the key (packaging/README.md, "The apt repository").
#
# The update channel of a release is the release branch it was promoted
# to, which is the pre-release identifier of the tag's name (v0.7.0-alpha.1
# is on channel alpha); for a tag without one, a "channel:" line in the
# tag message, else the one branch on GitHub holding its commit. The name
# comes first because the message is the release's CHANGELOG.md section
# (`make release-alpha` tags with changelog.sh), which names no channel;
# that section is also the GitHub release's notes. Development happens on
# main; the release branches only ever fast-forward to it.
on:
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*' ]

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Release metadata
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          # checkout leaves the tag without its annotation; fetch it again.
          git fetch --quiet --force origin "refs/tags/${tag}:refs/tags/${tag}"
          sha="$(git rev-parse "${tag}^{commit}")"
          if [ "$(git describe --tags --exact-match "$sha")" != "$tag" ]; then
            echo "::error::git describe does not name ${tag} for ${sha}."
            exit 1
          fi
          channel="$(printf '%s\n' "$tag" | sed -n 's/^v[0-9][0-9.]*-\([a-z][a-z0-9]*\)\.[0-9][0-9]*$/\1/p')"
          if [ -z "$channel" ]; then
            channel="$(git for-each-ref --format='%(contents)' "refs/tags/${tag}" | sed -n 's/^channel: *//p' | head -n1 | tr -d '[:space:]')"
          fi
          if [ -z "$channel" ]; then
            branches="$(git branch -r --format='%(refname:lstrip=3)' --contains "$sha" | grep -vx HEAD || true)"
            if [ "$(printf '%s\n' "$branches" | grep -c .)" != 1 ]; then
              echo "::error::${tag} names no channel, and its commit is on these branches, not on exactly one: ${branches:-none}"
              exit 1
            fi
            channel="$branches"
          fi
          if ! printf '%s' "$channel" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$'; then
            echo "::error::invalid channel '${channel}'."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" "origin/${channel}"; then
            echo "::error::${tag} names channel ${channel}, but ${sha} is not on that branch on GitHub."
            exit 1
          fi
          # 0.x is pre-release by definition, as is any -suffix.
          prerelease=false
          case "$tag" in v0.*|*-*) prerelease=true ;; esac
          echo "release ${tag} (${sha}) on channel ${channel}, prerelease ${prerelease}"
          {
            echo "tag=${tag}"
            echo "channel=${channel}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

      # The same toolchain as ci.yml: a supported line, newest patch.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Build every binary and package, SHA256SUMS and the manifest
        run: make release VERSION="${{ steps.meta.outputs.tag }}" CHANNEL="${{ steps.meta.outputs.channel }}"

      - name: Hand the files to the signing job
        uses: actions/upload-artifact@v6
        with:
          name: release
          path: dist/
          if-no-files-found: error

  sign:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-latest
    environment: signing
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
      CHANNEL: ${{ needs.build.outputs.channel }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      # The public key and the tag's message; nothing from here is run.
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: release
          path: dist

      - name: Sign the manifest
        env:
          MASSIMO_RELEASE_KEY: ${{ secrets.MASSIMO_RELEASE_KEY }}
        run: |
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MASSIMO_RELEASE_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/massimo-release.json | base64 -w0 > dist/massimo-release.json.sig
          echo >> dist/massimo-release.json.sig

      # The signature must verify against the key massimo has compiled in,
      # or no installed binary would accept the release.
      - name: Verify against the compiled-in key
        run: |
          base64 -d dist/massimo-release.json.sig > "$RUNNER_TEMP/sig.bin"
          openssl pkeyutl -verify -pubin -inkey internal/update/release-key.pem -rawin \
            -in dist/massimo-release.json -sigfile "$RUNNER_TEMP/sig.bin"
          (cd dist && sha256sum -c SHA256SUMS)
          grep -q "\"tag\": \"${TAG}\"" dist/massimo-release.json

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          sentence="Channel: \`${CHANNEL}\`. Install or update with \`massimo update\`, or install the Debian package with \`apt install ./massimo_<version>_<arch>.deb\` (see packaging/README.md); verify a download by hand with \`sha256sum -c SHA256SUMS\`."
          # The notes are the tag message's body, the release's CHANGELOG.md
          # section as changelog.sh wrote it, then the sentence; an old tag's
          # channel: line is not part of them, and a tag with no body gets
          # the sentence alone.
          git fetch --quiet --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          body="$(git for-each-ref --format='%(contents:body)' "refs/tags/${TAG}" | sed -e '/^channel:/d' -e '/./,$!d')"
          if [ -n "$body" ]; then
            printf '%s\n\n%s\n' "$body" "$sentence" > "$RUNNER_TEMP/notes.md"
          else
            printf '%s\n' "$sentence" > "$RUNNER_TEMP/notes.md"
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}" dist/massimo-* dist/*.deb dist/SHA256SUMS

  # The Homebrew formula of the release's channel, pushed to the tap
  # (publish.yml), once the release is published; skipped without the
  # tap's deploy key. It runs from here because the release this run
  # creates with its own token starts no workflow of its own.
  homebrew:
    name: Homebrew
    needs: [ build, sign ]
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

  # The apt repository: the packages of the newest releases of every
  # channel, one suite per channel, signed with the repository key
  # (MASSIMO_APT_KEY, with its passphrase, in the signing environment)
  # and built into the Pages artifact; nothing of it runs without the
  # key. The site has no state: every release rebuilds it from GitHub.
  apt-build:
    name: Build the apt repository
    needs: sign
    runs-on: ubuntu-latest
    environment: signing
    outputs:
      built: ${{ steps.site.outputs.built }}
    env:
      HAS_APT_KEY: ${{ secrets.MASSIMO_APT_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
        if: env.HAS_APT_KEY == 'true'

      # nfpm, for the keyring package, through go run at the Makefile's version.
      - uses: actions/setup-go@v6
        if: env.HAS_APT_KEY == 'true'
        with:
          go-version: '1.26'
          check-latest: true

      - name: Build the site from the releases
        id: site
        if: env.HAS_APT_KEY == 'true'
        env:
          APT_KEY: ${{ secrets.MASSIMO_APT_KEY }}
          APT_KEY_PASSPHRASE: ${{ secrets.MASSIMO_APT_KEY_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          printf '%s\n' "$APT_KEY" | gpg --batch --quiet --import
          key="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          command -v apt-ftparchive >/dev/null || sudo apt-get -qq install -y apt-utils
          packaging/apt/publish.sh --out site --key "$key"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v4
        if: env.HAS_APT_KEY == 'true'
        with:
          path: site

  # Pages deploys from the artifact. Two settings of the owner's
  # (packaging/README.md, "The apt repository"): the repository's Pages
  # source is "GitHub Actions", and the github-pages environment GitHub
  # then makes, which deploys from the default branch only, also allows
  # the tags v* (Settings → Environments → github-pages → Deployment
  # branches and tags), since this job runs for a tag; else it is refused.
  apt-deploy:
    name: Deploy the apt repository
    needs: apt-build
    if: needs.apt-build.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
