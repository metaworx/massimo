name: Release

# The release of a commit CI has tested. ci.yml calls this workflow as its
# last job, once every test job has passed (workflow_call), so that it
# runs with the caller's ref, which the environments' rules are matched
# against: a v* tag here, where the signing environment admits the tags
# alone. A workflow started by workflow_run would carry the default
# branch whatever started it.
#
# A version tag (v1.2.3, v0.1.0-alpha.10) is built for every platform
# (the binaries, and the Debian packages holding them), signed and
# published as a GitHub release, which `massimo update` installs
# (internal/update).
#
# The jobs, a key in one each: `meta` decides what the run releases;
# `build` runs the toolchain and the third-party actions and holds no
# secret; `sign` holds the release key through the `signing` environment,
# which only v* tags may use, runs nothing but openssl and gh on what
# build handed over, checks the signature against the public key compiled
# into massimo and the flavour against the tag before publishing, and
# publishes exactly what it signed. `homebrew` then pushes the formula to
# the tap (publish.yml). `apt-build` holds the apt repository's key
# through the same environment and rebuilds the site from the releases
# (packaging/apt/publish.sh); `apt-deploy` puts it on GitHub Pages.
#
# The flavour of a release (internal/update) is the pre-release label of
# its tag (v0.7.0-alpha.1 is alpha), stable for a tag without one
# (v1.0.0); the tag message's channel: line and the branch holding the
# commit no longer count. The commit must be on main, where every release
# is cut (`make release-alpha`); the tag's message is the release's
# CHANGELOG.md section, which is also the GitHub release's notes.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  meta:
    name: What to release
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.meta.outputs.kind }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      flavour: ${{ steps.meta.outputs.flavour }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Release metadata
        id: meta
        run: |
          kind=skip tag="" sha="" version="" flavour="" prerelease=true
          case "$GITHUB_REF" in
          refs/tags/v*)
            tag="${GITHUB_REF_NAME}"
            # checkout leaves the tag without its annotation; fetch it again.
            git fetch --quiet --force origin "refs/tags/${tag}:refs/tags/${tag}"
            sha="$(git rev-parse "${tag}^{commit}")"
            if [ "$(git describe --tags --exact-match "$sha")" != "$tag" ]; then
              echo "::error::git describe does not name ${tag} for ${sha}."
              exit 1
            fi
            flavour="$(printf '%s\n' "$tag" | sed -n 's/^v[0-9][0-9.]*-\([a-z][a-z0-9]*\)\.[0-9][0-9]*$/\1/p')"
            if [ -z "$flavour" ] && printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              flavour=stable
            fi
            if [ -z "$flavour" ]; then
              echo "::error::${tag} names no flavour: a release tag is vX.Y.Z or vX.Y.Z-<label>.N."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$sha" origin/main; then
              echo "::error::${tag} (${sha}) is not on main, where every release is cut."
              exit 1
            fi
            # 0.x is pre-release by definition, as is any -suffix.
            case "$tag" in v0.*|*-*) ;; *) prerelease=false ;; esac
            kind=release version="$tag"
            ;;
          esac
          echo "${kind}: ${version:-nothing} (${sha:-no commit}), flavour ${flavour:-none}"
          {
            echo "kind=${kind}"
            echo "tag=${tag}"
            echo "sha=${sha}"
            echo "version=${version}"
            echo "flavour=${flavour}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: meta
    if: needs.meta.outputs.kind != 'skip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.sha }}
          fetch-depth: 0

      # The same toolchain as ci.yml: a supported line, newest patch.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true

      # Tested by ci.yml's jobs before this workflow was called.
      - name: Build every binary and package, SHA256SUMS and the manifest
        run: make release VERSION="${{ needs.meta.outputs.version }}" FLAVOUR="${{ needs.meta.outputs.flavour }}"

      - name: Hand the files to the signing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  sign:
    name: Sign and publish
    needs: [ meta, build ]
    if: needs.meta.outputs.kind == 'release'
    runs-on: ubuntu-latest
    environment: signing
    permissions:
      contents: write
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      SHA: ${{ needs.meta.outputs.sha }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      # The public key and the tag's message; nothing from here is run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      # The flavour comes from the tag here again, not from meta, which
      # ran beside the build: a manifest of another flavour is refused.
      - name: Check the manifest's tag and flavour
        run: |
          flavour="$(printf '%s\n' "$TAG" | sed -n 's/^v[0-9][0-9.]*-\([a-z][a-z0-9]*\)\.[0-9][0-9]*$/\1/p')"
          flavour="${flavour:-stable}"
          echo "FLAVOUR=${flavour}" >> "$GITHUB_ENV"
          grep -q "\"tag\": \"${TAG}\"" dist/massimo-release.json || { echo "::error::the manifest is not ${TAG}'s"; exit 1; }
          grep -q "\"channel\": \"${flavour}\"" dist/massimo-release.json || { echo "::error::the manifest's flavour is not ${flavour}"; exit 1; }
          if grep -q '"release":' dist/massimo-release.json; then
            echo "::error::a numbered release's manifest names another release"
            exit 1
          fi

      - name: Sign the manifest
        env:
          MASSIMO_RELEASE_KEY: ${{ secrets.MASSIMO_RELEASE_KEY }}
        run: |
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MASSIMO_RELEASE_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/massimo-release.json | base64 -w0 > dist/massimo-release.json.sig
          echo >> dist/massimo-release.json.sig

      # The signature must verify against the key massimo has compiled in,
      # or no installed binary would accept the release.
      - name: Verify against the compiled-in key
        run: |
          base64 -d dist/massimo-release.json.sig > "$RUNNER_TEMP/sig.bin"
          openssl pkeyutl -verify -pubin -inkey internal/update/release-key.pem -rawin \
            -in dist/massimo-release.json -sigfile "$RUNNER_TEMP/sig.bin"
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          sentence="Flavour: \`${FLAVOUR}\`, which boxes on the channel \`${FLAVOUR}\` and on every less stable one take. Install or update with \`massimo update\`, or install the Debian package with \`apt install ./massimo_<version>_<arch>.deb\` (see packaging/README.md); verify a download by hand with \`sha256sum -c SHA256SUMS\`."
          # The notes are the tag message's body, the release's CHANGELOG.md
          # section as changelog.sh wrote it, then the sentence; an old tag's
          # channel: line is not part of them, and a tag with no body gets
          # the sentence alone.
          git fetch --quiet --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          body="$(git for-each-ref --format='%(contents:body)' "refs/tags/${TAG}" | sed -e '/^channel:/d' -e '/./,$!d')"
          if [ -n "$body" ]; then
            printf '%s\n\n%s\n' "$body" "$sentence" > "$RUNNER_TEMP/notes.md"
          else
            printf '%s\n' "$sentence" > "$RUNNER_TEMP/notes.md"
          fi
          # The target is the tag's commit; a box reads the flavour from
          # the tag's label (internal/update, hintedFlavour).
          gh release create "$TAG" --verify-tag --target "$SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}" dist/massimo-* dist/*.deb dist/SHA256SUMS

  # The Homebrew formula of the release's channel, pushed to the tap
  # (publish.yml), once the release is published; skipped without the
  # tap's deploy key. It runs from here because the release this run
  # creates with its own token starts no workflow of its own.
  homebrew:
    name: Homebrew
    needs: [ meta, sign ]
    if: needs.meta.outputs.kind == 'release'
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.meta.outputs.tag }}
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

  # The apt repository: the packages of the newest releases of every
  # channel, one suite per channel, signed with the repository key
  # (MASSIMO_APT_KEY, with its passphrase, in the signing environment)
  # and built into the Pages artifact; nothing of it runs without the
  # key. The site has no state: every release rebuilds it from GitHub.
  apt-build:
    name: Build the apt repository
    needs: [ meta, sign ]
    if: needs.meta.outputs.kind == 'release'
    runs-on: ubuntu-latest
    environment: signing
    outputs:
      built: ${{ steps.site.outputs.built }}
    env:
      HAS_APT_KEY: ${{ secrets.MASSIMO_APT_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_APT_KEY == 'true'

      # nfpm, for the keyring package, through go run at the Makefile's version.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.HAS_APT_KEY == 'true'
        with:
          go-version: '1.26'
          check-latest: true

      - name: Build the site from the releases
        id: site
        if: env.HAS_APT_KEY == 'true'
        env:
          APT_KEY: ${{ secrets.MASSIMO_APT_KEY }}
          APT_KEY_PASSPHRASE: ${{ secrets.MASSIMO_APT_KEY_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          printf '%s\n' "$APT_KEY" | gpg --batch --quiet --import
          key="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          command -v apt-ftparchive >/dev/null || sudo apt-get -qq install -y apt-utils
          packaging/apt/publish.sh --out site --key "$key"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: env.HAS_APT_KEY == 'true'
        with:
          path: site

  # Pages deploys from the artifact. Two settings of the owner's
  # (packaging/README.md, "The apt repository"): the repository's Pages
  # source is "GitHub Actions", and the github-pages environment GitHub
  # then makes, which deploys from the default branch only, also allows
  # the tags v* (Settings → Environments → github-pages → Deployment
  # branches and tags), since this job runs for a tag; else it is refused.
  apt-deploy:
    name: Deploy the apt repository
    needs: apt-build
    if: needs.apt-build.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
