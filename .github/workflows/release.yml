name: Release

# The release of a commit CI has tested and build.yml has built: called by
# ci.yml once every test job has passed and the build is done, and by
# nightly.yml after its build, with build.yml's answers as inputs and its
# files as the run's artifact `release`. Called, it runs with the
# caller's ref, which the environments' rules are matched against: a version
# tag, which the signing environment admits alone, or main, which
# signing-rolling admits. A workflow started by workflow_run would carry
# the default branch whatever started it.
#
# The jobs, a key in one each: `sign` holds the release key through the
# `signing` environment, which only version tags may use, runs nothing but
# openssl and gh on what build.yml handed over, checks that the tag holds
# its store dump (make release, tools/store-fixture/make.sh), the signature
# against the public key compiled into massimo and the flavour against
# the tag before publishing, and publishes exactly what it signed as a
# GitHub release, which `massimo update` installs (internal/update);
# `rolling` does the same for a rolling build, devel or nightly, with the
# rolling key, through the signing-rolling environment, which main may
# use, and whose key boxes accept for the rolling flavours alone, as the
# one release release/<flavour>, replaced in place, and then signs the
# flavour's apt suite with the rolling apt key, attaching its index to
# that release. `homebrew` then pushes
# the formula to the tap (publish.yml) with the tap's key, and
# `apt-build` holds the apt repository's key, both through the signing
# environment too, and rebuilds the repository from the releases
# (packaging/apt/publish.sh). Both start beside `sign` and wait for it
# inside (packaging/wait-for-job.sh), so that one approval lets the
# three of them run (D57-A, 2026-11-11). `sign` and `rolling` sign
# SHA256SUMS too, as SHA256SUMS.sig. The Android app (AP MobileApp,
# Block 4): `app-sign` signs a release's APK and AAB, which build.yml
# built unsigned, with the app's keys through the signing environment,
# and `app-publish` waits for both signing jobs, adds the app to the
# release and its lines to SHA256SUMS, which it signs again with the
# release key; both start beside `sign` under its approval. `rolling`
# signs the nightly build's APK itself, before it publishes; `attest`,
# without a key, attests what these signed. `site`
# (site.yml) builds the site around it, with the docs of every channel,
# and puts it on GitHub Pages, also for a run that releases nothing, from
# the newest release's signed index, with each rolling release's index
# beside it. The tag's message is the release's
# CHANGELOG.md section, which is also the GitHub release's notes; the
# tag message's channel: line no longer counts.
on:
  workflow_call:
    inputs:
      kind:
        description: 'what build.yml decided: release, devel, nightly or skip'
        type: string
        required: true
      tag:
        description: 'the version tag of a release'
        type: string
        required: true
      sha:
        description: 'the commit built'
        type: string
        required: true
      version:
        description: 'the version built'
        type: string
        required: true
      flavour:
        description: 'the flavour built'
        type: string
        required: true
      release:
        description: 'the release of a rolling build (release/devel)'
        type: string
        required: true
      prerelease:
        description: 'whether a release is a pre-release (true or false)'
        type: string
        required: true
      site:
        description: 'false where the site is not to be deployed (a nightly build at a release commit)'
        type: string
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  sign:
    name: Sign and publish
    if: inputs.kind == 'release'
    runs-on: ubuntu-latest
    environment: signing
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      SHA: ${{ inputs.sha }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      # The public key, the tag's message and the history the release
      # branch is pushed from; nothing from here is run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      # The store the release writes, dumped by make release in a commit
      # before the release commit (tools/store-fixture/make.sh), so that
      # every later binary's TestMigratesReleasedStores migrates it
      # (docs/store.md, "Migrations"): a tag without it is not published.
      - name: Check the release's store dump
        run: |
          dump="internal/store/testdata/releases/${TAG}.sql"
          if [ ! -s "$dump" ]; then
            echo "::error::${TAG}'s tree lacks ${dump}: make release makes it; a tag cut otherwise needs tools/store-fixture/make.sh --ref <commit> ${TAG} committed before its release commit, and the tag made again"
            exit 1
          fi

      # The flavour comes from the tag here again, not from build.yml's
      # What to release, whose answer arrives as an input: a manifest of
      # another flavour is refused.
      - name: Check the manifest's tag and flavour
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z][a-z0-9]*\.[0-9]+)?$'; then
            echo "::error::${TAG} is not a version tag, vX.Y.Z or vX.Y.Z-<label>.N."
            exit 1
          fi
          flavour="$(printf '%s\n' "$TAG" | sed -nE 's/^v[0-9]+\.[0-9]+\.[0-9]+-([a-z][a-z0-9]*)\.[0-9]+$/\1/p')"
          flavour="${flavour:-stable}"
          echo "FLAVOUR=${flavour}" >> "$GITHUB_ENV"
          grep -q "\"tag\": \"${TAG}\"" dist/massimo-release.json || { echo "::error::the manifest is not ${TAG}'s"; exit 1; }
          grep -q "\"channel\": \"${flavour}\"" dist/massimo-release.json || { echo "::error::the manifest's flavour is not ${flavour}"; exit 1; }
          if grep -q '"release":' dist/massimo-release.json; then
            echo "::error::a numbered release's manifest names another release"
            exit 1
          fi

      # The manifest, which boxes install from, and SHA256SUMS, which people
      # check a download with (AP MobileApp, D15-D): Publish the Android
      # app signs SHA256SUMS again once it holds the app's lines.
      - name: Sign the manifest and SHA256SUMS
        env:
          MASSIMO_RELEASE_KEY: ${{ secrets.MASSIMO_RELEASE_KEY }}
        run: |
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MASSIMO_RELEASE_KEY" > "$key"
          for f in dist/massimo-release.json dist/SHA256SUMS; do
            openssl pkeyutl -sign -inkey "$key" -rawin -in "$f" | base64 -w0 > "${f}.sig"
            echo >> "${f}.sig"
          done

      # The signatures must verify against the key massimo has compiled in,
      # or no installed binary would accept the release.
      - name: Verify against the compiled-in key
        run: |
          for f in dist/massimo-release.json dist/SHA256SUMS; do
            base64 -d "${f}.sig" > "$RUNNER_TEMP/sig.bin"
            openssl pkeyutl -verify -pubin -inkey internal/update/release-key.pem -rawin \
              -in "$f" -sigfile "$RUNNER_TEMP/sig.bin"
          done
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          sentence="Flavour: \`${FLAVOUR}\`, which boxes on the channel \`${FLAVOUR}\` and on every less stable one take. Install or update with \`massimo update\`, or install the Debian package with \`apt install ./massimo_<version>_<arch>.deb\` (see packaging/README.md); verify a download by hand with \`sha256sum -c SHA256SUMS\`, and SHA256SUMS with its signature, SHA256SUMS.sig (README.md, \"Installing\")."
          # The notes are the tag message's body, the release's CHANGELOG.md
          # section as changelog.sh wrote it, then the sentence; an old tag's
          # channel: line is not part of them, and a tag with no body gets
          # the sentence alone.
          git fetch --quiet --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          body="$(git for-each-ref --format='%(contents:body)' "refs/tags/${TAG}" | sed -e '/^channel:/d' -e '/./,$!d')"
          if [ -n "$body" ]; then
            printf '%s\n\n%s\n' "$body" "$sentence" > "$RUNNER_TEMP/notes.md"
          else
            printf '%s\n' "$sentence" > "$RUNNER_TEMP/notes.md"
          fi
          # The target is the tag's commit; a box reads the flavour from
          # the tag's label (internal/update, hintedFlavour).
          gh release create "$TAG" --verify-tag --target "$SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}" dist/massimo-* dist/*.deb dist/SHA256SUMS dist/SHA256SUMS.sig
          # Every file under its own name, or SHA256SUMS and the manifest
          # name files the release lacks (packaging/release-assets.sh).
          packaging/release-assets.sh "$TAG" dist/massimo-* dist/*.deb dist/SHA256SUMS dist/SHA256SUMS.sig

      # The release branch follows the published release: release/<flavour>
      # names what the flavour's boxes are offered. It is pushed with a
      # deploy key, since GitHub refuses GITHUB_TOKEN a branch update that
      # changes .github/workflows/, which a release's commits often do; the
      # ruleset on release/* lets only a fast-forward through, and the first
      # push makes the branch. GitHub's host keys come from its API, over
      # HTTPS. Without the key the branch stays and the release stands.
      - name: Move the release branch
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_BRANCH_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="release/${FLAVOUR}"
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::warning::RELEASE_BRANCH_DEPLOY_KEY is not set; ${branch} stays where it is."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${branch}" >/dev/null; then
            echo "::error::a tag ${branch} exists; a name is never both a branch and a tag."
            exit 1
          fi
          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "${ssh_dir:?}"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts"
          git push "git@github.com:${GITHUB_REPOSITORY}.git" "${SHA}:refs/heads/${branch}"
          echo "${branch} is ${SHA} (${TAG})"

  # The Android app of a release (AP MobileApp, Block 4, D14-A, D16-A):
  # build.yml's unsigned APK signed with the app signing key, its AAB with
  # Google Play's upload key, each checked against its certificate in
  # app/android/signing/ (packaging/app-sign.sh), and handed to Publish
  # the Android app as the artifact app-signed; nothing is published here.
  # It starts beside sign, in the signing environment, so that the one
  # approval lets it run. Without a key's two secrets or its certificate,
  # or without the build's files, it warns and signs nothing, and the
  # release carries no app (no AAB without the upload key alone).
  app-sign:
    name: Sign the Android app
    if: inputs.kind == 'release'
    runs-on: ubuntu-latest
    environment: signing
    permissions:
      contents: read
    env:
      HAS_APP_KEY: ${{ secrets.MASSIMO_APP_KEYSTORE != '' && secrets.MASSIMO_APP_KEYSTORE_PASSWORD != '' }}
      HAS_UPLOAD_KEY: ${{ secrets.MASSIMO_APP_UPLOAD_KEYSTORE != '' && secrets.MASSIMO_APP_UPLOAD_KEYSTORE_PASSWORD != '' }}
    steps:
      # The script and the certificates; nothing from here is built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: app
        continue-on-error: true
        with:
          name: release-app
          path: app-dist

      - name: Sign the APK and the AAB
        id: sign
        if: steps.app.outcome == 'success' && env.HAS_APP_KEY == 'true'
        env:
          APP_KEYSTORE: ${{ secrets.MASSIMO_APP_KEYSTORE }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.MASSIMO_APP_KEYSTORE_PASSWORD }}
          UPLOAD_KEYSTORE: ${{ secrets.MASSIMO_APP_UPLOAD_KEYSTORE }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.MASSIMO_APP_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          certs=app/android/signing
          if [ ! -f "${certs}/app-cert.pem" ]; then
            echo "::warning::${certs}/app-cert.pem is not committed: the app signing key's signer cannot be checked, and the release carries no app."
            exit 0
          fi
          export JAVA_HOME="${JAVA_HOME_17_X64:-${JAVA_HOME:-}}"
          umask 077
          keys="$(mktemp -d)"
          trap 'rm -rf "${keys:?}"' EXIT
          mkdir -p app-signed
          printf '%s' "$APP_KEYSTORE" | base64 -d > "${keys}/app.p12"
          APP_KS_PASS="$APP_KEYSTORE_PASSWORD" packaging/app-sign.sh apk app-dist/massimo-android-unsigned.apk \
            app-signed/massimo-android.apk "${keys}/app.p12" massimo "${certs}/app-cert.pem"
          if [ "$HAS_UPLOAD_KEY" != true ]; then
            echo "::warning::MASSIMO_APP_UPLOAD_KEYSTORE or its password is not set in signing: the release carries the APK and no AAB."
          elif [ ! -f "${certs}/upload-cert.pem" ]; then
            echo "::warning::${certs}/upload-cert.pem is not committed: the release carries the APK and no AAB."
          else
            printf '%s' "$UPLOAD_KEYSTORE" | base64 -d > "${keys}/upload.p12"
            APP_KS_PASS="$UPLOAD_KEYSTORE_PASSWORD" packaging/app-sign.sh aab app-dist/massimo-android-play-unsigned.aab \
              app-signed/massimo-android-play.aab "${keys}/upload.p12" upload "${certs}/upload-cert.pem"
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: No app
        if: steps.sign.outputs.signed != 'true'
        run: echo "::warning::the release carries no Android app; the steps above say why (build.yml's Android app, MASSIMO_APP_KEYSTORE and its password in signing, app/android/signing/app-cert.pem)."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.sign.outputs.signed == 'true'
        with:
          name: app-signed
          path: app-signed/
          if-no-files-found: error
          retention-days: 1

  # D15-D and D20-A: the signed app onto the release, its lines added to
  # SHA256SUMS, which is signed again with the release key. It runs only
  # sha256sum, openssl and gh, starts beside sign under the one approval,
  # and waits for sign and for Sign the Android app; the SHA256SUMS sign
  # published must verify against the compiled-in key before it is
  # extended, and a re-run replaces the app's lines. The app files first,
  # then the sums and their signature; a check by hand in the second
  # between them fails and passes on the next try. The new SHA256SUMS and
  # the app go to Attest the signed files as the artifact signed.
  # actions: the wait reads this run's jobs.
  app-publish:
    name: Publish the Android app
    if: inputs.kind == 'release'
    runs-on: ubuntu-latest
    environment: signing
    permissions:
      contents: write
      actions: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # The waiting script and the public key; nothing from here is built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for Sign and publish and Sign the Android app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          packaging/wait-for-job.sh "Sign and publish"
          packaging/wait-for-job.sh "Sign the Android app"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: app
        continue-on-error: true
        with:
          name: app-signed
          path: signed

      - name: Nothing signed
        if: steps.app.outcome != 'success'
        run: echo "::notice::Sign the Android app signed nothing; ${TAG} keeps its SHA256SUMS."

      - name: Add the app to SHA256SUMS, sign it, and publish
        if: steps.app.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          MASSIMO_RELEASE_KEY: ${{ secrets.MASSIMO_RELEASE_KEY }}
        run: |
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "${work:?}"' EXIT
          pub="${PWD}/internal/update/release-key.pem"
          gh release download "$TAG" -p SHA256SUMS -p SHA256SUMS.sig -D "$work"
          base64 -d "${work}/SHA256SUMS.sig" > "${work}/sig.bin"
          openssl pkeyutl -verify -pubin -inkey "$pub" -rawin -in "${work}/SHA256SUMS" -sigfile "${work}/sig.bin"
          cd signed
          app=(massimo-android*)
          grep -vE '^[0-9a-f]{64} [ *]massimo-android[a-z-]*\.(apk|aab)$' "${work}/SHA256SUMS" > SHA256SUMS
          sha256sum "${app[@]}" >> SHA256SUMS
          printf '%s\n' "$MASSIMO_RELEASE_KEY" > "${work}/key"
          openssl pkeyutl -sign -inkey "${work}/key" -rawin -in SHA256SUMS | base64 -w0 > SHA256SUMS.sig
          echo >> SHA256SUMS.sig
          base64 -d SHA256SUMS.sig > "${work}/new.bin"
          openssl pkeyutl -verify -pubin -inkey "$pub" -rawin -in SHA256SUMS -sigfile "${work}/new.bin"
          sha256sum -c --ignore-missing SHA256SUMS
          gh release upload "$TAG" --clobber "${app[@]}"
          gh release upload "$TAG" --clobber SHA256SUMS SHA256SUMS.sig
          ../packaging/release-assets.sh "$TAG" "${app[@]}" SHA256SUMS SHA256SUMS.sig
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.app.outcome == 'success'
        with:
          name: signed
          path: |
            signed/massimo-android*
            signed/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  # GitHub's build provenance of the files signed in this run (D15-D): a
  # release's APK and AAB with the SHA256SUMS that names them, or the
  # nightly APK with its build's; build.yml attested everything else. No
  # key here, and nothing but the attestation action runs.
  attest:
    name: Attest the signed files
    needs: [ app-publish, rolling ]
    if: ${{ !cancelled() && (needs.app-publish.result == 'success' || needs.rolling.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: signed
        continue-on-error: true
        with:
          name: signed
          path: signed

      - name: Nothing signed
        if: steps.signed.outcome != 'success'
        run: echo "::notice::no app was signed in this run; build.yml's attestations cover every file."

      - name: Attest the signed files' provenance
        if: steps.signed.outcome == 'success'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: signed/*

  # A rolling build: signed with the rolling key and published as the one
  # release release/<flavour>, which is replaced in place. Editing a
  # release notifies no watcher, as creating one at every merge would.
  # One run at a time per flavour; a run that finds a newer build
  # published leaves it. A box downloading while the files are swapped
  # fails the signature check and tries again at its next check.
  rolling:
    name: Sign and publish the ${{ inputs.flavour }} build
    if: inputs.kind == 'devel' || inputs.kind == 'nightly'
    runs-on: ubuntu-latest
    environment: signing-rolling
    concurrency:
      group: rolling-${{ inputs.flavour }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      FLAVOUR: ${{ inputs.flavour }}
      RELEASE: ${{ inputs.release }}
      VERSION: ${{ inputs.version }}
      SHA: ${{ inputs.sha }}
      HAS_APT_KEY: ${{ secrets.MASSIMO_ROLLING_APT_KEY != '' }}
      HAS_TAP_KEY: ${{ secrets.HOMEBREW_ROLLING_TAP_DEPLOY_KEY != '' }}
      HAS_APP_KEY: ${{ secrets.MASSIMO_APP_ROLLING_KEYSTORE != '' && secrets.MASSIMO_APP_ROLLING_KEYSTORE_PASSWORD != '' }}
    steps:
      # The public key, CHANGELOG.md and changelog.sh for the notes, and
      # the history for the ancestry; nothing from here is built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          submodules: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      # The flavour this run may publish comes from its event here, not
      # from build.yml's What to release: devel from a push to main,
      # nightly from the schedule or by hand on main (nightly.yml).
      - name: Check the manifest's version, flavour and release
        run: |
          case "${GITHUB_EVENT_NAME}:${GITHUB_REF}" in
          push:refs/heads/main) allowed=devel ;;
          schedule:refs/heads/main | workflow_dispatch:refs/heads/main) allowed=nightly ;;
          *) allowed="" ;;
          esac
          if [ "$FLAVOUR" != "$allowed" ]; then
            echo "::error::this run (${GITHUB_EVENT_NAME} of ${GITHUB_REF}) may not publish ${FLAVOUR}."
            exit 1
          fi
          for want in "\"tag\": \"${VERSION}\"" "\"release\": \"release/${FLAVOUR}\"" "\"channel\": \"${FLAVOUR}\"" "\"commit\": \"${SHA}\""; do
            grep -qF "$want" dist/massimo-release.json || { echo "::error::the manifest lacks ${want}"; exit 1; }
          done

      # The nightly build's Android app (AP MobileApp, D18-A, D19-A):
      # build.yml's unsigned nightly APK, signed here with the rolling app
      # key and checked against app/android/signing/rolling-cert.pem
      # (packaging/app-sign.sh), joins the build's files with its line in
      # SHA256SUMS before they are signed and published. A devel build
      # carries none. Without the key's two secrets, its certificate or the
      # build's file, or where the signing fails, the build goes out
      # without it, and the step after says so.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: app
        if: inputs.kind == 'nightly'
        continue-on-error: true
        with:
          name: release-app
          path: app-dist

      - name: Sign the nightly app
        id: app-sign
        if: inputs.kind == 'nightly' && steps.app.outcome == 'success' && env.HAS_APP_KEY == 'true'
        continue-on-error: true
        env:
          APP_KEYSTORE: ${{ secrets.MASSIMO_APP_ROLLING_KEYSTORE }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.MASSIMO_APP_ROLLING_KEYSTORE_PASSWORD }}
        run: |
          cert=app/android/signing/rolling-cert.pem
          if [ ! -f "$cert" ]; then
            echo "::warning::${cert} is not committed: the rolling app key's signer cannot be checked."
            exit 0
          fi
          export JAVA_HOME="${JAVA_HOME_17_X64:-${JAVA_HOME:-}}"
          umask 077
          keys="$(mktemp -d)"
          trap 'rm -rf "${keys:?}"' EXIT
          printf '%s' "$APP_KEYSTORE" | base64 -d > "${keys}/rolling.p12"
          APP_KS_PASS="$APP_KEYSTORE_PASSWORD" packaging/app-sign.sh apk app-dist/massimo-android-nightly-unsigned.apk \
            "${keys}/massimo-android-nightly.apk" "${keys}/rolling.p12" rolling "$cert"
          mv "${keys}/massimo-android-nightly.apk" dist/
          (cd dist && sha256sum massimo-android-nightly.apk >> SHA256SUMS)
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: No nightly app
        if: inputs.kind == 'nightly' && steps.app-sign.outputs.signed != 'true'
        run: echo "::warning::the ${FLAVOUR} build carries no Android app; the steps above say why (build.yml's Android app, MASSIMO_APP_ROLLING_KEYSTORE and its password in signing-rolling, app/android/signing/rolling-cert.pem)."

      # The manifest, which boxes install from, and SHA256SUMS, which
      # people check a download with (AP MobileApp, D15-D).
      - name: Sign the manifest and SHA256SUMS
        env:
          MASSIMO_ROLLING_KEY: ${{ secrets.MASSIMO_ROLLING_KEY }}
        run: |
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MASSIMO_ROLLING_KEY" > "$key"
          for f in dist/massimo-release.json dist/SHA256SUMS; do
            openssl pkeyutl -sign -inkey "$key" -rawin -in "$f" | base64 -w0 > "${f}.sig"
            echo >> "${f}.sig"
          done

      - name: Verify against the compiled-in rolling key
        run: |
          for f in dist/massimo-release.json dist/SHA256SUMS; do
            base64 -d "${f}.sig" > "$RUNNER_TEMP/sig.bin"
            openssl pkeyutl -verify -pubin -inkey internal/update/rolling-key.pem -rawin \
              -in "$f" -sigfile "$RUNNER_TEMP/sig.bin"
          done
          (cd dist && sha256sum -c SHA256SUMS)

      # The notes: what the build is, the commits since the build before
      # it, and CHANGELOG.md's [Unreleased] as the next release would
      # write it (changelog.sh preview, from guidelines v4.54.0).
      - name: Write the notes
        run: |
          git fetch --quiet --force origin "+refs/tags/${RELEASE}:refs/tags/${RELEASE}" 2>/dev/null || true
          prev="$(git rev-parse --verify --quiet "refs/tags/${RELEASE}^{commit}" || true)"
          {
            # The backquotes are Markdown's code spans, not a command.
            # shellcheck disable=SC2016
            printf 'The %s build of `%s` (%s), replaced in place by the next one. Boxes on the channel `%s` take it with `massimo update` or the web UI; it is signed with the rolling key, which boxes accept for the rolling flavours alone.\n\n' "$FLAVOUR" "$VERSION" "$SHA" "$FLAVOUR"
            if [ -n "$prev" ] && git merge-base --is-ancestor "$prev" "$SHA"; then
              printf '## Commits since the previous %s build\n\n' "$FLAVOUR"
              git log --first-parent --format='- %s (%h)' "${prev}..${SHA}"
              echo
            fi
            printf '## Unreleased\n\n'
            if preview="$(GUIDELINES/shared/tools/changelog.sh preview 2>/dev/null)"; then
              printf '%s\n' "$preview"
            else
              echo "CHANGELOG.md's [Unreleased] is shown here once the guidelines carry changelog.sh preview (v4.54.0)."
            fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # Published only where the release still names a commit before this
      # one; then the binaries, packages and sums first, the manifest and
      # its signature after them, so that a box which reads the new
      # manifest finds its files already there; then the tag, and the notes
      # and the files the new build lacks (the debs carry the version in
      # their name) last. Before the tag moves, every file must be an asset
      # under its own name (packaging/release-assets.sh): a file GitHub
      # renamed would otherwise be deleted below as not the build's; the
      # step fails and the release keeps its old tag. The tag is pushed
      # with the deploy key
      # ROLLING_TAG_DEPLOY_KEY: GitHub refused GITHUB_TOKEN the move once
      # main's workflow files had changed since the commit (2026-11-10);
      # without the key the token tries.
      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_KEY: ${{ secrets.ROLLING_TAG_DEPLOY_KEY }}
        run: |
          git fetch --quiet --force origin "+refs/tags/${RELEASE}:refs/tags/${RELEASE}" 2>/dev/null || true
          files=(dist/massimo-* dist/*.deb dist/SHA256SUMS dist/SHA256SUMS.sig)
          title="${FLAVOUR} ${VERSION}"
          if ! cur="$(git rev-parse --verify --quiet "refs/tags/${RELEASE}^{commit}")"; then
            gh release create "$RELEASE" --target "$SHA" --prerelease --latest=false --title "$title" --notes-file "$RUNNER_TEMP/notes.md" "${files[@]}"
            packaging/release-assets.sh "$RELEASE" "${files[@]}"
            echo "${RELEASE} made at ${SHA}"
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge-base --is-ancestor "$SHA" "$cur"; then
            echo "${RELEASE} is ${cur}, at or after ${SHA}: left as it is."
            exit 0
          fi
          manifest=(dist/massimo-release.json dist/massimo-release.json.sig)
          payload=()
          for f in "${files[@]}"; do
            case "$f" in dist/massimo-release.json | dist/massimo-release.json.sig) ;; *) payload+=("$f") ;; esac
          done
          gh release upload "$RELEASE" --clobber "${payload[@]}"
          gh release upload "$RELEASE" --clobber "${manifest[@]}"
          packaging/release-assets.sh "$RELEASE" "${files[@]}"
          if [ -n "$TAG_KEY" ]; then
            ssh_dir="$(mktemp -d)"
            trap 'rm -rf "${ssh_dir:?}"' EXIT
            (umask 077 && printf '%s\n' "$TAG_KEY" > "$ssh_dir/key")
            gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$ssh_dir/known_hosts"
            GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts" \
              git push --force "git@github.com:${GITHUB_REPOSITORY}.git" "${SHA}:refs/tags/${RELEASE}"
          else
            echo "::warning::ROLLING_TAG_DEPLOY_KEY is not set; the token moves ${RELEASE}, which GitHub may refuse."
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE}" -f sha="$SHA" -F force=true >/dev/null
          fi
          gh release edit "$RELEASE" --target "$SHA" --title "$title" --notes-file "$RUNNER_TEMP/notes.md" --prerelease --latest=false
          # The apt index stays until the next step replaces it.
          keep="$(for f in "${files[@]}" massimo-apt-index.tar.gz; do basename "$f"; done)"
          gh release view "$RELEASE" --json assets --jq '.assets[].name' | while read -r name; do
            if ! printf '%s\n' "$keep" | grep -qxF "$name"; then
              gh release delete-asset "$RELEASE" "$name" --yes
            fi
          done
          echo "${RELEASE} moved from ${cur} to ${SHA}"
          echo "published=true" >> "$GITHUB_OUTPUT"

      # The nightly APK and the SHA256SUMS that names it, for Attest the
      # signed files; only where this run published them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.app-sign.outputs.signed == 'true' && steps.publish.outputs.published == 'true'
        with:
          name: signed
          path: |
            dist/massimo-android-nightly.apk
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

      # The rolling suite of the apt repository (packaging/README.md, "The
      # apt repository"): the build's packages as the release now has them,
      # signed with the rolling apt key, which only this environment holds
      # and boxes accept for the rolling suites alone; its index replaces
      # the release's, and the site assembles it beside the numbered
      # suites. Skipped without the key; the site then has no suite of
      # this flavour. nfpm, for the keyring package, through go run at the
      # Makefile's version; no cache in a job that holds the key.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: env.HAS_APT_KEY == 'true'
        with:
          go-version: '1.26'
          check-latest: true
          cache: false

      - name: Build the rolling apt suite and attach its index
        if: env.HAS_APT_KEY == 'true'
        env:
          APT_KEY: ${{ secrets.MASSIMO_ROLLING_APT_KEY }}
          APT_KEY_PASSPHRASE: ${{ secrets.MASSIMO_ROLLING_APT_KEY_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          printf '%s\n' "$APT_KEY" | gpg --batch --quiet --import
          key="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          command -v apt-ftparchive >/dev/null || sudo apt-get -qq install -y apt-utils
          packaging/apt/publish.sh --out "$RUNNER_TEMP/apt-site" --key "$key" --rolling "$FLAVOUR" \
            --index-asset "$RUNNER_TEMP/massimo-apt-index.tar.gz"
          gh release upload "$RELEASE" --clobber "$RUNNER_TEMP/massimo-apt-index.tar.gz"

      - name: No rolling apt key
        if: env.HAS_APT_KEY != 'true'
        run: echo "::warning::MASSIMO_ROLLING_APT_KEY is not set in signing-rolling; the site has no apt suite ${FLAVOUR}."

      # The flavour's Homebrew formula, massimo-devel or massimo-nightly,
      # in the rolling tap metaworx/homebrew-massimo-rolling, whose deploy
      # key only this environment holds (packaging/README.md, "Homebrew"):
      # the newer of this build and the newest numbered release, as a box
      # on the channel takes them, built from that commit's or tag's
      # archive as the flavour. Only where this run published the build:
      # one that found a newer build there leaves the formula to that one's
      # run. Skipped with a warning without the key.
      - name: Push the rolling formula to its tap
        if: env.HAS_TAP_KEY == 'true' && steps.publish.outputs.published == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_ROLLING_TAP_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          # The newest numbered release, by the order apt's versions have
          # (the Makefile's DEBVER: a build sorts after the tag it follows).
          mine="$(make -s --no-print-directory debver VERSION="$VERSION")"
          newest="" newest_deb="$mine"
          for t in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --exclude-drafts --json tagName \
            --jq '.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-[a-z][a-z0-9]*\\.[0-9]+)?$"))'); do
            d="$(make -s --no-print-directory debver VERSION="$t")"
            if dpkg --compare-versions "$d" gt "$newest_deb"; then newest="$t" newest_deb="$d"; fi
          done
          git clone --depth 1 git@github.com:metaworx/homebrew-massimo-rolling.git tap
          others=""
          if [ -d tap/Formula ]; then
            others="$(find tap/Formula -maxdepth 1 -name '*.rb' -exec basename {} .rb \; | paste -sd, -)"
          fi
          if [ -n "$newest" ]; then
            echo "${newest} is newer than this build (${VERSION}): massimo-${FLAVOUR} follows it"
            from="$newest"
            name="$(packaging/homebrew/render.sh --tag "$newest" --channel "$FLAVOUR" --conflicts "$others" --out formula.rb)"
          else
            from="$VERSION"
            name="$(packaging/homebrew/render.sh --commit "$SHA" --version "$VERSION" --channel "$FLAVOUR" --conflicts "$others" --out formula.rb)"
          fi
          cat formula.rb
          install -D formula.rb "tap/Formula/${name}.rb"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Formula/${name}.rb"
          if git diff --cached --quiet; then
            echo "the tap holds this formula for ${from} already"
            exit 0
          fi
          git commit -m "${name} ${from}" -m "Rendered by metaworx/massimo's release workflow from packaging/homebrew/massimo.rb.in."
          git push

      - name: No rolling tap key
        if: env.HAS_TAP_KEY != 'true'
        run: echo "::warning::HOMEBREW_ROLLING_TAP_DEPLOY_KEY is not set in signing-rolling; the rolling tap has no new massimo-${FLAVOUR}."

  # The Homebrew formula of the release's channel, pushed to the tap
  # (publish.yml), once the release is published; skipped without the
  # tap's deploy key. It runs from here because the release this run
  # creates with its own token starts no workflow of its own. It starts
  # beside sign and waits for it inside (wait), in the signing
  # environment, so that one approval lets sign, apt-build and it run:
  # GitHub asks again for a job that reaches the environment later.
  # actions: the wait reads this run's jobs.
  homebrew:
    name: Homebrew
    if: inputs.kind == 'release'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ inputs.tag }}
      wait: true
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

  # The apt repository: the packages of the newest releases of every
  # flavour, one suite per flavour, signed with the repository key
  # (MASSIMO_APT_KEY, with its passphrase, in the signing environment)
  # and handed to the site as the artifact apt; nothing of it runs
  # without the key. It has no state: every release rebuilds it from
  # GitHub.
  # The signed index also goes onto the release as
  # massimo-apt-index.tar.gz, with pool.tsv naming where each package
  # comes from, so that a site rebuilt from main serves the repository
  # without the key, which stays with the tags.
  # It starts beside sign, as homebrew does, and waits for it first
  # (packaging/wait-for-job.sh), so that one approval lets both run;
  # actions: the wait reads this run's jobs.
  apt-build:
    name: Build the apt repository
    if: inputs.kind == 'release'
    runs-on: ubuntu-latest
    environment: signing
    permissions:
      contents: write
      actions: read
    outputs:
      built: ${{ steps.site.outputs.built }}
    env:
      HAS_APT_KEY: ${{ secrets.MASSIMO_APT_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_APT_KEY == 'true'

      # The repository is built from the published releases, this one's
      # among them.
      - name: Wait for Sign and publish
        if: env.HAS_APT_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: packaging/wait-for-job.sh "Sign and publish"

      # nfpm, for the keyring package, through go run at the Makefile's
      # version; no cache in a job that holds the apt key.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: env.HAS_APT_KEY == 'true'
        with:
          go-version: '1.26'
          check-latest: true
          cache: false

      - name: Build the apt repository from the releases
        id: site
        if: env.HAS_APT_KEY == 'true'
        env:
          APT_KEY: ${{ secrets.MASSIMO_APT_KEY }}
          APT_KEY_PASSPHRASE: ${{ secrets.MASSIMO_APT_KEY_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          printf '%s\n' "$APT_KEY" | gpg --batch --quiet --import
          key="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          command -v apt-ftparchive >/dev/null || sudo apt-get -qq install -y apt-utils
          packaging/apt/publish.sh --out site --key "$key" --index-asset "$RUNNER_TEMP/massimo-apt-index.tar.gz"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Attach the signed index to the release
        if: env.HAS_APT_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" --clobber "$RUNNER_TEMP/massimo-apt-index.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.HAS_APT_KEY == 'true'
        with:
          name: apt
          path: site/apt
          if-no-files-found: error
          retention-days: 1

  # The site (site.yml): after the release and the rolling build, so
  # that the docs of release/devel and release/nightly are the ones just
  # published; the apt repository apt-build has just signed, or else the
  # newest release's signed index. For every run, so that a push to main
  # brings its docs onto the site (one of the site's documents alone has no
  # build and no release, and ci.yml's Deploy site calls site.yml for it
  # instead); not where apt-build or the rolling build failed, nor where
  # the caller says so: a nightly build at a release commit leaves the
  # deploy to the tag's run, since Pages keeps the first deploy of a commit.
  site:
    name: Site
    needs: [ sign, apt-build, rolling ]
    if: >-
      ${{ !cancelled() && inputs.site != 'false'
      && contains(fromJSON('["success","skipped"]'), needs.sign.result)
      && contains(fromJSON('["success","skipped"]'), needs.apt-build.result)
      && contains(fromJSON('["success","skipped"]'), needs.rolling.result) }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml
    with:
      apt-artifact: ${{ needs.apt-build.outputs.built == 'true' && 'apt' || '' }}
