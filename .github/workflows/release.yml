name: Release

# The release of a commit CI has tested and build.yml has built: called by
# ci.yml once every test job has passed and the build is done, and by
# nightly.yml after its build, with build.yml's answers as inputs and its
# files as the run's artifact `release`. Called, it runs with the
# caller's ref, which the environments' rules are matched against: a v*
# tag, which the signing environment admits alone, or main, which
# signing-rolling admits. A workflow started by workflow_run would carry
# the default branch whatever started it.
#
# The jobs, a key in one each: `sign` holds the release key through the
# `signing` environment, which only v* tags may use, runs nothing but
# openssl and gh on what build.yml handed over, checks the signature
# against the public key compiled into massimo and the flavour against
# the tag before publishing, and publishes exactly what it signed as a
# GitHub release, which `massimo update` installs (internal/update);
# `rolling` does the same for a rolling build, devel or nightly, with the
# rolling key, through the signing-rolling environment, which main may
# use, and whose key boxes accept for the rolling flavours alone, as the
# one release release/<flavour>, replaced in place. `homebrew` then pushes
# the formula to the tap (publish.yml) with the tap's key, and
# `apt-build` holds the apt repository's key, both through the signing
# environment too, and rebuilds the repository from the releases
# (packaging/apt/publish.sh). Both start beside `sign` and wait for it
# inside (packaging/wait-for-job.sh), so that one approval lets the
# three of them run (D57-A, 2026-11-11); `site`
# (site.yml) builds the site around it, with the docs of every channel,
# and puts it on GitHub Pages, also for a run that releases nothing, from
# the newest release's signed index. The tag's message is the release's
# CHANGELOG.md section, which is also the GitHub release's notes; the
# tag message's channel: line no longer counts.
on:
  workflow_call:
    inputs:
      kind:
        description: 'what build.yml decided: release, devel, nightly or skip'
        type: string
        required: true
      tag:
        description: 'the version tag of a release'
        type: string
        required: true
      sha:
        description: 'the commit built'
        type: string
        required: true
      version:
        description: 'the version built'
        type: string
        required: true
      flavour:
        description: 'the flavour built'
        type: string
        required: true
      release:
        description: 'the release of a rolling build (release/devel)'
        type: string
        required: true
      prerelease:
        description: 'whether a release is a pre-release (true or false)'
        type: string
        required: true
      site:
        description: 'false where the site is not to be deployed (a nightly build at a release commit)'
        type: string
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  sign:
    name: Sign and publish
    if: inputs.kind == 'release'
    runs-on: ubuntu-latest
    environment: signing
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      SHA: ${{ inputs.sha }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      # The public key, the tag's message and the history the release
      # branch is pushed from; nothing from here is run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      # The flavour comes from the tag here again, not from build.yml's
      # What to release, whose answer arrives as an input: a manifest of
      # another flavour is refused.
      - name: Check the manifest's tag and flavour
        run: |
          flavour="$(printf '%s\n' "$TAG" | sed -n 's/^v[0-9][0-9.]*-\([a-z][a-z0-9]*\)\.[0-9][0-9]*$/\1/p')"
          flavour="${flavour:-stable}"
          echo "FLAVOUR=${flavour}" >> "$GITHUB_ENV"
          grep -q "\"tag\": \"${TAG}\"" dist/massimo-release.json || { echo "::error::the manifest is not ${TAG}'s"; exit 1; }
          grep -q "\"channel\": \"${flavour}\"" dist/massimo-release.json || { echo "::error::the manifest's flavour is not ${flavour}"; exit 1; }
          if grep -q '"release":' dist/massimo-release.json; then
            echo "::error::a numbered release's manifest names another release"
            exit 1
          fi

      - name: Sign the manifest
        env:
          MASSIMO_RELEASE_KEY: ${{ secrets.MASSIMO_RELEASE_KEY }}
        run: |
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MASSIMO_RELEASE_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/massimo-release.json | base64 -w0 > dist/massimo-release.json.sig
          echo >> dist/massimo-release.json.sig

      # The signature must verify against the key massimo has compiled in,
      # or no installed binary would accept the release.
      - name: Verify against the compiled-in key
        run: |
          base64 -d dist/massimo-release.json.sig > "$RUNNER_TEMP/sig.bin"
          openssl pkeyutl -verify -pubin -inkey internal/update/release-key.pem -rawin \
            -in dist/massimo-release.json -sigfile "$RUNNER_TEMP/sig.bin"
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          sentence="Flavour: \`${FLAVOUR}\`, which boxes on the channel \`${FLAVOUR}\` and on every less stable one take. Install or update with \`massimo update\`, or install the Debian package with \`apt install ./massimo_<version>_<arch>.deb\` (see packaging/README.md); verify a download by hand with \`sha256sum -c SHA256SUMS\`."
          # The notes are the tag message's body, the release's CHANGELOG.md
          # section as changelog.sh wrote it, then the sentence; an old tag's
          # channel: line is not part of them, and a tag with no body gets
          # the sentence alone.
          git fetch --quiet --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          body="$(git for-each-ref --format='%(contents:body)' "refs/tags/${TAG}" | sed -e '/^channel:/d' -e '/./,$!d')"
          if [ -n "$body" ]; then
            printf '%s\n\n%s\n' "$body" "$sentence" > "$RUNNER_TEMP/notes.md"
          else
            printf '%s\n' "$sentence" > "$RUNNER_TEMP/notes.md"
          fi
          # The target is the tag's commit; a box reads the flavour from
          # the tag's label (internal/update, hintedFlavour).
          gh release create "$TAG" --verify-tag --target "$SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}" dist/massimo-* dist/*.deb dist/SHA256SUMS
          # Every file under its own name, or SHA256SUMS and the manifest
          # name files the release lacks (packaging/release-assets.sh).
          packaging/release-assets.sh "$TAG" dist/massimo-* dist/*.deb dist/SHA256SUMS

      # The release branch follows the published release: release/<flavour>
      # names what the flavour's boxes are offered. It is pushed with a
      # deploy key, since GitHub refuses GITHUB_TOKEN a branch update that
      # changes .github/workflows/, which a release's commits often do; the
      # ruleset on release/* lets only a fast-forward through, and the first
      # push makes the branch. GitHub's host keys come from its API, over
      # HTTPS. Without the key the branch stays and the release stands.
      - name: Move the release branch
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_BRANCH_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="release/${FLAVOUR}"
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::warning::RELEASE_BRANCH_DEPLOY_KEY is not set; ${branch} stays where it is."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${branch}" >/dev/null; then
            echo "::error::a tag ${branch} exists; a name is never both a branch and a tag."
            exit 1
          fi
          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "${ssh_dir:?}"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts"
          git push "git@github.com:${GITHUB_REPOSITORY}.git" "${SHA}:refs/heads/${branch}"
          echo "${branch} is ${SHA} (${TAG})"

  # A rolling build: signed with the rolling key and published as the one
  # release release/<flavour>, which is replaced in place. Editing a
  # release notifies no watcher, as creating one at every merge would.
  # One run at a time per flavour; a run that finds a newer build
  # published leaves it. A box downloading while the files are swapped
  # fails the signature check and tries again at its next check.
  rolling:
    name: Sign and publish the ${{ inputs.flavour }} build
    if: inputs.kind == 'devel' || inputs.kind == 'nightly'
    runs-on: ubuntu-latest
    environment: signing-rolling
    concurrency:
      group: rolling-${{ inputs.flavour }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      FLAVOUR: ${{ inputs.flavour }}
      RELEASE: ${{ inputs.release }}
      VERSION: ${{ inputs.version }}
      SHA: ${{ inputs.sha }}
    steps:
      # The public key, CHANGELOG.md and changelog.sh for the notes, and
      # the history for the ancestry; nothing from here is built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          submodules: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      # The flavour this run may publish comes from its event here, not
      # from build.yml's What to release: devel from a push to main,
      # nightly from the schedule or by hand on main (nightly.yml).
      - name: Check the manifest's version, flavour and release
        run: |
          case "${GITHUB_EVENT_NAME}:${GITHUB_REF}" in
          push:refs/heads/main) allowed=devel ;;
          schedule:refs/heads/main | workflow_dispatch:refs/heads/main) allowed=nightly ;;
          *) allowed="" ;;
          esac
          if [ "$FLAVOUR" != "$allowed" ]; then
            echo "::error::this run (${GITHUB_EVENT_NAME} of ${GITHUB_REF}) may not publish ${FLAVOUR}."
            exit 1
          fi
          for want in "\"tag\": \"${VERSION}\"" "\"release\": \"release/${FLAVOUR}\"" "\"channel\": \"${FLAVOUR}\"" "\"commit\": \"${SHA}\""; do
            grep -qF "$want" dist/massimo-release.json || { echo "::error::the manifest lacks ${want}"; exit 1; }
          done

      - name: Sign the manifest
        env:
          MASSIMO_ROLLING_KEY: ${{ secrets.MASSIMO_ROLLING_KEY }}
        run: |
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MASSIMO_ROLLING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/massimo-release.json | base64 -w0 > dist/massimo-release.json.sig
          echo >> dist/massimo-release.json.sig

      - name: Verify against the compiled-in rolling key
        run: |
          base64 -d dist/massimo-release.json.sig > "$RUNNER_TEMP/sig.bin"
          openssl pkeyutl -verify -pubin -inkey internal/update/rolling-key.pem -rawin \
            -in dist/massimo-release.json -sigfile "$RUNNER_TEMP/sig.bin"
          (cd dist && sha256sum -c SHA256SUMS)

      # The notes: what the build is, the commits since the build before
      # it, and CHANGELOG.md's [Unreleased] as the next release would
      # write it (changelog.sh preview, from guidelines v4.54.0).
      - name: Write the notes
        run: |
          git fetch --quiet --force origin "+refs/tags/${RELEASE}:refs/tags/${RELEASE}" 2>/dev/null || true
          prev="$(git rev-parse --verify --quiet "refs/tags/${RELEASE}^{commit}" || true)"
          {
            printf 'The %s build of `%s` (%s), replaced in place by the next one. Boxes on the channel `%s` take it with `massimo update` or the web UI; it is signed with the rolling key, which boxes accept for the rolling flavours alone.\n\n' "$FLAVOUR" "$VERSION" "$SHA" "$FLAVOUR"
            if [ -n "$prev" ] && git merge-base --is-ancestor "$prev" "$SHA"; then
              printf '## Commits since the previous %s build\n\n' "$FLAVOUR"
              git log --first-parent --format='- %s (%h)' "${prev}..${SHA}"
              echo
            fi
            printf '## Unreleased\n\n'
            if preview="$(GUIDELINES/shared/tools/changelog.sh preview 2>/dev/null)"; then
              printf '%s\n' "$preview"
            else
              echo "CHANGELOG.md's [Unreleased] is shown here once the guidelines carry changelog.sh preview (v4.54.0)."
            fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # Published only where the release still names a commit before this
      # one; then the binaries, packages and sums first, the manifest and
      # its signature after them, so that a box which reads the new
      # manifest finds its files already there; then the tag, and the notes
      # and the files the new build lacks (the debs carry the version in
      # their name) last. Before the tag moves, every file must be an asset
      # under its own name (packaging/release-assets.sh): a file GitHub
      # renamed would otherwise be deleted below as not the build's; the
      # step fails and the release keeps its old tag. The tag is pushed
      # with the deploy key
      # ROLLING_TAG_DEPLOY_KEY: GitHub refused GITHUB_TOKEN the move once
      # main's workflow files had changed since the commit (2026-11-10);
      # without the key the token tries.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_KEY: ${{ secrets.ROLLING_TAG_DEPLOY_KEY }}
        run: |
          git fetch --quiet --force origin "+refs/tags/${RELEASE}:refs/tags/${RELEASE}" 2>/dev/null || true
          files=(dist/massimo-* dist/*.deb dist/SHA256SUMS)
          title="${FLAVOUR} ${VERSION}"
          if ! cur="$(git rev-parse --verify --quiet "refs/tags/${RELEASE}^{commit}")"; then
            gh release create "$RELEASE" --target "$SHA" --prerelease --latest=false --title "$title" --notes-file "$RUNNER_TEMP/notes.md" "${files[@]}"
            packaging/release-assets.sh "$RELEASE" "${files[@]}"
            echo "${RELEASE} made at ${SHA}"
            exit 0
          fi
          if git merge-base --is-ancestor "$SHA" "$cur"; then
            echo "${RELEASE} is ${cur}, at or after ${SHA}: left as it is."
            exit 0
          fi
          manifest=(dist/massimo-release.json dist/massimo-release.json.sig)
          payload=()
          for f in "${files[@]}"; do
            case "$f" in dist/massimo-release.json | dist/massimo-release.json.sig) ;; *) payload+=("$f") ;; esac
          done
          gh release upload "$RELEASE" --clobber "${payload[@]}"
          gh release upload "$RELEASE" --clobber "${manifest[@]}"
          packaging/release-assets.sh "$RELEASE" "${files[@]}"
          if [ -n "$TAG_KEY" ]; then
            ssh_dir="$(mktemp -d)"
            trap 'rm -rf "${ssh_dir:?}"' EXIT
            (umask 077 && printf '%s\n' "$TAG_KEY" > "$ssh_dir/key")
            gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$ssh_dir/known_hosts"
            GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts" \
              git push --force "git@github.com:${GITHUB_REPOSITORY}.git" "${SHA}:refs/tags/${RELEASE}"
          else
            echo "::warning::ROLLING_TAG_DEPLOY_KEY is not set; the token moves ${RELEASE}, which GitHub may refuse."
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE}" -f sha="$SHA" -F force=true >/dev/null
          fi
          gh release edit "$RELEASE" --target "$SHA" --title "$title" --notes-file "$RUNNER_TEMP/notes.md" --prerelease --latest=false
          keep="$(for f in "${files[@]}"; do basename "$f"; done)"
          gh release view "$RELEASE" --json assets --jq '.assets[].name' | while read -r name; do
            if ! printf '%s\n' "$keep" | grep -qxF "$name"; then
              gh release delete-asset "$RELEASE" "$name" --yes
            fi
          done
          echo "${RELEASE} moved from ${cur} to ${SHA}"

  # The Homebrew formula of the release's channel, pushed to the tap
  # (publish.yml), once the release is published; skipped without the
  # tap's deploy key. It runs from here because the release this run
  # creates with its own token starts no workflow of its own. It starts
  # beside sign and waits for it inside (wait), in the signing
  # environment, so that one approval lets sign, apt-build and it run:
  # GitHub asks again for a job that reaches the environment later.
  # actions: the wait reads this run's jobs.
  homebrew:
    name: Homebrew
    if: inputs.kind == 'release'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ inputs.tag }}
      wait: true
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

  # The apt repository: the packages of the newest releases of every
  # flavour, one suite per flavour, signed with the repository key
  # (MASSIMO_APT_KEY, with its passphrase, in the signing environment)
  # and handed to the site as the artifact apt; nothing of it runs
  # without the key. It has no state: every release rebuilds it from
  # GitHub.
  # The signed index also goes onto the release as
  # massimo-apt-index.tar.gz, with pool.tsv naming where each package
  # comes from, so that a site rebuilt from main serves the repository
  # without the key, which stays with the tags.
  # It starts beside sign, as homebrew does, and waits for it first
  # (packaging/wait-for-job.sh), so that one approval lets both run;
  # actions: the wait reads this run's jobs.
  apt-build:
    name: Build the apt repository
    if: inputs.kind == 'release'
    runs-on: ubuntu-latest
    environment: signing
    permissions:
      contents: write
      actions: read
    outputs:
      built: ${{ steps.site.outputs.built }}
    env:
      HAS_APT_KEY: ${{ secrets.MASSIMO_APT_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_APT_KEY == 'true'

      # The repository is built from the published releases, this one's
      # among them.
      - name: Wait for Sign and publish
        if: env.HAS_APT_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: packaging/wait-for-job.sh "Sign and publish"

      # nfpm, for the keyring package, through go run at the Makefile's
      # version; no cache in a job that holds the apt key.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.HAS_APT_KEY == 'true'
        with:
          go-version: '1.26'
          check-latest: true
          cache: false

      - name: Build the apt repository from the releases
        id: site
        if: env.HAS_APT_KEY == 'true'
        env:
          APT_KEY: ${{ secrets.MASSIMO_APT_KEY }}
          APT_KEY_PASSPHRASE: ${{ secrets.MASSIMO_APT_KEY_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          printf '%s\n' "$APT_KEY" | gpg --batch --quiet --import
          key="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          command -v apt-ftparchive >/dev/null || sudo apt-get -qq install -y apt-utils
          packaging/apt/publish.sh --out site --key "$key" --index-asset "$RUNNER_TEMP/massimo-apt-index.tar.gz"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Attach the signed index to the release
        if: env.HAS_APT_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" --clobber "$RUNNER_TEMP/massimo-apt-index.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.HAS_APT_KEY == 'true'
        with:
          name: apt
          path: site/apt
          if-no-files-found: error
          retention-days: 1

  # The site (site.yml): after the release and the rolling build, so
  # that the docs of release/devel and release/nightly are the ones just
  # published; the apt repository apt-build has just signed, or else the
  # newest release's signed index. For every run, so that a push to main
  # brings its docs onto the site; not where apt-build or the rolling
  # build failed, nor where the caller says so: a nightly build at a
  # release commit leaves the deploy to the tag's run, since Pages keeps
  # the first deploy of a commit.
  site:
    name: Site
    needs: [ sign, apt-build, rolling ]
    if: >-
      ${{ !cancelled() && inputs.site != 'false'
      && contains(fromJSON('["success","skipped"]'), needs.sign.result)
      && contains(fromJSON('["success","skipped"]'), needs.apt-build.result)
      && contains(fromJSON('["success","skipped"]'), needs.rolling.result) }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml
    with:
      apt-artifact: ${{ needs.apt-build.outputs.built == 'true' && 'apt' || '' }}
