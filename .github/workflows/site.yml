name: Site

# The project's site, https://massimo.metaworx.ch (packaging/README.md,
# "The site"): the apt repository, the pages of packaging/site and the
# documentation of every channel, built by packaging/site/build.sh without
# a key, and deployed to GitHub Pages.
#
# release.yml calls it once per run, after the release or the rolling
# build. A release hands over the apt repository it has just signed, as
# the artifact named by apt-artifact; every other run (a push to main, the
# nightly build) takes the signed index of the newest release that carries
# one (massimo-apt-index.tar.gz), so that the docs follow main without a
# release and the apt key stays with the tags. Where no release carries
# one yet, the build ends without a site and nothing is deployed: a deploy
# replaces the whole site, and one without the repository would take the
# repository offline.
on:
  workflow_call:
    inputs:
      apt-artifact:
        description: The artifact holding the apt repository a release has just built, or empty.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.site.outputs.built }}
    steps:
      # Every branch and tag: the channels' docs are built from
      # release/<channel> (a branch, or a tag for the rolling ones) and
      # main, each version named by git describe.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.apt-artifact != ''
        with:
          name: ${{ inputs.apt-artifact }}
          path: apt-built

      # build.sh's exit 3: no release carries the apt index yet.
      - name: Build the site
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
          APT_ARTIFACT: ${{ inputs.apt-artifact }}
        run: |
          if [ -n "$APT_ARTIFACT" ]; then
            apt=(--apt apt-built)
          else
            apt=(--apt-index newest)
          fi
          rc=0
          packaging/site/build.sh --out site "${apt[@]}" || rc=$?
          case "$rc" in
          0) echo "built=true" >> "$GITHUB_OUTPUT" ;;
          3) echo "::notice::No release carries the apt index yet: the site stays as it is." ;;
          *) exit "$rc" ;;
          esac

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.site.outputs.built == 'true'
        with:
          path: site

  # Pages deploys from the artifact, one deploy at a time and none
  # cancelled. Two settings of the owner's (packaging/README.md, "The
  # site"): the repository's Pages source is "GitHub Actions", and the
  # github-pages environment, which deploys from the default branch only,
  # also allows the tags v*, since a release's run deploys for its tag.
  deploy:
    name: Deploy the site
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
