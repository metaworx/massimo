openapi: 3.0.3
info:
  title: Massimo API
  version: "1"
  description: |
    HTTP API of `massimo serve` over one or more eQ-3 MAX! Cubes.
    Reads come from the server's copy of each Cube's state; writes go
    through a per-Cube command queue that respects the radio budget.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: http://127.0.0.1:8099
security:
  - bearer: []
  - {}
paths:
  /healthz:
    get:
      summary: Liveness and version
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  version: {type: string}
                  started_at: {type: string, format: date-time, description: When the server process started.}
                  node_id: {type: string, format: uuid, description: The box's node.id from its store, the same across restarts}
                  tls:
                    type: object
                    description: With TLS, the certificate served; absent without.
                    properties:
                      source: {type: string, description: "Where the certificate comes from: files, self-signed, or acme."}
                      names: {type: array, items: {type: string}, description: The certificate's names and addresses.}
                      not_after: {type: string, format: date-time}
                      fingerprint: {type: string, description: The SHA-256 of the certificate, as browsers show it.}
                      self_signed: {type: boolean}
                      warning: {type: string, description: Set while something needs the owner.}
  /api/v1/login:
    post:
      summary: Log in with a name and a password
      x-capability: none
      description: |
        Answers a session token, good for 30 days from its last use,
        which the client sends as the bearer header. A wrong pair counts
        against the address and the user name (429 after ten in a
        minute). An address signs in once at a time: a login while
        another from the same address is checked is 429 with
        Retry-After 1, not counted as a failure. 409 on a server without
        users (create the first owner with POST /api/v1/users) or
        without a store (the API token). 403 while auth.password_login
        is off in /api/v1/settings: the users sign in by OPAQUE alone.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Login"}
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401":
          description: Wrong user or password
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: No users yet, or no store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          description: >-
            The address or the user name is locked out (ten failed logins
            within a minute), or a sign-in from this address is running
          headers:
            Retry-After:
              description: Seconds until the lockout ends, or 1
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503": {$ref: "#/components/responses/Busy"}
  /api/v1/login/start:
    post:
      summary: Start a sign-in by OPAQUE
      x-capability: none
      description: |
        The first half of a sign-in of auth_version 2 (RFC 9807,
        ristretto255-SHA512, the messages base64url without padding):
        the client's KE1 for a name is answered with KE2, the key
        stretching the client is to run for the record, and a login to
        finish under within a minute. No password crosses. A name
        without a record of version 2 is answered from a fake record of
        the same shape, and its finish fails. A start is a guess, since
        the client can tell from KE2 whether its password was right: it
        counts as a failed login against the address and the name at
        once, which a finished sign-in clears. The address is held until
        the finish or the minute's end; a start or a login from it
        meanwhile is 429 with Retry-After 1. v1 says whether the box
        still takes POST /api/v1/login, for a client whose finish fails.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginStart"}
      responses:
        "200":
          description: KE2 and the login to finish under
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoginStarted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409":
          description: No users yet, or no store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          description: >-
            The address or the user name is locked out (ten failed logins
            within a minute), or a sign-in from this address is running
          headers:
            Retry-After:
              description: Seconds until the lockout ends, or 1
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503": {$ref: "#/components/responses/Busy"}
  /api/v1/login/finish:
    post:
      summary: Finish a sign-in by OPAQUE
      x-capability: none
      description: |
        The client's KE3 for a login started. A match answers the session
        of POST /api/v1/login, or with the purpose proof a proof of the
        password, good once for five minutes, for one's own password
        change. Anything else is 401 and counts no more failures than the
        start did. A login is finished once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginFinish"}
      responses:
        "200":
          description: The session, or the proof
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/Session"}
                  - {$ref: "#/components/schemas/Proof"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401":
          description: Wrong user or password, or no login started under the identifier, or it took too long
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: No users yet, or no store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503": {$ref: "#/components/responses/Busy"}
  /api/v1/login/providers:
    get:
      summary: The providers a user may sign in through
      x-capability: none
      description: |
        The enabled OpenID Connect providers, by key, each with the name
        its sign-in button shows; an empty list on a server without users.
      security: []
      responses:
        "200":
          description: The providers
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/LoginProvider"}
  /api/v1/login/oidc/{key}:
    post:
      summary: Start a sign-in through an OpenID Connect provider
      x-capability: none
      description: |
        The provider's authorization URL for a new sign-in (the
        authorization code flow with PKCE S256, a state and a nonce),
        which the page opens. redirect is the page's own address: the
        redirect URI is it plus api/v1/login/oidc/callback, which must be
        registered at the provider, and the callback sends the browser
        back to it. The sign-in waits ten minutes. An address locked out
        is refused as for a password.
      security: []
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}, description: The provider's key}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OIDCStart"}
      responses:
        "200":
          description: The provider's page to open
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OIDCStarted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: No users yet, or no store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "502":
          description: The provider's discovery document could not be read, or does not do
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503": {$ref: "#/components/responses/Busy"}
  /api/v1/login/oidc/callback:
    get:
      summary: The provider sends the browser back
      x-capability: none
      description: |
        The redirect URI. The code is traded at the provider's token
        endpoint, the id_token's iss, aud, exp and nonce are checked, and
        the user is found: by the provider's subject; else by an e-mail
        assigned to a user, verified by the provider, which binds the
        subject; else, where the provider creates users, a new one. The
        browser goes back to the page with #oidc=<code>, a one-time code
        good for a minute from the same address, or with
        #oidc-error=<reason>: denied (at the provider), failed (its answer
        did not do), refused (no user here for the account) or disabled.
        A refusal counts as a failed sign-in of the address.
      security: []
      parameters:
        - {name: code, in: query, schema: {type: string}}
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}, description: The provider's refusal}
      responses:
        "303":
          description: Back to the page, the code or the reason in the fragment
          headers:
            Location: {schema: {type: string}}
        "400":
          description: No sign-in started under the state, or it took too long
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/login/oidc/finish:
    post:
      summary: Finish a sign-in through an OpenID Connect provider
      x-capability: none
      description: |
        The callback's one-time code traded for the session of POST
        /api/v1/login, with the provider's key; from the address the
        callback came from, once, within a minute.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OIDCFinish"}
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401":
          description: No sign-in under the code, or it took too long, or the user is gone
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: No users yet, or no store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/logout:
    post:
      summary: End the session that makes the call
      x-capability: any
      description: An API key is not a session and answers 400; it is revoked under the user's tokens.
      responses:
        "200":
          description: Ended
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
        "400":
          description: The token is an API key, or the server has no users
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
  /api/v1/me:
    get:
      summary: Who the caller is and what the caller may do
      x-capability: any
      description: |
        The mode (users, open, token, none), the caller's user, role and
        effective capabilities, and the token presented; outside users
        mode user and role are null and the capabilities are all of
        them. setup is true on an open server for a caller on the local
        network, which may create the first owner.
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
  /api/v1/commands/{id}:
    get:
      summary: A command by its id, with its steps
      x-capability: read
      description: |
        Every request that changes something is a command (its id is in
        the audit's command_id), and every engine command it put on a
        Cube's queue is a step beneath it. A user without audit sees its
        own commands only; others are 404. A caller with audit gets the
        request's audit row with it.
      parameters:
        - {name: id, in: path, required: true, description: "The command's id, a UUID, or its number, as the log's command and the audit's command_id name it", schema: {type: string, example: "42"}}
      responses:
        "200":
          description: The command
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Command"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: No such command, or not the caller's
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/me/preferences:
    get:
      summary: The signed-in user's preferences, by key
      x-capability: any
      description: |
        The web UI's settings (ui) and colour schemes (schemes), each a
        JSON document; {} when none is kept. 409 without a signed-in user
        (an open server, or the API token): the
        page then keeps its settings in the browser.
      responses:
        "200":
          description: The preferences by key
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {description: The JSON document of the key}
              example:
                ui: {poll: 10, expert: false, clock: browser, lang: auto, theme: system, scheme: massimo}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/NoSignedInUser"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/me/preferences/{key}:
    get:
      summary: One of the signed-in user's preferences
      x-capability: any
      parameters: [{$ref: "#/components/parameters/prefKey"}]
      responses:
        "200":
          description: The JSON document of the key
          content:
            application/json:
              schema: {description: The document as it was put}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: The key is not set
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409": {$ref: "#/components/responses/NoSignedInUser"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
    put:
      summary: Keep one of the signed-in user's preferences on the server
      x-capability: preferences
      description: |
        The body is the value, any JSON document of at most 64 KiB; it
        replaces the key's. Needs preferences, which a guest has not: a
        guest's settings stay in the browser. An audit row, no command.
      parameters: [{$ref: "#/components/parameters/prefKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {description: Any JSON document}
      responses:
        "200":
          description: How it was stored
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Preference"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/NoSignedInUser"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
    delete:
      summary: Remove one of the signed-in user's preferences
      x-capability: preferences
      description: Answers ok also when the key was not set.
      parameters: [{$ref: "#/components/parameters/prefKey"}]
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  key: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/NoSignedInUser"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/push/vapid:
    get:
      summary: The server's VAPID public key, which a browser subscribes with
      x-capability: read
      description: |
        The P-256 public key of the server's VAPID key pair (RFC 8292), as
        pushManager.subscribe takes it for applicationServerKey; made at
        the first request and kept in the store, whose settings do not
        show it.
      responses:
        "200":
          description: The key
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: {type: string, description: "The uncompressed point, base64url without padding"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/me/push:
    get:
      summary: The signed-in user's push subscriptions
      x-capability: preferences
      description: Oldest first, without their keys; current marks the one made with the caller's session or key.
      responses:
        "200":
          description: The subscriptions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/PushSubscription"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/NoSignedInUser"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
    post:
      summary: Subscribe a browser or an app to the signed-in user's notifications
      x-capability: preferences
      description: |
        The body is the browser's PushSubscription.toJSON() and a label;
        the subscription belongs to the user and to the caller's session
        or key, and goes with them. The same endpoint again updates its
        row (200), which then belongs to the caller. A label left out is
        the request's User-Agent. An audit row (push.subscribe), no
        command.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: {type: string, description: "The push service's http or https URL, at most 2048 characters"}
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh: {type: string, description: "The subscriber's P-256 public key, uncompressed, base64url"}
                    auth: {type: string, description: "The subscriber's 16-byte auth secret, base64url"}
                label: {type: string, description: "At most 100 characters, such as Firefox on the phone"}
      responses:
        "200":
          description: The endpoint's subscription, updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PushSubscription"}
        "201":
          description: A new subscription
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PushSubscription"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/NoSignedInUser"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/me/push/{id}:
    delete:
      summary: Remove one of the signed-in user's push subscriptions
      x-capability: preferences
      description: An audit row (push.unsubscribe), no command.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: The user has no subscription of that id
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409": {$ref: "#/components/responses/NoSignedInUser"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/audit:
    get:
      summary: The audit, newest first
      x-capability: audit
      description: |
        Every request that changed something, or tried to: who, from
        where, what, the request with its secrets removed, and how it
        went. Paged by time with before, filtered by user.
      parameters:
        - {name: before, in: query, description: Rows before this time, RFC 3339, schema: {type: string, format: date-time}}
        - {name: limit, in: query, description: At most this many rows (100), schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
        - {name: user, in: query, description: Rows of this user's login name, schema: {type: string}}
      responses:
        "200":
          description: The rows
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AuditEntry"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/users:
    get:
      summary: List the users
      x-capability: users
      description: Every user with users; the guests with guests alone; the own user otherwise.
      responses:
        "200":
          description: The users by name
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/User"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
    post:
      summary: Create a user
      x-capability: users
      description: |
        With users, any role; with guests alone, the role guest. On a
        server without users, the first owner: open to a caller on the
        local network (loopback, a private range, link-local), the role
        owner and a password required, refused from anywhere else.
      parameters: [{$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserCreate"}
      responses:
        "201":
          description: The user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: The name exists
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStoreOrBusy"}
  /api/v1/users/{name}:
    get:
      summary: One user
      x-capability: users
      parameters: [{$ref: "#/components/parameters/name"}]
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NoUser"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
    put:
      summary: Change a user
      x-capability: users
      description: |
        Any of the fields; absent ones stay. A user changes its own
        display_name and, with current_password, its password; the
        role, disabled and expires_at need users (guests for a guest). A
        password set by someone else ends the user's sessions. The last
        enabled owner cannot be disabled or demoted (409).
      parameters: [{$ref: "#/components/parameters/name"}, {$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserChange"}
      responses:
        "200":
          description: The user as changed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NoUser"}
        "409":
          description: The last enabled owner without an end date
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStoreOrBusy"}
    delete:
      summary: Remove a user
      x-capability: users
      description: The user's tokens are revoked; its row stays for the audit. The last enabled owner without an end date stays (409).
      parameters: [{$ref: "#/components/parameters/name"}, {$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  name: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NoUser"}
        "409":
          description: The last enabled owner without an end date
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/users/{name}/register:
    post:
      summary: Start a registration by OPAQUE
      x-capability: users
      description: |
        The first step of a password of auth_version 2: the client's
        registration request for the name is answered with the server's
        response and the key stretching to run. Nothing is kept; the
        client finishes with the password and sends the record to POST
        /api/v1/users or PUT /api/v1/users/{name} as record and ksf.
        Allowed to whoever may set the user's password, or, for a name
        that has no user, add one: the first owner from the local network
        on a server without users.
      parameters: [{$ref: "#/components/parameters/name"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Register"}
      responses:
        "200":
          description: The server's response
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Registered"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NoUser"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/users/{name}/tokens:
    get:
      summary: The user's sessions and API keys
      x-capability: users
      parameters: [{$ref: "#/components/parameters/name"}]
      responses:
        "200":
          description: The live tokens, oldest first, without their secrets
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Token"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NoUser"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
    post:
      summary: Create an API key for the user
      x-capability: users
      description: >-
        The key is shown once, in token; the store keeps its hash. It never expires. A retry with the same
        Idempotency-Key answers 201 without token.
      parameters: [{$ref: "#/components/parameters/name"}, {$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: {type: string, maxLength: 64, example: Loxone}
      responses:
        "201":
          description: The key
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string, description: The secret, shown once}
                  id: {type: integer}
                  kind: {type: string, enum: [api]}
                  label: {type: string}
                  created_at: {type: string, format: date-time}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NoUser"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/users/{name}/tokens/{id}:
    delete:
      summary: Revoke a session or an API key
      x-capability: users
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {$ref: "#/components/parameters/name"}
        - {name: id, in: path, required: true, description: The token's id from the list, schema: {type: integer}}
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  id: {type: integer}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: No such user, or no such live token of the user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/roles:
    get:
      summary: The roles with their sets, and every capability
      x-capability: roles
      responses:
        "200":
          description: The default roles first, then the created ones by key; and the capabilities with whether each is disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items: {$ref: "#/components/schemas/Role"}
                  capabilities:
                    type: array
                    items: {$ref: "#/components/schemas/Capability"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
    post:
      summary: Create a role
      x-capability: roles
      parameters: [{$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RoleCreate"}
      responses:
        "201":
          description: The role
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Role"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: The key exists
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/roles/{key}:
    put:
      summary: Rename a role or change its set
      x-capability: roles
      description: Absent fields stay. owner cannot be changed (403).
      parameters: [{$ref: "#/components/parameters/roleKey"}, {$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RoleChange"}
      responses:
        "200":
          description: The role as changed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Role"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NoRole"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
    delete:
      summary: Remove a created role no user has
      x-capability: roles
      description: A default role cannot be removed (403); one with users is 409.
      parameters: [{$ref: "#/components/parameters/roleKey"}, {$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  key: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NoRole"}
        "409":
          description: The role still has users
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/roles/{key}/disabled:
    put:
      summary: Disable or enable a role
      x-capability: roles.disable
      description: A disabled role's users keep their login and are refused every route. owner cannot be disabled (403).
      parameters: [{$ref: "#/components/parameters/roleKey"}, {$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Disabled"}
      responses:
        "200":
          description: The role
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Role"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NoRole"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/capabilities:
    get:
      summary: Every capability, and whether it is disabled
      x-capability: capabilities
      responses:
        "200":
          description: The capabilities in the order of the table
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Capability"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/capabilities/{key}:
    put:
      summary: Disable or enable a capability
      x-capability: capabilities
      description: A disabled capability is denied to every role but owner, whatever the role's set says.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {name: key, in: path, required: true, description: The capability, schema: {type: string, example: pair}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Disabled"}
      responses:
        "200":
          description: The capability
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Capability"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: No such capability
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/cubes:
    get:
      summary: List the Cubes
      x-capability: read
      description: The configured Cubes (configured true), then the Cubes discovery found that are not configured (configured false), while they answer - from the first answer to the end of the first complete run without one; after a restart, once a run has heard them.
      responses:
        "200":
          description: The Cubes
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - {$ref: "#/components/schemas/Cube"}
                    - {$ref: "#/components/schemas/FoundCube"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
    post:
      summary: Serve a Cube from now on
      x-capability: cubes
      description: |
        Adds a Cube to the store and starts serving it at once: one
        discovery found (its row becomes configured), or one given by
        serial. Without an address it follows discovery, starting at the
        address discovery saw last. Its proxy listens on proxy_address,
        or on :62910 when it is the only Cube and nothing else listens;
        with -proxy on serve's command line the listeners stay as they
        are. Needs the store.
      parameters: [{$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/CubeChange"}
                - type: object
                  required: [serial]
                  properties:
                    serial: {type: string, example: KEQ0000000}
      responses:
        "201":
          description: The Cube, now served
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cube"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: The Cube is served already
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503":
          description: The server has no store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/cubes/discover:
    post:
      summary: Look for Cubes on the LAN now
      x-capability: discover
      description: |
        UDP discovery, about three seconds. A call while a run is going
        waits for it and gets its result. serve also runs it at the start
        and every -discover-interval (30 minutes). A Cube that is not
        configured is announced as a cube_found event on every Cube's
        stream when it first answers, and again when it answers after a
        complete run without it; not after a restart. A found Cube that
        does not answer a complete run leaves GET /api/v1/cubes. Each
        Cube is listed once, at its own address where a massimo proxy
        answers for it too; one configured by serial only keeps its
        address while that answers, else takes the proxy's, else its
        own, at most one move a run.
      parameters: [{$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "200":
          description: Every Cube that answered, configured or not
          content:
            application/json:
              schema:
                type: object
                properties:
                  ran_at: {type: string, format: date-time}
                  found:
                    type: array
                    items: {$ref: "#/components/schemas/FoundCube"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503":
          description: The discovery port (UDP 23272, or the address of serve -discover-listen) is not available
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/cubes/{sn}:
    get:
      summary: One Cube with its configuration and rooms
      x-capability: read
      parameters: [{$ref: "#/components/parameters/sn"}]
      responses:
        "200":
          description: The Cube
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CubeDetail"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      summary: Change a Cube's configuration
      x-capability: cubes
      description: |
        Any of the fields; absent ones stay, unknown ones are refused.
        Written to the store (source becomes ui) and applied at once: a
        new address reconnects, a new proxy address or serial restarts
        that Cube's listener (not with -proxy on serve's command line),
        a new hidden list hides at once. An empty address makes the Cube
        follow discovery.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CubeChange"}
      responses:
        "200":
          description: The Cube as changed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cube"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The Cube is served for this run only (-addr or -sn) or has not reported its serial yet
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503":
          description: The server has no store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    delete:
      summary: Stop serving a Cube
      x-capability: cubes
      description: |
        The server stops the Cube's connection and proxy. Its row stays
        in the store with configured = 0, with its history; discovery
        lists it as found while it answers, and POST /api/v1/cubes adds
        it back. A line for it in the settings file does not bring it
        back.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  serial: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The Cube is served for this run only (-addr or -sn)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503":
          description: The server has no store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/cubes/{sn}/rooms:
    get:
      summary: Rooms with their devices and states
      x-capability: read
      parameters: [{$ref: "#/components/parameters/sn"}]
      responses:
        "200":
          description: Rooms
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Room"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/cubes/{sn}/devices:
    get:
      summary: Every device the Cube knows
      x-capability: read
      parameters: [{$ref: "#/components/parameters/sn"}]
      responses:
        "200":
          description: Devices in the Cube's order; unlisted ones are paired but not in a room
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Device"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/cubes/{sn}/devices/{rf}:
    get:
      summary: One device with its configuration
      x-capability: read
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/rf"}]
      responses:
        "200":
          description: The device
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeviceDetail"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      summary: Rename a device and/or move it to another room, or add a paired device to one
      x-capability: rename
      description: >-
        A move unlinks the device from its old room's partners and relinks
        it with the new room's, as the original software does, then writes
        the metadata. room_id 0 is refused. A device in no room yet
        (unlisted, for example just paired) needs room_id and is linked
        with the room's members (0x20 both ways, after a wakeup), given
        the room's group (0x22) and listed under name; without room_id it
        answers 409. A thermostat put into a room, by an add or a move,
        then gets the room's settings from its first other thermostat:
        0x40 auto, 0x11 to every thermostat of the room, 0x12, and 0x10
        for each day of the programme that differs, then 0x11 again;
        hidden devices are left out. The copy needs the capability
        configure as well (403 without it); copy false skips it. A
        discarded 0x40 sets mode_not_set and ends nothing; any other
        command that fails ends the copy with its error, the device in
        the room.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/rf"}, {$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 32}
                room_id: {type: integer, minimum: 1, maximum: 255}
                copy:
                  type: boolean
                  default: true
                  description: With room_id, give the device the room's settings.
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  copied:
                    type: object
                    description: What of the room's settings was sent; absent when nothing was.
                    properties:
                      temperatures:
                        type: array
                        description: The thermostats that got the room's temperatures (0x11).
                        items: {type: string, pattern: "^[0-9a-f]{6}$"}
                      valve: {type: boolean, description: The device got the room's valve settings (0x12).}
                      days: {type: integer, minimum: 0, maximum: 7, description: The days of the week programme sent (0x10).}
                      mode_not_set: {type: boolean, description: The Cube discarded the 0x40 that sets auto; the device keeps its mode.}
                  budget: {$ref: "#/components/schemas/Budget"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The device is paired but not assigned to a room
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "502": {$ref: "#/components/responses/CubeError"}
    delete:
      summary: Remove a device from the Cube
      x-capability: structure
      description: >-
        As the original software deletes a device: a device in a room (the
        metadata's, else its C line's) is unlinked from the room's members
        in both directions after a wakeup (0x21), hidden devices left out,
        and its group removed (0x23), which the original software leaves;
        a device in room 255 by its C line is not unlinked. Then t: with
        the force flag, which makes the Cube send the device a factory
        reset; then the metadata without it, where it was listed. A device
        the metadata lists without a C line loses its entry alone. The
        server's copy forgets the device at once. A device that never
        answers stays in the Cube's memory and comes back, unlisted, with
        the next full read.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/rf"}, {$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  budget: {$ref: "#/components/schemas/Budget"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502": {$ref: "#/components/responses/CubeError"}
        "503": {$ref: "#/components/responses/NotConnected"}
  /api/v1/cubes/{sn}/devices/{rf}/setpoint:
    put:
      summary: Set mode and setpoint of one thermostat
      x-capability: setpoint
      description: |
        A device in a room is addressed as its room, since the Cube
        discards a direct command to a room member; every thermostat of
        that room takes the setpoint. A device outside any room is
        addressed directly. The request waits for the Cube's answer, up
        to two minutes when the radio budget is exhausted.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/rf"}, {$ref: "#/components/parameters/idempotencyKey"}]
      requestBody: {$ref: "#/components/requestBodies/Setpoint"}
      responses:
