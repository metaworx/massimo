          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/WeekProgram"}
                  - type: object
                    properties:
                      source: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      summary: Write the week programme of the whole room
      x-capability: configure
      description: Any subset of days; one group radiogram 0x10 per day, which every thermostat of the room takes.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/id"}, {$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WeekProgram"}
      responses:
        "200": {$ref: "#/components/responses/CommandResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Superseded"}
        "502": {$ref: "#/components/responses/CubeError"}
  /api/v1/cubes/{sn}/devices/{rf}/config:
    put:
      summary: Write a thermostat's settings
      x-capability: configure
      description: Every field optional, merged into the current configuration; 0x11 for temperatures, 0x12 for boost, descaling and valve limits, 0x82 for display_actual (wall thermostats), after a wakeup of the room.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/rf"}, {$ref: "#/components/parameters/idempotencyKey"}]
      requestBody: {$ref: "#/components/requestBodies/Config"}
      responses:
        "200": {$ref: "#/components/responses/CommandResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Superseded"}
        "502": {$ref: "#/components/responses/CubeError"}
  /api/v1/cubes/{sn}/devices/{rf}/program:
    put:
      summary: Write the week programme of one thermostat
      x-capability: configure
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/rf"}, {$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WeekProgram"}
      responses:
        "200": {$ref: "#/components/responses/CommandResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Superseded"}
        "502": {$ref: "#/components/responses/CubeError"}
  /api/v1/cubes/{sn}/backup:
    get:
      summary: A backup file of the Cube
      x-capability: backup
      parameters:
        - {$ref: "#/components/parameters/sn"}
        - name: format
          in: query
          schema: {type: string, enum: [json, yaml], default: json}
      responses:
        "200":
          description: The backup, as massimo backup writes it
          content:
            application/json:
              schema: {type: object, description: "See internal/backup for the structure"}
            application/yaml:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/NotReady"}
  /api/v1/cubes/{sn}/backups:
    get:
      summary: The Cube's stored backups
      x-capability: backup
      description: |
        The backups the server keeps for the Cube in its store, newest
        first: taken by the server after a change of the Cube's
        configuration (auto), by hand (manual), by a restore before its
        first step (before_restore), and the file a restore was sent
        (upload). While the configuration differs from the newest
        backup's, changed says when it last changed and due when the
        automatic backup follows (backups.auto_min after the last change,
        at the latest backups.auto_max after the first). A Cube without a
        row in the store has no history (503).
      parameters: [{$ref: "#/components/parameters/sn"}]
      responses:
        "200":
          description: The backups and the pending automatic one
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BackupList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/NotReady"}
    post:
      summary: Take a backup now
      x-capability: backup
      description: |
        A backup of the Cube as GET …/backup takes it, stored with the
        reason manual, the user and the note.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {$ref: "#/components/parameters/sn"}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: {type: string, maxLength: 200}
      responses:
        "201":
          description: The backup stored
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StoredBackup"}
        "400":
          description: A field other than note, or a note longer than 200 characters
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/NotConnected"}
  /api/v1/cubes/{sn}/backups/{id}:
    get:
      summary: A stored backup's file
      x-capability: backup
      description: The file as it was stored, or in the format asked for, as an attachment.
      parameters:
        - {$ref: "#/components/parameters/sn"}
        - {$ref: "#/components/parameters/backupID"}
        - name: format
          in: query
          description: The stored format when absent
          schema: {type: string, enum: [json, yaml]}
      responses:
        "200":
          description: The backup file
          content:
            application/json:
              schema: {type: object, description: "See internal/backup for the structure"}
            application/yaml:
              schema: {type: string}
        "400":
          description: A format other than json or yaml
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/NotReady"}
    delete:
      summary: Remove a stored backup
      x-capability: restore
      description: The backup leaves the history; the store keeps a tombstone without the file until the retention removes it.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {$ref: "#/components/parameters/sn"}
        - {$ref: "#/components/parameters/backupID"}
      responses:
        "204": {description: Removed}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/NotReady"}
  /api/v1/cubes/{sn}/backups/{id}/diff:
    get:
      summary: What differs between two stored backups
      x-capability: backup
      description: |
        The restore planner's comparison, read-only: the steps a restore
        of this backup would send to the Cube as the backup against
        recorded it (its raw lines and NTP servers), with the notes and
        the radio commands. Nothing is sent. The restore's options apply,
        so skip=clock leaves the clock out; hidden devices are not
        compared.
      parameters:
        - {$ref: "#/components/parameters/sn"}
        - {$ref: "#/components/parameters/backupID"}
        - {name: against, in: query, required: true, description: The id of the backup to compare with, schema: {type: integer, minimum: 1}}
        - {$ref: "#/components/parameters/restorePortal"}
        - {$ref: "#/components/parameters/restoreState"}
        - {$ref: "#/components/parameters/restoreSkip"}
      responses:
        "200":
          description: The steps from the one to the other; none when they hold the same configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        what: {type: string}
                        radio: {type: boolean}
                        device: {type: string}
                        room: {type: integer}
                  notes: {type: array, items: {type: string}}
                  radio_commands: {type: integer}
        "400":
          description: No against, or a bad option
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/NotReady"}
  /api/v1/cubes/{sn}/restore/plan:
    post:
      summary: What restoring a backup would send
      x-capability: restore
      description: |
        The dry run of massimo restore: the backup in the body (JSON or
        YAML, which may be edited by hand) is compared with the Cube and
        the steps a restore would send are answered, with the notes
        (devices to pair again), the radio commands and about what they
        cost in duty cycle (1.25 % each), the Cube's budget, and a hash
        of the plan that POST …/restore takes. Nothing is written. The
        clock group reads the Cube's NTP servers first; hidden devices
        are neither compared nor written. With backup=<id> the stored
        backup is the file, and the body is left empty.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {$ref: "#/components/parameters/sn"}
        - {$ref: "#/components/parameters/restoreBackup"}
        - {$ref: "#/components/parameters/restorePortal"}
        - {$ref: "#/components/parameters/restoreState"}
        - {$ref: "#/components/parameters/restoreSkip"}
      requestBody: {$ref: "#/components/requestBodies/Backup"}
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RestorePlan"}
        "400":
          description: The backup cannot be read, is from another Cube or names none, or an option is bad
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "503": {$ref: "#/components/responses/NotConnected"}
  /api/v1/cubes/{sn}/restore:
    post:
      summary: Restore a backup
      x-capability: restore
      description: |
        The same body and options as POST …/restore/plan, plus the hash
        that answered. The plan is computed again and, when the hash is
        the same, its steps are sent one after the other through the
        queue at low priority; each step is a restore_step event, the end
        a restore_done event, and GET …/restore shows the state. The
        restore stops at the first step the Cube refused or that failed.
        Guard rails: a restore already running on the Cube, a changed
        plan, and radio commands while the duty cycle is above 80 %
        answer 409. A Cube with a row in the store keeps a backup of its
        configuration before the first step (before_restore; 503 when it
        cannot be stored) and the file of the body (upload).
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {$ref: "#/components/parameters/sn"}
        - {name: plan, in: query, required: true, description: The hash from POST …/restore/plan, schema: {type: string}}
        - {$ref: "#/components/parameters/restoreBackup"}
        - {$ref: "#/components/parameters/restorePortal"}
        - {$ref: "#/components/parameters/restoreState"}
        - {$ref: "#/components/parameters/restoreSkip"}
      requestBody: {$ref: "#/components/requestBodies/Backup"}
      responses:
        "202":
          description: The restore runs; follow it on the event stream or with GET
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  steps: {type: integer, description: Steps to send}
        "400":
          description: No plan hash, or what the plan request refuses with 400
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: A restore is running, the plan has changed since it was made (both hashes in the message), or the duty cycle is above 80 % and the plan has radio commands (the percentage in the message)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "503": {$ref: "#/components/responses/NotConnected"}
    get:
      summary: The last restore of the Cube
      x-capability: read
      parameters: [{$ref: "#/components/parameters/sn"}]
      responses:
        "200":
          description: The last restore since the server started, or {"state":"none"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RestoreState"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/cubes/{sn}/pairing:
    post:
      summary: Start pairing (inclusion mode)
      x-capability: pair
      description: |
        Sends n:<seconds> to the Cube. Devices that join are reported as
        "paired" events on the stream and in the state, and appear in the
        device list as unlisted; PUT /devices/{rf} with room_id puts one
        into a room. The Cube may end the mode earlier on its own.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                seconds: {type: integer, minimum: 1, maximum: 600, default: 60}
      responses:
        "200":
          description: Pairing runs
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PairingState"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Pairing is already running
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "502": {$ref: "#/components/responses/CubeError"}
        "503": {$ref: "#/components/responses/NotReady"}
    get:
      summary: Pairing state and the devices that joined
      x-capability: read
      parameters: [{$ref: "#/components/parameters/sn"}]
      responses:
        "200":
          description: The state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PairingState"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      summary: Stop pairing
      x-capability: pair
      description: Sends x:, also when the server counts the mode as over already.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "200":
          description: Pairing stopped
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PairingState"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502": {$ref: "#/components/responses/CubeError"}
  /api/v1/cubes/{sn}/log:
    get:
      summary: A page of the Cube's events, oldest first
      x-capability: read
      description: |
        The events the stream sends, kept in the store for log.keep_days
        (30 by default, 0 for ever), each with its id, the server's own
        among every Cube's; without parameters the newest 200 at info
        and above. A client pages back with before set
        to the id of the oldest event it has, until a page is empty. A
        state event's stored copy leaves out state.received. A Cube
        without a row in the store keeps its last 500 events in memory,
        without ids.
      parameters:
        - {$ref: "#/components/parameters/sn"}
        - {name: before, in: query, description: "An event's id for the page before it, or an RFC 3339 time for the events before that time", schema: {type: string, example: "4711"}}
        - {name: since, in: query, description: "An RFC 3339 time for the events at or after it, not after a before time", schema: {type: string, format: date-time, example: "2026-11-06T20:00:00Z"}}
        - {name: limit, in: query, schema: {type: integer, default: 200, minimum: 1, maximum: 1000}}
        - {name: kind, in: query, description: "Only events of this kind: state, config, connected, …", schema: {type: string, example: state}}
        - {name: source, in: query, description: "Only events of this source: a device's, the Cube's own, the server's own jobs, a change of the configuration, the queue's (a command's steps, its holds), the server's sign-ins, the LAN proxy's", schema: {type: string, enum: [device, cube, system, config, queue, server, proxy]}}
        - {name: level, in: query, description: "Only events of this level and above; info by default", schema: {type: string, enum: [debug, info, warn, error], default: info}}
        - {name: device, in: query, description: "Only events of this device, by its serial number or its radio address, also one the Cube no longer has", schema: {type: string, pattern: "^([0-9a-fA-F]{6}|[A-Za-z]{3}[0-9]{7})$", example: MEQ0000101}}
        - {name: user, in: query, description: "Only events this user started, by the login name, a removed user's too; a name the server does not know answers an empty page", schema: {type: string, example: anna}}
        - {name: command, in: query, description: "Only the events of this command (GET /api/v1/commands/{id}): its attempt, a discard and a retry, its outcome", schema: {type: integer, minimum: 1, example: 42}}
      responses:
        "200":
          description: Events as the stream sends them, each with its id in the log; those only a user with audit sees (sign-ins, lockouts) for such a user alone
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: integer, description: The event's place in the log; absent for a Cube without a row in the store}
                    kind: {type: string}
                    device: {type: string, description: The device's radio address}
                    serial: {type: string, description: "The device's serial number, also before it has a state and after it is gone; the Cube's for its own configuration"}
                    source: {type: string, enum: [device, cube, system, config, queue, server, proxy], description: "Whose the event is: a device's, the Cube's own, the server's own jobs, a change of the configuration, the queue's, the server's sign-ins, the LAN proxy's"}
                    level: {type: string, enum: [debug, info, warn, error]}
                    summary: {type: object, description: "What a line holds in short: a connection's devices, rooms, firmware, duty_cycle_pct, free_memory_slots, cause and down_for_s; a hello's budget; a list's rooms and devices; a configuration's main values"}
                    list_changes:
                      type: array
                      description: A metadata event's differences of the room and device list
                      items:
                        type: object
                        properties:
                          what: {type: string, enum: [room_added, room_renamed, room_deleted, device_added, device_renamed, device_moved, device_left]}
                          room: {type: integer}
                          name: {type: string}
                          from: {type: string}
                          to: {type: string}
                          device: {type: string}
                          serial: {type: string}
                    changes: {type: object, description: "A state event's or a config event's differences, by name: {from, to}"}
                    while_disconnected: {type: boolean, description: What a connection's greeting found changed while the Cube was disconnected or the server down}
                    command: {type: integer, description: "The command the event belongs to (GET /api/v1/commands/{id}); absent for none, and once the command is pruned"}
                    by:
                      type: object
                      description: Who started it, as the user is named now; absent for the Cube, the server's own jobs and a server without users
                      properties:
                        name: {type: string}
                        display_name: {type: string}
                    time: {type: string, format: date-time}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/cubes/{sn}/events:
    get:
      summary: Server-sent events for connection and state changes
      x-capability: read
      description: |
        On connect, one `state` event per device with its current data,
        then an event per change the Cube reports. Kinds: connected,
        disconnected (once per loss of the connection, not at each retry),
        hello, metadata, config, state, pairing_started,
        paired (with the device that joined in "paired"), pairing_ended,
        device_forgotten (a device deleted from the Cube left the server's
        copy; its "state" is the device as the server knew it), cube_found (with a Cube that is not configured in "cube"),
        restore_step and restore_done (with the progress of a restore in
        "restore", see POST …/restore), notification (with what the
        stream's user is told in "notification", on that user's streams
        alone); the server's own, source system:
        server_started, server_stopping, settings_read, restart, reboot,
        reboot_cancelled, update, update_result, backup, backup_deleted,
        backups_pruned, log_pruned, audit_pruned, log_rotated, restore_started; a Cube's own:
        address_changed, cube_gone; a change made through the API, source
        config: change, with the action, target, set, changes and subject in
        "summary" and who in "by"; the queue's, source queue: command (a
        step of the command named in "command": its state queued, sent,
        acknowledged, retried, dropped or failed) and hold (the radio
        commands waiting); the server's sign-ins, source server, for a
        user with audit alone: login, login_failed, locked_out; the LAN
        proxy's, source proxy: proxy_connected, proxy_disconnected,
        proxy_refused, proxy_discarded, proxy_deleted, proxy_delete_refused,
        proxy_pairing, proxy_warning. A state
        event after a device's first one has "changes": per changed value
        of state, {"from": …, "to": …} (null for a value the device did not
        have), and "reported" when the Cube gained or lost its state. A
        device's event carries its radio address in "device", its serial
        number in "serial" and "source": device, or cube for the Cube's own
        configuration. A comment line
        every 30 seconds keeps the stream alive. Browsers open it
        without headers: pass a ticket from POST …/events/ticket.
        Every event carries an id, "<epoch>-<number>"; the connection's
        state events none but the last, which carries the newest. A client
        that reconnects with the last id it read, in Last-Event-ID or
        last_event_id, gets the events since and no state burst; an id the
        server no longer holds gets a resync event, then the state burst.
        A client that falls behind is sent what is queued, then the stream
        ends.
      security:
        - bearer: []
        - ticket: []
        - token: []
        - {}
      parameters:
        - {$ref: "#/components/parameters/sn"}
        - {name: ticket, in: query, description: Single-use ticket from POST …/events/ticket, schema: {type: string}}
        - {name: last_event_id, in: query, description: "The last event id the client read, to resume after it; Last-Event-ID wins where both are given", schema: {type: string}}
        - {name: Last-Event-ID, in: header, description: "The last event id the client read, as a browser's retry sends it", schema: {type: string}}
        - {name: token, in: query, deprecated: true, description: "The API token itself; deprecated, it ends up in URLs and logs. Answered with the header Deprecation: @1793836800 (RFC 9745)", schema: {type: string}}
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/cubes/{sn}/events/ticket:
    post:
      summary: A single-use ticket that opens the event stream
      x-capability: read
      description: |
        Valid for one connection to this Cube's event stream within a
        minute, so that the token never goes into a URL.
      parameters: [{$ref: "#/components/parameters/sn"}]
      responses:
        "200":
          description: The ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: {type: string}
                  expires_at: {type: string, format: date-time}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/settings:
    get:
      summary: The server's settings
      x-capability: settings
      description: |
        Every setting with the store's value (or the default), the
        default, whether the store holds one, the value this run uses
        (a serve flag wins for one run) and when a change applies;
        node.id and tenant.id are read-only.
      responses:
        "200":
          description: The settings by key
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {$ref: "#/components/schemas/Setting"}
              example:
                stale_after: {value: 24h, default: 24h, set: false, in_effect: 24h, applies: now}
                commands.keep_days: {value: "0", default: "0", set: false, in_effect: "0", applies: now}
                log.keep_days: {value: "30", default: "30", set: false, in_effect: "30", applies: now}
                audit.keep_days: {value: "365", default: "365", set: false, in_effect: "365", applies: now}
                backups.auto_min: {value: "60", default: "60", set: false, in_effect: "60", applies: now}
                backups.auto_max: {value: "120", default: "120", set: false, in_effect: "120", applies: now}
                backups.keep_days_auto: {value: "90", default: "90", set: false, in_effect: "90", applies: now}
                backups.keep_days_manual: {value: "365", default: "365", set: false, in_effect: "365", applies: now}
                backups.keep_newest: {value: "10", default: "10", set: false, in_effect: "10", applies: now}
                auth.password_login: {value: "true", default: "true", set: false, in_effect: "true", applies: now}
                update.channel: {value: alpha, default: alpha, set: false, in_effect: alpha, applies: now}
                poll_interval: {value: 1m, default: 1m, set: false, in_effect: 1m, applies: restart}
                node.id: {value: 01a1ae5a-6bee-7ed4-bb4e-3baa2c43fe55, set: true, read_only: true}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503":
          description: The server has no store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    put:
      summary: Change settings
      x-capability: settings
      description: |
        An object of keys and values: stale_after (1h to 720h, applies
        at once), poll_interval (10s to 1h), refresh_interval (10m to
        168h, or 0 for off) and discover_interval (1m to 24h, or 0 for
        only on request), the intervals at the next start; the whole
        numbers; auth.password_login, true or false, whether POST
        /api/v1/login takes a password (off, the users sign in by OPAQUE
        alone); update.channel, devel, nightly, alpha, beta or stable,
        the releases the box takes (its own flavour's and every more
        stable one's; the default is the build's flavour); null goes back
        to the default. Every value is checked before any is written. The
        answer is that of GET.
      parameters: [{$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                nullable: true
                oneOf:
                  - {type: string}
                  - {type: integer}
                  - {type: boolean}
            example: {stale_after: 36h, refresh_interval: null}
      responses:
        "200":
          description: The settings by key, as GET
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {$ref: "#/components/schemas/Setting"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503":
          description: The server has no store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/update:
    get:
      summary: The newest signed release on the update channel
      x-capability: read
      parameters:
        - {name: refresh, in: query, description: Ask GitHub now instead of reusing a check of the last ten minutes, schema: {type: string}}
      responses:
        "200":
          description: Versions and whether an update can be started
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UpdateInfo"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
    post:
      summary: Ask the update helper to install the newest release
      x-capability: update
      description: |
        Needs a configured API token even where the other routes are open.
        The helper (massimo-update.service, root) verifies the release
        signature and checksum, replaces the binary, restarts the server and
        rolls back if the new version does not come up.
      parameters: [{$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "202":
          description: Requested; follow the progress with GET
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  requested: {type: string, description: The release tag that is newest now}
                  channel: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "403":
          description: The caller's role lacks update, no API token configured, no update helper, or Windows
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: Up to date, no release on the channel, or an update is running
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "502":
          description: The release check failed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/restart:
    get:
      summary: Whether the server can be restarted from here, and who starts it again
      x-capability: restart
      responses:
        "200":
          description: The restart's state for this caller
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RestartInfo"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
    post:
      summary: Restart the server through the service manager that runs it
      x-capability: restart
      description: |
        The server stops as on SIGTERM once the answer is written, and its
        service manager starts it again: systemd, launchd or Homebrew on the
        exit status 75, the Windows service manager through massimo restart.
        GET /healthz then reports a new started_at. An open server (no users,
        or no token without a store) takes it only from the box itself.
      parameters: [{$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "202":
          description: The restart has begun
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  by: {type: string, enum: [systemd, launchd, windows, exit]}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "403":
          description: The caller's role lacks restart, another site's page sent it, or an open server was asked from elsewhere than the box
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: No service manager would start the server again, the restart is switched off, one is under way, or an update is running
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          description: The restart could not be started, such as the Windows helper
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/reload:
    post:
      summary: Read the settings file again at once, as SIGHUP does
      x-capability: restart
      description: |
        Reads the settings file again and applies MASSIMO_API_TOKEN at once, as
        SIGHUP does, and checkpoints the store; every other setting that
        changed applies at the next start. The server also reads the file by
        itself within seconds of a change. Sends nothing to a Cube, so a
        retry is harmless.
      responses:
        "200":
          description: What reading the file again found
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReloadResult"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "409":
          description: The server reads no settings file
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          description: The settings file could not be read
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/reboot:
    get:
      summary: Whether the server can reboot the computer it runs on from here, and who does
      x-capability: reboot
      responses:
        "200":
          description: The reboot's state for this caller
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RebootInfo"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
    post:
      summary: Reboot the computer the server runs on, after a delay
      x-capability: reboot
      description: |
        Needs the owner's switch (MASSIMO_REBOOT=on in the settings file, or
        serve -allow-reboot) and, on Linux and macOS, the root helper that
        massimo install -reboot-helper installs; the Windows service reboots
        by itself. The server waits the delay, then asks the helper; the
        system stops the server as at every shutdown. DELETE takes back a
        reboot that still waits. An open server (no users, or no token
        without a store) takes it only from the box itself.
      parameters: [{$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                delay: {type: integer, minimum: 0, maximum: 3600, default: 60, description: Seconds until the reboot}
      responses:
        "202":
          description: The reboot waits its delay
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  by: {type: string, enum: [systemd, launchd, windows]}
                  at: {type: string, format: date-time, description: When the reboot is asked for}
        "400":
          description: The body is not JSON, or the delay is not 0 to 3600 seconds
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "403":
          description: The caller's role lacks reboot, another site's page sent it, or an open server was asked from elsewhere than the box
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: The server cannot reboot its computer, the reboot is switched off, no helper is installed, a reboot waits or has begun, a restart is under way, or an update is running
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    delete:
      summary: Take back a reboot that waits
      x-capability: reboot
      parameters: [{$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "200":
          description: The reboot is taken back
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "403":
          description: The caller's role lacks reboot, or an open server was asked from elsewhere than the box
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: No reboot waits, or the reboot has begun
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/store:
    get:
      summary: The store as massimo store info shows it
      x-capability: settings
      responses:
        "200":
          description: The store's file, schema, identities and rows per table
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StoreInfo"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503":
          description: The server has no store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/config:
    get:
      summary: The settings in effect, as massimo config shows them
      x-capability: settings
      description: |
        A key's, an IV's, a token's or a password's value never leaves the
        server: the variable is listed with secret true and no value.
      responses:
        "200":
          description: The settings in effect
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConfigView"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503":
          description: The server does not show its settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: >-
        A session or an API key of a user of the store, which names the
        user whose role grants the capabilities (x-capability on each
        operation, docs/api-v1.md "Authentication"); without a store,
        the one token of MASSIMO_API_TOKEN or -token. Required once a
        user exists, or a token is set. Ten failed checks from one
        address within a minute lock it out for five minutes (429).
    ticket:
      type: apiKey
      in: query
      name: ticket
      description: The event stream only; a single-use ticket from POST …/events/ticket.
    token:
      type: apiKey
      in: query
      name: token
      description: The event stream only, deprecated; the API token itself.
  parameters:
    prefKey:
      name: key
      in: path
      required: true
      description: "A preference's key: 1 to 32 of lower-case letters, digits, _ . -, starting with a letter; the web UI uses ui and schemes"
      schema: {type: string, example: ui}
    sn:
      name: sn
      in: path
      required: true
      description: Cube serial number, case-insensitive
      schema: {type: string, example: KEQ0000200}
    rf:
      name: rf
      in: path
      required: true
      description: "The device: its serial number, case-insensitive, or its radio address, six hex digits; a serial the Cube does not have is 404"
      schema: {type: string, pattern: "^([0-9a-fA-F]{6}|[A-Za-z]{3}[0-9]{7})$", example: "MEQ0000101"}
    id:
      name: id
      in: path
      required: true
      description: Room number as the Cube assigns it
      schema: {type: integer, minimum: 1, maximum: 255}
    restorePortal:
      name: portal
      in: query
      description: Also restore the portal URL and whether the Cube polls it; off unless given (?portal or ?portal=true)
      allowEmptyValue: true
      schema: {type: boolean, default: false}
    restoreState:
      name: state
      in: query
      description: Also re-apply each thermostat's mode and setpoint from the backup's state; off unless given
      allowEmptyValue: true
      schema: {type: boolean, default: false}
    restoreBackup:
      name: backup
      in: query
      description: A stored backup's id (GET …/backups), in place of the file in the body
      schema: {type: integer, minimum: 1}
    backupID:
      name: id
      in: path
      required: true
      description: A stored backup's id, from GET …/backups
      schema: {type: integer, minimum: 1}
    restoreSkip:
      name: skip
      in: query
      description: "Groups to leave alone, comma separated: names, settings, programs, clock"
      schema: {type: string, example: "names,clock"}
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        A key of the client's choice, at most 128 characters, kept per user
        for 24 hours: a retry with the same key answers what the first
        request answered, with the header Idempotent-Replayed: true, and
        sends nothing to the Cube; the same key with another request is
        422, one whose request is still running 409, and one whose request
        the server's restart cut off 503.
      schema: {type: string, maxLength: 128}
    name:
      name: name
      in: path
      required: true
      description: A user's login name, case does not matter
      schema: {type: string, example: anna}
    roleKey:
      name: key
      in: path
      required: true
      description: A role's key
      schema: {type: string, example: operator}
  requestBodies:
    Backup:
      required: false
      description: Left empty with backup=<id>; else a backup file as GET …/backup or massimo backup writes it, which may be edited by hand; at most 1 MB. A body that does not start with a brace is read as YAML whatever the Content-Type.
      content:
        application/json:
          schema: {type: object, description: "See internal/backup for the structure"}
        application/yaml:
          schema: {type: string}
        text/yaml:
          schema: {type: string}
    Config:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ConfigWrite"}
    Setpoint:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Setpoint"}
          examples:
            manual: {value: {mode: manual, temp: 21}}
            auto: {value: {mode: auto}}
            vacation: {value: {mode: vacation, temp: 17, until: "2026-11-10 12:00"}}
  responses:
    CommandResult:
      description: The Cube accepted the command
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: {type: boolean}
              discarded: {type: boolean, description: Always false on 200; a discarded command answers 502}
              budget: {$ref: "#/components/schemas/Budget"}
        pending_radiograms: {type: integer, description: Radiograms sent by the Cube and not yet acknowledged by a device (memory slots in use)}
    BadRequest:
      description: Bad input
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: Missing or wrong token
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: >-
        The token's user may not do this: the capability the route needs
        is not in the user's role, or the user or the role is disabled.
        The message says which.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    LockedOut:
      description: >-
        Too many failed token checks from this address (ten within a
        minute); every request from it is refused for five minutes.
      headers:
        Retry-After:
          description: Seconds until the lockout ends
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NoSignedInUser:
      description: No user is signed in (an open server, or the API token), so there is no one to keep preferences for
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NoStore:
      description: The server has no store (serve -addr), so no users
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Busy:
      description: >-
        Too many password checks at once (one a core, at most four, and
        eight waiting); try again after Retry-After.
      headers:
        Retry-After:
          description: Seconds to wait before trying again
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NoStoreOrBusy:
      description: >-
        The server has no store (serve -addr), so no users; or it is
        checking too many passwords at once, with Retry-After.
      headers:
        Retry-After:
          description: Seconds to wait before trying again, when busy
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NoUser:
      description: No such user
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NoRole:
      description: No such role
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Unknown Cube, device or room
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Superseded:
      description: A newer command for the same target replaced this one before it was sent
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    CubeError:
      description: >-
        The Cube discarded the command or the connection failed. A room
        command discarded because the Cube holds no state for some
        members (they have not reported since the Cube restarted) also
        carries `no_state`.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotReady:
      description: The Cube has not sent its greeting yet
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotConnected:
      description: The Cube is not connected
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    TooLarge:
      description: The body is over the limit (1 MB for a backup)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    StoredBackup:
      type: object
      properties:
        id: {type: integer}
        taken_at: {type: string, format: date-time}
        reason: {type: string, enum: [auto, manual, before_restore, upload]}
        format: {type: string, enum: [json, yaml]}
        tool: {type: string, description: The software that wrote the file}
        size: {type: integer, description: Bytes of the file}
        sha256: {type: string}
        user: {type: string, description: Who asked; absent for the server's own}
        note: {type: string}
    BackupList:
      type: object
      properties:
        backups:
          type: array
          items: {$ref: "#/components/schemas/StoredBackup"}
        changed: {type: string, format: date-time, description: When the configuration last changed against the newest backup; absent when it did not}
        due: {type: string, format: date-time, description: When the automatic backup follows; absent when none is due}
    Preference:
      type: object
      properties:
        key: {type: string, example: ui}
        value: {description: The JSON document as stored}
        updated_at: {type: string, format: date-time}
        version: {type: integer, description: Counts the writes of the key; a later write wins}
    PushSubscription:
      type: object
      properties:
        id: {type: integer}
        endpoint: {type: string}
        label: {type: string, example: Firefox on the phone}
        created_at: {type: string, format: date-time}
        last_ok_at: {type: string, format: date-time, description: The last message the push service took; absent before the first}
        failures: {type: integer, description: Failed deliveries since then}
        current: {type: boolean, description: Made with the caller's session or key}
    CommandState:
      type: string
      enum: [queued, sent, acknowledged, failed, dropped]
      description: >-
        queued, the request is running and nothing went to the Cube yet;
        sent, a step went to the Cube, or the request was answered 202
        and its run goes on; acknowledged, answered 2xx (a step: the Cube
        accepted it); failed, answered 5xx (a step: the send failed);
        dropped, answered 4xx or 503, nothing sent (a step: superseded,
        discarded by the Cube, or the server stopped).
    Command:
      type: object
      properties:
        id: {type: string, format: uuid}
        action: {type: string, description: As the audit names it}
        target: {type: string}
        cube: {type: string, description: The Cube's serial}
        user: {type: string, description: The login name of who asked}
        state: {$ref: "#/components/schemas/CommandState"}
        status: {type: integer, description: The HTTP status answered; absent while running}
        request: {type: object, description: The method, the path, the query and a hash of the body}
        result: {type: object, description: The answer's body; for a restore, the run's id, state and counts}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        steps:
          type: array
          description: The engine commands of the request, in order
          items: {$ref: "#/components/schemas/CommandStep"}
        audit:
          description: The request's audit row, for a caller with audit; absent for a proxy client's command, which has none
          allOf: [{$ref: "#/components/schemas/AuditEntry"}]
    CommandStep:
      type: object
      properties:
        id: {type: string, format: uuid}
        target: {type: string, description: "device:0a010d or room:6"}
        state: {$ref: "#/components/schemas/CommandState"}
        request: {type: object, description: The queue key, the priority, the number of lines and of radio lines, the wakeup, the room}
        result: {type: object, description: discarded, the budget the Cube reported, and the error}
        created_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
    AuditEntry:
      type: object
      properties:
        id: {type: integer}
        time: {type: string, format: date-time}
        user: {type: string, description: The login name; absent for no authentication, a failed login or the command line}
        token_id: {type: integer, description: The session or key used}
        remote: {type: string, description: The client's address, or cli}
        action: {type: string, description: "setpoint, room.config, device.update, cube.add, user.add, login, login.failed, …", example: setpoint}
        cube: {type: string, description: The Cube's serial, for a Cube's route}
        target: {type: string, description: "device:0a010d, room:6, user:anna, role:night, token:4, cube:KEQ0000000", example: "room:6"}
        detail:
          type: object
          description: >-
            The method, the path, the status, the milliseconds, the body's size and, when JSON and short, the body
            with password, current_password, token, record, proof, login, ke1 and ke3 removed, and the error of a failed answer. A request refused
            for a known user keeps no body. Requests refused before anyone is known are one row per address and
            minute, without their bodies: the first one's method, path and status, the count of requests within
            the minute, the count of each status in statuses, and the time of the last.
        result: {type: string, enum: [ok, refused, failed]}
        command_id: {type: integer, description: The command the request is, when it is one}
    UserCreate:
      type: object
      required: [name]
      properties:
        name: {type: string, description: "The login name: 1 to 64 of letters, digits, '.', '_', '-' and '@', case does not matter", example: anna}
        display_name: {type: string, maxLength: 64}
        role: {type: string, description: A role's key; viewer when absent, owner for the first owner}
        password: {type: string, description: Absent for a user with keys only; this or record for the first owner}
        record: {type: string, description: "A password of auth_version 2 in place of password: the registration record, base64url (POST /api/v1/users/{name}/register)"}
        ksf: {type: string, description: "The record's key stretching, as the registration answered it: m=<KiB>,t=<passes>,p=<lanes>", example: "m=19456,t=2,p=1"}
        disabled: {type: boolean}
        expires_at: {type: string, format: date-time, description: "Guests: disabled from then on"}
    UserChange:
      type: object
      properties:
        display_name: {type: string, maxLength: 64}
        role: {type: string}
        disabled: {type: boolean}
        expires_at: {type: string, format: date-time, nullable: true, description: null clears the end date}
        password: {type: string, description: Empty removes the password}
        current_password: {type: string, description: Required when a user sets its own password, unless proof is given}
        record: {type: string, description: "A password of auth_version 2 in place of password: the registration record, base64url"}
        ksf: {type: string, description: "The record's key stretching: m=<KiB>,t=<passes>,p=<lanes>", example: "m=19456,t=2,p=1"}
        proof: {type: string, description: "A proof of the current password from POST /api/v1/login/finish with the purpose proof, in place of current_password"}
    Role:
      type: object
      properties:
        key: {type: string}
        name: {type: string, description: The display name; empty shows the key's translated default}
        builtin: {type: boolean, description: One of the six default roles, which keep their keys}
        disabled: {type: boolean}
        capabilities:
          type: array
          description: The role's set, sorted; every capability for owner
          items: {type: string}
        users: {type: integer, description: Users with this role}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RoleCreate:
      type: object
      required: [key]
      properties:
        key: {type: string, description: "1 to 32 of letters, digits, '_' and '-', starting with a letter; lower case", example: night}
        name: {type: string, maxLength: 64}
        capabilities:
          type: array
          items: {type: string}
    RoleChange:
      type: object
      properties:
        name: {type: string, maxLength: 64}
        capabilities:
          type: array
          description: Replaces the set
          items: {type: string}
    Capability:
      type: object
      properties:
        key: {type: string, example: pair}
        disabled: {type: boolean, description: Denied to every role but owner}
    Disabled:
      type: object
      required: [disabled]
      properties:
        disabled: {type: boolean}
    Login:
      type: object
      required: [user, password]
      properties:
        user: {type: string, description: The login name; case does not matter}
        password: {type: string}
        label: {type: string, maxLength: 64, description: Names the session under the user's tokens; the User-Agent when absent}
        login:
          type: string
          description: >-
            A sign-in by OPAQUE for the name, started from this address, that the client could not finish:
            this request takes it over, so that the attempt counts once, and answers upgrade for a user still of
            auth_version 1
    LoginStart:
      type: object
      required: [user, ke1]
      properties:
        user: {type: string, description: The login name; case does not matter}
        ke1: {type: string, description: "The client's KE1, 96 bytes, base64url without padding"}
        purpose: {type: string, enum: [proof], description: A proof of the password in place of a session}
    LoginStarted:
      type: object
      properties:
        login: {type: string, description: The identifier to finish under}
        ke2: {type: string, description: "The server's KE2, 320 bytes, base64url without padding"}
        ksf: {type: string, description: "The key stretching to run: argon2id m=<KiB>,t=<passes>,p=<lanes>", example: "m=19456,t=2,p=1"}
        v1: {type: boolean, description: The box takes POST /api/v1/login as well}
        expires_at: {type: string, format: date-time, description: A minute from now}
    LoginFinish:
      type: object
      required: [login, ke3]
      properties:
        login: {type: string}
        ke3: {type: string, description: "The client's KE3, 64 bytes, base64url without padding"}
        label: {type: string, maxLength: 64, description: Names the session under the user's tokens; the User-Agent when absent}
    LoginProvider:
      type: object
      properties:
        key: {type: string}
        name: {type: string, description: On the sign-in button; the key where the provider has none}
    OIDCStart:
      type: object
      required: [redirect]
      properties:
        redirect: {type: string, description: "The page's own address, http or https, without a query or fragment", example: "https://massimo.example.com/"}
    OIDCStarted:
      type: object
      properties:
        url: {type: string, description: The provider's authorization URL, to open in the browser}
        expires_at: {type: string, format: date-time, description: Ten minutes from now}
    OIDCFinish:
      type: object
      required: [code]
      properties:
        code: {type: string, description: "The callback's #oidc= code"}
        label: {type: string, maxLength: 64, description: Names the session under the user's tokens; the User-Agent when absent}
    Proof:
      type: object
      properties:
        proof: {type: string, description: "Good once, for PUT /api/v1/users/{name} of one's own password"}
        expires_at: {type: string, format: date-time, description: Five minutes from now}
    Register:
      type: object
      required: [request]
      properties:
        request: {type: string, description: "The client's registration request, 32 bytes, base64url without padding"}
    Registered:
      type: object
      properties:
        response: {type: string, description: "The server's registration response, 64 bytes, base64url without padding"}
        ksf: {type: string, description: "The key stretching to run and to send with the record", example: "m=19456,t=2,p=1"}
    Session:
      type: object
      properties:
        token: {type: string, description: The session token, shown once; sent as the bearer header}
        expires_at: {type: string, format: date-time, description: 30 days from now, moved by use}
        user: {$ref: "#/components/schemas/User"}
        role: {$ref: "#/components/schemas/RoleRef"}
        capabilities:
          type: array
          description: The effective set
          items: {type: string}
        upgrade:
          type: string
          description: >-
            With login, for a user of auth_version 1: a proof, good once for five minutes, to set the user's own
            record with in PUT /api/v1/users/{name} without the password
        provider: {type: string, description: "After a sign-in through an OpenID Connect provider: the provider's key"}
    User:
      type: object
      properties:
        name: {type: string, description: The login name, lower case}
        display_name: {type: string}
        role: {type: string, description: The role's key}
        disabled: {type: boolean}
        has_password: {type: boolean, description: False for a user with keys only}
        expires_at: {type: string, format: date-time, description: "Guests: disabled from then on"}
        invited_by: {type: string, description: The user that created this one}
        auth_version: {type: integer, description: "1: the server hashes the password; 2: OPAQUE, the server keeps a record and never sees the password"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_login_at: {type: string, format: date-time}
    RoleRef:
      type: object
      properties:
        key: {type: string}
        name: {type: string, description: The display name; empty shows the key's translated default}
        disabled: {type: boolean}
    Token:
      type: object
      description: A session or an API key, without its secret
      properties:
        id: {type: integer}
        kind: {type: string, enum: [session, api]}
        label: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, description: Absent for an API key}
        last_used_at: {type: string, format: date-time}
        last_used_from: {type: string, description: The client's address}
    Me:
      type: object
      properties:
        mode: {type: string, enum: [users, open, token, none], description: How the server authenticates}
        user:
          nullable: true
          allOf: [{$ref: "#/components/schemas/User"}]
        role:
          nullable: true
          allOf: [{$ref: "#/components/schemas/RoleRef"}]
        capabilities:
          type: array
          description: What the caller may do; every capability outside users mode
          items: {type: string}
        setup: {type: boolean, description: The first owner can be created from here}
        token: {$ref: "#/components/schemas/Token"}
    RestoreStep:
      type: object
      description: One command of a restore plan
      properties:
        what: {type: string, description: The step as massimo restore prints it}
        radio: {type: boolean, description: Sends radio commands, which cost budget; false for a Cube command (names, NTP, time zone)}
        device: {type: string, description: The device the command addresses, when it has one}
        room: {type: integer, description: The room woken up before the command, when there is one}
        result: {$ref: "#/components/schemas/RestoreStepResult"}
    RestoreStepResult:
      type: object
      description: The outcome of a step once it ran (GET …/restore only)
      properties:
        ok: {type: boolean}
        discarded: {type: boolean, description: The Cube refused the radiogram; present when true}
        error: {type: string}
        budget: {$ref: "#/components/schemas/Budget"}
        time: {type: string, format: date-time}
    RestorePlan:
      type: object
      properties:
        plan: {type: string, description: SHA-256 over the step list (texts and command lines); POST …/restore takes it}
        steps:
          type: array
          description: The commands in the order they would be sent; empty when the Cube matches the backup
          items: {$ref: "#/components/schemas/RestoreStep"}
        notes:
          type: array
          description: Differences a restore cannot write, such as devices that have to be paired again
          items: {type: string}
        radio_commands: {type: integer, description: Radiograms of all steps}
        duty_cost_pct: {type: number, description: About what the radio commands will cost of the hourly radio budget, 1.25 % each}
        budget: {$ref: "#/components/schemas/Budget"}
    RestoreState:
      type: object
      description: The last restore of a Cube; only state for none
      properties:
        id: {type: string}
        state: {type: string, enum: [none, running, done, failed]}
        plan: {type: string, description: The hash of the plan sent}
        started: {type: string, format: date-time}
        finished: {type: string, format: date-time, description: Present once the restore ended}
        steps:
          type: array
          description: The plan's steps, each with its result once it ran; a failed restore stops at the failed step
          items: {$ref: "#/components/schemas/RestoreStep"}
        sent: {type: integer, description: Steps the Cube accepted}
        radio_commands: {type: integer}
        error: {type: string, description: Which step failed and why, for a failed restore}
    RestoreProgress:
      type: object
      description: The restore field of restore_step and restore_done events
      properties:
        id: {type: string}
        step: {type: integer, description: Counts from 1 in the order of the plan's steps; restore_step only}
        steps: {type: integer, description: Steps in the plan}
        what: {type: string, description: restore_step only}
        ok: {type: boolean}
        discarded: {type: boolean, description: Present when true}
        error: {type: string}
        state: {type: string, enum: [done, failed], description: restore_done only}
        sent: {type: integer, description: Steps the Cube accepted; restore_done only}
    RestartInfo:
      type: object
      required: [available]
      properties:
        available: {type: boolean, description: Whether this caller's POST would restart the server now}
        by: {type: string, enum: [systemd, launchd, windows, exit], description: Who starts the server again; absent when nobody would}
        blocked: {type: string, description: Why the restart is not available}
        pending:
          type: array
          items: {type: string}
          description: The settings file's variables that changed since the start and apply only at the next one; names, never values
        file: {type: string, description: The settings file serve reads}
        read_at: {type: string, format: date-time, description: When the settings file was last read, at the start or since}
    RebootInfo:
      type: object
      required: [available]
      properties:
        available: {type: boolean, description: Whether this caller's POST would reboot the computer now}
        by: {type: string, enum: [systemd, launchd, windows], description: Who reboots; absent when nobody can}
        blocked: {type: string, description: Why the reboot is not available}
        at: {type: string, format: date-time, description: When a reboot that waits, or has begun, is asked for}
        begun: {type: boolean, description: The delay is over and the helper or the system was asked}
        error: {type: string, description: Why the last reboot failed}
    ReloadResult:
      type: object
      required: [changed, pending, read_at]
      properties:
        changed:
          type: array
          items: {type: string}
          description: The variables that changed in this read; names, never values
        pending:
          type: array
          items: {type: string}
          description: The variables that differ from the start and apply only at the next one
        read_at: {type: string, format: date-time}
    StoreInfo:
      type: object
      properties:
        file: {type: string, description: The store's file}
        schema: {type: integer, description: The file's schema version}
        min_reader: {type: integer, description: The oldest schema version that still reads it}
        binary: {type: integer, description: The schema version this server is built for}
        node: {type: string}
        tenant: {type: string}
        rows:
          type: object
          additionalProperties: {type: integer}
          description: Rows per table
    ConfigView:
      type: object
      properties:
        version: {type: string}
        file: {type: string, description: The settings file}
        file_found: {type: boolean}
        data_dir: {type: string}
        listen: {type: string}
        tls: {type: string, enum: ["off", files, self-signed, acme]}
        log_level: {type: string, description: The level and where it came from}
        variables:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              value: {type: string, description: Absent for a secret}
              secret: {type: boolean}
              source: {type: string, description: Where the value came from, the environment or the settings file}
              unknown: {type: boolean, description: A name Massimo does not know, perhaps a typo}
    UpdateInfo:
      type: object
      properties:
        current: {type: string, description: The running version}
        flavour: {type: string, description: "What the running build was released as: devel, nightly, alpha, beta or stable; absent for a build without the Makefile"}
        channel: {type: string, description: "The update channel: MASSIMO_UPDATE_CHANNEL, else the setting update.channel, else the flavour; the apt source's suite where apt owns the binary"}
        manager: {type: string, description: "The package manager that owns the binary (apt, brew); absent on a box massimo install set up"}
        latest: {type: string, description: "Newest signed release the channel takes: of its own flavour or a more stable one"}
        release_url: {type: string}
        available: {type: boolean, description: latest is newer than current}
        checked_at: {type: string, format: date-time}
        check_error: {type: string}
        can_update: {type: boolean, description: POST would start an update}
        blocked: {type: string, description: Why an update cannot be started from the API (a package manager owning the binary without a helper of its own, no token, no helper, a development build)}
        helper: {$ref: "#/components/schemas/UpdateStatus"}
    UpdateStatus:
      type: object
      description: The update helper's last run
      properties:
        state: {type: string, enum: [checking, installing, restarting, done, up-to-date, failed, rolled-back]}
        from: {type: string}
        to: {type: string}
        channel: {type: string}
        message: {type: string}
        time: {type: string, format: date-time}
    Error:
      type: object
      properties:
        error: {type: string}
        no_state:
          type: array
          items: {type: string}
          description: Radio addresses of room members without state, when that caused the discard
    Budget:
      type: object
      description: What the Cube last reported about its radio limits
      properties:
        duty_cycle_pct: {type: integer, description: Share of the hourly radio budget already used}
        free_memory_slots: {type: integer, description: Free slots for unacknowledged radiograms (about 50)}
        updated_at: {type: string, format: date-time}
    FoundCube:
      type: object
      description: A Cube that answered discovery
      properties:
        serial: {type: string}
        configured: {type: boolean}
        address: {type: string, description: "The IP it answered from, its own where a massimo proxy answers for it too"}
        mac: {type: string, description: From the host's ARP cache; absent when unknown}
        rf_address: {type: string}
        firmware: {type: string, example: "1.1.3"}
        dhcp: {type: boolean, description: "Whether the Cube takes its address by DHCP, from its answer to the c request in this server run's latest discovery that had one; absent until it has answered c"}
        gateway: {type: string, description: "The gateway the Cube uses, from its answer to the N request in this server run's latest discovery that had one; absent until then"}
        netmask: {type: string, description: The netmask the Cube uses, as gateway}
        dns:
          type: array
          items: {type: string}
          description: The DNS servers the Cube uses, as gateway
        proxies:
          type: array
          items: {type: string}
          description: "The other addresses that answered for the Cube's serial in the latest run: massimo proxies (docs/proxy.md); absent when none did"
        found_at: {type: string, format: date-time, description: When the server first saw it}
        last_seen: {type: string, format: date-time, description: Its latest answer}
    Cube:
      type: object
      properties:
        serial: {type: string}
        name: {type: string, description: User-friendly name from the store (seeded from MASSIMO_CUBE_<SN>_NAME), when set}
        address: {type: string}
        configured: {type: boolean, description: Always true here; found Cubes are FoundCube}
        source: {type: string, enum: [env, ui, flag], description: Where the configuration comes from; absent without a store}
        file_differs:
          type: array
          description: The settings file's lines for this Cube whose values differ from the store's, which wins
          items: {$ref: "#/components/schemas/FileDifference"}
        configured_address: {type: string, description: "The stored address; empty: from discovery (address is where it connects now)"}
        follow_discovery: {type: boolean}
        proxy_address: {type: string, description: "The configured proxy address; empty: the default"}
        proxy_serial: {type: string}
        proxy_listening:
          type: array
          description: The addresses the Cube's proxy listens on now
          items: {type: string}
        hidden:
          type: array
          description: The hidden list (radio addresses), besides room 255
          items: {type: string}
        mac: {type: string, description: From discovery, once it saw the Cube}
        last_seen: {type: string, format: date-time, description: When the Cube last answered discovery}
        connected: {type: boolean, description: The server is connected to the Cube and has its complete greeting}
        firmware: {type: string, example: "1.1.3"}
        rf_address: {type: string}
        budget: {$ref: "#/components/schemas/Budget"}
        updated: {type: string, format: date-time}
        observed_since: {type: string, format: date-time, description: When the server first heard from the Cube; a device value received at that time was already there and may be older}
        rooms: {type: integer}
        devices: {type: integer}
        queued: {type: integer, description: Commands waiting in the queue}
        cube_time: {type: string, example: "2026-11-04 15:28"}
    CubeChange:
      type: object
      description: The fields of a Cube's configuration that PUT and POST change
      properties:
        name: {type: string, maxLength: 64}
        address: {type: string, description: "host or host:port; empty: from discovery", example: 192.168.1.10}
        follow_discovery: {type: boolean, description: The address follows the Cube's discovery answers}
        proxy_address: {type: string, description: "The server's listener for this Cube, host[:port]; empty: :62910 with a single Cube"}
        proxy_serial: {type: string, description: "The serial in discovery replies; empty: the Cube's"}
        hidden:
          type: array
          description: Radio addresses of devices to hide, besides those in room 255
          items: {type: string, example: 0abc12}
    Setting:
      type: object
      properties:
        value: {type: string, description: "The store's value, or the default; durations as 30m, 24h, 0 for off"}
        default: {type: string}
        set: {type: boolean, description: The store holds a value}
        in_effect: {type: string, description: What this run uses; a serve flag wins for one run}
        applies: {type: string, enum: [now, restart]}
        read_only: {type: boolean}
    FileDifference:
      type: object
      properties:
        field: {type: string, enum: [name, address, proxy_address, proxy_serial, hidden]}
        variable: {type: string, example: MASSIMO_CUBE_KEQ0000000_NAME}
        file: {description: The file's value; a list of radio addresses for hidden}
        store: {description: The store's value, in effect; a list for hidden}
    CubeDetail:
      allOf:
        - {$ref: "#/components/schemas/Cube"}
        - type: object
          properties:
            config: {$ref: "#/components/schemas/CubeConfig"}
            room_list:
              type: array
              items: {$ref: "#/components/schemas/Room"}
    CubeConfig:
      type: object
      properties:
        portal_enabled: {type: boolean}
        portal_url: {type: string}
        push_button_up: {type: integer}
        push_button_down: {type: integer}
        tz_winter: {$ref: "#/components/schemas/TimeZoneRule"}
        tz_summer: {$ref: "#/components/schemas/TimeZoneRule"}
    TimeZoneRule:
      type: object
      properties:
        name: {type: string, example: CET}
        month: {type: integer}
        weekday: {type: integer}
        hour: {type: integer}
        offset_seconds: {type: integer}
    Room:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        ready: {type: boolean, description: Every device of the room has reported since the Cube restarted, so the Cube accepts room commands}
        stale: {type: boolean, description: A device of the room is stale; present when true}
        devices:
          type: array
          items: {$ref: "#/components/schemas/Device"}
    DeviceType:
      type: string
      enum: [cube, radiator_thermostat, radiator_thermostat_plus, wall_thermostat, shutter_contact, eco_switch]
    Mode:
      type: string
      enum: [auto, manual, vacation, boost]
    State:
      type: object
      description: The device's last report; absent until it reported once
      properties:
        mode: {$ref: "#/components/schemas/Mode"}
        setpoint: {type: number}
        until: {type: string, description: "Vacation end, YYYY-MM-DD HH:MM"}
        actual_temp: {type: number}
        valve_pct: {type: integer}
        window_open: {type: boolean}
        battery_low: {type: boolean}
        error: {type: boolean, description: Transmit error reported by the Cube}
        link_error: {type: boolean}
        panel_locked: {type: boolean, description: Key lock active on the device; present when true}
    Device:
      type: object
      properties:
        rf_address: {type: string}
        type: {$ref: "#/components/schemas/DeviceType"}
        name: {type: string}
        room_id: {type: integer}
        serial: {type: string}
        unlisted: {type: boolean, description: Paired but not assigned to a room}
        reported: {type: boolean, description: The Cube holds state for the device (it transmitted since the Cube restarted)}
        state: {$ref: "#/components/schemas/State"}
        received:
          type: object
          description: >-
            Per value of state (same names), when the server saw its current
            value appear in the Cube's device list. The Cube keeps no times;
            a repeated value keeps its time, and a value already there when
            the server connected carries the Cube's observed_since. Present
            with state.
          additionalProperties: {type: string, format: date-time}
        last_seen: {type: string, format: date-time, description: When the device's entry in the Cube's device list last changed; present with state}
        stale: {type: boolean, description: "Radiator or wall thermostat whose entry has not changed for 24 hours: out of range, flat battery, or just quiet. Present when true"}
    ConfigWrite:
      type: object
      description: Every field optional; merged into the device's current configuration
      properties:
        comfort_temp: {type: number, description: 4.5 to 30.5 in steps of 0.5}
        eco_temp: {type: number}
        max_setpoint: {type: number}
        min_setpoint: {type: number}
        temp_offset: {type: number, description: -3.5 to 3.5 in steps of 0.5; per device only}
        window_open_temp: {type: number}
        window_open_minutes: {type: integer, description: 0 to 60 in steps of 5}
        boost_minutes: {type: integer, description: 0 to 30 in steps of 5, or 60}
        boost_valve_pct: {type: integer, description: 0 to 100 in steps of 5}
        decalc_day: {type: string, enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]}
        decalc_hour: {type: integer, minimum: 0, maximum: 23}
        max_valve_pct: {type: integer, minimum: 0, maximum: 100}
        valve_offset_pct: {type: integer, minimum: 0, maximum: 100}
        display_actual: {type: boolean, description: Wall thermostats only, per device only}
    DeviceResult:
      type: object
      properties:
        rf_address: {type: string}
        name: {type: string}
        ok: {type: boolean}
        discarded: {type: boolean}
        error: {type: string}
    RoomConfig:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        source: {type: string, description: The thermostat the common fields come from}
        comfort_temp: {type: number}
        eco_temp: {type: number}
        max_setpoint: {type: number}
        min_setpoint: {type: number}
        window_open_temp: {type: number}
        window_open_minutes: {type: integer}
        boost_minutes: {type: integer}
        boost_valve_pct: {type: integer}
        decalc_day: {type: string}
        decalc_hour: {type: integer}
        max_valve_pct: {type: integer}
        valve_offset_pct: {type: integer}
        devices:
          type: array
          items:
            type: object
            properties:
              rf_address: {type: string}
              type: {$ref: "#/components/schemas/DeviceType"}
              name: {type: string}
              temp_offset: {type: number}
              display_actual: {type: boolean}
    SwitchPoint:
      type: object
      properties:
        temp: {type: number}
        until: {type: string, example: "07:00"}
    WeekProgram:
      type: object
      description: Switch points per weekday; the last point of a day ends at 24:00
      properties:
        monday: {type: array, items: {$ref: "#/components/schemas/SwitchPoint"}}
        tuesday: {type: array, items: {$ref: "#/components/schemas/SwitchPoint"}}
        wednesday: {type: array, items: {$ref: "#/components/schemas/SwitchPoint"}}
        thursday: {type: array, items: {$ref: "#/components/schemas/SwitchPoint"}}
        friday: {type: array, items: {$ref: "#/components/schemas/SwitchPoint"}}
        saturday: {type: array, items: {$ref: "#/components/schemas/SwitchPoint"}}
        sunday: {type: array, items: {$ref: "#/components/schemas/SwitchPoint"}}
    ThermostatConfig:
      type: object
      properties:
        comfort_temp: {type: number}
        eco_temp: {type: number}
        max_setpoint: {type: number}
        min_setpoint: {type: number}
        temp_offset: {type: number}
        window_open_temp: {type: number}
        window_open_minutes: {type: integer}
        boost_minutes: {type: integer}
        boost_valve_pct: {type: integer}
        decalc_day: {type: string}
        decalc_hour: {type: integer}
        max_valve_pct: {type: integer}
        valve_offset_pct: {type: integer}
        week_program: {$ref: "#/components/schemas/WeekProgram"}
    WallThermostatConfig:
      type: object
      properties:
        comfort_temp: {type: number}
        eco_temp: {type: number}
        max_setpoint: {type: number}
        min_setpoint: {type: number}
        temp_offset: {type: number}
        window_open_temp: {type: number}
        boost_minutes: {type: integer}
        boost_valve_pct: {type: integer}
        display_actual: {type: boolean, description: The display shows the measured temperature instead of the setpoint}
        week_program: {$ref: "#/components/schemas/WeekProgram"}
    NewDevice:
      type: object
      description: A device that joined during pairing, from the Cube's N line
      properties:
        type: {$ref: "#/components/schemas/DeviceType"}
        rf_address: {type: string}
        serial: {type: string}
    PairingState:
      type: object
      properties:
        active: {type: boolean}
        started: {type: string, format: date-time}
        until: {type: string, format: date-time, description: When pairing ends at the latest}
        ended: {type: string, format: date-time, description: When the last pairing ended; absent while active or before the first}
        paired:
          type: array
          description: Devices that joined during the current or last pairing
          items: {$ref: "#/components/schemas/NewDevice"}
    DeviceDetail:
      allOf:
        - {$ref: "#/components/schemas/Device"}
        - type: object
          properties:
            firmware: {type: integer}
            thermostat: {$ref: "#/components/schemas/ThermostatConfig"}
            wall_thermostat: {$ref: "#/components/schemas/WallThermostatConfig"}
    Setpoint:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [auto, manual, vacation]
        temp:
          type: number
          minimum: 4.5
          maximum: 30.5
          multipleOf: 0.5
          description: Required for manual and vacation; optional for auto
        until:
          type: string
          description: "Vacation end, YYYY-MM-DD HH:MM on a half hour; required for vacation"
