openapi: 3.0.3
info:
  title: Massimo API
  version: "1"
  description: |
    HTTP API of `massimo serve` over one or more eQ-3 MAX! Cubes.
    Reads come from the server's copy of each Cube's state; writes go
    through a per-Cube command queue that respects the radio budget.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: http://127.0.0.1:8099
security:
  - bearer: []
  - {}
paths:
  /healthz:
    get:
      summary: Liveness and version
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  version: {type: string}
                  started_at: {type: string, format: date-time, description: When the server process started.}
                  node_id: {type: string, format: uuid, description: "The box's node.id from its store, the same across restarts"}
                  features:
                    type: object
                    description: "What this server can do, by name, each its version MAJOR.MINOR: event_ids, idempotency, commands, vwt, program_etag, boost, proxy_virtual, integration, log_after; without a store idempotency, commands, proxy_virtual and integration are left out. A name never changes meaning."
                    additionalProperties: {type: string, pattern: "^[0-9]+\\.[0-9]+$", example: "1.0"}
                  tls: {$ref: "#/components/schemas/CertStatus"}
                  password_reveal: {type: boolean, description: "The setting auth.password_reveal: the web UI's password fields offer their eye, which shows the password as it is typed; true without a store. The sign-in learns it here, before anyone is signed in."}
  /api/v1/login:
    post:
      summary: Log in with a name and a password
      x-capability: none
      description: |
        Answers a session token, good for 30 days from its last use,
        which the client sends as the bearer header. A wrong pair counts
        against the address and the user name (429 after ten in a
        minute). An address signs in once at a time: a login while
        another from the same address is checked is 429 with
        Retry-After 1, not counted as a failure. 409 on a server without
        users (create the first owner with POST /api/v1/users) or
        without a store (the API token). 403 while auth.password_login
        is off in /api/v1/settings: the users sign in by OPAQUE alone.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Login"}
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401":
          description: Wrong user or password
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: No users yet, or no store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          description: >-
            The address or the user name is locked out (ten failed logins
            within a minute), or a sign-in from this address is running
          headers:
            Retry-After:
              description: Seconds until the lockout ends, or 1
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503": {$ref: "#/components/responses/Busy"}
  /api/v1/login/start:
    post:
      summary: Start a sign-in by OPAQUE
      x-capability: none
      description: |
        The first half of a sign-in of auth_version 2 (RFC 9807,
        ristretto255-SHA512, the messages base64url without padding):
        the client's KE1 for a name is answered with KE2, the key
        stretching the client is to run for the record, and a login to
        finish under within a minute. No password crosses. A name
        without a record of version 2 is answered from a fake record of
        the same shape, and its finish fails. A start is a guess, since
        the client can tell from KE2 whether its password was right: it
        counts as a failed login against the address and the name at
        once, which a finished sign-in clears. The address is held until
        the finish or the minute's end; a start or a login from it
        meanwhile is 429 with Retry-After 1. v1 says whether the box
        still takes POST /api/v1/login, for a client whose finish fails.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginStart"}
      responses:
        "200":
          description: KE2 and the login to finish under
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoginStarted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409":
          description: No users yet, or no store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          description: >-
            The address or the user name is locked out (ten failed logins
            within a minute), or a sign-in from this address is running
          headers:
            Retry-After:
              description: Seconds until the lockout ends, or 1
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503": {$ref: "#/components/responses/Busy"}
  /api/v1/login/finish:
    post:
      summary: Finish a sign-in by OPAQUE
      x-capability: none
      description: |
        The client's KE3 for a login started. A match answers the session
        of POST /api/v1/login, or with the purpose proof a proof of the
        password, good once for five minutes, for one's own password
        change. Anything else is 401 and counts no more failures than the
        start did. A login is finished once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginFinish"}
      responses:
        "200":
          description: The session, or the proof
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/Session"}
                  - {$ref: "#/components/schemas/Proof"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401":
          description: Wrong user or password, or no login started under the identifier, or it took too long
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: No users yet, or no store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503": {$ref: "#/components/responses/Busy"}
  /api/v1/login/providers:
    get:
      summary: The providers a user may sign in through
      x-capability: none
      description: |
        The enabled OpenID Connect providers, by key, each with the name
        its sign-in button shows; an empty list on a server without users.
      security: []
      responses:
        "200":
          description: The providers
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/LoginProvider"}
  /api/v1/login/oidc/{key}:
    post:
      summary: Start a sign-in through an OpenID Connect provider
      x-capability: none
      description: |
        The provider's authorization URL for a new sign-in (the
        authorization code flow with PKCE S256, a state and a nonce),
        which the page opens. redirect is the page's own address: the
        redirect URI is it plus api/v1/login/oidc/callback, which must be
        registered at the provider, and the callback sends the browser
        back to it. The sign-in waits ten minutes. An address locked out
        is refused as for a password.
      security: []
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}, description: The provider's key}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OIDCStart"}
      responses:
        "200":
          description: The provider's page to open
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OIDCStarted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: No users yet, or no store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "502":
          description: The provider's discovery document could not be read, or does not do
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503": {$ref: "#/components/responses/Busy"}
  /api/v1/login/oidc/callback:
    get:
      summary: The provider sends the browser back
      x-capability: none
      description: |
        The redirect URI. The code is traded at the provider's token
        endpoint, the id_token's iss, aud, exp and nonce are checked, the
        userinfo endpoint, where the discovery names one, fills in what
        the id_token lacks (an answer for another sub fails), and the
        user is found: by the provider's subject; else by an e-mail
        assigned to a user, verified by the provider, which binds the
        subject; else, where the provider creates users, a new one. The
        browser goes back to the page with #oidc=<code>, a one-time code
        good for a minute from the same address, or with
        #oidc-error=<reason>: denied (at the provider), failed (its answer
        did not do), refused (no user here for the account), noemail (none,
        and no e-mail sent), unverified (none, and the e-mail that would
        have counted not verified), group (in none of the groups the
        provider admits) or disabled.
        A refusal counts as a failed sign-in of the address.
      security: []
      parameters:
        - {name: code, in: query, schema: {type: string}}
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}, description: The provider's refusal}
      responses:
        "303":
          description: Back to the page, the code or the reason in the fragment
          headers:
            Location: {schema: {type: string}}
        "400":
          description: No sign-in started under the state, or it took too long
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/login/oidc/finish:
    post:
      summary: Finish a sign-in through an OpenID Connect provider
      x-capability: none
      description: |
        The callback's one-time code traded for the session of POST
        /api/v1/login, with the provider's key; from the address the
        callback came from, once, within a minute.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OIDCFinish"}
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401":
          description: No sign-in under the code, or it took too long, or the user is gone
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: No users yet, or no store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/login/key:
    post:
      summary: A session from the API key that makes the call
      x-capability: any
      description: |
        For the apps' login by fingerprint (docs/app.md): the bearer is
        an API key of the user's own, and the answer the session POST
        /api/v1/login answers. The session names the key (key_id in the
        token list), the key's earlier session ends, and revoking the key
        ends the session. A wrong key is 401 and counts toward the
        address's lockout as every failed token check does; a revoked
        key is 401 and does not, as no token that ended does; a
        disabled user, a guest past its end date or a disabled role is
        403, and so is a registered integration's key. It sends no
        password, so it works while auth.password_login is off.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label: {type: string, maxLength: 64, description: "Names the session under the user's tokens; the User-Agent when absent"}
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "400":
          description: The bearer is a session, not an API key, or the body is not JSON
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: No users yet, or no store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
  /api/v1/logout:
    post:
      summary: End the session that makes the call
      x-capability: any
      description: |
        An API key is not a session and answers 400; it is revoked with
        DELETE /api/v1/me/token as its own bearer, or under the user's
        tokens.
      responses:
        "200":
          description: Ended
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
        "400":
          description: The token is an API key, or the server has no users
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
  /api/v1/me/token:
    delete:
      summary: Revoke the token that makes the call
      x-capability: any
      description: |
        The bearer is revoked, whatever it is: a session, or an API key
        and the sessions made from it (POST /api/v1/login/key), with the
        keys it made and theirs (heirs; AP KeyLife, D5-A). One call
        for any token, without the user's name or the token's id, as the
        apps revoke a kept key with the key alone. Audited as
        token.revoke. A caller without a token of a user, on an open
        server or with the one token of a server without users, is 400,
        and so is an integration's call on a user's behalf
        (X-MassimoHA-On-Behalf-Of). The settings file's token
        (MASSIMO_API_TOKEN) is 409: it is changed or removed in the
        settings file, since the next start would not add it back.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  id: {type: integer, description: "The token's id, as the user's token list had it"}
                  heirs: {$ref: "#/components/schemas/TokenHeirs"}
        "400":
          description: No token of a user to revoke, or a call on a user's behalf
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: The token is the settings file's MASSIMO_API_TOKEN
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
  /api/v1/me:
    get:
      summary: Who the caller is and what the caller may do
      x-capability: any
      description: |
        The mode (users, open, token, none), the caller's user, role and
        effective capabilities, with what they include (restart beside
        update or reboot), and the token presented; outside users
        mode user and role are null and the capabilities are all of
        them. An open server has no regular user: an integration's users
        do not count, and its key is answered as anyone's, mode open.
        setup is true on an open server for a caller on the local
        network, which may create the first owner; kept_open is true on an
        open server while the setting auth.keep_open is on, and absent
        otherwise.
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
  /api/v1/commands/{id}:
    get:
      summary: A command by its id, with its steps
      x-capability: read
      description: |
        Every request that changes something is a command (its id is in
        the audit's command_id), and every engine command it put on a
        Cube's queue is a step beneath it. A user without audit sees its
        own commands only; others are 404. A caller with audit gets the
        request's audit row with it.
      parameters:
        - {name: id, in: path, required: true, description: "The command's id, a UUID, or its number, as the log's command and the audit's command_id name it", schema: {type: string, example: "42"}}
      responses:
        "200":
          description: The command
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Command"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: No such command, or not the caller's
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/me/preferences:
    get:
      summary: The signed-in user's preferences, by key
      x-capability: any
      description: |
        The web UI's settings (ui) and colour schemes (schemes), each a
        JSON document; {} when none is kept. 409 without a signed-in user
        (an open server, or the API token): the
        page then keeps its settings in the browser.
      responses:
        "200":
          description: The preferences by key
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {description: The JSON document of the key}
              example:
                ui: {poll: 10, expert: false, clock: browser, lang: auto, theme: system, scheme: massimo}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/NoSignedInUser"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/me/preferences/{key}:
    get:
      summary: One of the signed-in user's preferences
      x-capability: any
      parameters: [{$ref: "#/components/parameters/prefKey"}]
      responses:
        "200":
          description: The JSON document of the key
          content:
            application/json:
              schema: {description: The document as it was put}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: The key is not set
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409": {$ref: "#/components/responses/NoSignedInUser"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
    put:
      summary: Keep one of the signed-in user's preferences on the server
      x-capability: preferences
      description: |
        The body is the value, any JSON document of at most 64 KiB; it
        replaces the key's. Needs preferences, which a guest has not: a
        guest's settings stay in the browser. An audit row, no command.
      parameters: [{$ref: "#/components/parameters/prefKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {description: Any JSON document}
      responses:
        "200":
          description: How it was stored
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Preference"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/NoSignedInUser"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
    delete:
      summary: Remove one of the signed-in user's preferences
      x-capability: preferences
      description: Answers ok also when the key was not set.
      parameters: [{$ref: "#/components/parameters/prefKey"}]
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  key: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/NoSignedInUser"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/push/vapid:
    get:
      summary: The server's VAPID public key, which a browser subscribes with
      x-capability: read
      description: |
        The P-256 public key of the server's VAPID key pair (RFC 8292), as
        pushManager.subscribe takes it for applicationServerKey; made at
        the first request and kept in the store, whose settings do not
        show it.
      responses:
        "200":
          description: The key
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: {type: string, description: "The uncompressed point, base64url without padding"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/me/push:
    get:
      summary: The signed-in user's push subscriptions
      x-capability: preferences
      description: Oldest first, without their keys; current marks the one made with the caller's session or key.
      responses:
        "200":
          description: The subscriptions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/PushSubscription"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/NoSignedInUser"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
    post:
      summary: Subscribe a browser or an app to the signed-in user's notifications
      x-capability: preferences
      description: |
        The body is the browser's PushSubscription.toJSON() and a label;
        the subscription belongs to the user and to the caller's session
        or key, and goes with them. The same endpoint again updates its
        row (200), which then belongs to the caller. A label left out is
        the request's User-Agent. An audit row (push.subscribe), no
        command.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: {type: string, description: "The push service's http or https URL, at most 2048 characters"}
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh: {type: string, description: "The subscriber's P-256 public key, uncompressed, base64url"}
                    auth: {type: string, description: "The subscriber's 16-byte auth secret, base64url"}
                label: {type: string, description: "At most 100 characters, such as Firefox on the phone"}
      responses:
        "200":
          description: The endpoint's subscription, updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PushSubscription"}
        "201":
          description: A new subscription
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PushSubscription"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/NoSignedInUser"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/me/push/{id}:
    delete:
      summary: Remove one of the signed-in user's push subscriptions
      x-capability: preferences
      description: An audit row (push.unsubscribe), no command.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: The user has no subscription of that id
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409": {$ref: "#/components/responses/NoSignedInUser"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/audit:
    get:
      summary: The audit, newest first
      x-capability: audit
      description: |
        Every request that changed something, or tried to: who, from
        where, what, the request with its secrets removed, and how it
        went. Paged by time with before, filtered by user.
      parameters:
        - {name: before, in: query, description: "Rows before this time, RFC 3339", schema: {type: string, format: date-time}}
        - {name: limit, in: query, description: At most this many rows (100), schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
        - {name: user, in: query, description: "Rows of this user's login name: made with its rights (effective_user) or by it (real_user)", schema: {type: string}}
      responses:
        "200":
          description: The rows
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AuditEntry"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/users:
    get:
      summary: List the users
      x-capability: users
      description: >-
        Every user with users or passwords; else the own user and those the caller may change: with guests the
        guests it reaches, regular ones or, for a call through an integration, that integration's own; with
        integrations an integration's users but those stored as owner.
      responses:
        "200":
          description: The users by name
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/User"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
    post:
      summary: Create a user
      x-capability: users
      description: |
        With users, any role; with guests alone, the role guest, and
        through an integration none: a new user is a regular one. On a
        server without regular users (an integration's do not count), the
        first owner: open to a caller on the
        local network (loopback, a private range, link-local), the role
        owner and a password required, refused from anywhere else, and
        created once: a second request at the same moment is 409. A
        password has 8 to 64 characters, Unicode code points as sent,
        and contains neither the user's names nor the server's, nor
        massimo or maxcube, or it is 400 and nothing is written; a record
        is not checked, since the server never sees the password in it.
        The first owner's answer holds open_setup where anything set up
        before it still works, as a rule while the server was open, which
        the log's open_setup line at warn says too.
      parameters: [{$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserCreate"}
      responses:
        "201":
          description: The user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserCreated"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: The name exists, or the first owner exists already
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStoreOrBusy"}
  /api/v1/users/{name}:
    get:
      summary: One user
      x-capability: users
      parameters: [{$ref: "#/components/parameters/name"}]
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NoUser"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
    put:
      summary: Change a user
      x-capability: users
      description: |
        Any of the fields; absent ones stay. A user changes its own
        display_name and, with current_password, its password, never a
        call through an integration for the user it is linked to; the
        role, disabled and expires_at need users (guests for a guest it
        reaches: a regular one, or for a call through an integration that
        integration's own); integrations changes an integration's user but
        one stored as owner, a role it outranks within the integration's
        maximum (403 beyond). A
        password set by someone else ends the user's sessions. The last
        enabled owner cannot be disabled or demoted (409); an
        integration's user is none. An integration's user gets no password
        or record (403): it acts through its integration alone. A
        password other than the empty one has 8 to 64 characters and
        contains neither the user's names nor the server's, nor massimo or
        maxcube, or it is 400 and nothing of the request is written; a
        record is not checked.
      parameters: [{$ref: "#/components/parameters/name"}, {$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserChange"}
      responses:
        "200":
          description: The user as changed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NoUser"}
        "409":
          description: The last enabled owner without an end date
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStoreOrBusy"}
    delete:
      summary: Remove a user
      x-capability: users
      description: >-
        The user's tokens are revoked, with the keys its keys made (made_by); its row stays for the audit. An integration's
        user's link to a Massimo user ends with it: its integration's next call for it makes it anew, unlinked. The last
        enabled owner without an end date stays (409), and so does the user that holds the settings file's MASSIMO_API_TOKEN
        (409), whose key the next start would not add back: it is changed or removed in the settings file first. An
        integration's own user (<uuid>:) and its system user stay too (403): DELETE /api/v1/integrations/{uuid} removes the
        integration and keeps both.
      parameters: [{$ref: "#/components/parameters/name"}, {$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  name: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NoUser"}
        "409":
          description: The last enabled owner without an end date, or the user that holds the settings file's MASSIMO_API_TOKEN
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/users/{name}/register:
    post:
      summary: Start a registration by OPAQUE
      x-capability: users
      description: |
        The first step of a password of auth_version 2: the client's
        registration request for the name is answered with the server's
        response and the key stretching to run. Nothing is kept; the
        client finishes with the password and sends the record to POST
        /api/v1/users or PUT /api/v1/users/{name} as record and ksf.
        Allowed to whoever may set the user's password, or, for a name
        that has no user, add one: the first owner from the local network
        on a server without users.
      parameters: [{$ref: "#/components/parameters/name"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Register"}
      responses:
        "200":
          description: The server's response
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Registered"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NoUser"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/users/{name}/tokens:
    get:
      summary: The user's sessions and API keys
      x-capability: users
      parameters: [{$ref: "#/components/parameters/name"}]
      responses:
        "200":
          description: The live tokens, oldest first, without their secrets; the settings file's MASSIMO_API_TOKEN with from_settings
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Token"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NoUser"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
    post:
      summary: Create an API key for the user
      x-capability: users
      description: >-
        The key is shown once, in token; the store keeps its hash. expires_at gives it an end date, a time
        in the future (one that has passed is 400 and makes no key), null or absent none (AP KeyLife,
        Block 4); unused for the days of the setting auth.key_idle_days it ends, unless idle_exempt keeps
        it from that limit, which only who manages the user may set (403 for anyone else, the key's own
        user among them; AP KeyLife, D7-A). A retry with the same Idempotency-Key answers 201 without
        token. An integration's user gets
        none (403): it acts through its integration alone. With an API key as the bearer, the new key names
        it (made_by) and goes with its revoke; a bearer key revoked or ended after the request was let in
        makes none (401).
      parameters: [{$ref: "#/components/parameters/name"}, {$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: {type: string, maxLength: 64, example: Loxone}
                idle_exempt: {type: boolean, description: "Keeps the key from the idle limit; false by default"}
                expires_at: {type: string, format: date-time, nullable: true, description: "The key's end date, in the future; null or absent for none"}
      responses:
        "201":
          description: The key
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string, description: "The secret, shown once"}
                  id: {type: integer}
                  kind: {type: string, enum: [api]}
                  label: {type: string}
                  created_at: {type: string, format: date-time}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NoUser"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/users/{name}/tokens/{id}:
    put:
      summary: Change an API key's life
      x-capability: users
      description: |
        idle_exempt keeps the key from the idle limit (true) or holds it
        to it again (false), for who manages the key's user alone (AP
        KeyLife, D7-A); a key that ended unused lives again once kept
        from it (D6-A). expires_at sets or moves the key's end date, a
        time in the future (one that has passed is 400 and changes
        nothing), and null removes it (Block 4): for the key's user and
        who manages it, an integration's key's for a holder of users or
        integrations; a key past its end date lives again, its session
        with it, once the date is moved later or removed (D6-A). A field
        left out keeps what the key has, and a body of none, or with
        another field, is 400. A session is 400, and so is an
        integration's key kept from the limit: it is always held to it.
        The settings file's key (from_settings in the list) is 409: it
        never ends, by the limit nor by a date, and is changed in the
        file (D3-A). The bearer that very key is 403: a key changes
        nothing of its own life, its end date included; a session made
        from it is not the key (D4-A). Audited as token.update.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {$ref: "#/components/parameters/name"}
        - {name: id, in: path, required: true, description: The token's id from the list, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                idle_exempt: {type: boolean}
                expires_at: {type: string, format: date-time, nullable: true, description: "The key's end date, in the future; null removes it"}
            example: {idle_exempt: true, expires_at: "2026-12-24T18:00:00Z"}
      responses:
        "200":
          description: The key as the list shows it
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Token"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: No such user, or no such live token of the user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: The token is the settings file's MASSIMO_API_TOKEN
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
    delete:
      summary: Revoke a session or an API key
      x-capability: users
      description: |
        A session made from a key goes with the key, and so do the keys
        the key made with itself as the bearer, and theirs (heirs; AP
        KeyLife, D5-A), with their sessions. The settings file's
        token (MASSIMO_API_TOKEN, from_settings in the list) is 409, as
        DELETE /api/v1/me/token answers it: it is changed or removed in
        the settings file, since the next start would not add it back.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {$ref: "#/components/parameters/name"}
        - {name: id, in: path, required: true, description: The token's id from the list, schema: {type: integer}}
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  id: {type: integer}
                  heirs: {$ref: "#/components/schemas/TokenHeirs"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: No such user, or no such live token of the user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: The token is the settings file's MASSIMO_API_TOKEN
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/users/{name}/identities:
    get:
      summary: A user's identities at the OpenID Connect providers
      x-capability: users
      description: |
        Each an e-mail at a provider, waiting for its first sign-in, or
        bound to the provider's subject, with what the provider said of
        the account at the last sign-in or link. A guests holder reaches a
        guest's it may change, an integrations holder an integration's
        user's; a user lists its own.
      parameters:
        - {$ref: "#/components/parameters/name"}
      responses:
        "200":
          description: The identities, by provider
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Identity"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NoUser"}
        "503": {$ref: "#/components/responses/NoStore"}
    post:
      summary: Assign an e-mail or a user id at a provider to a user
      x-capability: users
      description: |
        By email, a pre-link: the first sign-in through the provider with
        the e-mail, which the provider says it verified, binds the
        provider's subject to the user, and the subject alone finds it
        from then on. An e-mail waits once per provider (409). By subject,
        the user id at the provider, bound at once; one another identity
        at the provider has is 409.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {$ref: "#/components/parameters/name"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IdentityAdd"}
      responses:
        "201":
          description: Assigned
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Identity"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: No such user or provider
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: The e-mail already waits at the provider, or the user id is another identity's
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/users/{name}/identities/link/{key}:
    post:
      summary: Link the user's own account at a provider
      x-capability: users
      description: |
        The user's own only (403 for another's): a sign-in at the
        provider, as POST /api/v1/login/oidc/{key} starts one, whose
        callback keeps the account as a pending link and sends the page
        back with #oidc-link-confirm=<code>, which the routes under
        …/link/pending/{code} show, store or drop; or with
        #oidc-link-error=taken where another user has the account, group
        where it is in none of the groups the provider admits (failed
        where the provider's answer did not do). No session is made.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {$ref: "#/components/parameters/name"}
        - {name: key, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OIDCStart"}
      responses:
        "200":
          description: The provider's page to open
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OIDCStarted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: No such user, or no enabled provider of the key
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "502":
          description: The provider's discovery document cannot be read or does not do
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/users/{name}/identities/link/pending/{code}:
    parameters:
      - {$ref: "#/components/parameters/name"}
      - {name: code, in: path, required: true, description: "The code of #oidc-link-confirm=", schema: {type: string}}
    get:
      summary: A link come back, before it is stored
      x-capability: users
      description: |
        The user's own, from the address that started it, for ten minutes:
        the account at the provider and the user's identities at that
        provider the link would replace. Another user's code is 403, an
        unknown, used or old one 404.
      responses:
        "200":
          description: The pending link
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PendingLink"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: No link waits under the code
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
    post:
      summary: Store a link come back
      x-capability: users
      description: |
        Links the account to the user, replacing the user's other
        identities at the provider; the code is spent.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Identity"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: No link waits under the code
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: Another user has linked the account since
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
    delete:
      summary: Drop a link come back
      x-capability: users
      description: Nothing is stored; the code is spent.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
      responses:
        "200":
          description: Dropped
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: No link waits under the code
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/users/{name}/identities/{id}:
    put:
      summary: Change an identity no sign-in has used yet
      x-capability: users
      description: |
        Its e-mail, which makes it a waiting one, or the user id at the
        provider (subject), which makes it a bound one. One a sign-in used
        is removed and assigned again instead (409).
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {$ref: "#/components/parameters/name"}
        - {name: id, in: path, required: true, description: The identity's id from the list, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Either email or subject.
              additionalProperties: false
              properties:
                email: {type: string}
                subject: {type: string}
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Identity"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: No such user, or no such identity of the user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: A sign-in used it, or the e-mail or user id is another identity's at the provider
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
    delete:
      summary: Remove one of a user's identities
      x-capability: users
      description: |
        A user removes its own too, but not the last way it signs in: a
        bound identity where the user has no password and no other bound
        one (409). A manager removes any.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {$ref: "#/components/parameters/name"}
        - {name: id, in: path, required: true, description: The identity's id from the list, schema: {type: integer}}
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  id: {type: integer}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: No such user, or no such identity of the user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: The user's own last way to sign in
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/integrations/requests:
    post:
      summary: An integration asks to be registered
      x-capability: none
      description: |
        Without a key. Answers the request's id and a six-character code,
        which the integration shows and the owner compares before approving.
        A request waits ten minutes; at most five wait at once, an address
        asks at most ten times in ten minutes, and the setting
        integrations.requests off refuses requests (403).
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IntegrationRequest"}
      responses:
        "201":
          description: The request
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  code: {type: string}
                  expires_at: {type: string, format: date-time}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/integrations/requests/{id}:
    get:
      summary: An integration collects its key
      x-capability: none
      description: |
        With the request's code. 202 while the request waits; 200 with the
        key once approved, again with a new key (the one before revoked) as
        long as that key was never used and ten minutes since the approval
        have not passed; 410 once refused, expired or its key used.
      security: [{}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: code, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: The key, and the integration
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: {type: string}
                  integration: {$ref: "#/components/schemas/Integration"}
        "202": {description: The request waits for the owner}
        "404": {$ref: "#/components/responses/NotFound"}
        "410": {description: "Refused, expired, or its key collected and used"}
  /api/v1/integrations:
    get:
      summary: The integrations and the requests waiting
      x-capability: integrations
      responses:
        "200":
          description: Integrations, by name
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Integration"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/integrations/{uuid}/approve:
    post:
      summary: Approve a registration request
      x-capability: integrations
      description: |
        max_caps, the integration's maximum, within the role integration;
        all of it by default. attach, an integration of the same kind, makes
        the request that integration again, with its users, links and
        maximum. Either way the integration collects its key within ten
        minutes.
      parameters: [{$ref: "#/components/parameters/integrationUUID"}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                max_caps: {type: array, items: {type: string}}
                attach: {type: string}
      responses:
        "200":
          description: The integration
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Integration"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "410": {description: Not a request waiting}
  /api/v1/integrations/{uuid}/refuse:
    post:
      summary: Refuse a registration request
      x-capability: integrations
      parameters: [{$ref: "#/components/parameters/integrationUUID"}]
      responses:
        "200": {description: Refused}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "410": {description: Not a request waiting}
  /api/v1/integrations/{uuid}/accept-instance:
    post:
      summary: Accept the installation id last seen
      x-capability: integrations
      description: A call that came with another installation id than the accepted one was refused and recorded as pending_instance; this accepts it.
      parameters: [{$ref: "#/components/parameters/integrationUUID"}]
      responses:
        "200":
          description: The integration
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Integration"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/integrations/{uuid}:
    get:
      summary: An integration with its users
      x-capability: integrations
      description: |
        The integration and its users, the system user first. An
        unlinked user carries a proposal for a link: a Massimo user whose
        name or display name is the user's name at the integration.
      parameters: [{$ref: "#/components/parameters/integrationUUID"}]
      responses:
        "200":
          description: The integration
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Integration"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      summary: Change an integration
      x-capability: integrations
      parameters: [{$ref: "#/components/parameters/integrationUUID"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, maxLength: 64, description: "Its name as the owner gives it: its own user's display name, which the chain of each of its users begins with"}
                max_caps: {type: array, items: {type: string}}
                state: {type: string, enum: [active, disabled]}
      responses:
        "200":
          description: The integration
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Integration"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      summary: Revoke an integration
      x-capability: integrations
      description: Its key revoked and the integration disabled; its users, links and maximum stay, for a request from the same installation to be attached to it.
      parameters: [{$ref: "#/components/parameters/integrationUUID"}]
      responses:
        "200": {description: Revoked}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/integrations/found:
    get:
      summary: The installations of integrations seen on the LAN
      x-capability: integrations
      description: |
        What the last look at the LAN saw: Home Assistant's zeroconf
        records, looked for at the start and every 30 minutes by a server
        that announces itself. ?refresh=1 looks now (about two seconds).
        looks is false where the server does not look, and announce then
        says why: the setting announce, and why, the first that holds of
        fixed (-announce or MASSIMO_ANNOUNCE decides), restart (the stored
        setting announces from the next start), off (the setting is off)
        and loopback (auto, on a loopback address).
      parameters:
        - {name: refresh, in: query, schema: {type: string, enum: ["1"]}}
      responses:
        "200":
          description: The installations seen
          content:
            application/json:
              schema:
                type: object
                required: [found, looks]
                properties:
                  found:
                    type: array
                    items:
                      type: object
                      required: [kind, name, instance_id, address]
                      properties:
                        kind: {type: string}
                        name: {type: string}
                        instance_id: {type: string}
                        location: {type: string}
                        url: {type: string}
                        version: {type: string}
                        address: {type: string}
                        integration: {type: string, description: "The uuid of the integration or request of this installation id, if any"}
                  at: {type: string, format: date-time}
                  looks: {type: boolean}
                  announce:
                    type: object
                    description: Why the server does not look; only where looks is false
                    properties:
                      value: {type: string, enum: [auto, "on", "off"], description: "The setting announce stored, or auto"}
                      in_effect: {type: string, enum: ["off"]}
                      fixed_by: {type: string, description: "-announce or MASSIMO_ANNOUNCE, where one decides"}
                      why: {type: string, enum: [fixed, restart, "off", loopback]}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "502": {description: The LAN could not be asked}
  /api/v1/integrations/{uuid}/users/{id}:
    put:
      summary: Link an integration's user to a Massimo user
      x-capability: integrations
      description: |
        {"user": "<name>"} links the integration's user to a Massimo user:
        its calls then act as that user, within its role. {"user": null}
        unlinks it. Several of an integration's users may link to one
        user. The system user and a user of an integration are refused
        (400); the caller must outrank the user linked to (403).
      parameters:
        - {$ref: "#/components/parameters/integrationUUID"}
        - {name: id, in: path, required: true, schema: {type: string}, description: "The user's id at the integration, 32 hex digits"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user]
              properties:
                user: {type: string, nullable: true}
      responses:
        "200":
          description: Linked or unlinked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  linked: {type: boolean}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/providers:
    get:
      summary: The OpenID Connect providers
      x-capability: auth
      description: |
        Every provider, by key, its client secret never answered:
        has_secret says whether it has one. callback is the redirect URI's
        path under the page's address, to register at the provider.
      responses:
        "200":
          description: The providers
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Provider"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/NoStore"}
    post:
      summary: Add an OpenID Connect provider
      x-capability: auth
      description: |
        key, issuer and client_id are needed; the issuer is an https URL
        (http only on loopback) whose discovery document is under
        /.well-known/openid-configuration. Enabled unless enabled is false;
        an enabled one is saved only where that document is reached and
        names the issuer, one differing only by a trailing slash kept in
        the document's form (400 otherwise).
        auto_role, the role of the users a sign-in creates where
        auto_create is true, may not be owner nor hold an administrative
        capability (guests, users, passwords, roles, roles.disable,
        capabilities, cubes, settings, update, restart, reboot, audit,
        auth); viewer where absent.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderWrite"}
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Provider"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: A provider with the key exists
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/providers/{key}:
    put:
      summary: Change an OpenID Connect provider
      x-capability: auth
      description: |
        The fields given, as in POST; a field left out stays, the client
        secret too, and "" clears it. The key cannot be changed. A change
        of the issuer, or enabling, checks the issuer as POST does.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {name: key, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderWrite"}
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Provider"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
    delete:
      summary: Remove an OpenID Connect provider
      x-capability: auth
      description: The provider and every identity at it; no user signs in through it any more.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {name: key, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  key: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/roles:
    get:
      summary: The roles with their sets, and every capability
      x-capability: roles
      responses:
        "200":
          description: The default roles first, then the created ones by key; and the capabilities with whether each is disabled
          content:
            application/json:
              schema:
                type: object
                required: [roles, capabilities]
                properties:
                  roles:
                    type: array
                    items: {$ref: "#/components/schemas/Role"}
                  capabilities:
                    type: array
                    items: {$ref: "#/components/schemas/Capability"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
    post:
      summary: Create a role
      x-capability: roles
      parameters: [{$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RoleCreate"}
      responses:
        "201":
          description: The role
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Role"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: The key exists
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/roles/{key}:
    put:
      summary: Rename a role or change its set
      x-capability: roles
      description: Absent fields stay. owner cannot be changed (403).
      parameters: [{$ref: "#/components/parameters/roleKey"}, {$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RoleChange"}
      responses:
        "200":
          description: The role as changed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Role"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NoRole"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
    delete:
      summary: Remove a created role no user has
      x-capability: roles
      description: A default role cannot be removed (403); one with users is 409.
      parameters: [{$ref: "#/components/parameters/roleKey"}, {$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  key: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NoRole"}
        "409":
          description: The role still has users
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/roles/{key}/disabled:
    put:
      summary: Disable or enable a role
      x-capability: roles.disable
      description: A disabled role's users keep their login and are refused every route. owner cannot be disabled (403).
      parameters: [{$ref: "#/components/parameters/roleKey"}, {$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Disabled"}
      responses:
        "200":
          description: The role
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Role"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NoRole"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/capabilities:
    get:
      summary: Every capability, and whether it is disabled
      x-capability: capabilities
      responses:
        "200":
          description: The capabilities in the order of the table
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Capability"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/capabilities/{key}:
    put:
      summary: Disable or enable a capability
      x-capability: capabilities
      description: A disabled capability is denied to every role but owner, whatever the role's set says.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {name: key, in: path, required: true, description: The capability, schema: {type: string, example: pair}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Disabled"}
      responses:
        "200":
          description: The capability
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Capability"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: No such capability
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NoStore"}
  /api/v1/cubes:
    get:
      summary: List the Cubes
      x-capability: read
      description: The configured Cubes (configured true), then the Cubes discovery found that are not configured (configured false), while they answer - from the first answer to the end of the first complete run without one; after a restart, once a run has heard them. Each has backups, the number of backups the store keeps of it, which GET …/backups lists also for a found Cube.
      responses:
        "200":
          description: The Cubes
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - {$ref: "#/components/schemas/Cube"}
                    - {$ref: "#/components/schemas/FoundCube"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
    post:
      summary: Serve a Cube from now on
      x-capability: cubes
      description: |
        Adds a Cube to the store and starts serving it at once: one
        discovery found (its row becomes configured), or one given by
        serial. Without an address it follows discovery, starting at the
        address discovery saw last. Its proxy listens on proxy_address,
        or on :62910 when it is the only Cube and nothing else listens;
        with -proxy on serve's command line the listeners stay as they
        are. Needs the store.

        A Cube that was removed is added as new, a row of its own without
        the removed rows' history, unless restore names one of the removed
        rows its found entry lists (removed): that row is served again,
        with its settings, log, backups, rooms, commands and audit, and
        the body's other fields change its settings.
      parameters: [{$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/CubeChange"}
                - type: object
                  required: [serial]
                  properties:
                    serial: {type: string, example: KEQ0000000}
                    restore: {type: string, format: uuid, description: "The uuid of a removed row of the serial, from the found Cube's removed, to serve again with its history; absent: the Cube is added as new"}
      responses:
        "201":
          description: The Cube, now served
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cube"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: restore names no removed row of the serial
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: The Cube is served already, or restore is given for a serial that has a row that is not removed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503":
          description: The server has no store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/cubes/discover:
    post:
      summary: Look for Cubes on the LAN now
      x-capability: discover
      description: |
        UDP discovery, about three seconds. A call while a run is going
        waits for the run after it, which every call that came meanwhile
        shares: never a run begun before the call, so up to about six
        seconds. serve also runs it at the start
        and every -discover-interval (30 minutes), and at a Cube's loss
        and every minute until it is back. A Cube that is not
        configured is announced as a cube_found event on every Cube's
        stream when it first answers, and again when it answers after a
        complete run without it; not after a restart. A found Cube that
        does not answer a complete run leaves GET /api/v1/cubes. Each
        Cube is listed once, at its own address where a massimo proxy
        answers for it too; one configured by serial only keeps its
        address while that answers, else takes the proxy's, else its
        own, at most one move a run.
      parameters: [{$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "200":
          description: Every Cube that answered, configured or not
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Discovery"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503":
          description: The discovery port (UDP 23272, or the address of serve -discover-listen) is not available
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/cubes/{sn}:
    get:
      summary: One Cube with its configuration and rooms
      x-capability: read
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/devicesView"}]
      responses:
        "200":
          description: The Cube
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CubeDetail"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      summary: Change a Cube's configuration
      x-capability: cubes
      description: |
        Any of the fields; absent ones stay, unknown ones are refused.
        Written to the store (source becomes ui) and applied at once: a
        new address reconnects, a new proxy address or serial restarts
        that Cube's listener (not with -proxy on serve's command line),
        a new hidden list hides at once. An empty address makes the Cube
        follow discovery.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CubeChange"}
      responses:
        "200":
          description: The Cube as changed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cube"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The Cube is served for this run only (-addr or -sn) or has not reported its serial yet
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503":
          description: The server has no store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    delete:
      summary: Stop serving a Cube
      x-capability: cubes
      description: |
        The server stops the Cube's connection and proxy. Its row is
        removed and kept in the store with its history; discovery lists
        the Cube as found while it answers, with the removed row under
        removed, and POST /api/v1/cubes adds it again: as new, or with
        restore, the removed row with its history. A line for it in the
        settings file does not bring it back.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  serial: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The Cube is served for this run only (-addr or -sn)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503":
          description: The server has no store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/cubes/{sn}/rooms:
    get:
      summary: Rooms with their devices and states
      x-capability: read
      description: >-
        Each room with its uid (room_uid) and its devices as the view
        (devices) shows them; the virtual wall thermostat, where shown, is
        the room's first device.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/devicesView"}]
      responses:
        "200":
          description: Rooms
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Room"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/cubes/{sn}/devices:
    get:
      summary: Every device the Cube knows
      x-capability: read
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/devicesView"}]
      responses:
        "200":
          description: Devices in the Cube's order, then the virtual wall thermostats the view shows in the rooms' order; unlisted ones are paired but not in a room
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Device"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/cubes/{sn}/devices/{rf}:
    get:
      summary: One device with its configuration
      x-capability: read
      description: >-
        A real device, or a room's virtual wall thermostat, named by its
        address, its serial or room-<id>: then with the room's settings and
        week programme in a wall thermostat's shape, as GET
        …/rooms/{id}/config and …/program decide them by the room's one
        order (RoomMajority.D19-A), the offset a device's own (its real
        wall thermostat's, else the first of the order's), and its own
        settings.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/rf"}]
      responses:
        "200":
          description: The device
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeviceDetail"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      summary: Rename a device and/or move it to another room, or add a paired device to one
      x-capability: rename
      description: >-
        A move unlinks the device from its old room's partners and relinks
        it with the new room's, as the original software does, then writes
        the metadata. room_id 0 is refused. A device in no room yet
        (unlisted, for example just paired) needs room_id and is linked
        with the room's members (0x20 both ways, after a wakeup), given
        the room's group (0x22) and listed under name, without name under
        the default "<room name> <type> <n>" a repair's listing gives;
        without room_id it answers 409. A thermostat put into a room, by
        an add or a move, then gets the room's state and settings: 0x40
        to the device directly with the room's state from before the
        change, read before the device is linked and held for the room
        checks once a radiogram of the link half went through
        (RoomMajority.D8-A), auto on the programme where the room has
        none; 0x11 to the device and the room's thermostats the Cube
        holds a valid state for, 0x12, and 0x10 for each day of the
        programme that differs, then 0x11 again. The
        room's settings are decided by one rule, which the report and the
        configuration's repair take too (RoomMajority.D9): each group and
        each day what more than half of the room's other thermostats
        share, else what the first of the room's order has (master, wall
        thermostat, radiator thermostats), a thermostat the Cube holds no
        valid state for passed over; hidden devices are left out. The
        copy needs the capability configure as well (403 without it);
        copy false skips it, the device keeping its own state and
        settings. A discarded 0x40 sets mode_not_set and ends
        nothing; the room's state then goes once as a room command
        (room_mode, RoomMajority.D16-A), whose discard ends nothing
        either; any other command that fails ends the copy with its
        error, the device in the room.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/rf"}, {$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 32}
                room_id: {type: integer, minimum: 1, maximum: 255}
                copy:
                  type: boolean
                  default: true
                  description: With room_id, give the device the room's settings.
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  copied:
                    type: object
                    description: What of the room's state and settings was sent; present where the copy ran.
                    properties:
                      state:
                        type: object
                        description: "The state the 0x40 carried, the room's from before the change (RoomMajority.D8-A), auto on the programme where the room had none."
                        required: [mode]
                        properties:
                          mode: {type: string, enum: [auto, manual, vacation]}
                          setpoint: {type: number, description: "The setpoint, absent for auto on the week programme"}
                          until: {type: string, description: "A holiday's end, YYYY-MM-DD HH:MM"}
                      state_from:
                        type: string
                        enum: [room, default]
                        description: "Where the state came from: the room's from before the change, or Massimo's setpoint to the room since (room); auto on the programme where the room had none (default)."
                      config_skipped:
                        type: string
                        enum: [no_other_thermostat, no_valid_state]
                        description: "Why no configuration was sent: the room has no other thermostat, or the Cube holds no valid state for any other one (RoomMajority.D9); absent where it was sent."
                      temperatures:
                        type: array
                        description: The thermostats that got the room's temperatures (0x11); empty where none did.
                        items: {type: string, pattern: "^[0-9a-f]{6}$"}
                      valve: {type: boolean, description: The device got the room's valve settings (0x12).}
                      days: {type: integer, minimum: 0, maximum: 7, description: The days of the week programme sent (0x10).}
                      mode_not_set: {type: boolean, description: "The Cube discarded the 0x40 that sets the device's mode, the room's state; the device keeps its own."}
                      room_mode: {type: boolean, description: "After the discarded 0x40, the room's state went to the room as a room command, which the Cube took (RoomMajority.D16-A)."}
                  budget: {$ref: "#/components/schemas/Budget"}
                  confirmation: {type: string, enum: [pending], description: "The device went into a room: the server reads the change back from the Cube's free slots, and the log's structure event says when it is done."}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The device is paired but not assigned to a room
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "502": {$ref: "#/components/responses/CubeError"}
    delete:
      summary: Remove a device from the Cube
      x-capability: structure
      description: >-
        As the original software removed a device on 2026-11-15: a device
        in a room (the metadata's, else its C line's) is unlinked after a
        wakeup of the room, each other member whose error flag is set
        reset first (r:), by one 0x21 with the room flag naming it, to the
        first of the room's order (RoomMajority.D9): the room's master where
        it is a thermostat of the room, else its wall thermostat, else its
        first radiator thermostat, one the Cube holds no valid state for
        passed over, which every member takes; window contacts alone in
        the room get one each; hidden devices left out; no 0x23 and no 0x21 to the device itself; a
        device in room 255 by its C line is not unlinked. Then t: with
        the force flag, which makes the Cube send the device a factory
        reset; then the metadata without it, where it was listed. A device
        the metadata lists without a C line loses its entry alone. The
        server's copy forgets the device at once. A device that never
        answers stays in the Cube's memory and comes back, unlisted, with
        the next full read.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/rf"}, {$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  budget: {$ref: "#/components/schemas/Budget"}
                  confirmation: {type: string, enum: [pending], description: "The server reads the removal back from the Cube's free slots; the log's structure event says when it is done."}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502": {$ref: "#/components/responses/CubeError"}
        "503": {$ref: "#/components/responses/NotConnected"}
  /api/v1/cubes/{sn}/devices/{rf}/setpoint:
    put:
      summary: Set mode and setpoint of one thermostat
      x-capability: setpoint
      description: |
        A device in a room is addressed as its room, since the Cube
        discards a direct command to a room member; every thermostat of
        that room takes the setpoint. A device outside any room is
        addressed directly. The request waits for the Cube's answer, up
        to two minutes when the radio budget is exhausted.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/rf"}, {$ref: "#/components/parameters/idempotencyKey"}]
      requestBody: {$ref: "#/components/requestBodies/Setpoint"}
      responses:
        "200": {$ref: "#/components/responses/CommandResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Superseded"}
        "502": {$ref: "#/components/responses/CubeError"}
  /api/v1/cubes/{sn}/devices/{rf}/lock:
    put:
      summary: Lock or unlock the buttons of one thermostat
      x-capability: lock
      description: |
        The key lock ("LoC" on the display, `panel_locked` in the state).
        Radiogram 0x80, sent directly to the device after a wakeup of its
        room.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/rf"}, {$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locked]
              properties:
                locked: {type: boolean}
      responses:
        "200": {$ref: "#/components/responses/CommandResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Superseded"}
        "502": {$ref: "#/components/responses/CubeError"}
  /api/v1/cubes/{sn}/devices/{rf}/battery:
    post:
      summary: Mark new batteries in a device, whose battery level is then ok at once
      x-capability: configure
      description: |
        A device whose battery level is weak or low and whose battery flag
        is off, as the Cube shows it now (battery_low), is ok at once, not
        when the server's rules say so (a low one an hour after the flag
        went). Its battery event in the log says cause replaced in its
        summary, and who marked it in "by"; the server reads it back at a
        start, so that the level stays ok. Nothing goes to the Cube. A
        device already ok answers changed false.
      parameters:
        - {$ref: "#/components/parameters/sn"}
        - {$ref: "#/components/parameters/rf"}
        - {$ref: "#/components/parameters/idempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [replaced]
              additionalProperties: false
              properties:
                replaced: {type: boolean, enum: [true]}
      responses:
        "200":
          description: The level, the one before, and whether it changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  battery: {type: string, enum: [ok]}
                  from:
                    type: string
                    enum: [ok, weak, low]
                    description: The level before; ok where it did not change
                  changed: {type: boolean}
        "400":
          description: >-
            Another body than {"replaced": true}, a bad device, a virtual wall
            thermostat or the Cube itself, which have no batteries
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: >-
            The device's flag is still on: it has not reported its new
            batteries yet; or the Cube holds no current report of it, since
            the Cube's restart or for some minutes. Wait for its next report
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
  /api/v1/cubes/{sn}/rooms/{id}:
    put:
      summary: Rename a room
      x-capability: rename
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/id"}, {$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: true
