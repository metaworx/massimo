        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Superseded"}
        "502": {$ref: "#/components/responses/CubeError"}
  /api/v1/cubes/{sn}/rooms/{id}/program:
    get:
      summary: The week programme of the room
      x-capability: read
      description: >-
        Each day what more than half of the room's thermostats have, else
        the first of the room's one order's (its master, its wall
        thermostat, its radiator thermostats), one out of date passed over
        while every thermostat has reported since the Cube's restart and
        another is not out of date (RoomMajority.D9, D19-A); a programme
        written and not yet in the devices' configurations counts as
        written, pending. The tag covers every
        thermostat's programme of the room.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/id"}]
      responses:
        "200":
          description: Programme keyed by weekday, plus source (the first of the room's order whose week is the room's), its tag, pending and program_consistent
          headers:
            ETag: {description: "The programme's tag, quoted", schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProgramWithTag"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      summary: Write the week programme of the whole room
      x-capability: configure
      description: Any subset of days; one group radiogram 0x10 per day, which every thermostat of the room takes. With If-Match, a tag other than the current one (the programme changed since it was read, or a write to it is still on its way) is 412 with the current tag; without it the write is unconditional. The answer carries the new tag.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/id"}, {$ref: "#/components/parameters/idempotencyKey"}, {$ref: "#/components/parameters/ifMatch"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WeekProgram"}
      responses:
        "200": {$ref: "#/components/responses/CommandResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Superseded"}
        "412": {$ref: "#/components/responses/ProgramChanged"}
        "502": {$ref: "#/components/responses/CubeError"}
  /api/v1/cubes/{sn}/devices/{rf}/config:
    put:
      summary: Write a thermostat's settings
      x-capability: configure
      description: Every field optional, merged into the current configuration; 0x11 for temperatures, 0x12 for boost, descaling and valve limits, 0x82 for display_actual (wall thermostats), after a wakeup of the room.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/rf"}, {$ref: "#/components/parameters/idempotencyKey"}]
      requestBody: {$ref: "#/components/requestBodies/Config"}
      responses:
        "200": {$ref: "#/components/responses/CommandResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Superseded"}
        "502": {$ref: "#/components/responses/CubeError"}
  /api/v1/cubes/{sn}/devices/{rf}/program:
    get:
      summary: The week programme of one thermostat
      x-capability: read
      description: >-
        A room member's tag is its room's; a virtual wall thermostat's
        programme is its room's.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/rf"}]
      responses:
        "200":
          description: Programme keyed by weekday, plus source (the device it comes from), its tag, pending and program_consistent
          headers:
            ETag: {description: "The programme's tag, quoted", schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProgramWithTag"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      summary: Write the week programme of one thermostat
      x-capability: configure
      description: >-
        Directly to the device; a virtual wall thermostat's goes to its room. With If-Match, a tag other than the current one (the programme changed since it was read, or a write to it is still on its way) is 412 with the current tag; without it the write is unconditional. The answer carries the new tag.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/rf"}, {$ref: "#/components/parameters/idempotencyKey"}, {$ref: "#/components/parameters/ifMatch"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WeekProgram"}
      responses:
        "200": {$ref: "#/components/responses/CommandResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Superseded"}
        "412": {$ref: "#/components/responses/ProgramChanged"}
        "502": {$ref: "#/components/responses/CubeError"}
  /api/v1/cubes/{sn}/backup:
    get:
      summary: A backup file of the Cube
      x-capability: backup
      parameters:
        - {$ref: "#/components/parameters/sn"}
        - name: format
          in: query
          schema: {type: string, enum: [json, yaml], default: json}
      responses:
        "200":
          description: The backup, as massimo backup writes it
          content:
            application/json:
              schema: {type: object, description: "See internal/backup for the structure"}
            application/yaml:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/NotReady"}
  /api/v1/cubes/{sn}/backups:
    get:
      summary: The Cube's stored backups
      x-capability: backup
      description: |
        The backups the server keeps for the Cube in its store, newest
        first: taken by the server after a change of the Cube's
        configuration (auto), by hand (manual), by a restore before its
        first step (before_restore), and the file a restore was sent
        (upload). While the configuration differs from the newest
        backup's, changed says when it last changed and due when the
        automatic backup follows (backups.auto_min after the last change,
        at the latest backups.auto_max after the first). A Cube without a
        row in the store has no history (503).

        A Cube the store keeps a row of that no runtime serves (one taken
        out of the configuration, or only found by discovery) is listed
        too, without changed and due; its backups download, compare and
        delete as a served Cube's, while POST …/backups and the restore
        answer 409. GET /api/v1/backups/unserved lists such Cubes. A
        serial with neither is 404.
      parameters: [{$ref: "#/components/parameters/sn"}]
      responses:
        "200":
          description: The backups and the pending automatic one
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BackupList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/NotReady"}
    post:
      summary: Take a backup now
      x-capability: backup
      description: |
        A backup of the Cube as GET …/backup takes it, stored with the
        reason manual, the user and the note.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {$ref: "#/components/parameters/sn"}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: {type: string, maxLength: 200}
      responses:
        "201":
          description: The backup stored
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StoredBackup"}
        "400":
          description: A field other than note, or a note longer than 200 characters
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/NotServed"}
        "503": {$ref: "#/components/responses/NotConnected"}
  /api/v1/cubes/{sn}/backups/{id}:
    get:
      summary: A stored backup's file
      x-capability: backup
      description: The file as it was stored, or in the format asked for, as an attachment; also of a Cube that is not served (GET …/backups).
      parameters:
        - {$ref: "#/components/parameters/sn"}
        - {$ref: "#/components/parameters/backupID"}
        - name: format
          in: query
          description: The stored format when absent
          schema: {type: string, enum: [json, yaml]}
      responses:
        "200":
          description: The backup file
          content:
            application/json:
              schema: {type: object, description: "See internal/backup for the structure"}
            application/yaml:
              schema: {type: string}
        "400":
          description: A format other than json or yaml
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/NotReady"}
    delete:
      summary: Remove a stored backup
      x-capability: restore
      description: The backup leaves the history; the store keeps a tombstone without the file until the retention removes it. Also of a Cube that is not served (GET …/backups).
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {$ref: "#/components/parameters/sn"}
        - {$ref: "#/components/parameters/backupID"}
      responses:
        "204": {description: Removed}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/NotReady"}
  /api/v1/cubes/{sn}/backups/{id}/diff:
    get:
      summary: What differs between two stored backups
      x-capability: backup
      description: |
        The restore planner's comparison, read-only: the steps a restore
        of this backup would send to the Cube as the backup against
        recorded it (its raw lines and NTP servers), with the notes and
        the radio commands. Nothing is sent. The restore's options apply,
        so skip=clock leaves the clock out; hidden devices are not
        compared. Also of a Cube that is not served (GET …/backups), its
        row's hidden list applying.
      parameters:
        - {$ref: "#/components/parameters/sn"}
        - {$ref: "#/components/parameters/backupID"}
        - {name: against, in: query, required: true, description: The id of the backup to compare with, schema: {type: integer, minimum: 1}}
        - {$ref: "#/components/parameters/restorePortal"}
        - {$ref: "#/components/parameters/restoreState"}
        - {$ref: "#/components/parameters/restoreSkip"}
      responses:
        "200":
          description: The steps from the one to the other; none when they hold the same configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        what: {type: string}
                        radio: {type: boolean}
                        device: {type: string}
                        room: {type: integer}
                  notes: {type: array, items: {type: string}}
                  radio_commands: {type: integer}
        "400":
          description: No against, or a bad option
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/NotReady"}
  /api/v1/backups/unserved:
    get:
      summary: The Cubes not served that keep backups
      x-capability: backup
      description: |
        The Cube rows of the store that no runtime serves, that are not
        removed and keep at least one backup, by serial: one taken out of
        the configuration, or one only found by discovery, also while
        discovery does not hear it, which GET /api/v1/cubes then does not
        list. Their backups are listed, downloaded, compared and deleted
        through GET …/backups and its routes; they take no backup and no
        restore (409). The served Cubes are not in it, and a server
        without a store lists none.
      responses:
        "200":
          description: The Cubes not served that keep backups; empty where none does
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/UnservedCube"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
  /api/v1/cubes/{sn}/restore/plan:
    post:
      summary: What restoring a backup would send
      x-capability: restore
      description: |
        The dry run of massimo restore: the backup in the body (JSON or
        YAML, which may be edited by hand) is compared with the Cube and
        the steps a restore would send are answered, with the notes
        (devices to pair again), the radio commands and about what they
        cost in duty cycle (1.25 % each), the Cube's budget, and a hash
        of the plan that POST …/restore takes. Nothing is written. The
        clock group reads the Cube's NTP servers first; hidden devices
        are neither compared nor written. With backup=<id> the stored
        backup is the file, and the body is left empty. A Cube the store
        keeps a row of that no runtime serves is 409: a backup of it is
        put onto another Cube by downloading it (GET …/backups/{id}) and
        sending it to that Cube's restore.
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {$ref: "#/components/parameters/sn"}
        - {$ref: "#/components/parameters/restoreBackup"}
        - {$ref: "#/components/parameters/restorePortal"}
        - {$ref: "#/components/parameters/restoreState"}
        - {$ref: "#/components/parameters/restoreSkip"}
      requestBody: {$ref: "#/components/requestBodies/Backup"}
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RestorePlan"}
        "400":
          description: The backup cannot be read, is from another Cube or names none, or an option is bad
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/NotServed"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "503": {$ref: "#/components/responses/NotConnected"}
  /api/v1/cubes/{sn}/restore:
    post:
      summary: Restore a backup
      x-capability: restore
      description: |
        The same body and options as POST …/restore/plan, plus the hash
        that answered. The plan is computed again and, when the hash is
        the same, its steps are sent one after the other through the
        queue at low priority; each step is a restore_step event, the end
        a restore_done event, and GET …/restore shows the state. The
        restore stops at the first step the Cube refused or that failed.
        Guard rails: a restore already running on the Cube, a changed
        plan, and radio commands while the duty cycle is above 80 %
        answer 409. A Cube with a row in the store keeps a backup of its
        configuration before the first step (before_restore; 503 when it
        cannot be stored) and the file of the body (upload).
      parameters:
        - {$ref: "#/components/parameters/idempotencyKey"}
        - {$ref: "#/components/parameters/sn"}
        - {name: plan, in: query, required: true, description: The hash from POST …/restore/plan, schema: {type: string}}
        - {$ref: "#/components/parameters/restoreBackup"}
        - {$ref: "#/components/parameters/restorePortal"}
        - {$ref: "#/components/parameters/restoreState"}
        - {$ref: "#/components/parameters/restoreSkip"}
      requestBody: {$ref: "#/components/requestBodies/Backup"}
      responses:
        "202":
          description: The restore runs; follow it on the event stream or with GET
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  steps: {type: integer, description: Steps to send}
        "400":
          description: No plan hash, or what the plan request refuses with 400
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: A restore is running, the plan has changed since it was made (both hashes in the message), the duty cycle is above 80 % and the plan has radio commands (the percentage in the message), or the Cube is not served (as POST …/restore/plan)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "503": {$ref: "#/components/responses/NotConnected"}
    get:
      summary: The last restore of the Cube
      x-capability: read
      parameters: [{$ref: "#/components/parameters/sn"}]
      responses:
        "200":
          description: The last restore since the server started, or {"state":"none"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RestoreState"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/cubes/{sn}/repair/reset:
    get:
      summary: Preview the reset of every communication error of the Cube
      x-capability: repair
      description: |
        One r: per device of the Cube whose error flag (byte 5's 0x08, the
        communication error) is set, the hidden ones left out: the Cube's
        bookkeeping, at no radio cost. Nothing to send where no device is flagged. The
        run reads the device list about two seconds later and names the
        devices still flagged (still_flagged).
        The preview sends nothing: the lines a run would send and what they
        cost, and the plan's hash for the run.
      parameters: [{$ref: "#/components/parameters/sn"}]
      responses:
        "200": {$ref: "#/components/responses/RepairPreview"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NotConnected"}
    post:
      summary: Reset every communication error of the Cube
      x-capability: repair
      description: |
        Runs what the preview of the same path showed, once the plan it
        computes again has the preview's hash.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/repairPlan"}, {$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "200": {$ref: "#/components/responses/RepairRun"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/RepairRefused"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "502": {$ref: "#/components/responses/RepairStopped"}
        "503": {$ref: "#/components/responses/NotConnected"}
  /api/v1/cubes/{sn}/rooms/{id}/repair/reset:
    get:
      summary: Preview the reset of the communication errors of a room
      x-capability: repair
      description: |
        One r: per device whose C line names the room and whose error flag
        is set, at no radio cost; as the Cube's reset, for the room.
        The preview sends nothing: the lines a run would send and what they
        cost, and the plan's hash for the run.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/id"}]
      responses:
        "200": {$ref: "#/components/responses/RepairPreview"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NotConnected"}
    post:
      summary: Reset the communication errors of a room
      x-capability: repair
      description: |
        Runs what the preview of the same path showed, once the plan it
        computes again has the preview's hash.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/id"}, {$ref: "#/components/parameters/repairPlan"}, {$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "200": {$ref: "#/components/responses/RepairRun"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/RepairRefused"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "502": {$ref: "#/components/responses/RepairStopped"}
        "503": {$ref: "#/components/responses/NotConnected"}
  /api/v1/cubes/{sn}/rooms/{id}/repair/master:
    get:
      summary: Preview naming a thermostat of the room as its master
      x-capability: repair
      description: |
        Where the metadata's master of the room is no thermostat whose C line
        names the room, the metadata is written with the room's wall
        thermostat as master, else its first radiator thermostat, one the
        Cube holds no valid state for passed over while another is not (the
        room's order without its master, RoomMajority.D9, in place of
        AP DeviceUnPairingFix, D167); metadata only, no radio. Nothing to send where
        the master is valid or the room has no thermostat.
        The preview sends nothing: the lines a run would send and what they
        cost, and the plan's hash for the run.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/id"}]
      responses:
        "200": {$ref: "#/components/responses/RepairPreview"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NotConnected"}
    post:
      summary: Name a thermostat of the room as its master
      x-capability: repair
      description: |
        Runs what the preview of the same path showed, once the plan it
        computes again has the preview's hash.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/id"}, {$ref: "#/components/parameters/repairPlan"}, {$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "200": {$ref: "#/components/responses/RepairRun"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/RepairRefused"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "502": {$ref: "#/components/responses/RepairStopped"}
        "503": {$ref: "#/components/responses/NotConnected"}
  /api/v1/cubes/{sn}/rooms/{id}/repair/relink:
    get:
      summary: Preview the re-link of a room, adding only
      x-capability: repair
      description: |
        For each member that takes part in links (thermostats and window
        contacts, by their C lines), after a wakeup of the room, the
        placement's link half: one 0x20 with the room flag naming it to the
