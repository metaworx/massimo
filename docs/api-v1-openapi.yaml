        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The room still has devices
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "502": {$ref: "#/components/responses/CubeError"}
  /api/v1/cubes/{sn}/rooms/{id}/setpoint:
    put:
      summary: Set mode and setpoint of a whole room
      x-capability: setpoint
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/id"}, {$ref: "#/components/parameters/idempotencyKey"}]
      requestBody: {$ref: "#/components/requestBodies/Setpoint"}
      responses:
        "200": {$ref: "#/components/responses/CommandResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: >-
            The room has no thermostat, or a newer command for the room
