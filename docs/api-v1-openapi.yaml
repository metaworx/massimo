        one to the member for each partner, then 0x22. Nothing is
        unlinked. The room's flagged members are reset first. Nothing to send where the
        room's list and its C lines disagree (place or list the devices
        first) or fewer than two members take part in links. Read back as
        a structure change (the log's device change).
        The preview sends nothing: the lines a run would send and what they
        cost, and the plan's hash for the run.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/id"}]
      responses:
        "200": {$ref: "#/components/responses/RepairPreview"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NotConnected"}
    post:
      summary: Re-link a room, adding only
      x-capability: repair
      description: |
        Runs what the preview of the same path showed, once the plan it
        computes again has the preview's hash.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/id"}, {$ref: "#/components/parameters/repairPlan"}, {$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "200": {$ref: "#/components/responses/RepairRun"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/RepairRefused"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "502": {$ref: "#/components/responses/RepairStopped"}
        "503": {$ref: "#/components/responses/NotConnected"}
  /api/v1/cubes/{sn}/devices/{rf}/repair/config:
    get:
      summary: Preview re-sending a thermostat's configuration from its room
      x-capability: repair
      description: |
        The room's temperatures (comfort, eco, maximum, minimum, window
        open) and week programme by the C lines of its thermostats, the
        device's included, as the report of members that differ names
        them (RoomMajority.D9, the copy's rule): each day and the
        temperatures what more than half of them share, else what the
        first of the room's order has, a thermostat the Cube holds no
        valid state for passed over; where the device's differ, the days
        that differ (0x10), then 0x11 with the device's own offset and
        window-open minutes. Nothing to send where the room has no other
        thermostat the Cube holds a valid state for, the device has the
        room's configuration already, or its list and C line name
        different rooms.
        The preview sends nothing: the lines a run would send and what they
        cost, and the plan's hash for the run.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/rf"}]
      responses:
        "200": {$ref: "#/components/responses/RepairPreview"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NotConnected"}
    post:
      summary: Re-send a thermostat's configuration from its room
      x-capability: repair
      description: |
        Runs what the preview of the same path showed, once the plan it
        computes again has the preview's hash.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/rf"}, {$ref: "#/components/parameters/repairPlan"}, {$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "200": {$ref: "#/components/responses/RepairRun"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/RepairRefused"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "502": {$ref: "#/components/responses/RepairStopped"}
        "503": {$ref: "#/components/responses/NotConnected"}
  /api/v1/cubes/{sn}/devices/{rf}/repair/place:
    get:
      summary: Preview placing a device in the room the metadata lists
      x-capability: repair
      description: |
        Where the device's C line names another room than the metadata, or
        none: a move from its C line's room (the removal's unlink half with
        0x23 and the placement's link half), or the link half alone from
        none. The metadata stays; the room's settings are not copied, but a
        thermostat's run holds the room's state from before it for the room
        checks once its link half went through, as an add does
        (RoomMajority.D15-A). Nothing
        to send where the list does not list the device or has it where the Cube
        has it, or a second wall thermostat.
        The preview sends nothing: the lines a run would send and what they
        cost, and the plan's hash for the run.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/rf"}]
      responses:
        "200": {$ref: "#/components/responses/RepairPreview"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NotConnected"}
    post:
      summary: Place a device in the room the metadata lists
      x-capability: repair
      description: |
        Runs what the preview of the same path showed, once the plan it
        computes again has the preview's hash.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/rf"}, {$ref: "#/components/parameters/repairPlan"}, {$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "200": {$ref: "#/components/responses/RepairRun"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/RepairRefused"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "502": {$ref: "#/components/responses/RepairStopped"}
        "503": {$ref: "#/components/responses/NotConnected"}
  /api/v1/cubes/{sn}/devices/{rf}/repair/list:
    get:
      summary: Preview listing a device where its C line has it
      x-capability: repair
      description: |
        Metadata only, no radio: the device's entry moved to the room its C
        line names, or one made for a device the list does not have. A room
        the list does not have is made with room_name, its master the
        room's wall thermostat, else its first radiator thermostat, as the
        repair of a room's master names it; without
        the name the preview asks for it (details code room_name_needed and room).
        A device the list does not have gets the name name gives, else
        "<room name> <type> <n>", the type in English and n the lowest
        number no device of the room takes in a name of that form, and
        "<type> <n>" where that would pass 32 bytes; details name,
        room_name and type say which.
        The preview sends nothing: the lines a run would send and what they
        cost, and the plan's hash for the run.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/rf"}, {$ref: "#/components/parameters/repairRoomName"}, {$ref: "#/components/parameters/repairDeviceName"}]
      responses:
        "200": {$ref: "#/components/responses/RepairPreview"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NotConnected"}
    post:
      summary: List a device where its C line has it
      x-capability: repair
      description: |
        Runs what the preview of the same path showed, once the plan it
        computes again has the preview's hash.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/rf"}, {$ref: "#/components/parameters/repairRoomName"}, {$ref: "#/components/parameters/repairDeviceName"}, {$ref: "#/components/parameters/repairPlan"}, {$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "200": {$ref: "#/components/responses/RepairRun"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/RepairRefused"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "502": {$ref: "#/components/responses/RepairStopped"}
        "503": {$ref: "#/components/responses/NotConnected"}
  /api/v1/cubes/{sn}/rooms/{id}/repair/unlink-relink:
    get:
      summary: Preview unlinking every link of a room and re-linking it
      x-capability: repair
      description: |
        Needs structure as well as repair. For each member that takes part
        in links, after a wakeup of the room, the 0x21s of a move's unlink
        half without its 0x23: one with the room flag naming it to the
        room's addressee, one to each window contact among its partners,
        one to the member for each partner; then the re-link of every
        member, as POST …/repair/relink. Not yet run on hardware
        (untested): a run that stops halfway leaves the room's devices
        without their partners until it is run again.
        The preview sends nothing: the lines a run would send and what they
        cost, and the plan's hash for the run.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/id"}]
      responses:
        "200": {$ref: "#/components/responses/RepairPreview"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/RepairRefused"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503": {$ref: "#/components/responses/NotConnected"}
    post:
      summary: Unlink every link of a room, then re-link it
      x-capability: repair
      description: |
        Runs what the preview of the same path showed, once the plan it
        computes again has the preview's hash.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/id"}, {$ref: "#/components/parameters/repairPlan"}, {$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "200": {$ref: "#/components/responses/RepairRun"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/RepairRefused"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "502": {$ref: "#/components/responses/RepairStopped"}
        "503": {$ref: "#/components/responses/NotConnected"}
  /api/v1/cubes/{sn}/reboot:
    post:
      summary: Reboot the Cube (UDP R), which drops the radiograms it has not delivered
      x-capability: cubes.reboot
      description: |
        Sends R to the Cube's port 23272: the Cube restarts, is gone for
        about a minute and takes a connection again, as one that still holds
        an old connection (link stale) does only after up to about 40
        minutes. A restart drops the radiograms the Cube has not delivered,
        and its rooms refuse commands for a while; so, while radiograms are
        pending as the Cube last said, the request names the count it
        accepts, and the server never reboots a Cube by itself. The link is
        rebooting until the Cube's greeting, three minutes at most.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                pending: {type: integer, minimum: 0, description: The pending radiograms the caller accepts to drop; needed while any are pending}
      responses:
        "202":
          description: R sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: {type: boolean}
                  answered: {type: boolean, description: "The Cube answered within a second; on the box of a serve without its discovery port the answer goes elsewhere"}
                  status: {type: integer, nullable: true, description: "The answer's status: 2, restarting; null without an answer"}
        "400":
          description: The body is not JSON
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: More radiograms are pending than the request accepts, or the Cube's serial or address is not known yet
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "502":
          description: R could not be sent
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/cubes/{sn}/refresh:
    post:
      summary: Read the Cube again at once, by a new connection; nothing goes by radio
      x-capability: restart
      description: |
        The reconnect of the periodic refresh (refresh_interval), at once:
        the server ends its connection to the Cube and connects again, and
        the Cube's greeting replaces what the server holds of it, its rooms,
        its devices with their state and battery flags, and its budget. It
        goes through the Cube's queue after the commands before it, sends
        nothing by radio and takes no memory slot. The request waits for the
        new greeting, a minute at most once its turn has come. No body.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "200":
          description: The new greeting has replaced the snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  budget: {$ref: "#/components/schemas/Budget"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The Cube reboots (link rebooting), its serial or address is not known yet, or a newer refresh took the request's place before its turn
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "502":
          description: "The reconnect failed: no greeting within the minute, as from a Cube not reachable or held by another client (link busy), or a lost connection still held (link held)"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/cubes/{sn}/pairing:
    post:
      summary: Start pairing (inclusion mode)
      x-capability: pair
      description: |
        Sends n:<seconds> to the Cube. Devices that join are reported as
        "paired" events on the stream and in the state, and appear in the
        device list as unlisted; PUT /devices/{rf} with room_id puts one
        into a room. 255 seconds is the longest a Cube keeps the mode;
        the Cube may end it earlier on its own.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                seconds: {type: integer, minimum: 1, maximum: 255, default: 60}
      responses:
        "200":
          description: Pairing runs
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PairingState"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Pairing is already running
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "502": {$ref: "#/components/responses/CubeError"}
        "503": {$ref: "#/components/responses/NotReady"}
    get:
      summary: Pairing state and the devices that joined
      x-capability: read
      parameters: [{$ref: "#/components/parameters/sn"}]
      responses:
        "200":
          description: The state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PairingState"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      summary: Stop pairing
      x-capability: pair
      description: Sends x:, also when the server counts the mode as over already.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "200":
          description: Pairing stopped
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PairingState"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502": {$ref: "#/components/responses/CubeError"}
  /api/v1/cubes/{sn}/log:
    get:
      summary: A page of the Cube's events, oldest first
      x-capability: read
      description: |
        The events the stream sends, kept in the store for log.keep_days
        (30 by default, 0 for ever), each with its id, the server's own
        among every Cube's; without parameters the newest 200 at info
        and above. A client pages back with before set
        to the id of the oldest event it has, until a page is empty, and
        follows the log with after set to the id of the newest it has
        (the feature log_after; an older server ignores after): each
        event once, in the order the log kept them. A cursor older than
        the oldest event kept starts at the oldest kept. A state event's
        stored copy leaves out state.received. A Cube without a row in
        the store keeps its last 500 events in memory, each with an id of
        the server's counter, which starts at the server's start in
        microseconds.
      parameters:
        - {$ref: "#/components/parameters/sn"}
        - {name: after, in: query, description: "An event's id for the page after it: the first limit events after that one, oldest first; 0 for the log's start. With every other parameter, before and since as further bounds", schema: {type: integer, minimum: 0, example: 4711}}
        - {name: before, in: query, description: "An event's id for the page before it, or an RFC 3339 time for the events before that time", schema: {type: string, example: "4711"}}
        - {name: since, in: query, description: "An RFC 3339 time for the events at or after it, not after a before time: the start of a range, not a cursor (after is)", schema: {type: string, format: date-time, example: "2026-11-06T20:00:00Z"}}
        - {name: limit, in: query, schema: {type: integer, default: 200, minimum: 1, maximum: 1000}}
        - {name: kind, in: query, description: "Only events of this kind: state, config, connected, …", schema: {type: string, example: state}}
        - {name: source, in: query, description: "Only events of this source: a device's, the Cube's own, the server's own jobs, a change of the configuration, the queue's (a command's steps, its holds), the server's sign-ins, the LAN proxy's", schema: {type: string, enum: [device, cube, system, config, queue, server, proxy]}}
        - {name: level, in: query, description: "Only events of this level and above; info by default", schema: {type: string, enum: [debug, info, warn, error], default: info}}
        - {name: device, in: query, description: "Only events of this device, by its serial number or its radio address, also one the Cube no longer has", schema: {type: string, pattern: "^([0-9a-fA-F]{6}|[A-Za-z]{3}[0-9]{7})$", example: MEQ0000101}}
        - {name: user, in: query, description: "Only events this user started, by the login name, a removed user's too: those started with its rights (effective_user) or by it (real_user); a name the server does not know answers an empty page", schema: {type: string, example: anna}}
        - {name: command, in: query, description: "Only the events of this command (GET /api/v1/commands/{id}): its attempt, a discard and a retry, its outcome", schema: {type: integer, minimum: 1, example: 42}}
      responses:
        "200":
          description: Events as the stream sends them, each with its id in the log; those only a user with audit sees (sign-ins, lockouts) for such a user alone
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: integer, description: "The event's place in the log, the cursor of before and after: its row in the store, or for a Cube without a row a number of the server's counter"}
                    kind: {type: string}
                    device: {type: string, description: The device's radio address}
                    serial: {type: string, description: "The device's serial number, also before it has a state and after it is gone; the Cube's for its own configuration"}
                    source: {type: string, enum: [device, cube, system, config, queue, server, proxy], description: "Whose the event is: a device's, the Cube's own, the server's own jobs, a change of the configuration, the queue's, the server's sign-ins, the LAN proxy's"}
                    level: {type: string, enum: [debug, info, warn, error]}
                    summary: {type: object, description: "What a line holds in short: a connection's devices, rooms, firmware, duty_cycle_pct, free_memory_slots, cause and down_for_s; a hello's budget; a list's rooms and devices; a configuration's main values"}
                    list_changes:
                      type: array
                      description: A metadata event's differences of the room and device list
                      items:
                        type: object
                        properties:
                          what: {type: string, enum: [room_added, room_renamed, room_deleted, device_added, device_renamed, device_moved, device_left]}
                          room: {type: integer}
                          name: {type: string}
                          from: {type: string}
                          to: {type: string}
                          device: {type: string}
                          serial: {type: string}
                    changes: {type: object, description: "A state event's or a config event's differences, by name: {from, to}"}
                    while_disconnected: {type: boolean, description: What a connection's greeting found changed while the Cube was disconnected or the server down}
                    command: {type: integer, description: "The command the event belongs to (GET /api/v1/commands/{id}); absent for none, and once the command is pruned"}
                    by:
                      type: object
                      description: Who started it, the user whose rights it had, as the user is named now; absent for the Cube, the server's own jobs and a server without users
                      properties:
                        name: {type: string}
                        display_name: {type: string}
                    effective_user: {$ref: "#/components/schemas/RowUser"}
                    real_user: {$ref: "#/components/schemas/RowUser"}
                    time: {type: string, format: date-time}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/LogCursorBeyond"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/log:
    get:
      summary: A page of every Cube's events, oldest first
      x-capability: read
      description: |
        Every Cube's log at once, as GET /api/v1/cubes/{sn}/log gives one
        Cube's: the same parameters and events, each Cube's event with the
        Cube's serial number in cube_serial, the server's own once and
        without it. Pages go back by id across the Cubes, and forward with
        after. A radio address as device names the device of that address
        on every Cube; a serial number names one device. A Cube without a
        row in the store yet adds nothing; without a store, the Cubes'
        last 500 events each, merged by id, which they take from the
        server's one counter.
      parameters:
        - {name: after, in: query, description: "An event's id for the page after it: the first limit events after that one, oldest first; 0 for the log's start. With every other parameter, before and since as further bounds", schema: {type: integer, minimum: 0, example: 4711}}
        - {name: before, in: query, description: "An event's id for the page before it, or an RFC 3339 time for the events before that time", schema: {type: string, example: "4711"}}
        - {name: since, in: query, description: "An RFC 3339 time for the events at or after it, not after a before time: the start of a range, not a cursor", schema: {type: string, format: date-time, example: "2026-11-06T20:00:00Z"}}
        - {name: limit, in: query, schema: {type: integer, default: 200, minimum: 1, maximum: 1000}}
        - {name: kind, in: query, description: "Only events of this kind: state, config, connected, …", schema: {type: string, example: state}}
        - {name: source, in: query, description: "Only events of this source", schema: {type: string, enum: [device, cube, system, config, queue, server, proxy]}}
        - {name: level, in: query, description: "Only events of this level and above; info by default", schema: {type: string, enum: [debug, info, warn, error], default: info}}
        - {name: device, in: query, description: "Only events of this device: by its serial number, or by its radio address on every Cube", schema: {type: string, pattern: "^([0-9a-fA-F]{6}|[A-Za-z]{3}[0-9]{7})$", example: MEQ0000101}}
        - {name: user, in: query, description: "Only events this user started, by the login name: with its rights or by it", schema: {type: string, example: anna}}
        - {name: command, in: query, description: "Only the events of this command", schema: {type: integer, minimum: 1, example: 42}}
      responses:
        "200":
          description: Events as GET /api/v1/cubes/{sn}/log gives them, each Cube's with cube_serial
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties:
                    id: {type: integer, description: "The event's place in the log, the cursor of before and after: its row in the store, or without a store a number of the server's counter"}
                    cube_serial: {type: string, description: "The serial number of the Cube whose event it is; absent for the server's own", example: KEQ0000100}
                    kind: {type: string}
                    device: {type: string, description: The device's radio address on its Cube}
                    serial: {type: string, description: "The device's serial number; the Cube's for its own configuration"}
                    source: {type: string, enum: [device, cube, system, config, queue, server, proxy]}
                    level: {type: string, enum: [debug, info, warn, error]}
                    time: {type: string, format: date-time}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/LogCursorBeyond"}
        "429": {$ref: "#/components/responses/LockedOut"}
  /api/v1/log/alerts:
    get:
      summary: The log's warnings and errors that nothing has settled yet
      x-capability: read
      description: |
        Every Cube's and the server's warnings and errors that no later
        event has settled: a disconnect by the next connect, a command by
        the same command acknowledged, a failed backup by the next one;
        a hold and a lockout once they end; a kind without a counterpart
        only by a mark. A device's communication error and link error are
        alerts at warn while the device has them, at the state line that
        set them; its battery is one by its level, the battery event at
        low, settled by the next at ok, not by the Cube's flag. The audit's
        lines for a holder of audit only.
        A Cube without a row in the store adds nothing; without a store,
        none.
      parameters:
        - {name: after, in: query, description: "An event's id: only the alerts after it", schema: {type: integer, minimum: 0, example: 4711}}
      responses:
        "200":
          description: The alerts, newest first, and the worst level
          content:
            application/json:
              schema:
                type: object
                properties:
                  level: {type: string, enum: ["", warn, error], description: "The worst of the alerts; empty for none"}
                  alerts:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer, description: The line's id in the log}
                        kind: {type: string}
                        level: {type: string, enum: [warn, error]}
                        cube_serial: {type: string, description: "The Cube whose line it is; absent for the server's own"}
                        device: {type: string, description: The device's radio address on its Cube}
                        serial: {type: string}
                        flag: {type: string, enum: [error, link_error], description: "The device's flag, for a state line"}
                        failed_radiogram:
                          description: "The error flag's: of the radiograms that failed while it stayed set, the most severe (Assignment and Remove, then Configuration, then Control, then the rest), of two as severe the oldest"
                          allOf: [{$ref: "#/components/schemas/FailedRadiogram"}]
                        time: {type: string, format: date-time}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
  /api/v1/cubes/{sn}/events:
    get:
      summary: Server-sent events for connection and state changes
      x-capability: read
      description: |
        On connect, one `state` event per device with its current data,
        then an event per change the Cube reports. Kinds: connected,
        disconnected (once per loss of the connection, not at each retry),
        hello, metadata, config, state, battery (a device's battery
        level changed; cause replaced in "summary" and who in "by" where
        someone marked new batteries), wall_reset (a wall thermostat back from a silence
        on another mode, at warn), error_reset (the server reset the
        communication error of a device that reported while flagged, once a
        day at most: the room of its C line and automatic in "summary"),
        error_watch (a device's flags watched, "what" in "summary": back,
        at warn, its communication error back within a day of its
        automatic reset, which holds further automatic resets until it
        stays clear a day; lasting, at error, the communication error or
        the link error set for 24 hours; clear, at info, such a flag clear
        again),
        pairing_started,
        paired (with the device that joined in "paired"), pairing_ended,
        device_forgotten (a device deleted from the Cube left the server's
        copy; its "state" is the device as the server knew it), cube_found (with a Cube that is not configured in "cube"),
        restore_step and restore_done (with the progress of a restore in
        "restore", see POST …/restore), notification (with what the
        stream's user is told in "notification", on that user's streams
        alone); the server's own, source system:
        server_started, server_stopping, settings_read, restart, reboot,
        reboot_cancelled, update, update_result, update_postponed, backup, backup_deleted,
        backups_pruned, log_pruned, audit_pruned, log_rotated, restore_started,
        open_setup (at warn: what was set up before the first regular user
        and still works, with the user and its role in "summary", see
        OpenSetup); a Cube's own:
        address_changed, cube_gone; a change made through the API, source
        config: change, with the action, target, set, changes and subject in
        "summary" and who in "by"; the queue's, source queue: command (a
        step of the command named in "command": its state queued, sent,
        acknowledged, retried, dropped or failed) and hold (the radio
        commands waiting); structure, source cube (a removal, placement or
        move read back from the Cube's free slots: action, outcome,
        before, free_slots, minutes, held or no_reading, flagged,
        link_error in "summary"); unconfirmed, source device (a write its
        devices do not show in time: write (setpoint, lock, display, config,
        program), target, room, source, expected,
        outcome not_confirmed at warn with minutes, confirmed and devices,
        or confirmed_late at info with seconds, and a room setpoint's
        re-send: resent with duty_pct, free_slots and program, not_resent
        with why (superseded, changed, busy, boost, today), resend_failed
        at warn, resend_confirmed with confirmed and seconds, or
        resend_not_confirmed at warn as not_confirmed, in "summary"); slots, source cube (the Cube's memory
        slots held for an hour with nothing of the server's in flight,
        fewer than 5 free at warn, fewer than 2 at error, and free again,
        at info: state low, full or free, from for a step, free_slots,
        since, full_since in "summary"); mismatch, source cube (a C line and the room
        list, or a room's members, that differ, at warn, and agree again,
        at info: state found or cleared and the Mismatch's fields in
        "summary"); the room checks' (docs/api-v1.md, "The
        room checks"): disagree, source cube (a room whose thermostats
        differ: room and outcome differ, resent (from massimo, majority,
        newest, master, wall_thermostat or radiator_thermostat, and
        before_change true for the state from before a structure change),
        resend_failed, not_resent or agree in "summary")
        and drift, source device (a thermostat off
        its week programme: outcome not_following, follows or left_auto);
        the server's sign-ins, source server, for a
        user with audit alone: login, login_failed, locked_out; the LAN
        proxy's, source proxy: proxy_connected, proxy_disconnected,
        proxy_refused, proxy_discarded, proxy_deleted, proxy_delete_refused,
        proxy_pairing, proxy_warning. A state
        event after a device's first one has "changes": per changed value
        of state, {"from": …, "to": …} (null for a value the device did not
        have), and "reported" when the Cube gained or lost its state. A
        device's event carries its radio address in "device", its serial
        number in "serial" and "source": device, or cube for the Cube's own
        configuration. A comment line
        every 30 seconds keeps the stream alive. Browsers open it
        without headers: pass a ticket from POST …/events/ticket.
        Every event carries an id, "<epoch>-<number>"; the connection's
        state events none but the last, which carries the newest. A client
        that reconnects with the last id it read, in Last-Event-ID or
        last_event_id, gets the events since and no state burst; an id the
        server no longer holds gets a resync event, then the state burst.
        A client that falls behind is sent what is queued, then the stream
        ends. The view (devices) says which devices' events the stream
        carries: a virtual wall thermostat has a state event whenever its
        computed state changes, right after the member's that changed it,
        and a device_forgotten when its room is gone.
      security:
        - bearer: []
        - ticket: []
        - token: []
        - {}
      parameters:
        - {$ref: "#/components/parameters/sn"}
        - {name: ticket, in: query, description: Single-use ticket from POST …/events/ticket, schema: {type: string}}
        - {name: last_event_id, in: query, description: "The last event id the client read, to resume after it; Last-Event-ID wins where both are given", schema: {type: string}}
        - {$ref: "#/components/parameters/devicesView"}
        - {name: Last-Event-ID, in: header, description: "The last event id the client read, as a browser's retry sends it", schema: {type: string}}
        - {name: token, in: query, deprecated: true, description: "The API token itself; deprecated, it ends up in URLs and logs. Answered with the header Deprecation: @1793836800 (RFC 9745)", schema: {type: string}}
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/cubes/{sn}/events/ticket:
    post:
      summary: A single-use ticket that opens the event stream
      x-capability: read
      description: |
        Valid for one connection to this Cube's event stream within a
        minute, so that the token never goes into a URL.
      parameters: [{$ref: "#/components/parameters/sn"}]
      responses:
        "200":
          description: The ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: {type: string}
                  expires_at: {type: string, format: date-time}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/settings:
    get:
      summary: The server's settings
      x-capability: settings
      description: |
        Every setting with the store's value (or the default), the
        default, whether the store holds one, the value this run uses
        (a serve flag wins for one run) and when a change applies;
        node.id and tenant.id are read-only.
      responses:
        "200":
          description: The settings by key
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {$ref: "#/components/schemas/Setting"}
              example:
                stale_after: {value: 50h, default: 50h, set: false, in_effect: 50h, applies: now}
                stale_after_wall: {value: 24h, default: 24h, set: false, in_effect: 24h, applies: now}
                commands.keep_days: {value: "0", default: "0", set: false, in_effect: "0", applies: now}
                log.keep_days: {value: "30", default: "30", set: false, in_effect: "30", applies: now}
                audit.keep_days: {value: "365", default: "365", set: false, in_effect: "365", applies: now}
                backups.auto_min: {value: "60", default: "60", set: false, in_effect: "60", applies: now}
                backups.auto_max: {value: "120", default: "120", set: false, in_effect: "120", applies: now}
                backups.keep_days_auto: {value: "90", default: "90", set: false, in_effect: "90", applies: now}
                backups.keep_days_manual: {value: "365", default: "365", set: false, in_effect: "365", applies: now}
                backups.keep_newest: {value: "10", default: "10", set: false, in_effect: "10", applies: now}
                auth.key_idle_days: {value: "0", default: "0", set: false, in_effect: "0", applies: now}
                auth.password_login: {value: "true", default: "true", set: false, in_effect: "true", applies: now}
                integrations.requests: {value: "true", default: "true", set: false, in_effect: "true", applies: now}
                auth.keep_open: {value: "false", default: "false", set: false, in_effect: "false", applies: now}
                auth.password_reveal: {value: "true", default: "true", set: false, in_effect: "true", applies: now}
                announce: {value: auto, default: auto, set: false, in_effect: "off", applies: restart}
                update.channel: {value: alpha, default: alpha, set: false, in_effect: alpha, applies: now}
                update.auto: {value: "off", default: "off", set: false, in_effect: "off", applies: now}
                update.auto_window: {value: "03:00-05:00", default: "03:00-05:00", set: false, in_effect: "03:00-05:00", applies: now}
                poll_interval: {value: 10s, default: 10s, set: false, in_effect: 10s, applies: restart}
                node.id: {value: 01a1ae5a-6bee-7ed4-bb4e-3baa2c43fe55, set: true, read_only: true}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503":
          description: The server has no store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    put:
      summary: Change settings
      x-capability: settings
      description: |
        An object of keys and values: stale_after and
        stale_after_wall (1h to 720h, the radiator and the wall
        thermostats' stale thresholds, 50h and 24h by default, applying
        at once), poll_interval (10s to 1h, 10s by default),
        refresh_interval (10m to 168h, or 0 for off),
        discover_interval (1m to 24h, or 0 for only on request) and
        duty_wait (1m to 1h, 10m by default, how long radio commands wait
        at a used-up duty cycle before the budget is read again), the
        intervals at the next start;
        window_warn_after and window_alert_after (1m to 24h, the alert not
        under the warning, at once), how long a window may stay open; the whole
        numbers, auth.key_idle_days among them (0 to 3650, 0 by default
        for off: an API key unused for that many days ends, its session
        with it, at once; a key kept from it and the settings file's key
        never do); auth.password_login, true or false, whether POST
        /api/v1/login takes a password (off, the users sign in by OPAQUE
        alone); integrations.requests, true or false, whether
        integrations may ask to be registered; auth.keep_open, true or
        false, whether a server without regular users is kept open on
        purpose, so that the web UI does not ask for the first owner (it
        changes nothing about who is let in, counts only while the server
        has no regular users, and goes with the first regular user, not
        with an integration's; true is 409 on a server with regular
        users); auth.password_reveal, true or false, whether the web UI's
        password fields offer their eye (true by default; GET /healthz says
        it before anyone signs in); announce, auto, on or off,
        the announcement on the LAN at the next start; update.channel, devel, nightly, alpha, beta, rc or stable,
        the releases the box takes (its own flavour's and every more
        stable one's; the default is the build's flavour); update.auto, off
        or night, whether the box installs a release itself, inside the
        window update.auto_window, HH:MM-HH:MM in the server's time, at
        least 30 minutes, its end past midnight allowed (03:00-05:00 by
        default); null goes back to the default. Every value is checked before any is written. The
        answer is that of GET.
      parameters: [{$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                nullable: true
                oneOf:
                  - {type: string}
                  - {type: integer}
                  - {type: boolean}
            example: {stale_after: 36h, refresh_interval: null}
      responses:
        "200":
          description: The settings by key, as GET
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {$ref: "#/components/schemas/Setting"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: auth.keep_open switched on where the server has users
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503":
          description: The server has no store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/system:
    get:
      summary: The server, how it was installed, the computer it runs on and the caller's address
      x-capability: read
      description: |
        What System settings → System Info shows. Beside the version, the
        start and the certificate, which /healthz gives anyone, how the
        server was installed, the operating system, the host's name and the
        caller's address as the server sees it (the client a trusted proxy
        names).
      responses:
        "200":
          description: The server and its computer
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemInfo"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
  /api/v1/update:
    get:
      summary: The newest signed release on the update channel
      x-capability: read
      parameters:
        - {name: refresh, in: query, description: Ask GitHub now instead of reusing a check of the last ten minutes, schema: {type: string}}
      responses:
        "200":
          description: Versions and whether an update can be started
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UpdateInfo"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
    post:
      summary: Ask the update helper to install the newest release
      x-capability: update
      description: |
        Needs a configured API token even where the other routes are open.
        The helper (massimo-update.service, root) verifies the release
        signature and checksum, replaces the binary, restarts the server and
        rolls back if the new version does not come up.
      parameters: [{$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "202":
          description: Requested; follow the progress with GET
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  requested: {type: string, description: The release tag that is newest now}
                  channel: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "403":
          description: The caller's role lacks update, no API token configured, no update helper, or the reason GET's blocked gives (a package manager, a job object on Windows, a listen address the helper cannot ask, a development build)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: Up to date, no release on the channel, or an update is running
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "502":
          description: The release check failed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/update/answer:
    put:
      summary: Answer the question of the automatic update, for the box
      x-capability: update
      description: |
        Where automatic updates are on (the setting update.auto at night)
        and an update is due, GET /api/v1/update says ask; the answer is
        the box's, kept in the setting update.answer. now starts the update
        at once, as POST /api/v1/update does; tonight ends the question for
        the version, which the night installs; skip holds the version back
        from the night, and the question with it, until a newer release is
        out. tonight and skip need automatic updates on. Audited as
        update.answer, a line of the log under Configuration.
      parameters: [{$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, answer]
              properties:
                version: {type: string, description: "The version asked about, latest of GET /api/v1/update"}
                answer: {type: string, enum: [now, tonight, skip]}
      responses:
        "200":
          description: Kept (tonight, skip); the answer is that of GET /api/v1/update
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UpdateInfo"}
        "202":
          description: Install now requested, as POST /api/v1/update answers
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  requested: {type: string}
                  channel: {type: string}
        "400":
          description: Not a version and an answer
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: The caller's role lacks update; for now, as POST /api/v1/update refuses
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: "Not the version offered, automatic updates off (tonight, skip), or as POST /api/v1/update refuses (now)"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503":
          description: The server has no store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/restart:
    get:
      summary: Whether the server can be restarted from here, and who starts it again
      x-capability: restart
      responses:
        "200":
          description: The restart's state for this caller
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RestartInfo"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
    post:
      summary: Restart the server through the service manager that runs it
      x-capability: restart
      description: |
        The server stops as on SIGTERM once the answer is written, and its
        service manager starts it again: systemd, launchd or Homebrew on the
        exit status 75, the Windows service manager through massimo restart.
        GET /healthz then reports a new started_at. An open server (no users,
        or no token without a store) takes it only from the box itself.
      parameters: [{$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "202":
          description: The restart has begun
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  by: {type: string, enum: [systemd, launchd, windows, exit]}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "403":
          description: The caller's role lacks restart, another site's page sent it, or an open server was asked from elsewhere than the box
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: No service manager would start the server again, the restart is switched off, one is under way, or an update is running
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          description: The restart could not be started, such as the Windows helper
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/reload:
    post:
      summary: Read the settings file again at once, as SIGHUP does
      x-capability: restart
      description: |
        Reads the settings file again and applies MASSIMO_API_TOKEN at once, as
        SIGHUP does, and rotates the log file and checkpoints the store,
        whatever the read finds; every other setting that changed applies at
        the next start. The server also reads the file by itself within
        seconds of a change. A setting the next start would refuse is not
        refused here: refused says it, as GET /api/v1/restart does until a
        read finds nothing refused. Sends nothing to a Cube, so a retry is
        harmless.
      responses:
        "200":
          description: What reading the file again found
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReloadResult"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "409":
          description: The server reads no settings file
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          description: >-
            The settings file could not be read, and no setting changed, though
            the log file was rotated and the store checkpointed; the log's
            settings_read is a warning where it does not parse, or is there but
            cannot be read
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/reboot:
    get:
      summary: Whether the server can reboot the computer it runs on from here, and who does
      x-capability: reboot
      responses:
        "200":
          description: The reboot's state for this caller
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RebootInfo"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
    post:
      summary: Reboot the computer the server runs on, after a delay
      x-capability: reboot
      description: |
        Needs the owner's switch (MASSIMO_REBOOT=on in the settings file, or
        serve -allow-reboot) and, on Linux and macOS, the root helper that
        massimo install -reboot-helper installs; the Windows service reboots
        by itself. The server waits the delay, then asks the helper; the
        system stops the server as at every shutdown. DELETE takes back a
        reboot that still waits. An open server (no users, or no token
        without a store) takes it only from the box itself.
      parameters: [{$ref: "#/components/parameters/idempotencyKey"}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                delay: {type: integer, minimum: 0, maximum: 3600, default: 60, description: Seconds until the reboot}
      responses:
        "202":
          description: The reboot waits its delay
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  by: {type: string, enum: [systemd, launchd, windows]}
                  at: {type: string, format: date-time, description: When the reboot is asked for}
        "400":
          description: The body is not JSON, or the delay is not 0 to 3600 seconds
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "403":
          description: The caller's role lacks reboot, another site's page sent it, or an open server was asked from elsewhere than the box
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: The server cannot reboot its computer, the reboot is switched off, no helper is installed, a reboot waits or has begun, a restart is under way, or an update is running
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    delete:
      summary: Take back a reboot that waits
      x-capability: reboot
      parameters: [{$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "200":
          description: The reboot is taken back
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "403":
          description: The caller's role lacks reboot, or an open server was asked from elsewhere than the box
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: No reboot waits, or the reboot has begun
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/store:
    get:
      summary: The store as massimo store info shows it
      x-capability: settings
      responses:
        "200":
          description: The store's file, schema, identities and rows per table
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StoreInfo"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503":
          description: The server has no store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/config:
    get:
      summary: The settings in effect, as massimo config shows them
      x-capability: settings
      description: |
        A key's, an IV's, a token's or a password's value never leaves the
        server: the variable is listed with secret true and no value. So is
        a name Massimo does not know, with unknown true, since it may hold a
        secret under a name the rule misses, MASSIMO_API_TOKEN_OLD.
      responses:
        "200":
          description: The settings in effect
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConfigView"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "503":
          description: The server does not show its settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: >-
        A session or an API key of a user of the store, which names the
        user whose role grants the capabilities (x-capability on each
        operation; update and reboot each include restart,
        docs/api-v1.md "Authentication"); without a store,
        the one token of MASSIMO_API_TOKEN or -token. Required once a
        user exists, or a token is set. Ten failed checks from one
        address within a minute lock it out for five minutes (429).
    ticket:
      type: apiKey
      in: query
      name: ticket
      description: The event stream only; a single-use ticket from POST …/events/ticket.
    token:
      type: apiKey
      in: query
      name: token
      description: The event stream only, deprecated; the API token itself.
  parameters:
    prefKey:
      name: key
      in: path
      required: true
      description: "A preference's key: 1 to 32 of lower-case letters, digits, _ . -, starting with a letter; the web UI uses ui and schemes"
      schema: {type: string, example: ui}
    sn:
      name: sn
      in: path
      required: true
      description: Cube serial number, case-insensitive
      schema: {type: string, example: KEQ0000200}
    rf:
      name: rf
      in: path
      required: true
      description: "The device: its serial number, case-insensitive, or its radio address, six hex digits; a serial the Cube does not have is 404, radio address 000000 (no device's) is 400. A room's virtual wall thermostat also by room-<id>"
      schema: {type: string, pattern: "^([0-9a-fA-F]{6}|[A-Za-z]{3}[0-9]{7}|[Rr][Oo][Oo][Mm]-[0-9]{1,3})$", example: "MEQ0000101"}
    integrationUUID:
      name: uuid
      in: path
      required: true
      description: An integration's or a registration request's uuid
      schema: {type: string}
    ifMatch:
      name: If-Match
      in: header
      description: The tag of the programme the write is based on, as GET returned it (quoted, W/ allowed; * matches any)
      schema: {type: string}
    devicesView:
      name: devices
      in: query
      description: >-
        Which devices a list shows. default: every real device, and the
        virtual wall thermostat of each room without a real wall thermostat;
        real: the real devices only; virtual: every virtual wall thermostat,
        and no real wall thermostat; all: both. Any other value is 400.
      schema: {type: string, enum: [default, real, virtual, all], default: default}
    id:
      name: id
      in: path
      required: true
      description: Room number as the Cube assigns it
      schema: {type: integer, minimum: 1, maximum: 255}
    repairPlan:
      name: plan
      in: query
      required: true
      description: The plan's hash from the repair's preview (GET of the same path)
      schema: {type: string}
    repairRoomName:
      name: room_name
      in: query
      description: The name of a room the Cube's list does not have, to list the device there as a new room
      schema: {type: string}
    repairDeviceName:
      name: name
      in: query
      description: "The name of a device the Cube's list does not have, 1 to 32 bytes; without it, \"<room name> <type> <n>\". A device the list has keeps its name"
      schema: {type: string}
    restorePortal:
      name: portal
      in: query
      description: Also restore the portal URL and whether the Cube polls it; off unless given (?portal or ?portal=true)
      allowEmptyValue: true
      schema: {type: boolean, default: false}
    restoreState:
      name: state
      in: query
      description: Also re-apply each thermostat's mode and setpoint from the backup's state; off unless given
      allowEmptyValue: true
      schema: {type: boolean, default: false}
    restoreBackup:
      name: backup
      in: query
      description: A stored backup's id (GET …/backups), in place of the file in the body
      schema: {type: integer, minimum: 1}
    backupID:
      name: id
      in: path
      required: true
      description: A stored backup's id, from GET …/backups
      schema: {type: integer, minimum: 1}
    restoreSkip:
      name: skip
      in: query
      description: "Groups to leave alone, comma separated: names, settings, programs, clock"
      schema: {type: string, example: "names,clock"}
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        A key of the client's choice, at most 128 characters, kept per user
        for 24 hours: a retry with the same key answers what the first
        request answered, with the header Idempotent-Replayed: true, and
        sends nothing to the Cube; the same key with another request is
        422, one whose request is still running 409, and one whose request
        the server's restart cut off 503.
      schema: {type: string, maxLength: 128}
    name:
      name: name
      in: path
      required: true
      description: A user's login name, case does not matter
      schema: {type: string, example: anna}
    roleKey:
      name: key
      in: path
      required: true
      description: A role's key
      schema: {type: string, example: operator}
  requestBodies:
    Backup:
      required: false
      description: Left empty with backup=<id>; else a backup file as GET …/backup or massimo backup writes it, which may be edited by hand; at most 1 MB. A body that does not start with a brace is read as YAML whatever the Content-Type.
      content:
        application/json:
          schema: {type: object, description: "See internal/backup for the structure"}
        application/yaml:
          schema: {type: string}
        text/yaml:
          schema: {type: string}
    Config:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ConfigWrite"}
    Setpoint:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Setpoint"}
          examples:
            manual: {value: {mode: manual, temp: 21}}
            auto: {value: {mode: auto}}
            vacation: {value: {mode: vacation, temp: 17, until: "2026-11-10 12:00"}}
            boost: {value: {mode: boost}}
  responses:
    RepairPreview:
      description: What a run would send and what it costs; nothing was sent
      content:
        application/json:
          schema: {$ref: "#/components/schemas/RepairPlan"}
    RepairRefused:
      description: >-
        A run with nothing to send (what its preview's nothing says: no
        device flagged, the room's list and C lines disagree, no other
        thermostat with a valid state to take a configuration from),
        whose plan changed since its
        preview (both hashes in the message), or that would reach the
        queue's hold for the duty cycle or the memory slots (its preview's
        refused). A listing into a room the list does not have carries
        code room_name_needed and the room.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: {type: string}
              code: {type: string, enum: [room_name_needed]}
              room: {type: integer}
    RepairRun:
      description: The Cube accepted every line of the repair
      content:
        application/json:
          schema: {$ref: "#/components/schemas/RepairResult"}
    RepairStopped:
      description: The Cube discarded a line or the connection failed; the steps say how far the repair got
      content:
        application/json:
          schema: {$ref: "#/components/schemas/RepairResult"}
    ProgramChanged:
      description: The programme changed since its tag was read, or a write to it is still on its way
      headers:
        ETag: {description: "The current tag, quoted", schema: {type: string}}
      content:
        application/json:
          schema:
            type: object
            properties:
              error: {type: string}
              etag: {type: string}
    CommandResult:
      description: The Cube accepted the command
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: {type: boolean}
              discarded: {type: boolean, description: Always false on 200; a discarded command answers 502}
              budget: {$ref: "#/components/schemas/Budget"}
              confirmation: {type: string, enum: [pending, confirmed], description: "A setpoint, a key lock or a display mode: pending until the devices' states show it (the devices' and the room's confirmation, the log's unconfirmed line after five minutes); a configuration or a week programme until their configurations show it (the line after the last re-read, about six minutes). Confirmed where each shows it already. Absent for other writes"}
    BadRequest:
      description: Bad input
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    LogCursorBeyond:
      description: >-
        The cursor after is beyond the log's newest event, one the log
        never gave out: a store restored from an older copy (the prune
        keeps the log's newest event and never makes one), a restart
        without a store on a clock set back, the cursor of a Cube's events
        kept in memory once the Cube has its row.
        The error says to reload the log: the client reads it again
        without after.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: Missing or wrong token
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: >-
        The token's user may not do this: the capability the route needs
        is not in the user's role, or the user or the role is disabled.
        The message says which.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    LockedOut:
      description: >-
        Too many failed token checks from this address (ten within a
        minute); every request from it is refused for five minutes.
      headers:
        Retry-After:
          description: Seconds until the lockout ends
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NoSignedInUser:
      description: No user is signed in (an open server, or the API token), so there is no one to keep preferences for
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NoStore:
      description: The server has no store (serve -addr), so no users
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Busy:
      description: >-
        Too many password checks at once (one a core, at most four, and
        eight waiting); try again after Retry-After.
      headers:
        Retry-After:
          description: Seconds to wait before trying again
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NoStoreOrBusy:
      description: >-
        The server has no store (serve -addr), so no users; or it is
        checking too many passwords at once, with Retry-After.
      headers:
        Retry-After:
          description: Seconds to wait before trying again, when busy
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NoUser:
      description: No such user
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NoRole:
      description: No such role
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Unknown Cube, device or room
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Superseded:
      description: A newer command for the same target replaced this one before it was sent
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    CubeError:
      description: >-
        The Cube discarded the command or the connection failed. A room
        command discarded because the Cube holds no state for some
        members (they have not reported since the Cube restarted) also
        carries `no_state`.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotReady:
      description: The Cube has not sent its greeting yet
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotServed:
      description: "The store keeps a row of the Cube, but no runtime serves it: it takes no backup and no restore; its stored backups can still be listed, downloaded, compared and deleted"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotConnected:
      description: The Cube is not connected
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    TooLarge:
      description: The body is over the limit (1 MB for a backup)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    StoredBackup:
      type: object
      required: [id, taken_at, reason, format, size, sha256]
      properties:
        id: {type: integer}
        taken_at: {type: string, format: date-time}
        reason: {type: string, enum: [auto, manual, before_restore, upload]}
        format: {type: string, enum: [json, yaml]}
        tool: {type: string, description: The software that wrote the file}
        size: {type: integer, description: Bytes of the file}
        sha256: {type: string}
        user: {type: string, description: Who asked; absent for the server's own}
        note: {type: string}
    UnservedCube:
      type: object
      description: A Cube row of the store that no runtime serves and that keeps backups, as GET /api/v1/backups/unserved lists it
      required: [serial, backups, newest]
      properties:
        serial: {type: string, example: KEQ0000000}
        name: {type: string, description: The row's name; absent where it has none}
        backups: {type: integer, description: The backups kept}
        newest: {type: string, format: date-time, description: When the newest backup was taken}
    BackupList:
      type: object
      required: [backups]
      properties:
        backups:
          type: array
          items: {$ref: "#/components/schemas/StoredBackup"}
        changed: {type: string, format: date-time, description: When the configuration last changed against the newest backup; absent when it did not}
        due: {type: string, format: date-time, description: When the automatic backup follows; absent when none is due}
    Preference:
      type: object
      properties:
        key: {type: string, example: ui}
        value: {description: The JSON document as stored}
        updated_at: {type: string, format: date-time}
        version: {type: integer, description: Counts the writes of the key; a later write wins}
    PushSubscription:
      type: object
      required: [id, endpoint, label, created_at, failures, current]
      properties:
        id: {type: integer}
        endpoint: {type: string}
        label: {type: string, example: Firefox on the phone}
        created_at: {type: string, format: date-time}
        last_ok_at: {type: string, format: date-time, description: The last message the push service took; absent before the first}
        failures: {type: integer, description: Failed deliveries since then}
        current: {type: boolean, description: Made with the caller's session or key}
    CommandState:
      type: string
      enum: [queued, sent, acknowledged, failed, dropped]
      description: >-
        queued, the request is running and nothing went to the Cube yet;
        sent, a step went to the Cube, or the request was answered 202
        and its run goes on; acknowledged, answered 2xx (a step: the Cube
        accepted it); failed, answered 5xx (a step: the send failed);
        dropped, answered 4xx or 503, nothing sent (a step: superseded,
        discarded by the Cube, or the server stopped).
    Command:
      type: object
      properties:
        id: {type: string, format: uuid}
        action: {type: string, description: As the audit names it}
        target: {type: string}
        cube: {type: string, description: The Cube's serial}
        user: {type: string, description: The login name of who asked}
        state: {$ref: "#/components/schemas/CommandState"}
        status: {type: integer, description: The HTTP status answered; absent while running}
        request: {type: object, description: "The method, the path, the query and a hash of the body"}
        result: {type: object, description: "The answer's body; for a restore, the run's id, state and counts"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        steps:
          type: array
          description: The engine commands of the request, in order
          items: {$ref: "#/components/schemas/CommandStep"}
        audit:
          description: The request's audit row, for a caller with audit; absent for a proxy client's command, which has none
          allOf: [{$ref: "#/components/schemas/AuditEntry"}]
    CommandStep:
      type: object
      properties:
        id: {type: string, format: uuid}
        target: {type: string, description: "device:0a010d or room:6"}
        state: {$ref: "#/components/schemas/CommandState"}
        request: {type: object, description: "The queue key, the priority, the number of lines and of radio lines, the wakeup, the room"}
        result: {type: object, description: "discarded, the budget the Cube reported, the error, answers (the Cube's answer to each line, in order, up to the first failure) and discarded_line (the line the Cube discarded)"}
        created_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
    AuditEntry:
      type: object
      properties:
        id: {type: integer}
        time: {type: string, format: date-time}
        user: {type: string, description: "The login name of the user whose rights it had; absent for no authentication, a failed login or the command line"}
        effective_user: {$ref: "#/components/schemas/RowUser"}
        real_user: {$ref: "#/components/schemas/RowUser"}
        token_id: {type: integer, description: The session or key used}
        remote: {type: string, description: "The client's address, or cli"}
        action: {type: string, description: "setpoint, room.config, device.update, cube.add, user.add, login, login.failed, …", example: setpoint}
        cube: {type: string, description: "The Cube's serial, for a Cube's route"}
        target: {type: string, description: "device:0a010d, room:6, user:anna, role:night, token:4, cube:KEQ0000000", example: "room:6"}
        detail:
          type: object
          description: >-
            The method, the path, the status, the milliseconds, the body's size and, when JSON and short, the body
            with password, current_password, token, record, proof, login, ke1 and ke3 removed, and the error of a failed answer. A request refused
            for a known user keeps no body. Requests refused before anyone is known are one row per address and
            minute, without their bodies: the first one's method, path and status, the count of requests within
            the minute, the count of each status in statuses, and the time of the last.
        result: {type: string, enum: [ok, refused, failed]}
        command_id: {type: integer, description: "The command the request is, when it is one"}
    UserCreate:
      type: object
      required: [name]
      properties:
        name: {type: string, description: "The login name: 1 to 64 of letters, digits, '.', '_', '-' and '@', case does not matter", example: anna}
        display_name: {type: string, maxLength: 64}
        role: {type: string, description: "A role's key; viewer when absent, owner for the first owner"}
        password: {type: string, minLength: 8, maxLength: 64, description: "8 to 64 characters, Unicode code points as sent, without the user's or the server's name. Absent for a user with keys only, and an empty one counts as absent; this or record for the first owner"}
        record: {type: string, description: "A password of auth_version 2 in place of password: the registration record, base64url (POST /api/v1/users/{name}/register)"}
        ksf: {type: string, description: "The record's key stretching, as the registration answered it: m=<KiB>,t=<passes>,p=<lanes>", example: "m=19456,t=2,p=1"}
        disabled: {type: boolean}
        expires_at: {type: string, format: date-time, description: "Guests: disabled from then on"}
    UserChange:
      type: object
      properties:
        display_name: {type: string, maxLength: 64}
        role: {type: string}
        disabled: {type: boolean}
        expires_at: {type: string, format: date-time, nullable: true, description: null clears the end date}
        password: {type: string, description: "Empty removes the password; any other has 8 to 64 characters, Unicode code points as sent, without the user's or the server's name"}
        current_password: {type: string, description: "Required when a user sets its own password, unless proof is given"}
        record: {type: string, description: "A password of auth_version 2 in place of password: the registration record, base64url"}
        ksf: {type: string, description: "The record's key stretching: m=<KiB>,t=<passes>,p=<lanes>", example: "m=19456,t=2,p=1"}
        proof: {type: string, description: "A proof of the current password from POST /api/v1/login/finish with the purpose proof, in place of current_password"}
    Role:
      type: object
      required: [key, builtin, disabled, users, created_at, updated_at]
      properties:
        key: {type: string}
        name: {type: string, description: The display name; empty shows the key's translated default}
        builtin: {type: boolean, description: "One of the six default roles, which keep their keys"}
        disabled: {type: boolean}
        capabilities:
          type: array
          description: The role's set, sorted; every capability for owner
          items: {type: string}
        users: {type: integer, description: Users with this role}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RoleCreate:
      type: object
      required: [key]
      properties:
        key: {type: string, description: "1 to 32 of letters, digits, '_' and '-', starting with a letter; lower case", example: night}
        name: {type: string, maxLength: 64}
        capabilities:
          type: array
          items: {type: string}
    RoleChange:
      type: object
      properties:
        name: {type: string, maxLength: 64}
        capabilities:
          type: array
          description: Replaces the set
          items: {type: string}
    Capability:
      type: object
      required: [key, disabled]
      properties:
        key: {type: string, example: pair}
        disabled: {type: boolean, description: Denied to every role but owner}
    Disabled:
      type: object
      required: [disabled]
      properties:
        disabled: {type: boolean}
    Login:
      type: object
      required: [user, password]
      properties:
        user: {type: string, description: The login name; case does not matter}
        password: {type: string}
        label: {type: string, maxLength: 64, description: Names the session under the user's tokens; the User-Agent when absent}
        login:
          type: string
          description: >-
            A sign-in by OPAQUE for the name, started from this address, that the client could not finish:
            this request takes it over, so that the attempt counts once, and answers upgrade for a user still of
            auth_version 1
    LoginStart:
      type: object
      required: [user, ke1]
      properties:
        user: {type: string, description: The login name; case does not matter}
        ke1: {type: string, description: "The client's KE1, 96 bytes, base64url without padding"}
        purpose: {type: string, enum: [proof], description: A proof of the password in place of a session}
    LoginStarted:
      type: object
      properties:
        login: {type: string, description: The identifier to finish under}
        ke2: {type: string, description: "The server's KE2, 320 bytes, base64url without padding"}
        ksf: {type: string, description: "The key stretching to run: argon2id m=<KiB>,t=<passes>,p=<lanes>", example: "m=19456,t=2,p=1"}
        v1: {type: boolean, description: The box takes POST /api/v1/login as well}
        expires_at: {type: string, format: date-time, description: A minute from now}
    LoginFinish:
      type: object
      required: [login, ke3]
      properties:
        login: {type: string}
        ke3: {type: string, description: "The client's KE3, 64 bytes, base64url without padding"}
        label: {type: string, maxLength: 64, description: Names the session under the user's tokens; the User-Agent when absent}
    Provider:
      type: object
      required: [key, name, issuer, client_id, has_secret, secret_lost, scopes, auto_create, auto_role, groups_claim, enabled, callback, created_at, updated_at]
      properties:
        key: {type: string}
        name: {type: string, description: On the sign-in button; the key shows where empty}
        issuer: {type: string, example: "https://cloud.example.com"}
        client_id: {type: string}
        has_secret: {type: boolean, description: The client secret is set; it is never answered}
        secret_lost: {type: boolean, description: "The client secret is set and sealed, and the key of opaque.key does not open it: it is to be entered again"}
        scopes: {type: string, example: openid email profile}
        auto_create: {type: boolean, description: A sign-in without an identity creates the user}
        auto_role: {type: string, description: "The role of a user created so, viewer by default"}
        auto_domains: {type: array, items: {type: string}, description: The e-mail domains it creates users for; none for any}
        groups_claim: {type: string, description: "The claim of the account's groups, groups by default"}
        allowed_groups: {type: array, items: {type: string}, description: "The groups it admits: an account in none of them neither signs in nor links; none for any"}
        enabled: {type: boolean}
        callback: {type: string, description: "The redirect URI's path under the page's address", example: api/v1/login/oidc/callback}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProviderWrite:
      type: object
      additionalProperties: false
      properties:
        key: {type: string, description: "In POST: 1 to 32 of lower-case letters, digits, _ and -, starting with a letter"}
        name: {type: string, maxLength: 64}
        issuer: {type: string}
        client_id: {type: string}
        client_secret: {type: string, description: Written only; "" clears it}
        scopes: {type: string, description: "Space-separated, openid among them; openid email profile by default"}
        auto_create: {type: boolean}
        auto_role: {type: string}
        auto_domains: {type: array, items: {type: string}}
        groups_claim: {type: string, maxLength: 64, description: "groups where empty"}
        allowed_groups: {type: array, maxItems: 100, items: {type: string}}
        enabled: {type: boolean}
    Identity:
      type: object
      required: [id, provider, email, subject, bound, name, username, created_at]
      properties:
        id: {type: integer}
        provider: {type: string, description: The provider's key}
        email: {type: string, description: Lower case}
        subject: {type: string, description: The user id at the provider (sub); empty until bound}
        bound: {type: boolean, description: The identity has the provider's subject}
        name: {type: string, description: "The name at the provider, from the last sign-in or link"}
        username: {type: string, description: "The user name at the provider (preferred_username), likewise"}
        groups: {type: array, items: {type: string}, description: "The groups at the provider, likewise"}
        created_at: {type: string, format: date-time}
        bound_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
    PendingLink:
      type: object
      required: [provider, provider_name, subject, email, name, username, expires_at]
      properties:
        provider: {type: string, description: The provider's key}
        provider_name: {type: string}
        subject: {type: string, description: The user id at the provider}
        email: {type: string}
        name: {type: string}
        username: {type: string}
        groups: {type: array, items: {type: string}}
        replaces: {type: array, items: {$ref: "#/components/schemas/Identity"}, description: "The user's identities at the provider the link replaces"}
        expires_at: {type: string, format: date-time}
    IdentityAdd:
      type: object
      description: The provider and either email or subject.
      required: [provider]
      additionalProperties: false
      properties:
        provider: {type: string}
        email: {type: string}
        subject: {type: string, description: The user id at the provider (sub)}
    LoginProvider:
      type: object
      required: [key, name]
      properties:
        key: {type: string}
        name: {type: string, description: On the sign-in button; the key where the provider has none}
    OIDCStart:
      type: object
      required: [redirect]
      properties:
        redirect: {type: string, description: "The page's own address, http or https, without a query or fragment", example: "https://massimo.example.com/"}
    OIDCStarted:
      type: object
      properties:
        url: {type: string, description: "The provider's authorization URL, to open in the browser"}
        expires_at: {type: string, format: date-time, description: Ten minutes from now}
    OIDCFinish:
      type: object
      required: [code]
      properties:
        code: {type: string, description: "The callback's #oidc= code"}
        label: {type: string, maxLength: 64, description: Names the session under the user's tokens; the User-Agent when absent}
    Proof:
      type: object
      properties:
        proof: {type: string, description: "Good once, for PUT /api/v1/users/{name} of one's own password"}
        expires_at: {type: string, format: date-time, description: Five minutes from now}
    Register:
      type: object
      required: [request]
      properties:
        request: {type: string, description: "The client's registration request, 32 bytes, base64url without padding"}
    Registered:
      type: object
      properties:
        response: {type: string, description: "The server's registration response, 64 bytes, base64url without padding"}
        ksf: {type: string, description: "The key stretching to run and to send with the record", example: "m=19456,t=2,p=1"}
    Session:
      type: object
      properties:
        token: {type: string, description: "The session token, shown once; sent as the bearer header"}
        expires_at: {type: string, format: date-time, description: "30 days from now, moved by use"}
        user: {$ref: "#/components/schemas/User"}
        role: {$ref: "#/components/schemas/RoleRef"}
        capabilities:
          type: array
          description: "The effective set, with what it includes: restart beside update or reboot"
          items: {type: string}
        upgrade:
          type: string
          description: >-
            With login, for a user of auth_version 1: a proof, good once for five minutes, to set the user's own
            record with in PUT /api/v1/users/{name} without the password
        provider: {type: string, description: "After a sign-in through an OpenID Connect provider: the provider's key"}
    RowUser:
      type: object
      description: >-
        A user of a row of the log or the audit, as it is named now: effective_user the user whose rights it had,
        real_user who made it, the same user but for a call of an integration's user linked to a Massimo user, which the
        effective user then is. Absent for no authentication, the Cube and the server's own jobs.
      properties:
        name: {type: string, description: "The login name; an integration's user's is <the integration's uuid>:<its id there>"}
        display_name: {type: string}
        integration: {type: string, description: "The uuid of the integration whose user it is; absent for any other user"}
        display:
          type: string
          description: >-
            How it is shown: its display name, else its login name; an integration's user by the chain
            "<the integration's name> › <its display name>"; real_user's with ", as <the effective user's login name>"
            where the two differ.
          example: "Home › Anna, as anna"
    User:
      type: object
      required: [name, role, disabled, has_password, auth_version, created_at, updated_at]
      properties:
        name: {type: string, description: "The login name, lower case; an integration's users' are <the integration's uuid>:, <uuid>:system and <uuid>:<its id there>"}
        display_name: {type: string}
        display:
          type: string
          description: >-
            How the user is shown: its display name, else its login name; an integration's user by the chain
            "<the integration's name> › <its display name>", with ", as <login name>" where it is linked to a Massimo user
          example: "Home › Anna, as anna"
        role: {type: string, description: The role's key}
        disabled: {type: boolean}
        has_password: {type: boolean, description: False for a user with keys only}
        expires_at: {type: string, format: date-time, description: "Guests: disabled from then on"}
        invited_by: {type: string, description: The user that created this one}
        auth_version: {type: integer, description: "1: the server hashes the password; 2: OPAQUE, the server keeps a record and never sees the password"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_login_at: {type: string, format: date-time}
        may:
          type: object
          description: "In the users routes' answers: what the caller may do with the user, change it beyond its own name and password (manage) or set its password (password), the roles it may give it (roles), and whether its role as stored lies beyond its integration's maximum (beyond); absent elsewhere"
          required: [manage, password, roles, beyond]
          properties:
            manage: {type: boolean}
            password: {type: boolean}
            beyond:
              type: boolean
              description: "An integration's user's role, as stored, lies beyond the role integration and its integration's maximum, within which it acts all the same; false for every other user. A role that roles leaves out may lie within them and be one the caller does not outrank"
            roles:
              type: array
              description: "The keys of the roles the caller may give the user, in the roles' order, empty where it may give none; of those, for an integration's user only the roles within the role integration and its integration's maximum, and integration itself, never owner. A holder of users without roles or integrations learns from it the keys of the roles it outranks and, for each integration's user, which of them lie within that integration's maximum"
              items: {type: string}
        integration:
          type: object
          description: "An integration's user, with its integration's uuid; in GET /api/v1/users id, name and linked_to for one of its users, absent for the integration's own"
          properties:
            uuid: {type: string}
            id: {type: string}
            name: {type: string}
            linked_to: {type: string}
        links:
          type: array
          description: "In GET /api/v1/users: the integrations' users linked to this user"
          items:
            type: object
            properties:
              integration: {type: string, description: The integration's uuid}
              id: {type: string}
              name: {type: string}
              display: {type: string, description: "Its chain, <the integration's name> › <its display name>"}
    UserCreated:
      allOf:
        - {$ref: "#/components/schemas/User"}
        - type: object
          properties:
            open_setup: {$ref: "#/components/schemas/OpenSetup"}
    OpenSetup:
      type: object
      description: >-
        What was set up before the first regular user and still works, for the first owner to check, as a rule while the
        server was open, else left by an owner since removed: in the first owner's answer of POST /api/v1/users alone,
        where it holds anything; each list absent where empty. Names only, never a key or a secret
      properties:
        integrations:
          type: array
          description: The integrations active with a live key, or one still to be collected with the approval's code; requests still waiting are not listed
          items:
            type: object
            required: [uuid, name]
            properties:
              uuid: {type: string}
              name: {type: string, description: "The name the owner gave it, else the one it reports"}
        providers:
          type: array
          description: The sign-in providers enabled
          items:
            type: object
            required: [key]
            properties:
              key: {type: string}
              name: {type: string, description: The name on its button; absent shows the key}
              auto_create: {type: boolean, description: A sign-in without an identity creates the user}
        roles:
          type: array
          description: "The roles added, and the default ones changed or disabled; never owner or integration"
          items:
            type: object
            required: [key]
            properties:
              key: {type: string}
              name: {type: string, description: The display name; absent shows the key's translated default}
        capabilities_off:
          type: array
          description: The capabilities turned off for every role but owner
          items: {type: string}
    RoleRef:
      type: object
      properties:
        key: {type: string}
        name: {type: string, description: The display name; empty shows the key's translated default}
        disabled: {type: boolean}
    Token:
      type: object
      description: A session or an API key, without its secret
      required: [id, kind, created_at]
      properties:
        id: {type: integer}
        kind: {type: string, enum: [session, api]}
        label: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, description: "A session's end, 30 days from its last use; an API key's end date, absent for a key without one (AP KeyLife, Block 4)"}
        last_used_at: {type: string, format: date-time}
        last_used_from: {type: string, description: The client's address}
        key_id: {type: integer, description: "The key a session was made from (POST /api/v1/login/key); absent for a session of a sign-in and for a key"}
        from_settings: {type: boolean, description: "In a user's token list, true on the key that is the settings file's MASSIMO_API_TOKEN, which is changed or removed there and not revoked through the API; absent on any other"}
        made_by: {type: integer, description: "The API key that made this key, as the bearer of its POST /api/v1/users/{name}/tokens (AP KeyLife, D5-A); absent for a key made by a session, the command line, the bootstrap or an integration's approval, and for a session. A revoke of that key revokes this one"}
        idle_exempt: {type: boolean, description: "An API key kept from the idle limit (the setting auth.key_idle_days; AP KeyLife, D7-A), the settings file's always; absent for one held to it and for a session"}
        idle_ends_at: {type: string, format: date-time, description: "When an API key ends unused: its last use, its session's included, or its making where it was never used, plus the limit's days. Absent where the limit is off, the key kept from it, and for a session; in the past for a key that ended so"}
        ended:
          type: string
          enum: [idle, expired]
          description: "Why an API key has ended, listed to be revoked: idle, unused past the limit; expired, past its end date. Absent while it lives. It lives again where the limit is raised or turned off, the key kept from it, or its end date moved later or removed (AP KeyLife, D6-A); its use never brings it back"
    TokenHeirs:
      type: array
      description: "The ids of the keys a revoke took with the token, the keys it made and theirs (made_by), oldest first; [] for none"
      items: {type: integer}
    Me:
      type: object
      properties:
        mode: {type: string, enum: [users, open, token, none], description: How the server authenticates}
        user:
          nullable: true
          allOf: [{$ref: "#/components/schemas/User"}]
        role:
          nullable: true
          allOf: [{$ref: "#/components/schemas/RoleRef"}]
        capabilities:
          type: array
          description: "What the caller may do, restart beside update or reboot, which include it; every capability outside users mode"
          items: {type: string}
        setup: {type: boolean, description: The first owner can be created from here}
        kept_open: {type: boolean, description: "An open server kept open on purpose (the setting auth.keep_open): the web UI does not ask for the first owner"}
        token: {$ref: "#/components/schemas/Token"}
        integration:
          type: object
          nullable: true
          description: "The registered integration whose key it is; null for any other key, and on an open server, which does not look at the key (mode open)"
          properties:
            uuid: {type: string}
            name: {type: string, description: "Its name as the owner gives it, its own user's display name"}
            reported_name: {type: string, description: The name it reports}
            state: {type: string}
            instance_id: {type: string}
        acts_for:
          type: object
          description: "With X-MassimoHA-On-Behalf-Of: the integration's user the call acts for; capabilities is then what the chain leaves. On an open server the header is not read and nothing is attributed"
          properties:
            id: {type: string}
            name: {type: string}
            level: {type: string, enum: [view, control, admin]}
            linked: {type: boolean}
            system_generated: {type: boolean}
    RestoreStep:
      type: object
      description: One command of a restore plan
      required: [what, radio]
      properties:
        what: {type: string, description: The step as massimo restore prints it}
        radio: {type: boolean, description: "Sends radio commands, which cost budget; false for a Cube command (names, NTP, time zone)"}
        device: {type: string, description: "The device the command addresses, when it has one"}
        room: {type: integer, description: "The room woken up before the command, when there is one"}
        result: {$ref: "#/components/schemas/RestoreStepResult"}
    RestoreStepResult:
      type: object
      description: The outcome of a step once it ran (GET …/restore only)
      properties:
        ok: {type: boolean}
        discarded: {type: boolean, description: The Cube refused the radiogram; present when true}
        error: {type: string}
        budget: {$ref: "#/components/schemas/Budget"}
        time: {type: string, format: date-time}
    RepairPlan:
      type: object
      required: [plan, steps, radiograms, duty_cost_pct, slots, held_slots, resets, wakeups, metadata, notes]
      properties:
        action: {type: string, enum: [reset, master, relink, unlink_relink, config, move, list]}
        plan: {type: string, description: "SHA-256 over the action and the lines; the run takes it"}
        steps:
          type: array
          items:
            type: object
            properties:
              what: {type: string}
              device: {type: string, description: "The device the command addresses"}
              room: {type: integer, description: "The room woken up before the command"}
              reset: {type: boolean, description: "The queue resets error flags before the command: the device's, the flagged members its room lines reach, the flagged devices its direct lines address"}
              lines: {type: array, items: {type: string}, description: "The command's lines as they go to the Cube, the wakeup and the queue's resets not included"}
        radiograms: {type: integer, description: "The s: lines"}
        duty_cost_pct: {type: number, description: "About what they cost of the hourly radio budget, 1.25 % each"}
        slots: {type: integer, description: "The memory slots they take, one each and a room radiogram one per member of the room"}
        held_slots: {type: integer, description: "Those held until the members' next wakeup, about ten minutes, a room radiogram's but its addressee's"}
        resets: {type: integer, description: "The r: lines, those the queue sends before each command included; free"}
        wakeups: {type: integer}
        metadata: {type: boolean, description: "A metadata write, no radio"}
        budget: {$ref: "#/components/schemas/Budget"}
        refused: {type: string, description: "Why a run would be refused now; absent where it fits the budget"}
        nothing: {type: string, description: "Why the repair has nothing to send now, without plan and steps; its run is refused with 409. A listing into a room the list lacks has details code room_name_needed and room"}
        notes: {type: array, items: {type: string}}
        untested: {type: boolean, description: "Not yet run on hardware"}
        details: {type: object, additionalProperties: true, description: "What the repair names: the devices reset, the room's masters, the agreement of a re-sent configuration, the rooms of a placement or listing"}
    RepairResult:
      type: object
      properties:
        ok: {type: boolean}
        action: {type: string}
        error: {type: string, description: "Where and why the repair stopped"}
        steps:
          type: array
          items:
            type: object
            properties:
              what: {type: string}
              lines: {type: integer}
              accepted: {type: integer, description: "The lines the Cube accepted"}
              discarded: {type: boolean}
              error: {type: string}
        budget: {$ref: "#/components/schemas/Budget"}
        confirmation: {type: string, enum: [pending], description: "Radiograms were sent: the log's device change line says when the Cube's free slots are back, or names the slots still held and the members left flagged"}
        still_flagged: {type: array, items: {type: string}, description: "The devices reset whose flag the device list read after the resets still shows"}
    RestorePlan:
      type: object
      required: [plan, radio_commands, duty_cost_pct, budget]
      properties:
        plan: {type: string, description: SHA-256 over the step list (texts and command lines); POST …/restore takes it}
        steps:
          type: array
          description: The commands in the order they would be sent; empty when the Cube matches the backup
          items: {$ref: "#/components/schemas/RestoreStep"}
        notes:
          type: array
          description: Differences a restore cannot write, such as devices that have to be paired again
          items: {type: string}
        radio_commands: {type: integer, description: Radiograms of all steps}
        duty_cost_pct: {type: number, description: "About what the radio commands will cost of the hourly radio budget, 1.25 % each"}
        budget: {$ref: "#/components/schemas/Budget"}
    RestoreState:
      type: object
      description: The last restore of a Cube; only state for none
      properties:
        id: {type: string}
        state: {type: string, enum: [none, running, done, failed]}
        plan: {type: string, description: The hash of the plan sent}
        started: {type: string, format: date-time}
        finished: {type: string, format: date-time, description: Present once the restore ended}
        steps:
          type: array
          description: The plan's steps, each with its result once it ran; a failed restore stops at the failed step
          items: {$ref: "#/components/schemas/RestoreStep"}
        sent: {type: integer, description: Steps the Cube accepted}
        radio_commands: {type: integer}
        error: {type: string, description: "Which step failed and why, for a failed restore"}
    RestoreProgress:
      type: object
      description: The restore field of restore_step and restore_done events
      properties:
        id: {type: string}
        step: {type: integer, description: Counts from 1 in the order of the plan's steps; restore_step only}
        steps: {type: integer, description: Steps in the plan}
        what: {type: string, description: restore_step only}
        ok: {type: boolean}
        discarded: {type: boolean, description: Present when true}
        error: {type: string}
        state: {type: string, enum: [done, failed], description: restore_done only}
        sent: {type: integer, description: Steps the Cube accepted; restore_done only}
    RestartInfo:
      type: object
      required: [available]
      properties:
        available: {type: boolean, description: Whether this caller's POST would restart the server now}
        by: {type: string, enum: [systemd, launchd, windows, exit], description: Who starts the server again; absent when nobody would}
        blocked: {type: string, description: Why the restart is not available}
        pending:
          type: array
          items: {type: string}
          description: The settings file's variables that changed since the start and apply only at the next one; names, never values
        file: {type: string, description: The settings file serve reads}
        read_at:
          type: string
          format: date-time
          description: >-
            When the settings file was last read, at the start or since, also
            where it did not parse, or was there but could not be read
        refused:
          type: array
          items: {$ref: "#/components/schemas/Refusal"}
          description: >-
            What the last read of the settings file found the next start
            refuses; absent where it found nothing, and at the start, which
            would have refused it. The restart is offered all the same.
    Refusal:
      type: object
      description: >-
        One thing the next start of serve refuses, in the start's order: a
        setting of the settings file, or the file itself
      required: [error]
      properties:
        settings:
          type: array
          items: {type: string}
          description: >-
            The settings that changed since the start and that the refusing
            check reads, by name; absent where the file itself does not parse,
            or is there but cannot be read
        error:
          type: string
          description: >-
            The start's own text, which may quote a value, a secret's named by
            its variable; for the file, its error naming the file and the
            line by its number
    RebootInfo:
      type: object
      required: [available]
      properties:
        available: {type: boolean, description: Whether this caller's POST would reboot the computer now}
        by: {type: string, enum: [systemd, launchd, windows], description: Who reboots; absent when nobody can}
        blocked: {type: string, description: Why the reboot is not available}
        at: {type: string, format: date-time, description: "When a reboot that waits, or has begun, is asked for"}
        begun: {type: boolean, description: The delay is over and the helper or the system was asked}
        error: {type: string, description: Why the last reboot failed}
    ReloadResult:
      type: object
      required: [changed, pending, refused, read_at]
      properties:
        changed:
          type: array
          items: {type: string}
          description: The variables that changed in this read; names, never values
        pending:
          type: array
          items: {type: string}
          description: The variables that differ from the start and apply only at the next one
        refused:
          type: array
          items: {$ref: "#/components/schemas/Refusal"}
          description: What the next start refuses of the settings now; empty for nothing
        read_at: {type: string, format: date-time}
    SystemInfo:
      type: object
      description: What System info shows, GET /api/v1/system
      required: [version, started_at, install, os, arch, client_ip, now, interfaces, cube_proxies]
      properties:
        version: {type: string, description: "The build version with the Go details, as /healthz has it"}
        started_at: {type: string, format: date-time, description: When the server process started.}
        tls: {$ref: "#/components/schemas/CertStatus"}
        install:
          type: string
          description: |
            The package manager that owns the binary (apt, brew), else what runs
            the server: windows-service, systemd or launchd; other for a
            terminal, a container or a supervisor massimo does not know.
        os: {type: string, description: "The operating system, as Go names it: linux, darwin, windows."}
        os_name: {type: string, description: The distribution's name from /etc/os-release; absent elsewhere.}
        arch: {type: string, description: "The processor, as Go names it: amd64, arm64, arm."}
        hostname: {type: string}
        client_ip: {type: string, description: The caller's address as the server sees it.}
        now: {type: string, format: date-time, description: The server's clock with its offset.}
        time_zone: {type: string, description: "The server's zone: TZ, else what /etc/localtime links to, else its abbreviation."}
        fqdn: {type: string, description: The host's full name as hostname -f gives it.}
        interfaces:
          type: array
          description: The interfaces the API or a Cube proxy listens on.
          items:
            type: object
            required: [name, addresses]
            properties:
              name: {type: string}
              mac: {type: string}
              addresses:
                type: array
                items:
                  type: object
                  required: [ip]
                  properties:
                    ip: {type: string}
                    api: {type: boolean, description: The API listens on this address.}
        api_port: {type: integer, description: The port the API listens on.}
        cube_proxies:
          type: array
          description: The Cubes' proxy listeners, listening or not.
          items:
            type: object
            required: [addr, listening]
            properties:
              serial: {type: string, description: "The Cube's serial; absent until the Cube of a plain MASSIMO_CUBE_ADDRESS reports it."}
              discovery_serial: {type: string, description: "The serial it answers discovery with: the Cube's proxy serial where set, else the Cube's; absent where it answers no discovery."}
              addr: {type: string}
              listening: {type: boolean}
              error: {type: string, description: The last try's error; absent while it listens.}
              since: {type: string, format: date-time, description: The first failure; absent while it listens.}
              next_try: {type: string, format: date-time, description: When it is tried again; absent while it listens.}
              tries: {type: integer, description: The tries so far; absent while it listens.}
        proxy:
          type: object
          description: The trusted proxy the request came through; absent otherwise.
          required: [host]
          properties:
            proto: {type: string, enum: [https, http], description: Absent where no header says.}
            host: {type: string}
            port: {type: integer, description: Absent where neither a scheme nor a port is said.}
            certificate:
              type: object
              description: The proxy's certificate as the last check read it; for https, absent before the first.
              required: [trusted, checked_at]
              properties:
                source: {type: string, enum: [proxy]}
                names: {type: array, items: {type: string}}
                not_after: {type: string, format: date-time}
                fingerprint: {type: string}
                self_signed: {type: boolean}
                issuer: {type: string}
                trusted: {type: boolean, description: Valid for the host against the system's roots.}
                checked_at: {type: string, format: date-time}
                error: {type: string, description: Why the last check failed.}
    StoreInfo:
      type: object
      required: [file, schema, min_reader, binary, node, tenant, rows]
      properties:
        file: {type: string, description: The store's file}
        schema: {type: integer, description: The file's schema version}
        min_reader: {type: integer, description: The oldest schema version that still reads it}
        binary: {type: integer, description: The schema version this server is built for}
        node: {type: string}
        tenant: {type: string}
        rows:
          type: object
          additionalProperties: {type: integer}
          description: Rows per table
    ProxyFailure:
      type: object
      description: A proxy listener that does not listen, and is tried again
      required: [addr, error, since, next_try]
      properties:
        addr: {type: string}
        error: {type: string, description: The last try's error}
        since: {type: string, format: date-time, description: The first failure}
        next_try: {type: string, format: date-time}
        tries: {type: integer}
    FoundElsewhere:
      type: object
      description: "A Cube with a fixed address that answered the latest discovery at another one, neither it nor a proxy answering at its own; absent otherwise"
      required: [address, configured, since]
      properties:
        address: {type: string, description: "Where it answers, with the configured address's port: the address a PUT takes"}
        configured: {type: string, description: The configured address}
        since: {type: string, format: date-time, description: The run that first found it there}
    ConfigView:
      type: object
      required: [version, file, file_found, data_dir, listen, tls, log_level, variables]
      properties:
        version: {type: string}
        file: {type: string, description: The settings file}
        file_found: {type: boolean}
        data_dir: {type: string}
        listen: {type: string}
        tls: {type: string, enum: ["off", files, self-signed, acme]}
        log_level: {type: string, description: The level and where it came from}
        variables:
          type: array
          items:
            type: object
            required: [name, source]
            properties:
              name: {type: string}
              value: {type: string, description: Absent for a secret and for an unknown name}
              secret: {type: boolean, description: "The value is not shown: a secret, or an unknown name"}
              source: {type: string, description: "Where the value came from, the environment or the settings file"}
              unknown: {type: boolean, description: "A name Massimo does not know, perhaps a typo"}
    UpdateInfo:
      type: object
      required: [current, channel, available, checked_at, can_update, history]
      properties:
        current: {type: string, description: The running version}
        flavour: {type: string, description: "What the running build was released as: devel, nightly, alpha, beta, rc or stable; absent for a build without the Makefile"}
        channel: {type: string, description: "The update channel: MASSIMO_UPDATE_CHANNEL, else the setting update.channel, else the apt source's suite where apt owns the binary, else the flavour"}
        suite: {type: string, description: "The suite of the apt source, where apt owns the binary; where it differs from channel, the next update switches the source to the channel's suite"}
        manager: {type: string, description: "The package manager that owns the binary (apt, brew); absent on a box massimo install set up"}
        latest: {type: string, description: "The version an update would install: the newest signed release the channel takes, of its own flavour or a more stable one; where apt or brew owns the binary, the newest its package source has, never newer than the signed release"}
        released: {type: string, description: "The newest signed release, where the package source has it not yet"}
        source_error: {type: string, description: "Why the package source (apt's index, brew's formula) could not be read; nothing is available then"}
        held: {type: string, description: "A version the update helper found nothing to install for (up-to-date), held back until a check made after it finds it in the package source"}
        release_url: {type: string, description: "The page of the newest signed release"}
        available: {type: boolean, description: "latest is newer than current, and not held back"}
        checked_at: {type: string, format: date-time}
        check_error: {type: string}
        can_update: {type: boolean, description: POST would start an update}
        blocked: {type: string, description: "Why an update cannot be started from the API (a package manager owning the binary without a helper of its own, no token, no helper, on Windows and under brew a listen address the helper cannot ask /healthz at, named by its setting, a development build)"}
        helper: {$ref: "#/components/schemas/UpdateStatus"}
        auto:
          type: object
          description: "The automatic update at night; absent without a store"
          required: [mode, window, ask]
          properties:
            mode: {type: string, enum: ["off", night], description: The setting update.auto}
            window: {type: string, description: "The setting update.auto_window, HH:MM-HH:MM in the server's time"}
            next: {type: string, format: date-time, description: "When the box will try: inside the window now, else at its next opening; absent while no update is due or the version is skipped"}
            waits: {type: string, enum: [settings], description: "What the next try waits for, where next is set: settings while the server's next start refuses the settings file (GET /api/v1/restart's refused); absent otherwise, a busy radio included"}
            answer:
              type: object
              description: "The box's answer to the question (PUT /api/v1/update/answer), where it names the version offered or a newer one"
              required: [version, answer, at]
              properties:
                version: {type: string}
                answer: {type: string, enum: [tonight, skip]}
                by:
                  type: object
                  description: Who answered; absent for the owner's key
                  properties:
                    name: {type: string}
                    display_name: {type: string}
                at: {type: string, format: date-time}
            ask: {type: boolean, description: "The page asks a holder of update Install now, Tonight or Skip this version: automatic updates on, an update due, no answer for it"}
        history:
          type: array
          description: The last ten updates, newest first; empty without a store
          items: {$ref: "#/components/schemas/UpdateEntry"}
    UpdateEntry:
      type: object
      description: "An update: started in Massimo (by, to), or found at a start (outside); completed by the next start with another version"
      properties:
        at: {type: string, format: date-time, description: "When it was started, or found at a start"}
        by:
          type: object
          description: The user who started it; absent for the owner's key and an update from outside Massimo
          properties:
            name: {type: string}
            display_name: {type: string}
        outside: {type: boolean, description: "Massimo did not start it: apt, brew or a person on the box"}
        manager: {type: string, description: "The box's package manager (apt, brew), for an update from outside"}
        from: {type: string, description: The version that ran before}
        to: {type: string, description: "The version asked for, where Massimo started it"}
        channel: {type: string, description: "The channel asked for, where Massimo started it; for an update from outside, the one the box followed at the start that found it"}
        reached: {type: string, description: "The version the next start ran, the one asked for or another apt chose; absent while the update runs"}
        reached_at: {type: string, format: date-time}
        auto: {type: boolean, description: "The server started it itself, at night; by is absent then"}
        result: {type: string, enum: [failed, rolled-back, up-to-date], description: "The update helper's outcome where the box did not stay on a new version, rolled-back after reached ran: taken at the next read or the next update started where the helper did not restart the server, else at the next start"}
    UpdateStatus:
      type: object
      description: The update helper's last run
      required: [state, time]
      properties:
        state: {type: string, enum: [checking, installing, restarting, done, up-to-date, failed, rolled-back]}
        from: {type: string}
        to: {type: string}
        channel: {type: string}
        message: {type: string}
        time: {type: string, format: date-time}
    Error:
      type: object
      properties:
        error: {type: string, description: "The server's English text"}
        code: {type: string, description: "What was refused, lower-case words joined by _, never renamed once released; absent for an error without one (docs/api-v1.md, \"Error codes\")"}
        params:
          type: object
          additionalProperties: true
          description: "The values the error names, by name: a room by its id, a device as the request named it, devices as radio addresses; absent where it names none"
        no_state:
          type: array
          items: {type: string}
          description: Radio addresses of room members without state, when that caused the discard
    Budget:
      type: object
      description: What the Cube last reported about its radio limits
      required: [updated_at]
      properties:
        duty_cycle_pct: {type: integer, description: Share of the hourly radio budget already used}
        free_memory_slots: {type: integer, description: Free slots for unacknowledged radiograms (about 50)}
        updated_at: {type: string, format: date-time}
    FoundCube:
      type: object
      description: A Cube that answered discovery
      required: [serial, kind, address, rf_address, firmware, last_seen]
      properties:
        serial: {type: string}
        kind: {type: string, enum: [cube, proxy, unknown], description: "What answered: a Cube, a massimo proxy (also one at an announced server's address), or neither"}
        serves: {type: string, description: "A proxy's: the serial of the Cube with its radio address, served here or found; absent where none is known"}
        host:
          type: object
          description: "The massimo server that serves it, announced on the LAN: the one at a proxy's address, or the one a proxy of a Cube runs on; absent where none matched"
          required: [name, url]
          properties:
            name: {type: string, description: Its instance name}
            url: {type: string, description: "The url its announcement gives, else http(s)://<address>:<port>"}
        configured: {type: boolean}
        other_network: {type: boolean, description: "True where address lies in none of this machine's networks, as a Cube without a DHCP lease on 192.168.0.222 does; absent otherwise, and on a proxy"}
        address: {type: string, description: "The IP it answered from, its own where a massimo proxy answers for it too"}
        mac: {type: string, description: From the host's ARP cache; absent when unknown}
        rf_address: {type: string}
        firmware: {type: string, example: "1.1.3"}
        dhcp: {type: boolean, description: "Whether the Cube takes its address by DHCP, from its answer to the c request in this server run's latest discovery that had one; absent until it has answered c"}
        gateway: {type: string, description: "The gateway the Cube uses, from its answer to the N request in this server run's latest discovery that had one; absent until then"}
        netmask: {type: string, description: "The netmask the Cube uses, as gateway"}
        dns:
          type: array
          items: {type: string}
          description: The DNS servers the Cube uses, as gateway
        proxies:
          type: array
          items: {type: string}
          description: "The other addresses that answered for the Cube's serial in the latest run: massimo proxies (docs/proxy.md); absent when none did"
        removed:
          type: array
          description: "A Cube that is not configured: the removed rows of its serial in the store, newest first, one of which POST /api/v1/cubes can restore; absent where there are none, and on a proxy"
          items:
            type: object
            required: [uuid, name, removed_at]
            properties:
              uuid: {type: string, format: uuid, description: "The row's, for POST /api/v1/cubes's restore"}
              name: {type: string, description: "The name it had; empty where it had none"}
              removed_at: {type: string, format: date-time, description: When it was removed}
        backups: {type: integer, description: "In GET /api/v1/cubes: the backups the store keeps of the serial's row, which GET …/backups lists while no runtime serves it; 0 without a row; absent in the answer of a discovery"}
        found_at: {type: string, format: date-time, description: When the server first saw it}
        last_seen: {type: string, format: date-time, description: Its latest answer}
    Discovery:
      type: object
      description: A run of discovery, as POST /api/v1/cubes/discover answers it
      required: [ran_at, found]
      properties:
        ran_at: {type: string, format: date-time}
        found:
          type: array
          description: Every Cube and massimo proxy that answered, configured or not; empty where none did
          items: {$ref: "#/components/schemas/FoundCube"}
    CertStatus:
      type: object
      description: "The certificate the server serves, as /healthz and GET /api/v1/system give it as tls; absent without TLS"
      required: [not_after, self_signed]
      properties:
        source: {type: string, description: "Where the certificate comes from: files, self-signed, or acme."}
        names: {type: array, items: {type: string}, description: The certificate's names and addresses.}
        not_after: {type: string, format: date-time}
        fingerprint: {type: string, description: "The SHA-256 of the certificate, as browsers show it."}
        self_signed: {type: boolean}
        warning: {type: string, description: Set while something needs the owner.}
    Cube:
      type: object
      required: [serial, address, configured_address, follow_discovery, proxy_virtual, hidden, backups, connected, link, budget, pending_radiograms, updated]
      properties:
        serial: {type: string}
        name: {type: string, description: "User-friendly name from the store (seeded from MASSIMO_CUBE_<SN>_NAME), when set"}
        address: {type: string}
        configured: {type: boolean, description: Always true here; found Cubes are FoundCube}
        source: {type: string, enum: [env, ui, flag], description: Where the configuration comes from; absent without a store}
        file_differs:
          type: array
          description: The settings file's lines for this Cube whose values differ from the store's, which wins
          items: {$ref: "#/components/schemas/FileDifference"}
        backups: {type: integer, description: "The backups the store keeps of the Cube (GET …/backups); 0 for a Cube without a row in the store, and without a store"}
        configured_address: {type: string, description: "The stored address; empty: from discovery (address is where it connects now)"}
        follow_discovery: {type: boolean}
        proxy_address: {type: string, description: "The configured proxy address; empty: the default"}
        proxy_serial: {type: string}
        proxy_virtual: {type: boolean, description: "The proxy shows clients the rooms' virtual wall thermostats"}
        proxy_listening:
          type: array
          description: The addresses the Cube's proxy listens on now
          items: {type: string}
        proxy_failing:
          type: array
          description: "The Cube's proxy listeners that do not listen, tried again; absent where none"
          items: {$ref: '#/components/schemas/ProxyFailure'}
        hidden:
          type: array
          description: The hidden list (radio addresses), besides room 255
          items: {type: string}
        mac: {type: string, description: "From discovery, once it saw the Cube"}
        last_seen: {type: string, format: date-time, description: When the Cube last answered discovery}
        found_address: {type: string, description: "The host discovery last found the Cube at; differs from address where the server connects through a proxy or to a fixed address the Cube has left"}
        found_elsewhere: {$ref: '#/components/schemas/FoundElsewhere'}
        other_network: {type: boolean, description: "True where the address the server connects to lies in none of this machine's networks: it reaches the Cube only through a router; absent otherwise, and for a host name"}
        slots_low:
          type: object
          description: "The Cube's memory slots held, fewer than 5 free (level warn) or fewer than 2 (error), at two readings an hour apart with nothing of the server's in flight: radiograms held for devices that do not answer, which a reboot of the Cube drops; absent otherwise (docs/api-v1.md, GET /api/v1/cubes)"
          required: [level, since, free_slots, logged]
          properties:
            level: {type: string, enum: [warn, error]}
            since: {type: string, format: date-time, description: The first reading below 5 of the run}
            full_since: {type: string, format: date-time, description: "The first reading below 2, for error"}
            free_slots: {type: integer, description: The free slots at the last reading}
            logged: {type: string, format: date-time, description: When the log's slots event of the level was given}
        problems:
          type: array
          description: "The Cube's visible devices with a problem (a communication or link error, a battery level weak or low, or the battery flag where the server keeps no level, a window open), each with its room's name; absent where none"
          items:
            allOf:
              - {$ref: '#/components/schemas/Device'}
              - type: object
                properties:
                  room: {type: string, description: The device's room's name}
        connected: {type: boolean, description: The server is connected to the Cube and has its complete greeting}
        link:
          type: object
          description: "How the server stands with a configured Cube beyond connected (docs/api-v1.md, GET /api/v1/cubes)"
          required: [state]
          properties:
            state:
              type: string
              enum: [connected, held, stale, busy, rebooting, offline]
              description: "held: a lost connection held open; stale: the Cube answers discovery but refuses a new connection while it holds the server's old one; busy: the same, another client holding it"
            since: {type: string, format: date-time, description: "Since when: the loss of a held connection, the first refused dial"}
            until: {type: string, format: date-time, description: The hold ends then at the latest}
        firmware: {type: string, example: "1.1.3"}
        rf_address: {type: string}
        budget: {$ref: "#/components/schemas/Budget"}
        pending_radiograms: {type: integer, description: "Radiograms sent by the Cube and not yet acknowledged by a device (memory slots in use): all of them when no slot is free, 0 until the Cube has reported its budget"}
        updated: {type: string, format: date-time}
        observed_since: {type: string, format: date-time, description: When the server first heard from the Cube; a device value received at that time was already there and may be older}
        rooms: {type: integer}
        devices: {type: integer}
        queued: {type: integer, description: Commands waiting in the queue}
        cube_time: {type: string, example: "2026-11-04 15:28", description: "The Cube's clock in its greeting at the last connect, its own time zone, to the minute"}
        cube_time_at: {type: string, format: date-time, description: When the server read cube_time}
    CubeChange:
      type: object
      description: The fields of a Cube's configuration that PUT and POST change
      properties:
        name: {type: string, maxLength: 64}
        address: {type: string, description: "host or host:port; empty: from discovery", example: 192.168.1.10}
        follow_discovery: {type: boolean, description: The address follows the Cube's discovery answers}
        proxy_address: {type: string, description: "The server's listener for this Cube, host[:port]; empty: :62910 with a single Cube"}
        proxy_serial: {type: string, description: "The serial in discovery replies; empty: the Cube's"}
        proxy_virtual: {type: boolean, description: "The proxy shows clients the rooms' virtual wall thermostats in place of the real wall thermostats; off by default"}
        hidden:
          type: array
          description: Radio addresses of devices to hide, besides those in room 255
          items: {type: string, example: 0abc12}
    Setting:
      type: object
      required: [value, set]
      properties:
        value: {type: string, description: "The store's value, or the default; durations as 30m, 24h, 0 for off"}
        default: {type: string}
        set: {type: boolean, description: The store holds a value}
        in_effect: {type: string, description: What this run uses; a serve flag wins for one run}
        applies: {type: string, enum: [now, restart]}
        read_only: {type: boolean}
        fixed_by: {type: string, description: "What decides this run's value instead of the setting: -announce or MASSIMO_ANNOUNCE (announce), -poll, -refresh, -discover-interval or -stale-after (the intervals)"}
    FileDifference:
      type: object
      required: [field, variable, file, store]
      properties:
        field: {type: string, enum: [name, address, proxy_address, proxy_serial, hidden]}
        variable: {type: string, example: MASSIMO_CUBE_KEQ0000000_NAME}
        file: {description: The file's value; a list of radio addresses for hidden}
        store: {description: "The store's value, in effect; a list for hidden"}
    CubeDetail:
      allOf:
        - {$ref: "#/components/schemas/Cube"}
        - type: object
          properties:
            config: {$ref: "#/components/schemas/CubeConfig"}
            room_list:
              type: array
              items: {$ref: "#/components/schemas/Room"}
    CubeConfig:
      type: object
      properties:
        portal_enabled: {type: boolean}
        portal_url: {type: string}
        push_button_up: {type: integer}
        push_button_down: {type: integer}
        tz_winter: {$ref: "#/components/schemas/TimeZoneRule"}
        tz_summer: {$ref: "#/components/schemas/TimeZoneRule"}
    TimeZoneRule:
      type: object
      properties:
        name: {type: string, example: CET}
        month: {type: integer}
        weekday: {type: integer}
        hour: {type: integer}
        offset_seconds: {type: integer}
    Room:
      type: object
      required: [id, name, ready, devices]
      properties:
        id: {type: integer}
        name: {type: string}
        room_uid: {type: string, description: "The room's uid, kept for the room's life and never given to another room; absent before the server has read the room"}
        ready: {type: boolean, description: "Every device of the room has reported since the Cube restarted, so the Cube accepts room commands"}
        stale: {type: boolean, description: A device of the room is stale; present when true}
        thermostat: {type: string, description: "The radio address of the thermostat whose state is the room's, the first of its virtual wall thermostat's sources.setpoint (RoomMajority.D9, D19-A): one of those whose state more than half show, else the one whose mode or setpoint changed last, else the first of the room's one order (its master, its wall thermostat, its radiator thermostats); during a boost the same over those that do not boost; where no thermostat has a state, the first of that order, as the room's commands name it; absent for a room without a thermostat"}
        comfort_temp: {type: number, description: "The room's comfort temperature, as GET …/rooms/{id}/config gives it: what more than half of its thermostats store, else the first of its order's; absent for a room without a thermostat"}
        eco_temp: {type: number, description: "The room's eco temperature, as comfort_temp"}
        min_setpoint: {type: number, description: "The room's lowest setpoint, as comfort_temp; a client offers the room's setpoints within min_setpoint and max_setpoint"}
        max_setpoint: {type: number, description: "The room's highest setpoint, as comfort_temp"}
        devices:
          type: array
          items: {$ref: "#/components/schemas/Device"}
        mismatches:
          type: array
          description: "The findings of the Cube's C lines against its room list that concern the room, and of its members that differ (docs/api-v1.md, \"The Cube's lines against its room list\"); absent where none"
          items: {$ref: "#/components/schemas/Mismatch"}
        confirmation: {$ref: "#/components/schemas/Confirmation"}
    Confirmation:
      type: object
      description: "A write not confirmed yet: the device, or members of the room, do not show what it set. Present while one is open"
      required: [state, since, fields]
      properties:
        state: {type: string, enum: [pending, unconfirmed], description: "pending until five minutes after the Cube's answer, then unconfirmed until the devices show it or a newer write of the same kind replaces it; a room setpoint sent once more is pending again for five minutes after the re-send's answer"}
        since: {type: string, format: date-time, description: "When the Cube took the oldest write still open"}
        fields: {type: array, items: {type: string}, description: "The values not shown yet: mode, setpoint, until, locked and display_actual of the state; the configuration's by their names (comfort_temp … valve_offset_pct); program.<day> for a day of the week programme, program.<day>.2 for a long day's second radiogram"}
        devices: {type: array, items: {type: string}, description: "A room's: the radio addresses of its members that do not show them"}
    Mismatch:
      type: object
      description: "A difference between a C line and the room list, or among a room's members, that the server found (docs/api-v1.md, \"The Cube's lines against its room list\")"
      required: [finding, room, since]
      properties:
        finding: {type: string, enum: [room, unlisted, no_config, type, master, programme, temperatures]}
        device: {type: string, description: "The device concerned, a room's master for master; absent for a master of address 000000"}
        name: {type: string, description: The device's name in the room list}
        room: {type: integer, description: "The room concerned: the room list's where it has the device, else its C line's"}
        room_name: {type: string}
        cube_room: {type: integer, description: "The room of the device's C line (room, unlisted), of the master's (master other_room)"}
        cube_room_name: {type: string}
        list_room: {type: integer, description: "The room the room list has the device in (room, no_config)"}
        list_room_name: {type: string}
        cube_type: {$ref: "#/components/schemas/DeviceType"}
        list_type: {$ref: "#/components/schemas/DeviceType"}
        why: {type: string, enum: [no_device, other_room, not_thermostat], description: A master's finding}
        since: {type: string, format: date-time, description: When the server first found it}
    DeviceType:
      type: string
      enum: [cube, radiator_thermostat, radiator_thermostat_plus, wall_thermostat, shutter_contact, eco_switch]
    Mode:
      type: string
      enum: [auto, manual, vacation, boost]
    FailedRadiogram:
      type: object
      description: "The type of the Cube's last radiogram to the device that failed, byte 4 of its entry; present only while error is set"
      required: [code]
      properties:
        code: {type: integer, minimum: 0, maximum: 255, description: "The radiogram type's code, 3 for TimeInformation"}
        name: {type: string, description: "The original software's name of the type (its FrameType enum, docs/cube-protocol.md); absent for a code it lacks"}
    State:
      type: object
      description: The device's last report; absent until it reported once
      properties:
        mode: {$ref: "#/components/schemas/Mode"}
        setpoint: {type: number}
        until: {type: string, description: "Vacation end, YYYY-MM-DD HH:MM"}
        actual_temp: {type: number, description: "The last measured temperature the device reported, kept while its entries carry none; received.actual_temp says when it appeared"}
        valve_pct: {type: integer}
        window_open: {type: boolean}
        battery_low: {type: boolean, description: "The battery flag as the Cube shows it now; the device's battery has the level the server keeps"}
        error: {type: boolean, description: "The communication error the Cube reports: its last radiogram to the device failed; it stays until reset (r:) or a Cube restart"}
        failed_radiogram: {$ref: "#/components/schemas/FailedRadiogram"}
        link_error: {type: boolean, description: "The link error the device reports: its radio communication with another MAX! device of its room is disturbed (the original software's transmitError)"}
        panel_locked: {type: boolean, description: Key lock active on the device; present when true}
        consistent: {type: boolean, description: "A virtual wall thermostat's alone: false while the room's thermostats disagree on mode, setpoint or until"}
    Device:
      type: object
      required: [rf_address, type, name, room_id, reported]
      properties:
        rf_address: {type: string}
        type: {$ref: "#/components/schemas/DeviceType"}
        name: {type: string}
        room_id: {type: integer}
        serial: {type: string}
        unlisted: {type: boolean, description: Paired but not assigned to a room}
        reported: {type: boolean, description: The Cube holds state for the device (it transmitted since the Cube restarted)}
        state: {$ref: "#/components/schemas/State"}
        out_of_date: {type: boolean, description: "The Cube marks the device's entry out of date, as after some minutes of silence: reported is false and state absent, last_known holds its last report. Present when true"}
        last_known: {$ref: "#/components/schemas/State"}
        received:
          type: object
          description: >-
            Per value of state (same names), when the server saw its current
            value appear in the Cube's device list. The Cube keeps no times;
            a repeated value keeps its time, and a value already there when
            the server connected carries the Cube's observed_since. Present
            with state.
          additionalProperties: {type: string, format: date-time}
        last_seen: {type: string, format: date-time, description: When the device's entry in the Cube's device list last changed; present with state}
        window:
          type: object
          description: >-
            An open window's times, present while state.window_open is true:
            when the server saw it open, and when it counts as open too
            long, as a warning and as an alert (the settings
            window_warn_after and window_alert_after).
          required: [open_since, warn_at, alert_at]
          properties:
            open_since: {type: string, format: date-time}
            warn_at: {type: string, format: date-time}
            alert_at: {type: string, format: date-time}
        battery:
          type: string
          enum: [ok, weak, low]
          description: >-
            A reported device's battery level, from the history of its flag:
            weak once the flag was seen, low once it stayed 15 minutes; ok
            again after a long valve move without it (weak) or an hour without
            it (low), or at once when someone marks new batteries (POST
            …/devices/{rf}/battery). Absent for a virtual wall thermostat and a
            device without state
        comfort_temp: {type: number, description: "A radiator or wall thermostat's comfort temperature, from its configuration (C line); absent for another device and where the Cube sent none"}
        eco_temp: {type: number, description: "A radiator or wall thermostat's eco temperature, from its configuration (C line); absent for another device and where the Cube sent none"}
        stale: {type: boolean, description: "Radiator or wall thermostat whose entry has not changed for its stale threshold (stale_after, 50 hours, or stale_after_wall, 24 hours): out of range, flat battery, or just quiet. Present when true. A virtual wall thermostat is stale when every source of its actual_temp is"}
        virtual: {type: boolean, description: "A room's virtual wall thermostat, which the server computes from the room's devices; present when true"}
        room_uid: {type: string, description: "A virtual wall thermostat's room's uid"}
        sources:
          type: object
          description: "A virtual wall thermostat's alone: the radio addresses its actual_temp came from, those its mode came from and those its setpoint and until came from"
          properties:
            actual_temp: {type: array, items: {type: string}}
            mode: {type: array, items: {type: string}, description: "Those its mode came from by the room's one order: those that show it, the one of the newest change, or the one of the order; the boosting ones during a boost"}
            setpoint: {type: array, items: {type: string}, description: "Those its setpoint and until came from by the room's one order, the one whose state it shows first, which the room entry's thermostat names; during a boost from the thermostats that do not boost"}
        confirmation: {$ref: "#/components/schemas/Confirmation"}
        mismatches:
          type: array
          description: "The findings of the device's C line against the room list, and of its room's members, that name it (docs/api-v1.md, \"The Cube's lines against its room list\"); absent where none"
          items: {$ref: "#/components/schemas/Mismatch"}
    ConfigWrite:
      type: object
      description: Every field optional; merged into the device's current configuration
      properties:
        comfort_temp: {type: number, description: 4.5 to 30.5 in steps of 0.5}
        eco_temp: {type: number}
        max_setpoint: {type: number}
        min_setpoint: {type: number}
        temp_offset: {type: number, description: -3.5 to 3.5 in steps of 0.5; per device only}
        window_open_temp: {type: number}
        window_open_minutes: {type: integer, description: 0 to 60 in steps of 5}
        boost_minutes: {type: integer, description: "0 to 30 in steps of 5, or 60"}
        boost_valve_pct: {type: integer, description: 0 to 100 in steps of 5}
        decalc_day: {type: string, enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]}
        decalc_hour: {type: integer, minimum: 0, maximum: 23}
        max_valve_pct: {type: integer, minimum: 0, maximum: 100}
        valve_offset_pct: {type: integer, minimum: 0, maximum: 100}
        display_actual: {type: boolean, description: "Wall thermostats only, per device only"}
    DeviceResult:
      type: object
      properties:
        rf_address: {type: string}
        name: {type: string}
        ok: {type: boolean}
        discarded: {type: boolean}
        error: {type: string}
    RoomConfig:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        source: {type: string, description: "The first thermostat of the room's one order that stores the room's temperatures, else the first of the order; absent for a room without a thermostat"}
        comfort_temp: {type: number}
        eco_temp: {type: number}
        max_setpoint: {type: number}
        min_setpoint: {type: number}
        window_open_temp: {type: number}
        window_open_minutes: {type: integer}
        boost_minutes: {type: integer}
        boost_valve_pct: {type: integer}
        decalc_day: {type: string}
        decalc_hour: {type: integer}
        max_valve_pct: {type: integer}
        valve_offset_pct: {type: integer}
        devices:
          type: array
          items:
            type: object
            properties:
              rf_address: {type: string}
              type: {$ref: "#/components/schemas/DeviceType"}
              name: {type: string}
              temp_offset: {type: number}
              display_actual: {type: boolean}
    SwitchPoint:
      type: object
      properties:
        temp: {type: number}
        until: {type: string, example: "07:00"}
    WeekProgram:
      type: object
      description: Switch points per weekday; the last point of a day ends at 24:00
      properties:
        monday: {type: array, items: {$ref: "#/components/schemas/SwitchPoint"}}
        tuesday: {type: array, items: {$ref: "#/components/schemas/SwitchPoint"}}
        wednesday: {type: array, items: {$ref: "#/components/schemas/SwitchPoint"}}
        thursday: {type: array, items: {$ref: "#/components/schemas/SwitchPoint"}}
        friday: {type: array, items: {$ref: "#/components/schemas/SwitchPoint"}}
        saturday: {type: array, items: {$ref: "#/components/schemas/SwitchPoint"}}
        sunday: {type: array, items: {$ref: "#/components/schemas/SwitchPoint"}}
    ThermostatConfig:
      type: object
      properties:
        comfort_temp: {type: number}
        eco_temp: {type: number}
        max_setpoint: {type: number}
        min_setpoint: {type: number}
        temp_offset: {type: number}
        window_open_temp: {type: number}
        window_open_minutes: {type: integer}
        boost_minutes: {type: integer}
        boost_valve_pct: {type: integer}
        decalc_day: {type: string}
        decalc_hour: {type: integer}
        max_valve_pct: {type: integer}
        valve_offset_pct: {type: integer}
        week_program: {$ref: "#/components/schemas/WeekProgram"}
    WallThermostatConfig:
      type: object
      properties:
        comfort_temp: {type: number}
        eco_temp: {type: number}
        max_setpoint: {type: number}
        min_setpoint: {type: number}
        temp_offset: {type: number}
        window_open_temp: {type: number}
        boost_minutes: {type: integer}
        boost_valve_pct: {type: integer}
        display_actual: {type: boolean, description: The display shows the measured temperature instead of the setpoint}
        week_program: {$ref: "#/components/schemas/WeekProgram"}
    NewDevice:
      type: object
      description: A device that joined during pairing, from the Cube's N line
      required: [type, rf_address, serial]
      properties:
        type: {$ref: "#/components/schemas/DeviceType"}
        rf_address: {type: string}
        serial: {type: string}
    PairingState:
      type: object
      required: [active, until, paired]
      properties:
        active: {type: boolean}
        started: {type: string, format: date-time}
        until: {type: string, format: date-time, description: When pairing ends at the latest}
        ended: {type: string, format: date-time, description: When the last pairing ended; absent while active or before the first}
        paired:
          type: array
          description: Devices that joined during the current or last pairing
          items: {$ref: "#/components/schemas/NewDevice"}
    IntegrationRequest:
      type: object
      required: [kind, name, instance_id]
      properties:
        kind: {type: string, enum: [homeassistant]}
        name: {type: string, maxLength: 64, description: "The installation's name (Home Assistant's location_name)"}
        instance_id: {type: string, pattern: "^[0-9a-fA-F]{32}$", description: The installation id}
        url: {type: string, maxLength: 256}
        version: {type: string, maxLength: 32}
    Integration:
      type: object
      required: [uuid, kind, name, reported_name, state, instance_id, created_at]
      properties:
        uuid: {type: string}
        kind: {type: string}
        name:
          type: string
          description: >-
            Its name as the owner gives it (PUT), its own user's display name; it follows reported_name while it is the
            name reported before. A request's is the name it reported.
        reported_name: {type: string, description: "The name the integration reports, when it asks and when a request is attached to it"}
        state: {type: string, enum: [pending, active, disabled]}
        instance_id: {type: string}
        pending_instance: {type: string, description: "An installation id a call came with, not accepted yet"}
        url: {type: string}
        version: {type: string}
        max_caps: {type: array, items: {type: string}, description: "The key's maximum, within the role integration"}
        request_code: {type: string, description: "A request's short code"}
        request_expires: {type: string, format: date-time, description: "Until when a request waits, or an approved integration may collect its key; absent once collected"}
        request_remote: {type: string, description: The address the request came from}
        key_issued_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        seen: {type: boolean, description: The last look at the LAN saw its installation id}
        users:
          type: array
          description: Its users, in GET /api/v1/integrations/{uuid} alone
          items: {$ref: "#/components/schemas/IntegrationUser"}
    IntegrationUser:
      type: object
      required: [id, name, display, user, own_user, linked]
      properties:
        id: {type: string, description: "Its id at the integration, or system"}
        name: {type: string, description: "Its name there, from its last call"}
        display: {type: string, description: "Its chain, <the integration's name> › <its user's display name>, with \", as <login name>\" where linked", example: "Home › Anna, as anna"}
        user: {type: string, description: The user its calls act as}
        own_user: {type: string, description: The user made at its first call}
        linked: {type: boolean}
        system_generated: {type: boolean}
        last_level: {type: string, enum: [view, control, admin]}
        last_used_at: {type: string, format: date-time}
        proposal: {type: string, description: "A Massimo user of the same name to link it to; absent where linked or none matches"}
    ProgramWithTag:
      allOf:
        - {$ref: "#/components/schemas/WeekProgram"}
        - type: object
          properties:
            source: {type: string, description: "The device the programme comes from: for a room, the first of its one order whose whole week is the room's, else the first of the order"}
            etag: {type: string, description: "The tag over every thermostat of the room's programme, as If-Match takes it"}
            pending: {type: boolean, description: A programme written and not yet in the devices' configurations}
            program_consistent: {type: boolean, description: False while the room's thermostats have different programmes}
    DeviceDetail:
      allOf:
        - {$ref: "#/components/schemas/Device"}
        - type: object
          properties:
            firmware: {type: integer}
            thermostat: {$ref: "#/components/schemas/ThermostatConfig"}
            wall_thermostat: {$ref: "#/components/schemas/WallThermostatConfig"}
            settings:
              type: object
              description: "A virtual wall thermostat's alone"
              properties:
                temp_method: {type: string, enum: [median, mean], description: How a room without a wall thermostat takes its temperature from its radiator thermostats}
                rf_address: {type: string, description: The address the owner gave it; absent for its room number}
    Setpoint:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [auto, manual, vacation, boost]
          description: "boost opens the valves by the thermostats' boost settings for their boost time, then they return to the mode they had"
        temp:
          type: number
          minimum: 4.5
          maximum: 30.5
          multipleOf: 0.5
          description: Required for manual and vacation; optional for auto; ignored by the devices for boost
        until:
          type: string
          description: "Vacation end, YYYY-MM-DD HH:MM on a half hour; required for vacation"
