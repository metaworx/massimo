                  ok: {type: boolean}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/LockedOut"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502": {$ref: "#/components/responses/CubeError"}
    delete:
      summary: Remove an empty room
      x-capability: structure
      description: Writes the Cube's metadata without the room. A room that still has devices, hidden ones included, is refused with 409.
      parameters: [{$ref: "#/components/parameters/sn"}, {$ref: "#/components/parameters/id"}, {$ref: "#/components/parameters/idempotencyKey"}]
      responses:
        "200":
