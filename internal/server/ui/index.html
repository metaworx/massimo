<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Massimo</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" class="icon-defs" aria-hidden="true" focusable="false">
  <!-- The pair in use: icon-is (a thermometer) for the measured
       temperature, icon-set (a gauge) for the setpoint. Swap by editing
       these two symbols; the alternatives below are unused. -->
  <symbol id="icon-is" viewBox="0 0 24 24"><path d="M10 14.5V5a2 2 0 0 1 4 0v9.5a3.5 3.5 0 1 1-4 0z"/><path d="M12 10v6"/></symbol>
  <symbol id="icon-set" viewBox="0 0 24 24"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/><circle cx="12" cy="16" r="1.4"/></symbol>
  <symbol id="icon-set-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
  <symbol id="icon-set-pin" viewBox="0 0 24 24"><path d="M12 21s-6-5.5-6-10a6 6 0 1 1 12 0c0 4.5-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></symbol>
  <symbol id="icon-set-dial" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5v4.5l3 2"/><path d="M12 4v1.5"/></symbol>
  <!-- tile tools -->
  <symbol id="icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></symbol>
  <!-- navigation -->
  <symbol id="icon-house" viewBox="0 0 24 24"><path d="M3 11.5L12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-6h4v6"/></symbol>
  <symbol id="icon-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="icon-cog" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
</svg>
<header class="top">
  <div class="top-line">
    <div class="top-left">
      <div class="brand">
        <h1>Massimo</h1>
        <span id="version-short" class="muted mono small" title="server version"></span>
      </div>
      <div class="cube">
        <label for="cube-select" class="muted">Cube</label>
        <select id="cube-select"></select>
        <span id="connection" class="pill"></span>
      </div>
      <span id="clock-plain" class="muted" title=""></span>
      <span id="updated" class="muted" title="time of the last successful poll"></span>
    </div>
    <div class="top-right">
      <button type="button" id="refresh-btn" class="icon-btn" aria-label="refresh" title="Refresh now">↻</button>
      <nav class="nav" aria-label="pages">
        <button type="button" id="view-tiles" class="icon-btn nav-btn active" aria-current="page" aria-label="rooms" title="Rooms"><svg class="ni" aria-hidden="true"><use href="#icon-house"/></svg></button>
        <button type="button" id="view-log" class="icon-btn nav-btn" aria-label="log" title="Log"><svg class="ni" aria-hidden="true"><use href="#icon-list"/></svg></button>
        <button type="button" id="view-settings" class="icon-btn nav-btn" aria-label="settings" title="Settings"><svg class="ni" aria-hidden="true"><use href="#icon-cog"/></svg></button>
      </nav>
    </div>
  </div>
  <button type="button" id="reload-btn" class="primary hidden">New version on the server, reload</button>
  <dl id="budget" class="budget expert-only">
    <div><dt>Server</dt><dd id="version">–</dd></div>
    <div><dt>Built with</dt><dd id="version-rest">–</dd></div>
    <div><dt>Firmware</dt><dd id="cube-fw">–</dd></div>
    <div><dt>Address</dt><dd id="cube-addr">–</dd></div>
    <div><dt>Radio</dt><dd id="cube-rf" class="mono">–</dd></div>
    <div><dt>Duty cycle</dt><dd id="duty">–</dd></div>
    <div><dt>Free slots</dt><dd id="slots">–</dd></div>
    <div><dt>Queued</dt><dd id="queued">–</dd></div>
    <div><dt>Pending</dt><dd id="pending-n">–</dd></div>
    <div><dt>Cube clock</dt><dd id="clock" title="">–</dd></div>
  </dl>
  <p id="pending" class="notice hidden"></p>
</header>

<main>
  <p id="message" class="message hidden"></p>

  <section id="settings" class="tile settings hidden" aria-label="settings">
    <header class="tile-head"><h2>Settings</h2></header>
    <div class="settings-body">
      <label>Poll every
        <span class="inline"><input type="number" id="poll-input" min="2" max="3600" step="1" value="10"> s</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="expert-toggle">
        <span class="slider" aria-hidden="true"></span>
        <span class="switch-label">Expert mode (addresses, types, budget, version)</span>
      </label>
      <label>Cube clock shown in
        <select id="clock-select">
          <option value="browser">the browser's time zone</option>
          <option value="cube">the Cube's time zone</option>
        </select>
      </label>
      <div class="actions">
        <button type="button" id="forget-token">Forget token</button>
      </div>
    </div>
  </section>

  <section id="house" class="tile house hidden">
    <header class="tile-head"><h2>House</h2></header>
    <div class="house-modes">
      <span class="muted">Mode</span>
      <button type="button" id="house-eco">ECO</button>
      <button type="button" id="house-auto">AUTO</button>
      <button type="button" id="house-comfort">COMFORT</button>
      <button type="button" id="house-manu">MANU</button>
    </div>
    <form id="house-panel" class="panel hidden">
      <div class="panel-row">
        <span class="muted">Mode</span>
        <span class="seg" id="house-mode">
          <label><input type="radio" name="house-mode" value="eco"> ECO</label>
          <label><input type="radio" name="house-mode" value="auto"> AUTO</label>
          <label><input type="radio" name="house-mode" value="comfort"> COMFORT</label>
          <label><input type="radio" name="house-mode" value="manual"> MANU</label>
        </span>
        <span id="house-temp-row" class="inline hidden">
          <button type="button" class="step small" id="house-temp-minus" aria-label="0.5 degrees less">−</button>
          <input type="number" id="house-temp" min="4.5" max="30.5" step="0.5" value="20">
          <button type="button" class="step small" id="house-temp-plus" aria-label="0.5 degrees more">+</button>
          <span class="muted">°C</span>
        </span>
      </div>
      <div class="panel-row" id="house-duration-row">
        <span class="muted">Duration</span>
        <span class="seg">
          <label><input type="radio" name="house-duration" value="permanent" checked> Permanently</label>
          <label><input type="radio" name="house-duration" value="until"> Until</label>
        </span>
        <input type="datetime-local" id="house-until" step="1800">
      </div>
      <div class="panel-row rooms-row">
        <span class="muted">Rooms</span>
        <div id="house-rooms" class="checks"></div>
      </div>
      <div class="actions">
        <button type="button" id="house-cancel">Cancel</button>
        <button type="submit" class="primary">Send</button>
      </div>
      <p id="house-result" class="tile-result hidden"></p>
    </form>
  </section>

  <section id="rooms" class="tiles"></section>

  <section id="unlisted" class="tile hidden">
    <header class="tile-head"><h2>Devices without a room</h2></header>
    <div id="unlisted-devices" class="devices"></div>
  </section>

  <section id="logview" class="tile log hidden" aria-label="event log">
    <header class="tile-head">
      <h2>Log</h2>
      <input type="search" id="log-filter" placeholder="filter" aria-label="filter the log">
      <button type="button" id="log-clear">Clear</button>
    </header>
    <div id="log-lines" class="log-lines"></div>
  </section>
</main>

<dialog id="token-dialog">
  <form method="dialog" id="token-form">
    <h3>API token</h3>
    <p class="muted">The server requires a bearer token (MASSIMO_API_TOKEN).</p>
    <label>Token <input type="password" id="token-input" autocomplete="off"></label>
    <div class="actions"><button type="submit" class="primary">Use token</button></div>
  </form>
</dialog>

<template id="room-template">
  <article class="tile room">
    <header class="tile-head">
      <button type="button" class="room-name-btn"><h2 class="room-name"></h2></button>
      <details class="menu">
        <summary aria-label="room actions" title="Room actions">⋯</summary>
        <div class="menu-items">
          <button type="button" class="menu-lock">Lock thermostats</button>
          <button type="button" class="menu-unlock">Unlock thermostats</button>
          <button type="button" class="menu-delete">Delete room</button>
        </div>
      </details>
    </header>
    <p class="notice not-ready hidden"></p>
    <div class="setpoint-row">
      <div class="temp-block">
        <span class="temp-tag"><svg class="ti" aria-hidden="true"><use href="#icon-is"/></svg><span class="temp-label">IS</span></span>
        <span class="temp-big temp-is" aria-label="measured temperature">–</span>
      </div>
      <div class="temp-block">
        <span class="temp-tag"><svg class="ti" aria-hidden="true"><use href="#icon-set"/></svg><span class="temp-label">SET</span></span>
        <span class="temp-big setpoint-big" aria-label="set temperature"></span>
      </div>
      <div class="stepper">
        <button type="button" class="step step-plus" aria-label="0.5 degrees more" title="0.5 °C more">&#x2303;</button>
        <button type="button" class="step step-minus" aria-label="0.5 degrees less" title="0.5 °C less">&#x2304;</button>
      </div>
    </div>
    <div class="pending-row hidden">
      <button type="button" class="pending-save primary">Save</button>
      <button type="button" class="pending-cancel">Cancel</button>
    </div>
    <div class="mode-row">
      <span class="mode-group" role="group" aria-label="mode">
        <button type="button" class="mode-auto" aria-pressed="false">AUTO</button>
        <button type="button" class="mode-manual" aria-pressed="false">MANU</button>
        <button type="button" class="mode-holiday" aria-pressed="false" title="holiday: a temperature until a date">HOLIDAY</button>
      </span>
      <span class="mode-vacation hidden"></span>
      <span class="tile-tools">
        <button type="button" class="tool-btn tile-info" aria-label="devices of the room" title="Devices" aria-expanded="false"><svg class="ni" aria-hidden="true"><use href="#icon-info"/></svg></button>
        <button type="button" class="tool-btn tile-cog" aria-label="configure the room" title="Configure" aria-expanded="false"><svg class="ni" aria-hidden="true"><use href="#icon-cog"/></svg></button>
      </span>
    </div>
    <form class="panel vacation-panel hidden">
      <div class="panel-row">
        <span class="muted">Vacation</span>
        <span class="inline">
          <button type="button" class="step small vacation-minus" aria-label="0.5 degrees less">−</button>
          <input type="number" class="vacation-temp" min="4.5" max="30.5" step="0.5" value="17">
          <button type="button" class="step small vacation-plus" aria-label="0.5 degrees more">+</button>
          <span class="muted">°C until</span>
        </span>
        <input type="datetime-local" class="vacation-until" step="1800" required>
      </div>
      <div class="actions">
        <button type="button" class="vacation-cancel">Cancel</button>
        <button type="submit" class="primary">Send</button>
      </div>
    </form>
    <div class="panel delete-confirm hidden">
      <span>Delete this empty room from the cube?</span>
      <div class="actions">
        <button type="button" class="delete-no">Keep</button>
        <button type="button" class="delete-yes primary">Delete</button>
      </div>
    </div>
    <p class="tile-result hidden"></p>
    <div class="devices hidden"></div>
    <div class="config-area hidden"></div>
  </article>
</template>

<template id="device-template">
  <div class="device">
    <div class="device-head">
      <span class="device-name"></span>
      <span class="device-badges"></span>
    </div>
    <div class="device-sub muted">
      <span class="device-type"></span>
      <span class="device-rf mono"></span>
    </div>
    <div class="device-vals hidden"></div>
    <div class="device-actions"></div>
  </div>
</template>

<script src="/ui/app.js"></script>
<script src="/ui/tiles.js"></script>
<script src="/ui/config.js"></script>
<script src="/ui/log.js"></script>
</body>
</html>
