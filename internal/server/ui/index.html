<!-- partials: header -->

<main>
  <p id="open-banner" class="open-banner hidden" role="note"><strong data-i18n="open.title">Open server.</strong> <span id="open-banner-text"></span></p>
  <p id="message" class="message hidden"></p>

  <!-- partials: home -->

  <!-- partials: setup -->

  <!-- Personal settings, the page 👤 opens: its row kept at the top under
       the header, with who is signed in, Sign out (or Forget key, none on
       an open server) and the sections menu (components.js pageBar), and
       three section cards in a grid (sectionCards, backToTop): My
       profile, for a signed-in user only, My settings and Notifications,
       each with the icon the menu shows it with (data-icon). -->
  <section id="me" class="settings settings-page me-page hidden" aria-labelledby="me-title">
    <div class="page-bar">
      <div class="page-title">
        <h2 id="me-title" data-i18n="nav.meTitle">Personal settings</h2>
        <p id="me-line" class="me-line small"></p>
      </div>
      <button type="button" id="logout-btn" class="logout-btn"><svg class="ni" aria-hidden="true"><use id="logout-icon" href="#icon-signout"/></svg><span id="logout-label" data-i18n="me.signOut">Sign out</span></button>
      <details class="menu sec-menu">
        <summary aria-label="sections" title="Sections" data-i18n-attr="aria-label:page.sections title:page.sectionsTitle"><svg class="ni" aria-hidden="true"><use href="#icon-list"/></svg></summary>
        <div class="menu-items"></div>
      </details>
    </div>
    <div class="section-grid">
      <section id="profile" class="tile section-card half profile-page" data-icon="icon-id" aria-labelledby="profile-title">
        <header class="tile-head section-head">
          <h3 id="profile-title"><button type="button" class="section-fold" aria-expanded="true" aria-controls="profile-sec"><svg class="fold-i" aria-hidden="true"><use href="#icon-chevron"/></svg><svg class="ni section-icon" aria-hidden="true"><use href="#icon-id"/></svg><span class="section-title" data-i18n="nav.profile">My profile</span></button></h3>
        </header>
