<!-- System settings → Backup and restore, a section card: the backup of the Cube as it is now, the backups the server keeps and the restore, backup.js draws into #backups-list and #restore-box. -->
<section id="sys-backup" class="tile section-card backup-settings needs-backup" aria-labelledby="sys-backup-h">
  <header class="tile-head section-head">
    <h3 id="sys-backup-h"><button type="button" class="section-fold" aria-expanded="true" aria-controls="sys-backup-body"><svg class="fold-i" aria-hidden="true"><use href="#icon-chevron"/></svg><span class="section-title" data-i18n="backup.title">Backup and restore</span></button></h3>
    <span class="section-badges"></span>
    <span data-help="backup" data-help-label="backup.title"></span>
  </header>
  <div id="sys-backup-body" class="section-body" aria-live="polite">
    <div class="backup-bar">
      <div class="field">
        <label for="backup-format" data-i18n="backup.format">Format</label>
        <select id="backup-format" class="field-control">
          <option value="yaml">YAML</option>
          <option value="json">JSON</option>
        </select>
      </div>
      <button type="button" id="backup-download" data-i18n="backup.download">Download backup</button>
      <button type="button" id="backup-take" data-i18n="backup.take">Take a backup now</button>
      <button type="button" id="restore-file" class="needs-restore" data-i18n="restore.fromFile">Restore from file…</button>
    </div>
    <p id="backup-pending" class="muted small hidden"></p>
    <div id="backups-list" class="backups-list"></div>
    <div id="restore-box"></div>
    <p id="backup-msg" class="small cubes-msg hidden" role="status"></p>
  </div>
</section>
