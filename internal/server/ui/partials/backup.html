<!-- Maintenance → Cube backups, a section card: a fold per Cube with its box, a part (ui/src/backups/) drawn into #backups-cubes. -->
<section id="sys-backup" class="tile section-card backup-settings needs-backup" aria-labelledby="sys-backup-h">
  <header class="tile-head section-head">
    <h3 id="sys-backup-h"><button type="button" class="section-fold" aria-expanded="true" aria-controls="sys-backup-body"><svg class="fold-i" aria-hidden="true"><use href="#icon-chevron"/></svg><span class="section-title" data-i18n="backup.cubesTitle">Cube backups</span></button></h3>
    <span class="section-badges"></span>
    <span data-help="backup" data-help-label="backup.cubesTitle"></span>
  </header>
  <div id="sys-backup-body" class="section-body" aria-live="polite">
    <div id="backups-cubes" class="backups-cubes"></div>
  </div>
</section>
