<!-- System settings → Capabilities for every role, a section card: a switch per capability, roles.js draws into #caps-list. -->
<section id="sys-caps" class="tile section-card caps-settings needs-capabilities" data-toc="roles.capsShort" aria-labelledby="sys-caps-h">
  <header class="tile-head section-head">
    <h3 id="sys-caps-h"><button type="button" class="section-fold" aria-expanded="true" aria-controls="sys-caps-body"><svg class="fold-i" aria-hidden="true"><use href="#icon-chevron"/></svg><span class="section-title" data-i18n="roles.capsTitle">Capabilities for every role</span></button></h3>
    <span class="section-badges"></span>
    <span data-help="capabilities" data-help-label="roles.capsTitle"></span>
  </header>
  <div id="sys-caps-body" class="section-body" aria-live="polite">
    <div id="caps-list"></div>
  </div>
</section>
