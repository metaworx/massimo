<!-- The tab bar of a room's configuration, config.js. -->
<template id="tpl-config-tabs">
  <div class="config-tabs">
    <span class="config-tablist" role="tablist" aria-label="configuration sections" data-i18n-attr="aria-label:cfg.sections">
      <button type="button" class="tab" role="tab" data-tab="room" data-i18n="cfg.tab.room">Room</button>
      <button type="button" class="tab" role="tab" data-tab="temps" data-i18n="cfg.tab.temps">Temperatures</button>
      <button type="button" class="tab" role="tab" data-tab="devices" data-i18n="cfg.tab.devices">Devices</button>
      <button type="button" class="tab" role="tab" data-tab="program" data-i18n="cfg.tab.program">Week programme</button>
      <button type="button" class="tab" role="tab" data-tab="copy" data-i18n="cfg.tab.copy">Copy</button>
    </span>
    <button type="button" class="tab close" aria-label="close configuration" title="Close the configuration" data-i18n-attr="aria-label:cfg.close title:cfg.closeTitle">×</button>
  </div>
</template>
