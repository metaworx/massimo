<!-- Settings → Cubes: the list cubes.js draws into #cubes-list, for a role with cubes or with pair (which sees the pairing only). -->
<div class="cubes-settings needs-cubes-or-pair" aria-live="polite">
  <div class="cubes-head">
    <span class="muted" data-i18n="cubes.title">Cubes</span>
    <span data-help="cubes" data-help-label="cubes.title"></span>
  </div>
  <div id="cubes-list"></div>
  <p id="cubes-msg" class="small cubes-msg hidden" role="status"></p>
</div>
