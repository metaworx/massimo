<!-- A device of a room tile or of the devices without a room, tiles.js. -->
<template id="device-template">
  <div class="device">
    <div class="device-head">
      <span class="device-type-icon" role="img"></span>
      <span class="device-name"></span>
      <span class="device-badges"></span>
    </div>
    <div class="device-sub muted expert-only">
      <span class="device-type"></span>
      <span class="device-rf mono"></span>
    </div>
    <div class="device-vals hidden"></div>
    <div class="device-actions"></div>
  </div>
</template>
