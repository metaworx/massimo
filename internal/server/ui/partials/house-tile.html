<!-- The House tile: the mode for the whole house, and its panel for the rooms ticked, house.js. -->
<section id="house" class="tile house needs-setpoint hidden">
  <header class="tile-head"><h2 data-i18n="house.title">House</h2></header>
  <div class="house-modes">
    <span class="muted" data-i18n="house.mode">Mode</span>
    <button type="button" id="house-eco" data-i18n="mode.eco">ECO</button>
    <button type="button" id="house-auto" data-i18n="mode.auto">AUTO</button>
    <button type="button" id="house-comfort" data-i18n="mode.comfort">COMFORT</button>
    <button type="button" id="house-manu" data-i18n="mode.manu">MANU</button>
  </div>
  <form id="house-panel" class="panel hidden">
    <div class="panel-row">
      <span class="muted" data-i18n="house.mode">Mode</span>
      <span class="seg" id="house-mode">
        <label><input type="radio" name="house-mode" value="eco"> <span data-i18n="mode.eco">ECO</span></label>
        <label><input type="radio" name="house-mode" value="auto"> <span data-i18n="mode.auto">AUTO</span></label>
        <label><input type="radio" name="house-mode" value="comfort"> <span data-i18n="mode.comfort">COMFORT</span></label>
        <label><input type="radio" name="house-mode" value="manual"> <span data-i18n="mode.manu">MANU</span></label>
      </span>
      <span id="house-temp-row" class="inline hidden">
        <button type="button" class="step small" id="house-temp-minus" aria-label="0.5 degrees less" data-i18n-attr="aria-label:temp.less">−</button>
        <input type="number" id="house-temp" min="4.5" max="30.5" step="0.5" value="20">
        <button type="button" class="step small" id="house-temp-plus" aria-label="0.5 degrees more" data-i18n-attr="aria-label:temp.more">+</button>
        <span class="muted">°C</span>
      </span>
    </div>
    <div class="panel-row" id="house-duration-row">
      <span class="muted" data-i18n="house.duration">Duration</span>
      <span class="seg">
        <label><input type="radio" name="house-duration" value="permanent" checked> <span data-i18n="house.permanent">Permanently</span></label>
        <label><input type="radio" name="house-duration" value="until"> <span data-i18n="house.until">Until</span></label>
      </span>
      <input type="datetime-local" id="house-until" step="1800">
    </div>
    <div class="panel-row rooms-row">
      <span class="muted" data-i18n="house.rooms">Rooms</span>
      <div id="house-rooms" class="checks"></div>
    </div>
    <div class="actions">
      <button type="button" id="house-cancel" data-i18n="action.cancel">Cancel</button>
      <button type="submit" class="primary" data-i18n="action.send">Send</button>
    </div>
    <p id="house-result" class="tile-result hidden"></p>
  </form>
</section>
