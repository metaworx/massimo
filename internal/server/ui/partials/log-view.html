<!-- The log: its choices, its lines and Older events, log.js. -->
<section id="logview" class="tile log hidden" aria-label="event log" data-i18n-attr="aria-label:log.aria">
  <header class="tile-head">
    <h2 data-i18n="log.title">Log</h2>
    <input type="search" id="log-filter" placeholder="filter" aria-label="filter the log" data-i18n-attr="placeholder:log.filter aria-label:log.filterAria">
    <select id="log-cubes" class="hidden" aria-label="Cubes" data-i18n-attr="aria-label:log.cubesAria"></select>
    <select id="log-kind" aria-label="kind of event" data-i18n-attr="aria-label:log.kindAria"></select>
    <select id="log-device" aria-label="source or device" data-i18n-attr="aria-label:log.deviceAria"></select>
    <select id="log-level" aria-label="level" data-i18n-attr="aria-label:log.levelAria"></select>
    <select id="log-user" class="hidden" aria-label="who" data-i18n-attr="aria-label:log.userAria"></select>
    <select id="log-range" aria-label="how far back" data-i18n-attr="aria-label:log.rangeAria"></select>
    <button type="button" id="log-clear" data-i18n="log.clear">Clear</button>
    <button type="button" id="log-seen-all" class="hidden" data-i18n="log.markAllSeen">Mark all as seen</button>
  </header>
  <div id="log-lines" class="log-lines"></div>
  <div class="log-older"><button type="button" id="log-older" class="subtle" data-i18n="log.older">Older events</button></div>
</section>
