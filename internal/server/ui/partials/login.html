<!-- The sign-in dialog, login.js. -->
<dialog id="login-dialog">
  <!-- the sign-in, a card in the signed-out page (login.js askLogin); the
       password form holds the one password field, the API key a form of its own -->
  <div class="brand-name brand-big" data-brand><span class="brand-word"><span class="brand-initial">M</span><span class="brand-rest">assimo</span></span></div>
  <div class="login-head">
    <h3 data-i18n="login.title">Sign in</h3>
    <!-- the language and the mode before anyone signs in, the settings of My settings -->
    <details id="login-menu" class="menu nav-menu login-menu">
      <summary class="nav-btn" aria-label="Language and appearance" title="Language and appearance" data-i18n-attr="aria-label:login.menu title:login.menu"><svg class="ni" aria-hidden="true"><use href="#icon-menu"/></svg></summary>
      <div class="menu-items">
        <div class="field wide">
          <label for="login-lang" data-i18n="settings.language">Language</label>
          <select id="login-lang" class="field-control"></select>
        </div>
        <div class="field wide">
          <label for="login-mode" data-i18n="appearance.title">Appearance</label>
          <select id="login-mode" class="field-control">
            <option value="system" data-i18n="appearance.modeSystem">as the system</option>
            <option value="light" data-i18n="appearance.modeLight">light</option>
            <option value="dark" data-i18n="appearance.modeDark">dark</option>
          </select>
        </div>
      </div>
    </details>
  </div>
  <div id="login-providers" class="login-providers hidden">
    <div id="login-provider-buttons" class="login-provider-buttons"></div>
    <p id="login-providers-error" class="small hidden" role="alert"></p>
  </div>
  <form id="login-form" method="post">
    <p class="muted" data-i18n="login.text">This server asks who you are.</p>
    <p id="login-tls" class="notice small hidden" role="note" data-i18n="header.selfSigned">Self-signed certificate: before signing in, compare the SHA-256 fingerprint in your browser's certificate details with the one massimo tls show prints on the server.</p>
    <label><span data-i18n="login.user">Name</span> <input type="text" id="login-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
    <label><span data-i18n="login.password">Password</span> <input type="password" id="login-password" name="password" autocomplete="current-password"></label>
    <p id="login-error" class="small hidden" role="alert"></p>
    <div class="actions"><button type="submit" class="primary" data-i18n="login.submit">Sign in</button></div>
  </form>
  <details class="login-token">
    <summary data-i18n="login.tokenInstead">Or an API key</summary>
    <form id="login-key-form">
      <label><span data-i18n="login.token">API key</span> <input type="password" id="login-token" name="api-key" autocomplete="off"></label>
      <div class="actions"><button type="submit" data-i18n="login.submit">Sign in</button></div>
    </form>
  </details>
</dialog>
