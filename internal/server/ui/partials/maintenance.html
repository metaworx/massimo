<!-- System settings → Maintenance, a section card: the server's restart and its settings file read again, update.js. -->
<section id="sys-maint" class="tile section-card half maint-settings needs-restart" aria-labelledby="sys-maint-h">
  <header class="tile-head section-head">
    <h3 id="sys-maint-h"><button type="button" class="section-fold" aria-expanded="true" aria-controls="sys-maint-body"><svg class="fold-i" aria-hidden="true"><use href="#icon-chevron"/></svg><span class="section-title" data-i18n="maint.title">Maintenance</span></button></h3>
    <span class="section-badges"></span>
  </header>
  <div id="sys-maint-body" class="section-body" aria-live="polite">
    <div class="action-row restart">
      <div>
        <p class="action-title" data-i18n="maint.restart">Restart</p>
        <p id="restart-text" class="muted small hidden"></p>
      </div>
      <div class="actions"><button type="button" id="restart-btn" class="hidden" data-i18n="restart.button">Restart the server</button></div>
    </div>
    <p id="restart-pending" class="notice small hidden"></p>
    <div class="action-row">
      <div>
        <p class="action-title" data-i18n="maint.file">Settings file</p>
        <p id="settings-file-text" class="muted small"></p>
        <p id="settings-reload-msg" class="small cubes-msg hidden" role="status"></p>
      </div>
      <div class="actions"><button type="button" id="settings-reload" data-i18n="maint.reload">Reload now</button></div>
    </div>
  </div>
</section>
