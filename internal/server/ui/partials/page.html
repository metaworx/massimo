<!-- Settings, this page in the browser: the note on reloads, who is signed in, that the settings follow the user, the own password and Log out, app.js and login.js. -->
<p class="muted small settings-note" data-i18n="settings.reloadNote">While this page is open, a new server version does not reload the page by itself; the reload button appears in the header instead.</p>
<p id="me-line" class="small hidden"></p>
<p class="muted small settings-note needs-sync" data-i18n="settings.syncNote">Your settings follow you to every browser you sign in on. A setting switched to “only on this device” keeps its value here instead.</p>
<details id="me-password" class="hidden">
  <summary data-i18n="me.changePassword">Change password</summary>
  <form id="me-password-form">
    <div class="field wide">
      <label for="me-current" data-i18n="users.currentPassword">Current password</label>
      <input type="password" id="me-current" class="field-control" autocomplete="current-password">
    </div>
    <div class="field wide">
      <label for="me-new" data-i18n="users.password">New password</label>
      <input type="password" id="me-new" class="field-control" autocomplete="new-password">
    </div>
    <div class="field wide">
      <label for="me-again" data-i18n="setup.again">Again</label>
      <input type="password" id="me-again" class="field-control" autocomplete="new-password">
    </div>
    <div class="actions"><span class="actions-right"><button type="submit" class="primary" data-i18n="action.save">Save</button></span></div>
    <p id="me-password-msg" class="small cubes-msg hidden" role="status"></p>
  </form>
</details>
<div class="actions">
  <button type="button" id="logout-btn" data-i18n="settings.logout">Log out</button>
</div>
