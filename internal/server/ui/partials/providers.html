<!-- System settings → Sign-in providers, a section card: the OpenID Connect providers users sign in through, with the capability auth; a part (ui/src/admin/Providers.tsx) drawn into its body; its pill says where a provider's settings are unsaved (ui/src/chrome/). -->
<section id="sys-providers" class="tile section-card providers-settings needs-auth" aria-labelledby="sys-providers-h">
  <header class="tile-head section-head">
    <h3 id="sys-providers-h"><button type="button" class="section-fold" aria-expanded="true" aria-controls="sys-providers-body"><svg class="fold-i" aria-hidden="true"><use href="#icon-chevron"/></svg><span class="section-title" data-i18n="providers.title">Sign-in providers</span></button></h3>
    <span class="section-badges"></span>
    <span class="section-pill part-slot" data-forms="providers" data-title="providers.title"></span>
    <span data-help="providers" data-help-label="providers.title"></span>
  </header>
  <div id="sys-providers-body" class="section-body" aria-live="polite"></div>
</section>
