<!-- Settings → Roles: the roles with their sets and the switch per capability, roles.js draws into #roles-list and #caps-list. -->
<div class="roles-settings needs-roles" aria-live="polite">
  <div class="cubes-head">
    <span class="muted" data-i18n="roles.title">Roles</span>
    <span data-help="roles" data-help-label="roles.title"></span>
  </div>
  <div id="roles-list"></div>
  <div id="role-new"></div>
  <div class="actions"><span class="actions-left"><button type="button" id="role-add" data-i18n="roles.add">Add a role</button></span></div>
  <div class="caps-settings needs-capabilities">
    <div class="cubes-head">
      <span class="muted" data-i18n="roles.capsTitle">Capabilities for every role</span>
      <span data-help="capabilities" data-help-label="roles.capsTitle"></span>
    </div>
    <div id="caps-list"></div>
  </div>
  <p id="roles-msg" class="small cubes-msg hidden" role="status"></p>
</div>
