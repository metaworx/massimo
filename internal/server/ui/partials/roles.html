<!-- System settings → Roles, a section card: the roles with their sets and the switch per capability, roles.js draws into #roles-list; Capabilities for every role is a card of its own (capabilities.html). -->
<section id="sys-roles" class="tile section-card roles-settings needs-roles" aria-labelledby="sys-roles-h">
  <header class="tile-head section-head">
    <h3 id="sys-roles-h"><button type="button" class="section-fold" aria-expanded="true" aria-controls="sys-roles-body"><svg class="fold-i" aria-hidden="true"><use href="#icon-chevron"/></svg><span class="section-title" data-i18n="roles.title">Roles</span></button></h3>
    <span class="section-badges"></span>
    <span data-help="roles" data-help-label="roles.title"></span>
  </header>
  <div id="sys-roles-body" class="section-body" aria-live="polite">
    <div id="roles-list"></div>
    <div id="role-new"></div>
    <div class="actions"><span class="actions-left"><button type="button" id="role-add" data-i18n="roles.add">Add a role</button></span></div>
    <p id="roles-msg" class="small cubes-msg hidden" role="status"></p>
  </div>
</section>
