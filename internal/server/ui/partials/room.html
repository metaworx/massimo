<!-- The room tile, tiles.js. -->
<template id="room-template">
  <article class="tile room">
    <header class="tile-head">
      <button type="button" class="room-name-btn"><h2 class="room-name"></h2></button>
      <span class="window-open flag fill-bad hidden"></span>
      <details class="menu">
        <summary aria-label="room actions" title="Room actions" data-i18n-attr="aria-label:room.actions title:room.actionsTitle">⋯</summary>
        <div class="menu-items">
          <button type="button" class="menu-lock" data-i18n="room.lock">Lock thermostats</button>
          <button type="button" class="menu-unlock" data-i18n="room.unlock">Unlock thermostats</button>
          <button type="button" class="menu-delete" data-i18n="room.delete">Delete room</button>
        </div>
      </details>
    </header>
    <p class="notice not-ready hidden"></p>
    <p class="notice stale-note hidden"></p>
    <div class="setpoint-row">
      <div class="temp-block">
        <span class="temp-tag"><svg class="ti" aria-hidden="true"><use href="#icon-is"/></svg><span class="temp-label" data-i18n="room.is">IS</span></span>
        <span class="temp-val">
          <span class="temp-big temp-is" aria-label="measured temperature" data-i18n-attr="aria-label:room.measured">–</span>
          <span class="temp-age"></span>
        </span>
      </div>
      <div class="temp-block">
        <span class="temp-tag"><svg class="ti" aria-hidden="true"><use href="#icon-set"/></svg><span class="temp-label" data-i18n="room.set">SET</span></span>
        <span class="temp-big setpoint-big" aria-label="set temperature" data-i18n-attr="aria-label:room.setTemp"></span>
      </div>
      <div class="stepper">
        <button type="button" class="step step-plus" aria-label="0.5 degrees more" title="0.5 °C more" data-i18n-attr="aria-label:temp.more title:temp.moreTitle">&#x2303;</button>
        <button type="button" class="step step-minus" aria-label="0.5 degrees less" title="0.5 °C less" data-i18n-attr="aria-label:temp.less title:temp.lessTitle">&#x2304;</button>
      </div>
    </div>
    <div class="pending-row hidden">
      <button type="button" class="pending-save primary" data-i18n="action.save">Save</button>
      <button type="button" class="pending-cancel" data-i18n="action.cancel">Cancel</button>
    </div>
    <div class="mode-row">
      <span class="mode-group" role="group" aria-label="mode" data-i18n-attr="aria-label:room.modeGroup">
        <button type="button" class="mode-auto" aria-pressed="false" data-i18n="mode.auto">AUTO</button>
        <button type="button" class="mode-manual" aria-pressed="false" data-i18n="mode.manu">MANU</button>
        <button type="button" class="mode-holiday" aria-pressed="false" title="holiday: a temperature until a date" data-i18n="mode.holiday" data-i18n-attr="title:room.holidayTitle">HOLIDAY</button>
      </span>
      <span class="mode-vacation hidden"></span>
      <span class="mode-mixed hidden"></span>
      <span class="tile-tools">
        <button type="button" class="tool-btn tile-info" aria-label="devices of the room" title="Devices" aria-expanded="false" data-i18n-attr="aria-label:room.devices title:room.devicesTitle"><svg class="ni" aria-hidden="true"><use href="#icon-info"/></svg></button>
        <button type="button" class="tool-btn tile-cog" aria-label="configure the room" title="Configure" aria-expanded="false" data-i18n-attr="aria-label:room.configure title:room.configureTitle"><svg class="ni" aria-hidden="true"><use href="#icon-cog"/></svg></button>
      </span>
    </div>
    <form class="panel vacation-panel hidden">
      <div class="panel-row">
        <span class="muted" data-i18n="room.vacation">Vacation</span>
        <span class="inline">
          <button type="button" class="step small vacation-minus" aria-label="0.5 degrees less" data-i18n-attr="aria-label:temp.less">−</button>
          <input type="number" class="vacation-temp" min="4.5" max="30.5" step="0.5" value="17">
          <button type="button" class="step small vacation-plus" aria-label="0.5 degrees more" data-i18n-attr="aria-label:temp.more">+</button>
          <span class="muted" data-i18n="room.degUntil">°C until</span>
        </span>
        <input type="datetime-local" class="vacation-until" step="1800" required>
      </div>
      <div class="actions">
        <button type="button" class="vacation-cancel" data-i18n="action.cancel">Cancel</button>
        <button type="submit" class="primary" data-i18n="action.send">Send</button>
      </div>
    </form>
    <div class="room-confirm"></div>
    <p class="tile-result hidden"></p>
    <div class="devices hidden"></div>
    <div class="config-area hidden"></div>
  </article>
</template>
