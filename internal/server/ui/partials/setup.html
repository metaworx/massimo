<!-- The first owner's form, on a server without users, login.js. -->
<section id="setup" class="tile setup hidden" aria-labelledby="setup-title">
  <div class="brand-name brand-big" data-brand><span class="brand-word"><span class="brand-initial">M</span><span class="brand-rest">assimo</span></span></div>
  <header class="tile-head"><h2 id="setup-title" data-i18n="setup.title">No users yet</h2></header>
  <form id="setup-form" class="setup-form">
    <p class="muted small" data-i18n="setup.text">This server has no users, so anyone on the network may do everything. Create the owner here, from the local network, or on the box with massimo user add.</p>
    <div class="field wide">
      <label for="setup-user" data-i18n="users.name">Name</label>
      <input type="text" id="setup-user" class="field-control" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" required>
      <p id="setup-name-msg" class="small cubes-msg field-hint hidden" role="status"></p>
    </div>
    <div class="field wide">
      <label for="setup-password" data-i18n="login.password">Password</label>
      <input type="password" id="setup-password" class="field-control" autocomplete="new-password" required>
    </div>
    <div class="field wide">
      <label for="setup-again" data-i18n="setup.again">Again</label>
      <input type="password" id="setup-again" class="field-control" autocomplete="new-password" required>
    </div>
    <!-- in the app where the phone can: keep the login by fingerprint, as the sign-in offers it (login.js renderSetupKeep) -->
    <label id="setup-keep-row" class="switch login-keep hidden"><input type="checkbox" id="setup-keep"><span class="slider" aria-hidden="true"></span><span class="switch-label" data-i18n="login.keepFingerprint">Enable login by fingerprint</span></label>
    <div class="actions"><span class="actions-right"><button type="submit" class="primary" data-i18n="setup.create">Create the owner</button></span></div>
    <p id="setup-msg" class="small cubes-msg hidden" role="status"></p>
  </form>
</section>
