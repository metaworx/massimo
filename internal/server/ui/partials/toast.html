<!-- A notification while the page is open (notify.js notifyToast) -->
<div id="notify-toast" class="toast hidden" role="status" aria-live="polite">
  <p class="toast-text"><strong id="notify-toast-title" class="toast-title"></strong> <span id="notify-toast-body"></span></p>
  <button type="button" id="notify-toast-close" class="icon-btn toast-close" aria-label="close" title="Close" data-i18n-attr="aria-label:action.close title:action.close">×</button>
</div>
