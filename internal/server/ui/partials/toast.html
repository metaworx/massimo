<!-- The page's toast (components.js showToast): a notification while the
     page is open (notify.js notifyToast), the Cube search's outcome
     (home.js discoverCubes) -->
<div id="toast" class="toast hidden" role="status" aria-live="polite">
  <p class="toast-text"><strong id="toast-title" class="toast-title"></strong> <span id="toast-body"></span></p>
  <button type="button" id="toast-close" class="icon-btn toast-close" aria-label="close" title="Close" data-i18n-attr="aria-label:action.close title:action.close">×</button>
</div>
