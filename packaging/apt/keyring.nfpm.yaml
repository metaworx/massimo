# The keyring package of the apt repository, built by packaging/apt/publish.sh
# from the repository's two committed public keys: apt verifies the suites
# with them through a Signed-By line naming one (packaging/README.md, "The
# apt repository"), the numbered suites' file or the rolling suites', one
# key in each, so that the rolling key signs nothing a box on alpha
# accepts. VERSION (1.0.<the publish's UTC time, to the second>, so that
# it only goes up), KEYRING and ROLLING_KEYRING (the keys, dearmored) and
# MAINTAINER come from the script.
name: massimo-archive-keyring
arch: all
platform: linux
version: ${VERSION}
section: misc
priority: optional
maintainer: ${MAINTAINER}
vendor: metaworx
homepage: https://go.metaworx.ch/massimo
license: AGPL-3.0-or-later
description: |
  OpenPGP keys of the Massimo apt repository
  The keys apt verifies the Massimo repository with, for the Signed-By line
  of /etc/apt/sources.list.d/massimo.sources: one for the numbered suites
  (alpha and up), one for the rolling suites (devel, nightly).
contents:
  # Readable by everyone: apt reads it as the user _apt, and the exported
  # key is a temporary file of mode 0600 that nfpm would copy as it is.
  - src: ${KEYRING}
    dst: /usr/share/keyrings/massimo-archive-keyring.gpg
    expand: true
    file_info:
      mode: 0644
  - src: ${ROLLING_KEYRING}
    dst: /usr/share/keyrings/massimo-rolling-archive-keyring.gpg
    expand: true
    file_info:
      mode: 0644
