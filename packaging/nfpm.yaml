# The Debian package, built by `make packages` with nfpm at the version
# the Makefile pins, from the release binary and the files of
# packaging/deb/; packaging/README.md, "Debian package", says what it
# installs and what its scripts do. VERSION, NFPM_ARCH and BINARY are set
# by the Makefile for each architecture; VERSION is already the dpkg form
# of the tag (DEBVER, 0.7.0~alpha.1), taken as it is, so that the control
# Version and the file name agree.
name: massimo
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
version_schema: none
section: net
priority: optional
maintainer: Martin Rüegg <massimo@metaworx.ch>
vendor: metaworx
homepage: https://go.metaworx.ch/massimo
license: AGPL-3.0-or-later
description: |
  Server for eQ-3 MAX! Cube heating systems
  Massimo keeps the MAX! Cubes connected, serves a JSON API and a web UI
  on port 8099, answers as a Cube on the LAN for other clients, and runs
  as the systemd service massimo. The settings go into /etc/massimo/env.
depends:
  - adduser
  - init-system-helpers (>= 1.52)
# The tools of the DNS-01 hooks (packaging/acme-dns-hooks/), which most
# boxes never run: apt installs a Recommends by default, a Suggests not.
suggests:
  - curl
  - jq
contents:
  - src: ${BINARY}
    dst: /usr/bin/massimo
    expand: true
    file_info:
      mode: 0755
  - src: dist/deb/massimo.service
    dst: /usr/lib/systemd/system/massimo.service
  # The update helper, enabled: it runs apt for the massimo source when
  # the web UI asks (packaging/deb/massimo-update.service).
  - src: packaging/systemd/massimo-update.path
    dst: /usr/lib/systemd/system/massimo-update.path
  - src: packaging/deb/massimo-update.service
    dst: /usr/lib/systemd/system/massimo-update.service
  # The reboot helper, disabled until `massimo install -reboot-helper`.
  - src: packaging/systemd/massimo-reboot.path
    dst: /usr/lib/systemd/system/massimo-reboot.path
  - src: packaging/systemd/massimo-reboot.service
    dst: /usr/lib/systemd/system/massimo-reboot.service
  - src: packaging/deb/packaged
    dst: /usr/share/massimo/packaged
  - src: packaging/env.template
    dst: /usr/share/massimo/env.template
  # The DNS-01 hooks of serve -acme-dns-hook (packaging/README.md).
  - src: packaging/acme-dns-hooks/infomaniak.sh
    dst: /usr/share/massimo/acme-dns-hooks/infomaniak.sh
    file_info:
      mode: 0755
  - src: packaging/acme-dns-hooks/cloudflare.sh
    dst: /usr/share/massimo/acme-dns-hooks/cloudflare.sh
    file_info:
      mode: 0755
  - src: packaging/deb/copyright
    dst: /usr/share/doc/massimo/copyright
scripts:
  preinstall: packaging/deb/preinst
  postinstall: packaging/deb/postinst
  preremove: packaging/deb/prerm
  postremove: packaging/deb/postrm
deb:
  compression: xz
  fields:
    Bugs: https://github.com/metaworx/massimo/issues
