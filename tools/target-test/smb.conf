# Samba for the targets' test (README.md): a standalone server with one
# share, backups, for the user samba.sh makes; no guest, every message
# signed and the share's traffic encrypted, which a NAS can ask for and
# the SMB target must then speak (SMB 3).
[global]
   server role = standalone server
   workgroup = WORKGROUP
   security = user
   map to guest = never
   passdb backend = tdbsam
   server signing = mandatory
   server smb encrypt = required
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

[backups]
   path = /srv/backups
   read only = no
   create mask = 0600
   directory mask = 0700
