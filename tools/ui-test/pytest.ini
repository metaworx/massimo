# The web UI suite (conftest.py); run.sh starts the servers and runs it.
# Of a failed test pytest-playwright keeps the trace, the screenshot and
# the video, under the --output directory run.sh gives.
[pytest]
addopts = --browser chromium --tracing retain-on-failure --screenshot only-on-failure --video retain-on-failure
markers =
    used_ticket: the page's first stream gets a used ticket, which the server refuses with a 401
python_files = test_*.py
# pytest-playwright's base_url fixture, on pytest 9
filterwarnings =
    ignore:Session-scoped fixtures defined as instance methods:pytest.PytestRemovedIn10Warning
