# The web UI suite (conftest.py); run.sh starts the servers and runs it.
# Of a failed test pytest-playwright keeps the screenshot and the video,
# under the --output directory run.sh gives. No trace: its DOM snapshots
# make every step slower (840 ms instead of 14 in System settings at
# 1100 px), so run.sh runs the failed tests once more with
# --tracing retain-on-failure, into results/retry/.
[pytest]
addopts = --browser chromium --screenshot only-on-failure --video retain-on-failure
markers =
    used_ticket: the page's first stream gets a used ticket, which the server refuses with a 401
python_files = test_*.py
# pytest-playwright's base_url fixture, on pytest 9
filterwarnings =
    ignore:Session-scoped fixtures defined as instance methods:pytest.PytestRemovedIn10Warning
