# The web UI suite (conftest.py); run.sh starts the servers and runs it.
# Of a failed test pytest-playwright keeps the screenshot, under the
# --output directory run.sh gives. No trace: its DOM snapshots make every
# step slower (840 ms instead of 14 in System settings at 1100 px); no
# video: it took a quarter of a second of every test's set-up and
# tear-down (AP TestSpeed, D8-A). run.sh runs the failed tests once more
# with both, --video retain-on-failure --tracing retain-on-failure, into
# results/retry/.
[pytest]
addopts = --browser chromium --screenshot only-on-failure
markers =
    cases(*ids): the test runs only in the cases named (1100-en, 390-en, 1100-de, 390-de), and is deselected in the others at collection
    used_ticket: the page's first stream gets a used ticket, which the server refuses with a 401
    clock: the page runs under Playwright's clock, installed before its scripts, which the test moves on
python_files = test_*.py
# pytest-playwright's base_url fixture, on pytest 9
filterwarnings =
    ignore:Session-scoped fixtures defined as instance methods:pytest.PytestRemovedIn10Warning
